version: "2"

linters:
  default: standard
  enable:
    # This module is a security verifier over untrusted attestation bytes;
    # unchecked errors on the verification path are latent fail-open bugs, so
    # errcheck stays on (the standard set includes it) and gosec is added.
    - gosec
    - revive
    # A hard ceiling on new complexity. The accepted branch-heavy functions are
    # governed by name in docs/architecture/DESIGN_DECISIONS.md, enforced by
    # scripts/complexity-table-gate.py; this linter is the second layer that
    # says nothing may get worse than the worst thing already accepted.
    - gocyclo
  settings:
    gocyclo:
      # The linter reports strictly ABOVE this number ("is high (> 37)"), so 37
      # means the build fails at 38. The highest accepted function is
      # checkSubstrateRow at 37, so every accepted function passes unchanged and
      # anything more complex than the worst one has to be argued for. Raising
      # this is not the way to land a new complex function: add a row to the
      # table with a rationale, which the table gate then holds to its measured
      # number.
      min-complexity: 37
    staticcheck:
      checks:
        - "all"
        - "-ST1000" # package-comment style, not load-bearing here
    errcheck:
      # Diagnostic/output writes to stdout/stderr are fire-and-forget: a failed
      # write to the terminal is unactionable and never a verification-path
      # fail-open. errcheck stays on for everything else (parsing, crypto, I/O
      # on the verification path).
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      # Test files read fixed vector/manifest paths under this repo, never
      # attacker-controlled input, so gosec's file-inclusion rules (G304 file
      # inclusion via variable, G703 path traversal via taint) are categorical
      # false positives there. G101 (hardcoded credentials) reads the case names
      # in a test table ("credential-malformed") as credentials. The
      # verification-path readers in non-test code stay covered.
      - path: _test\.go
        linters:
          - gosec
        text: G304|G703|G101
