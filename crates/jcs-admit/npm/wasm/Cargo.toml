[package]
name = "jcs-admit-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
publish = false
license = "MIT OR Apache-2.0"
description = "Raw-byte WASM bindings for the public jcs-admit core"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jcs-admit = { path = "../..", features = ["serde"] }
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
serde-wasm-bindgen = "=0.6.5"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
await_holding_lock = "deny"
