[package]
name = "jcsvectors"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "RFC 8785 (JSON Canonicalization Scheme) test vectors as embedded files with SHA-256 self-checks: accept cases with their exact canonical bytes, refusals, printer drift and depth cases"
documentation = "https://docs.rs/jcsvectors"
homepage = "https://github.com/probityai/agent-evidence-vectors/tree/main/crates/jcsvectors#readme"
readme = "README.md"
keywords = ["jcs", "rfc8785", "canonicalization", "test-vectors", "json"]
categories = ["encoding", "development-tools::testing"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/probityai/agent-evidence-vectors"
include = ["/src", "/data", "/tests", "/README.md", "/CHANGELOG.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/Cargo.toml"]

[dependencies]
serde = { version = "1.0.100", features = ["derive"] }
serde_json = { version = "1.0.87", features = ["raw_value"] }
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
