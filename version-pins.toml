# Where each version the repository's pages name is decided. The package built here is
# read from its manifest; the pin-refresh workflow moves the family locks and rewrites
# the live pages hourly. Pages that record a past release as a fact are listed under
# [scan] historical and are never moved.
repository = "probityai/agent-evidence-vectors"

[[own]]
key = "pypi:agent-evidence-vectors"
manifest = "pyproject.toml"
publisher = "probityai/agent-evidence-vectors"

[scan]
include = ["README.md", "docs/**/*.md", "packages/**/*.md"]
# Dated records of what a past release did or what a past run installed.
historical = [
  "interop/**",
  "docs/paper/**",
  "**/source-lock.json",
  "RUNS.md",
  "DISPOSITIONS.md",
]
