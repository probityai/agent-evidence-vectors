src = "spec/predicates/observed-effect.md"
wheel = "corpora/spec/predicates/observed-effect.md"
purpose = "The observed-effect predicate is normative for its corpus: the packaged reader\ncross-checks the manifest's predicateType against the Type URI line at\n<corpus>/../spec/predicates/."

