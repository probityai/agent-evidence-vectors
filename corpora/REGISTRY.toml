# The corpus registry. One row per corpus; scripts/corpus-registry.py checks it
# against corpora/REGISTRY.schema.json and the tree, and writes from it the
# packaging block of pyproject.toml and the index in corpora/README.md.
#
# `id` is the published name: the command line's --corpus, the Action's
# `corpus:` input, the wheel path agent_evidence_vectors/corpora/<id>/ and the
# release digest list all carry it, so it never changes. `path` is where the
# corpus lives in this repository and may move.

registry_version = 1

[build]
package = { src = "packaging/agent_evidence_vectors", wheel = "agent_evidence_vectors" }
exclude = ["**/__pycache__", "**/.build", "**/*.pyc"]
# Source files the sdist carries besides the package, the data files and the corpora.
sdist_extra = [
    ".gitignore",
    "interop/observed-code-digest-candidate",
    "interop/observed-invocation-binding-candidate",
    "README.md",
    "docs/guides",
    "docs/reference",
    "DISTRIBUTION.md",
    "LICENSE",
    "CITATION.cff",
]

[[data]]
src = "packaging/run_vectors.py"
wheel = "run_vectors.py"
purpose = "The rail, a single stdlib-only module. `sources` rewrites directory prefixes\nand leaves a single file where it is, so the rail is placed by name."

