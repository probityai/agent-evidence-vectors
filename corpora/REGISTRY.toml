wheel = true
sdist = true
title = "Execution evidence statements"
summary = "A verifier must accept valid adversarial execution evidence statements, refuse tampered, forged or mis-bound ones, and report the right result and evidence tier."
record_class = "execution-evidence"
domains = ["effects", "provenance"]
standards = ["in-toto"]
shapes = ["tampering", "forged-signature", "missing-binding"]

