[project]
name = "probity-trace-m1-consumer"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = ["cryptography==50.0.2", "pynacl==1.6.2"]

[dependency-groups]
dev = ["coverage==7.13.4", "pytest==9.0.3", "ruff==0.15.7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 80

