<svg xmlns="http://www.w3.org/2000/svg" width="360" height="828" viewBox="0 0 360 828" role="img" aria-labelledby="title description">
  <title id="title">Choose a project for your task</title>
  <desc id="description">Define terms with Vocabulary and test verifiers with Vectors. Record actions with Observer and check supplied claims with Verify. Apply workload policy with Admission. Admit JSON with jcs-admit and sign envelopes with dsse. Explore and rerun evidence with Atlas. Each project has an independent entry point.</desc>
  <rect width="360" height="828" rx="16" fill="#fbfaf7"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1d1d1f">
    <text x="20" y="39" font-size="23" font-weight="700">Choose your task</text>
    <text x="20" y="67" font-size="16" fill="#5b5d63">Each project has its own entry point.</text>
    <rect x="20" y="90" width="320" height="126" rx="10" fill="#f1efe9" stroke="#dcd9d2"/>
    <text x="36" y="122" font-size="19" font-weight="700" fill="#1f5f8b">Define and test</text>
    <text x="36" y="155" font-size="18" font-weight="700">Vocabulary</text>
    <text x="154" y="155" font-size="16">Evidence terms</text>
    <text x="36" y="188" font-size="18" font-weight="700">Vectors</text>
    <text x="154" y="188" font-size="16">Verifier test cases</text>
    <rect x="20" y="232" width="320" height="126" rx="10" fill="#f1efe9" stroke="#dcd9d2"/>
    <text x="36" y="264" font-size="19" font-weight="700" fill="#1f5f8b">Record and check</text>
    <text x="36" y="297" font-size="18" font-weight="700">Observer</text>
    <text x="154" y="297" font-size="16">Action records</text>
    <text x="36" y="330" font-size="18" font-weight="700">Verify</text>
    <text x="154" y="330" font-size="16">Supplied claims</text>
    <rect x="20" y="374" width="320" height="100" rx="10" fill="#f1efe9" stroke="#dcd9d2"/>
    <text x="36" y="406" font-size="19" font-weight="700" fill="#1f5f8b">Apply policy</text>
    <text x="36" y="441" font-size="18" font-weight="700">Admission</text>
    <text x="154" y="441" font-size="16">Workload decisions</text>
    <rect x="20" y="490" width="320" height="126" rx="10" fill="#f1efe9" stroke="#dcd9d2"/>
    <text x="36" y="522" font-size="19" font-weight="700" fill="#1f5f8b">Admit bytes and sign</text>
    <text x="36" y="555" font-size="18" font-weight="700">jcs-admit</text>
    <text x="154" y="555" font-size="16">JSON admission</text>
    <text x="36" y="588" font-size="18" font-weight="700">dsse</text>
    <text x="154" y="588" font-size="16">Signature envelopes</text>
    <rect x="20" y="632" width="320" height="100" rx="10" fill="#f1efe9" stroke="#dcd9d2"/>
    <text x="36" y="664" font-size="19" font-weight="700" fill="#1f5f8b">Explore and rerun</text>
    <text x="36" y="699" font-size="18" font-weight="700">Atlas</text>
    <text x="154" y="699" font-size="16">Retained evidence</text>
    <text x="20" y="770" font-size="17" font-weight="700">Start with one useful check.</text>
    <text x="20" y="799" font-size="16" fill="#5b5d63">Follow its pinned recipe and result.</text>
  </g>
</svg>
