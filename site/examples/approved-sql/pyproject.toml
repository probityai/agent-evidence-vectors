[project]
name = "oel-sql-illustration"
version = "0.1.0"
description = "Author-created illustration of approved SQL and audit comparison"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["coverage==7.13.4", "pytest==9.0.3", "ruff==0.16.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["sql_illustration"]
parallel = true
concurrency = ["multiprocessing"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
