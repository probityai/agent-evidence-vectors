[project]
name = "probity-nenrin-witness-byte-reader"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["cryptography==50.0.2"]

[dependency-groups]
dev = ["coverage==7.13.4", "pytest==9.0.3", "ruff==0.16.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]
addopts = "--junitxml=gate-results/tests.xml"

[tool.coverage.run]
branch = true
source = ["witness_case"]
parallel = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
