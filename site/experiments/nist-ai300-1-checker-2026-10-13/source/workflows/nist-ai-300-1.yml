name: NIST AI 300-1 templates and profiles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - interop/nist-ai-300-1/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/nist-ai-300-1.yml
  pull_request:
    paths:
      - interop/nist-ai-300-1/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/nist-ai-300-1.yml

permissions:
  contents: read

jobs:
  nist-ai-300-1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13.15", "3.14.7"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: lint and type-check the extractor, generator, checker and tests
        run: |
          uv run --locked --extra dev ruff check interop/nist-ai-300-1
          uv run --locked --extra dev ruff format --check interop/nist-ai-300-1
          uv run --locked --extra dev mypy --strict interop/nist-ai-300-1/extract.py \
            interop/nist-ai-300-1/model.py interop/nist-ai-300-1/schema_build.py \
            interop/nist-ai-300-1/gen_vectors.py interop/nist-ai-300-1/check_vectors.py \
            interop/nist-ai-300-1/test_check_vectors.py
      # The checker re-extracts the committed PDF and re-derives every digest,
      # judges every member against both schemas of its table, and deletes each
      # rule (and drops each condition) to prove the members naming it flip.
      - name: the test set behaves as its manifest claims, and every rule is load-bearing
        run: uv run --locked --extra dev python interop/nist-ai-300-1/check_vectors.py
      - name: the checker refuses a broken member, rule, transcript or source
        run: |
          uv run --locked --extra dev python -m unittest discover \
            -s interop/nist-ai-300-1 -p test_check_vectors.py -v
      - name: everything regenerates byte-identically from the PDF and readings.json
        run: |
          uv run --locked --extra dev python interop/nist-ai-300-1/gen_vectors.py
          git diff --exit-code -- interop/nist-ai-300-1
          test -z "$(git status --porcelain --untracked-files=all -- interop/nist-ai-300-1)"
