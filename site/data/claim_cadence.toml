# How long each claim-ledger row stays current after its read time.
#
# tools/build.py stamps every row of CLAIMS.md that has a read time with its cadence, and
# the claim-ledger page marks a row stale when the reader's clock is past read date plus
# cadence. A row with a read time and no entry here fails the build, so a new row cannot
# go unclassified.
#
# The rule, as the ledger states it: star counts, pull-request and issue states, a
# project's current release and link checks change weekly (7 days); standards and project
# statuses, descriptions and labels monthly (30 days); a version pinned by number, dated
# events, content pinned to a tag and the site's own data do not expire ("none").
#
# "Current release" and "latest release" are states, not pinned versions: a newer release
# makes the row wrong the day it ships. tools/build.py refuses a row whose claim names a
# current or latest release unless its cadence is 7 days or less.

