# ---------------------------------------------------------------- layers
[[layer]]
id = "L1"
name = "Identity and delegated authority"
job = "policy"
question = "Who or what is acting, for whom, under which delegated authority?"
short_question = "Who or what is acting, for whom, under which delegated authority?"
establishes = "That a request carried a credential bound to an identity a trusted issuer vouched for, and, through delegation or token exchange, the principal on whose behalf it was issued and the scope it was granted."
short_establishes = "A credential from a trusted issuer is bound to an identity and a delegated scope"
cannot = "That the holder is the agent it claims to be once a key or token leaves its workload; what the agent did with the authority; or whether a particular action matched what the principal intended. An identity makes an actor accountable only when some other record says what the actor did."
short_cannot = "What was done with the authority, or whether an action matched the principal's intent"
seam = "The policy engine decides on the identity it is shown. That identity usually names a workload, not a task. When a user delegates to an agent, which calls a tool, which calls a sub-agent, the token at the enforcement point often carries the agent's own identity and a broad scope. The human principal, the narrowing at each hop and the purpose of the call are lost or merely asserted. The resulting decision allows \"this workload may call this tool\". The two families leave open whether the call was within what the user delegated for this task. No record answers that question for the user who delegated."

[[layer]]
id = "L2"
name = "Policy, mediation and admission"
job = "policy"
question = "Was the action permitted, mediated or refused under a stated policy, and may a relying party accept its evidence?"
short_question = "Was the action permitted, mediated or refused under a stated policy, and may a relying party accept its evidence?"
establishes = "That a request which reached an enforcement point was evaluated against a stated policy, and allowed or denied."
short_establishes = "A request that reached the enforcement point was evaluated and allowed or denied"
cannot = "Anything about requests that never passed through that point, anything about what happened after an allow, or that the policy was right. The decider writes the decision log, so the log reports the decision and nothing about the effect."
short_cannot = "Anything about requests that bypassed the point, or what happened after an allow"
seam = "The policy engine evaluates the action as declared at the gateway. Containment governs what the process can actually reach. Whatever the agent does without crossing the gateway, such as code it runs inside an allowed tool, a direct socket, or a file a later step reads, is invisible to the policy engine. The decision and the effect happen in different places at different times, and nothing binds one to the other, so a decision log cannot tell anyone what an allowed action did."

[[layer]]
id = "L3"
name = "Containment"
job = "containment"
question = "Which resources and channels could the workload reach?"
short_question = "Which resources and channels could the workload reach?"
establishes = "That execution was restricted: the system calls, files, network destinations and memory it could touch were bounded, which bounds the damage a misbehaving agent can do."
short_establishes = "Execution was bounded to certain calls, files and destinations"
cannot = "What happened inside the allowed boundary. A sandbox limits what a process can reach and keeps no record of what it did. It cannot show by itself that it was in place for a particular run; that needs attestation by a party outside it. An escape it did not detect looks the same as no escape."
short_cannot = "What happened inside the boundary, or that the boundary was in place for a given run"
seam = "The contained process is also the process that reports on itself. Traces come from instrumentation inside the sandboxed workload, so a denied connection, a killed process, or a tool that did something other than what it logged produces no span. The trace still looks complete. Containment and observation sit at different vantage points, and the operator running both has to reconcile two partial views by hand."

[[layer]]
id = "L4"
name = "Observation and tracing"
job = "evidence (self-reported)"
question = "What was seen while the workload ran, and from which vantage?"
short_question = "What was seen while the workload ran, and from which vantage?"
establishes = "What the instrumentation emitted: correlated spans, timings and attributes, as reported."
short_establishes = "What the instrumentation emitted, correlated and timed"
cannot = "That the events happened independently of the party emitting them; that nothing is missing, since tracing has no concept of a missing span and sampling drops spans by design; or that the record is intact, since spans are unsigned and can change anywhere in the collection pipeline."
short_cannot = "That the events occurred independently of the emitter, or that nothing is missing"
seam = "Signing a trace fixes its bytes and changes nothing about whether the trace is true or complete. Whatever the emitter omitted before signing remains omitted. The signed version now carries more authority than the unsigned one did."

[[layer]]
id = "L5"
name = "Records, receipts and transparency"
job = "evidence (integrity)"
question = "How are observations encoded, signed, committed, ordered, retained and disclosed?"
short_question = "How are observations encoded, signed, committed, ordered, retained and disclosed?"
establishes = "Integrity and origin of bytes: the holder of a key signed these bytes and no others. A transparency log adds that an entry was included at a point in the log's history and that the history was not rewritten, which prevents equivocation for anyone who checks."
short_establishes = "Integrity and origin of bytes; with a log, that the history was not rewritten"
cannot = "That what the bytes describe occurred; that the set of records is complete; that their content is true; or that the signer observed anything at all."
short_cannot = "That the described events occurred, that the record is complete, or that the signer observed anything"
seam = "A receipt proves which bytes were issued. An evaluation measures how a system behaved. Deployments rarely bind the two: an evaluation result seldom names, by digest, the weights, scaffold, tools, configuration and grader it ran against. A production receipt seldom points back to the evaluation that licensed the deployment. Where no digest binds them, the deployer's statement that \"this deployed agent is the one that was evaluated\" is all a regulator or a customer receives."

[[layer]]
id = "L6"
name = "Conformance and evaluation"
job = "scrutiny"
question = "What did testing establish about behavior or reader agreement?"
short_question = "What did testing establish about behavior or reader agreement?"
establishes = "Measured behavior of a specific system version, under a specific harness and task set, at a specific time."
short_establishes = "Measured behavior of one version, under one harness, at one time"
cannot = "Behavior in deployment; that the evaluated system is the deployed one, unless the two are bound by digest; the absence of capabilities it did not test; or the soundness of its own result, unless someone else can recompute it from preserved inputs."
short_cannot = "Behavior in deployment, or that the deployed system is the one tested"
seam = "Governance texts name outcomes such as record-keeping, testing, logging and third-party assessment, without fixing an evidence format, a required vantage, or a way for a regulator to re-check a result. The European harmonised standards that would give a presumption of conformity are, on CEN-CENELEC's own page, still under development. Operating conditions for evaluator independence have been written down, AEF-1 among them; no comparable text says how a third party re-checks the evidence an evaluator produces, so the evaluator's client relies on the evaluator's report of that evidence."

[[layer]]
id = "L7"
name = "Governance, requirements and vocabulary"
job = "scrutiny"
question = "What is required, reported or asserted, and in which stable terms?"
short_question = "What is required, reported or asserted, and in which stable terms?"
establishes = "Obligations, risk categories, process requirements and routes to conformity."
short_establishes = "Obligations, risk categories and routes to conformity"
cannot = "That any obligation was met. Several instruments are voluntary, and several rest on standards not yet published. None specifies evidence that a distrusting party could re-check."
short_cannot = "That any obligation was met"
seam = "Accountability obligations end in a person or an organization. The record that would show which principal authorized which agent action is not something any of these instruments requires in a checkable form. The chain from \"this obligation applies to the deployer\" back to \"this delegation authorized this call\" is closed by documentation alone, which leaves the regulator reading the deployer's own account."

