# The conformance board: which outside implementations are scored against which pinned corpus.
#
# tools/run_board.py reads this file, runs one implementation, and writes a result;
# tools/gen_board.py renders src/board.md from this file and data/board-results.json.
# Edit this file and the results, never the page.
#
# A row has one of three statuses:
#   scored        a command in this file runs the pinned corpus against the implementation's own code
#   not-runnable  no entry point of the implementation can take this corpus; `url_checked` is the
#                 tree that was read to establish that, at the pin
#   held          not scored on this board by the board's publication rules; no reason is printed
#
# `pin` is a full commit of `repo`. The scheduled workflow scores the pin and the repository's
# current default-branch head, so a verdict at a new upstream commit appears without an edit here.

[meta]
vectors_package = "agent-evidence-vectors"
vectors_version = "0.29.3"
vectors_tag = "v0.29.3"
vectors_tag_commit = "a78eb265ece4163e5d4e08eb5865fac05d12cab0"

# Families the board scores. A family is a corpus plus the target of that corpus.
[family.jcs-rfc8785]
title = "RFC 8785 canonical bytes"
corpus = "vectors-a2a-jcs-v01"
target = "rfc8785"
vectors = 53
what = "One JSON value to its RFC 8785 canonical UTF-8 bytes: key order, string escapes, number spelling, literals. A function that raises on a value is a refusal."

[family.anchor-stream]
title = "ANCHORS stream verification"
corpus = "vectors-anchor-stream"
target = "anchors-verify"
vectors = 34
what = "An append-only anchor stream and its digest sidecar, with every platform byte pinned. Scores the verdict and the stop reason."

[[implementation]]
id = "moltrust-aae"
name = "MolTrust AAE"
repo = "MoltyCel/moltrust-api"
pin = "1cd28477ebdfa7af52efbd1538472df0b77d4d04"
status = "scored"
url_checked = "https://github.com/MoltyCel/moltrust-api/blob/1cd28477ebdfa7af52efbd1538472df0b77d4d04/app/signature.py"
declared_scope = "app/signature.py canonicalize: RFC 8785; integers beyond 2^53-1 are refused by design"
  [[implementation.run]]
  family = "jcs-rfc8785"
  adapter = "py"
  args = ["--repo", "{src}", "--module", "app.signature", "--func", "canonicalize"]
  deps = "{src}/tests/conformance/requirements.txt"

