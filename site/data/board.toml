[[implementation]]
id = "pic"
name = "PIC (pic-standard)"
repo = "pic-standard/pic-standard"
pin = "6856f36267a9feb56e8c3deb334e9293fc4258dd"
status = "scored"
url_checked = "https://github.com/pic-standard/pic-standard/blob/6856f36267a9feb56e8c3deb334e9293fc4258dd/sdk-python/pic_standard/canonical.py"
declared_scope = "pic_standard.canonical.canonicalize: PIC-CJSON/1.0, RFC 8785 as the baseline plus PIC-specific rules; the profile is frozen, so a vector where the profile differs from plain RFC 8785 is a profile difference the project declares"
  [[implementation.run]]
  family = "jcs-rfc8785"
  adapter = "py"
  args = ["--repo", "{src}/sdk-python", "--module", "pic_standard.canonical", "--func", "canonicalize"]
  deps = "board/deps/pic.txt"

