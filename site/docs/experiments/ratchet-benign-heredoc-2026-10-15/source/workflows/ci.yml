name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.14"
  UV_LOCKED: "1"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --all-groups --all-extras
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy src
      - run: uv run mypy --config-file probity-ratchet-cases/pyproject.toml probity-ratchet-cases/src
      - run: python3 scripts/readme-lint.py README.md
      - run: python3 scripts/readme-lint.py probity-ratchet-cases/README.md
      # check-docs imports ratchet_cases to count the case families, so it runs inside the synced virtualenv
      - run: uv run python scripts/check-docs.py

  # The case suite on its own: built as a wheel and tested from a clean environment on the oldest and a
  # current supported Python, so nothing in the harness's workspace can hide a missing file or dependency.
  cases:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No cache: the job installs one wheel and pytest, and two matrix legs saving one cache key race.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: uv build --package probity-ratchet-cases --out-dir dist
      - name: install the wheel alone
        run: |
          uv venv --no-project --python "${{ matrix.python }}" "$RUNNER_TEMP/cases"
          uv pip install --python "$RUNNER_TEMP/cases/bin/python" dist/probity_ratchet_cases-*.whl pytest==9.1.1
      - name: selftest and digest from the installed wheel
        run: |
          "$RUNNER_TEMP/cases/bin/ratchet-cases" selftest
          "$RUNNER_TEMP/cases/bin/ratchet-cases" digest
      - name: pytest against the installed wheel
        working-directory: probity-ratchet-cases
        run: '"$RUNNER_TEMP/cases/bin/python" -m pytest -q -W error -p no:cacheprovider'

  # The AgentDojo benign-twin suite against the AgentDojo release it pins, from the installed wheel and its
  # extra: every twin solvable by its ground truth, failed by a refuse-everything pipeline and by the paired
  # attack, and accepted by AgentDojo's own check_suites. No model, no key.
  cases-agentdojo:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: uv build --package probity-ratchet-cases --out-dir dist
      - name: install the wheel with the agentdojo extra
        run: |
          uv venv --no-project --python "${{ matrix.python }}" "$RUNNER_TEMP/twins"
          wheel="$(ls dist/probity_ratchet_cases-*.whl)"
          uv pip install --python "$RUNNER_TEMP/twins/bin/python" "${wheel}[agentdojo]" pytest==9.1.1
      - name: pytest the twins against the installed wheel
        working-directory: probity-ratchet-cases
        run: '"$RUNNER_TEMP/twins/bin/python" -m pytest -q -W error -p no:cacheprovider tests_agentdojo'

  # retail_faults against tau2-bench itself. tau2-bench is not on PyPI under its own name (the PyPI project
  # "tau2" is an unrelated package), so it is installed from its repository at the commit the harness pins,
  # with that commit's retail data. websockets is installed beside it because importing tau2 needs it while
  # tau2 declares it only in its voice extra.
  cases-tau2:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TAU2_COMMIT: 4ce7c0397c1eb65c9bbe59aeacfe1ca44a1cd699
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: fetch tau2-bench code and retail data at the pinned commit
        run: |
          d="$RUNNER_TEMP/tau2-bench"
          git init -q "$d"
          git -C "$d" remote add origin https://github.com/sierra-research/tau2-bench
          git -C "$d" sparse-checkout set --no-cone '/*' '!/data/' '/data/tau2/domains/retail/' \
            '!/data/tau2/domains/retail/task_issues/' '!/data/tau2/domains/retail/tasks_voice.json' \
            '!/data/tau2/domains/retail/audio_difficulty.json'
          git -C "$d" fetch -q --depth 1 --filter=blob:none origin "$TAU2_COMMIT"
          git -C "$d" checkout -q FETCH_HEAD
          test "$(git -C "$d" rev-parse HEAD)" = "$TAU2_COMMIT"
          echo "TAU2_DATA_DIR=$d/data" >> "$GITHUB_ENV"
      - run: uv build --package probity-ratchet-cases --out-dir dist
      - name: install the wheel beside tau2-bench
        run: |
          uv venv --no-project --python 3.12 "$RUNNER_TEMP/t2"
          uv pip install --python "$RUNNER_TEMP/t2/bin/python" "$RUNNER_TEMP/tau2-bench" websockets==15.0.1 \
            dist/probity_ratchet_cases-*.whl pytest==9.1.1
      # tau2-bench imports the standard library's audioop, deprecated since Python 3.11, from its voice
      # utilities at import time. That one warning comes from tau2-bench and is ignored by its exact text;
      # every other warning still fails the job.
      - name: faulted retail tasks, graded on the live databases
        working-directory: probity-ratchet-cases
        run: >-
          "$RUNNER_TEMP/t2/bin/python" -m pytest -q -p no:cacheprovider tests_tau2
          -W error -W "ignore:'audioop' is deprecated and slated for removal in Python 3.13:DeprecationWarning"


  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      # Same image, credentials and port mapping as docker/compose.yaml; the "image tag matches compose" step fails the
      # job if the two drift apart.
      atlas:
        image: mongodb/mongodb-atlas-local:8.3.9-20260928T091948Z
        env:
          MONGODB_INITDB_ROOT_USERNAME: ratchet
          MONGODB_INITDB_ROOT_PASSWORD: ratchet-local-dev
        ports:
          - 127.0.0.1:27018:27017
        options: >-
          --hostname ratchet-atlas
          --ulimit nofile=1048576:1048576
          --health-cmd "mongosh -u ratchet -p ratchet-local-dev --quiet --eval 1"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 20s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: image tag matches compose
        run: |
          want=$(sed -n 's/^ *image: *//p' docker/compose.yaml | head -1)
          have=$(sed -n 's/^ *image: *\(mongodb\/mongodb-atlas-local:[^ ]*\).*$/\1/p' .github/workflows/ci.yml | head -1)
          echo "compose: $want  workflow: $have"
          test -n "$want" && test "$want" = "$have"
      - name: wait until mongot answers search-index calls
        run: |
          id=$(docker ps --filter ancestor="$(sed -n 's/^ *image: *//p' docker/compose.yaml | head -1)" --format '{{.ID}}' | head -1)
          test -n "$id"
          for i in $(seq 1 90); do
            if docker exec "$id" mongosh -u ratchet -p ratchet-local-dev --quiet --eval "db.getSiblingDB('healthprobe').nothing.aggregate([{\$listSearchIndexes:{}}]).toArray().length" >/dev/null 2>&1; then
              echo "search ready after $((i * 5)) s"; exit 0
            fi
            sleep 5
          done
          docker logs --tail 50 "$id"
          exit 1
      - run: uv sync --all-groups --all-extras
      # Default selection: sandbox tests (hackathon cluster secrets) and live tests (VOYAGE_API_KEY) are deselected.
      - name: pytest
        run: >-
          uv run --with pytest-timeout python -m pytest -q -W error --timeout=120 -rfEs --tb=short
          -m "not sandbox and not live"
          --cov=src/ratchet --cov-report=term-missing:skip-covered

  demo-image:
    # The no-build demo: build the image, then run the reviewer sequence in a fresh container with no network
    # and no host mount, on x86-64 and on arm64 (the image runs on Apple-silicon hosts and arm64 servers).
    # The image is built here only; it is never pushed.
    name: demo-image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build the demo image
        run: docker build -f docker/demo.Dockerfile -t ratchet-demo:ci .
      - name: run the reviewer sequence
        run: docker/demo/check.sh ratchet-demo:ci
      - name: image size
        run: docker image ls ratchet-demo:ci
