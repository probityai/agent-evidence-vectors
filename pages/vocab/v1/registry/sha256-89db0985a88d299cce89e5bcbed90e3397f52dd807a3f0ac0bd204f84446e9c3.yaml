# agent-evidence-vocabulary: a closed term registry
#
# `canonical` is reserved here for one thing: a term's lifecycle status, reached
# only by the promotion rule in meta. It is deliberately NOT used to mean
# authoritative or single-source, which is what a registry title usually means by
# it. This file said both until 2026-08-30, so a reader met "canonical term
# registry" in the title and "no term in this file is canonical" forty lines
# down. A registry whose stated purpose is one word for one meaning cannot spend
# its own headline word three ways.
#
# This file is CC0-1.0 (public domain). Reuse, fork, or cite it freely; no
# attribution required. The full grant is in `LICENSE-CC0`, which is the
# unmodified Creative Commons legal text. The surrounding repository (docs,
# scripts, CI) is Apache-2.0, in `LICENSE`.
#
# Both files are present on purpose. Until 2026-08-30 this header claimed CC0 and
# pointed at a LICENSE carrying only Apache-2.0, so the permissive grant a reader
# was invited to rely on was asserted here and granted nowhere.
#
# Precedent for this shape: IANA JWT claim registry, JSON-LD @context registries.
#
# version: "0.9.0"
# status: "draft - open for review"

meta:
  version: "0.9.0"
  status: "draft - open for review"
  spec_anchor: "spec/predicates/adversarial-execution-evidence.md"
  spec_anchor_repo: "https://github.com/probityai/agent-evidence-vectors"
  purpose: >
    A closed, versioned vocabulary for terms that describe adversarial-execution
    evidence: what an executed artifact attempted, what a substrate beneath it
    observed or refused, how directly and from what vantage a claim was obtained,
    and how much of a declared population a claim actually covers. This registry
    is the vocabulary for that axis: who observed an execution, and how directly.
    Since 0.4.0 it also names the decision that admits or rejects a change to
    an agent's harness on that kind of evidence, in the change_admission
    section, whose terms the agent-change-admission predicate under
    docs/predicates/ carries. Since 0.6.0 it names how a claim that an agent's
    work is done is decided from outside the agent, in the done_verification
    section.
    Since 0.9.0 it also names how a party that does not trust the
    responder checks that a response to an incident happened and held, in the
    incident_response section.
    Since 0.10.0 it names the identity provider behind the issuer of a
    validated principal and whether the issuer's key was pinned, in the
    principal_identity section. Since 0.10.0 it also names the fields a signed
    record of one allow-or-refuse decision carries, in the decision_receipt
    section: the verdict and its strictness order, what the decision was made
    over, in what world, as one of how many, and one fact a provider can
    re-check. Since 0.10.0 it also names how the bytes of a record are
    canonicalized, hashed, ordered and signed and whose key may sign them, in
    the record_binding section, and how a verdict a record states about
    itself is re-derived, in the evaluation_claim section. It does not define reputation, wallet,
    reasoning-integrity or actor-scoring terms; those are out of scope by
    design (see out_of_scope below).
  promotion_lifecycle: >
    Every live term starts proposed. A term is promoted to canonical only once an
    independently-maintained system that is not us emits it in a real, running
    artifact and files a crosswalk declaring evidence: emitted with a resolvable
    source_path. Our own issuer does not count toward promotion, so one
    qualifying issuer is enough. A term with zero qualifying issuers after its
    review_by date is demoted to reserved and removed at the following review,
    unless a production issuer surfaces in the interim. A review-and-strip cycle
    is the mechanism that keeps a registry from filling with terms nobody emits,
    and it only works if the strip half actually happens, so the dates are in
    the file where anyone can hold us to them. What this adds to the usual shape
    is the evidence requirement: a listed issuer name is a claim, and a name in
    a list does not demonstrate that a field reaches the wire. Promotion needs
    an evidence: emitted declaration with a source_path a reviewer fetches. The
    bar for running is deliberately narrow. A plan sits outside it, and so does
    a mock.
    A filing made from OUTSIDE, about a system the filer does not maintain,
    records provenance and never counts toward promotion, whatever it declares.
    The trigger names the emitting system as the filer, so a crosswalk carrying
    third_party_authored: true documents somebody else's specification and moves
    nothing. This was implied by the trigger and is now stated, because the
    registry carries two such filings.
  status_at_this_version: >
    No term in this file is canonical and no term lists an issuer. Both follow
    from the rule directly above, and both were wrong at 0.1.0.
    Six of the eight terms carried status canonical, and seven of the eight
    listed one issuer, this project's own agent-evidence-vectors reference verifier.
    field_evidence_partition listed none from the start, which is why the two
    counts differ and why neither is simply eight. A listing means, in this
    registry's own words, that a system emits the value in a real running
    artifact AND that a crosswalk saying so has been filed. At 0.2.0 nobody had
    filed one, us included. The first filing, aee-e2 on 2026-09-17, comes from an
    independent verifier, which declares no term emitted and so lists no issuer;
    its result row is what the recomputed state added in 0.3.0 is for.
    The named system is also a verifier and a vector suite, so it reads these
    fields and does not emit them from a live execution, and the paragraph above
    puts a mock outside the bar. One condition of two, on the generous reading.
    That is the defect this registry says it exists to fix, arrived at from our
    own side, and it stood in three layers: the status, the issuer listing, and
    the promotion each of those implied.
    All three were corrected on 2026-08-30 and nothing else about any term
    changed. Version moved to 0.1.1 in the same pass, because the 0.1.0 tag is
    still reachable and still carries the old content; a citer pinning a version
    has to get the corrected one.
    The bar binds the maintainer's own systems identically. A registry that
    grades other people's evidence is the first thing it has to grade.
    Verify by reading every status and issuers_in_production key in this file,
    and by listing crosswalk/.
    Version 0.5.0 adds ten terms, all proposed, none listing an issuer. Three of
    them, attestation_tier, origin_kind and
    base_state_resolution, are proposed and list no issuer. Two of them are
    borrowed, and crosswalk/asqav.yaml and crosswalk/trace.yaml record where
    from. origin_kind carries a fourth value this registry adds to the
    borrowed enum, first-hand, with the rule that binds observation_vantage:
    below-observed to it; the reason is in the term and the departure is the
    third recorded in crosswalk/trace.yaml. Both filings are marked
    third_party_authored: true, map published specifications this project does
    not maintain, and declare evidence:
    asserted, so neither promotes a term and neither is offered as promoting
    one. The v0.4.0 tag does not carry the ten terms; a citer pinning that
    tag gets the registry without them.
    Six more terms added in 0.5.0 are proposed, list no issuer,
    and bring the first external_instruments block. The six are
    independence_basis, party_role, control_relation and evidence_origin_class under evidence_dimensions, and
    set_sufficiency and material_change_trigger under posture_and_coverage. Each
    carries an external_anchor naming an article of a public legislative
    proposal, quoting its wording, and saying what the citation is worth.
    A citation is not a filing, and the distinction is the same one the
    promotion rule above turns on. An instrument that emits no signed records
    cannot be an issuer, so no term here moved and none is offered as having
    moved. observation_vantage gains an external_anchor on the same footing: it
    records a drafting pattern in that instrument's annex, with the two counts
    that were measured and an explicit refusal to assert the per-criterion
    counts the converted source cannot support.
    intent_binding, the tenth, is proposed and lists no issuer.
    Version 0.6.0 adds the done_verification section: eight terms, all
    proposed, none listing an issuer. Each carries a check, the rule a verifier
    applies to decide the term. Three crosswalks are filed for it, for Claude
    Code goals, Codex goals and in-toto/attestation#604. All three are marked
    third_party_authored: true and declare evidence: asserted, so none promotes
    a term and none is offered as promoting one. The v0.5.0 tag does not carry
    the section.
    Version 0.7.0 adds commitment_anchor and its required companion
    anchor_time_rule to evidence_dimensions, both proposed. commitment_anchor
    names a proven ceiling on when a record existed, the mirror of the floor
    issuance_time_basis names. It lists invinoveritas as an issuer: its public
    ledger emits the anchor as ots_anchor, a partial match filed by its own
    maintainer. Neither term is promoted, because no record yet carries
    anchor_time_rule on the wire. The v0.6.0 tag does not carry either term.
    Version 0.8.0 adds open verdict classes under the closed result lattice, a
    criticality for each term, a registryDigest a record carries to name the
    registry it used, and a resolvable URI for each term. No published
    identifier moved, and a record that names our own registry, or none, is
    checked exactly as before.
    Version 0.9.0 adds the incident_response section: fifteen terms, all
    proposed, none listing an issuer. evidence_state orders what responders
    can observe about one system into nine codes, ES0 to ES8, from silence to
    a requested restart, each defined by an observable entry condition. Three of them, decision_role,
    authority_basis and revocation_coverage, name who held which role in a
    decision, what kind of grant let the authorizer act, and how much of an
    issuance population a revocation reached. Each carries a check, the rule a verifier
    applies to decide the term, and criticality critical, because a misread
    makes a record read as enforced when it was not. Where a restoration
    evidence predicate in agent-evidence-vectors carries a term, its source path
    names that member; the other source paths name fields no published
    predicate defines yet. The crosswalks filed for the section map published guidance onto
    the terms; each is marked third_party_authored: true and declares
    evidence: asserted or no_mapping, so none promotes a term and none is
    offered as promoting one. Version 0.9.0 also adds the multi_agent_run section,
    whose terms name what a multi-agent defence did to its agents'
    communication graph during one run. All are proposed and none lists an
    issuer. Their source paths name members of the containment-journal
    predicate in agent-evidence-vectors, except generation_outcome, which names
    a member no published predicate carries yet. The section reuses
    response_function, control_failure_posture, response_decision and
    witness_scope and does not redefine them. The incident_response section also
    adds the notification value to response_function.
  opencre_links: >
    A term whose definition states a requirement that one of OpenCRE's Common
    Requirements organizes carries an opencre list. Each item names the CRE by
    its full https://www.opencre.org/cre/ URL, declares the fit with one of the
    crosswalk match types exact, structural or partial, and says in one line
    what the term and the requirement share. OpenCRE's importer reads those URLs
    from this file at a release tag, so the links move with the terms. A term
    with no honest match carries no list, and docs/OPENCRE.md says why for each
    one. scripts/check_opencre_links.py refuses any other shape, and any CRE URL
    anywhere else in this file, comments included.

  term_uri_base: "https://w3id.org/agent-evidence/vocab/v1/"
  term_uris: >
    Every term has one URI: term_uri_base followed by the term's key, for
    example https://w3id.org/agent-evidence/vocab/v1/observation_vantage. A
    registered value of a term is that URI with the value as its fragment, for
    example .../vocab/v1/observation_vantage#substrate. The URIs are made by
    this rule and are not stored per term, so a term cannot carry a URI that
    disagrees with its key. They are new in this revision; the predicate type
    URIs under https://w3id.org/agent-evidence/predicate/v1/ are unchanged.
    Each URI resolves to a generated page on the repository's Pages site, and
    scripts/check_uris_resolve.py fails when one does not.
  registry_digest: >
    A record names the registry its producer used by carrying the SHA-256 of
    this file's exact released bytes as registryDigest: {sha256: <hex>}. The
    digest addresses the file, so a consumer can fetch the same bytes at
    https://probityai.github.io/agent-evidence/vocab/v1/registry/sha256-<hex>.yaml
    and check them. The file cannot carry its own digest; registry.json, which
    scripts/gen_registry_index.py generates from it, carries it as
    source_sha256.
  open_value_rule: >
    How a verifier treats a value it does not have registered. Three cases,
    decided by the record's registryDigest. (1) The record names a registry
    whose digest the verifier holds: the check is exact, and an unregistered
    value makes the record malformed, as every term's own text says. (2) The
    record carries no registryDigest: the same exact check, so records made
    before this rule are judged as they always were. (3) The record names a
    registry the verifier does not hold, normally a newer one: an unregistered
    value is judged by the term's criticality. A critical term yields degraded
    with the value preserved in the verifier's output, never a silent pass and
    never a rejection that drops the evidence. An informational term ignores
    the value and preserves it. Every term declares its criticality. A
    verdict carried under result is the exception to case 3; verdict_classes
    below says how it is judged.
# external_instruments: public instruments a term below cites as the external
# anchor for its own axis. A citation here is a CITATION and never a crosswalk
# filing. A legislative proposal emits no signed records, so nothing in this
# block moves a term toward canonical, nothing in it may be read as an issuer,
# and the promotion rule in meta is untouched by it. The crosswalk/ directory
# stays what it is: one file per system that emits claims.
#
# Why cite an instrument at all. A term whose only justification is this
# registry's own argument is a term a reader has to take on trust. A term whose
# axis is already named in a public instrument is one a reader recognises, and
# the citation is checkable: the article is named, the wording is quoted, and
# the quote can be read against the instrument's own text.
external_instruments:
  cada_2026:
    title: >
      Proposal for a Regulation of the European Parliament and of the Council
      establishing a framework of measures for strengthening Europe's cloud and
      AI ecosystem (Cloud and AI Development Act)
    reference: "COM(2026) 502 final, 2026/0138 (COD), Brussels, 3 June 2026"
    celex: "52026PC0502"
    source_url: "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:52026PC0502"
    status_of_instrument: >
      A Commission proposal, so the text is a draft under the ordinary
      legislative procedure and every article number cited below can move before
      adoption. A term here is anchored on the WORDING, which is what a reader
      recognises; a renumbering breaks the citation and not the term. The URL
      above was dereferenced on 2026-09-20 and returned the document.
    read_from: >
      The proposal and its three annexes, converted from the published PDFs and
      read locally. Article and annex text quoted below comes from that local
      copy and was checked line by line against it, never from memory.

# evidence_dimensions: properties of HOW a claim was obtained. They describe the
# obtaining. What is claimed lives in posture_and_coverage and outcome_lattice
# below. A claim carrying either should declare these dimensions alongside it,
# because a result with no vantage attached says nothing about who saw it.
evidence_dimensions:

  observation_vantage:
    status: proposed
    criticality: critical
    review_by: "2027-02-11"
    values: [substrate, artifact]
    definition: >
      Whether every input a claim depends on was obtained at a vantage the
      executed artifact could neither forge nor suppress (substrate, meaning a
      network boundary, syscall supervision, a hypervisor's read of guest
      state), or
      whether the claim rests on artifacts the executed party could have
      influenced (artifact). Composes by weakest input: a claim derived from a
      mix of substrate and artifact observations inherits artifact.
      A consumer with no policy-pinned substrate root MUST treat every
      substrate-vantage row as unattested and MUST NOT infer the root from the
      claim itself (no trust-on-first-use).
    source_path: "predicate.attackResults[].basis"
    external_anchor:
      instrument: cada_2026
      cited: >
        Annex III, the two criteria whose lead-ins name paragraph (a) and
        paragraph (k) of Annex II, against the criteria between them.
      quote: >
        "The auditing organisation should verify the applicable Union legal
        framework of the audited provider and verify whether their establishment
        is genuine and stable". Against: "The audited provider should provide the
        auditing organisation with the following evidence related to the
        ownership structure and specific rights".
      measured: >
        The instrument drafts its evidence requirements in two grammars, and
        which one it reaches for tracks who could forge the answer. Counted over
        the local annex text on 2026-09-20: the exact string "the auditing
        organisation should verify" occurs 8 times and "the audited provider
        should provide" occurs 14. All 8 verify occurrences sit in the two
        criteria named above, at both ends of the annex. The provide occurrences
        are spread across the criteria between them. Per-criterion counts are
        NOT asserted: four criterion headings did not survive the conversion of
        the published PDF, so a per-criterion attribution from this copy would
        be a guess dressed as a count. The two totals and the location of the 8
        are what the text supports.
      anchor_reasoning: >
        This is the closest external precedent for the substrate-and-artifact
        split. Where the answer can be checked against a source the observed
        party does not control, the instrument tells the assessor to verify it.
        Where the answer is only obtainable from the observed party, it tells
        that party to provide it. The drafting split is the same distinction
        this term registers, arrived at from the other direction by a drafter who
        was not writing about evidence formats, which is what makes it worth
        citing. It also shows the limit: the instrument never says which of the
        two produced a given finding once the report is written, so a reader of
        the report cannot recover the split. Carrying the value per row inside
        signed bytes is the part that is ours.
    issuers_in_production: []
    why_this_registry: >
      This is the field for a question people already ask and have nowhere to
      answer. Read the free-text notes attached to crosswalks in registries of
      this kind and the relation between observer and observed keeps surfacing
      in prose, phrased differently every time, because there is no key for it.
      Prose does not compose, and two systems describing the same relation in
      their own words produce claims a consumer cannot compare.
    opencre:
      - cre: https://www.opencre.org/cre/026-280
        match: partial
        basis: "Both keep the record of an execution where the executed party cannot alter it; the requirement moves logs off the host, while this term grades where each input was obtained."

  observation_directness:
    status: proposed
    criticality: critical
    review_by: "2027-02-11"
    values: [intercepted, reconstructed]
    definition: >
      Whether a claim rests on events captured as they occurred (intercepted),
      or on state examined after the fact, a snapshot-to-snapshot diff
      (reconstructed), which can miss a transient condition raised and undone
      between the states compared. Orthogonal to observation_vantage; composes
      by weakest input.
    source_path: "predicate.attackResults[].method"
    issuers_in_production: []
    why_this_registry: >
      A live capture and a weekly re-scan can produce claims that read
      identically. One watched the execution happen; the other inferred it
      afterwards from what was left behind. Without this field a consumer has no
      way to tell which they are holding, and the two carry very different
      weight when the executed party had an interest in the answer.

  witness_scope:
    status: proposed
    criticality: critical
    review_by: "2027-02-11"
    values: [SELF, PEER, EXTERNAL]
    definition: >
      Who the witness is relative to the party whose execution is described:
      the observed party itself (SELF), another participant in the same
      interaction (PEER), or a party outside it that the observed party cannot
      reach (EXTERNAL). Orthogonal to observation_vantage, which says what was
      observed, and to observation_directness, which says how; this says whose
      account a consumer is reading. Values are recorded in the casing the wire
      carries, upper case. A consumer matches the emitted string, not a
      normalised form.
    attribution: "witness_scope (SELF, PEER, EXTERNAL): wording from Empire Labs, the bounded verdict envelope put to the commerce working group, https://github.com/aaif/wg-agentic-commerce/issues/5 (2026-08-26)"
    source_path: "vectors[].witnessScope"
    issuers_in_production: []
    why_this_registry: >
      This term was missing while a corpus of ours already emitted it, which is
      the one failure a registry exists to prevent. Measured 2026-09-22 across
      vectors-acs-core: 32 vectors carry witnessScope, nineteen SELF, twelve
      PEER and one EXTERNAL, and nothing in this file defined any of the three,
      so a consumer holding one of those vectors could not resolve its value
      against anything. A counterparty found it by checking our own citation of
      this registry against the registry, on
      GenAI-Security-Project/agent-control-standard#18, and he was right. The
      axis it names is the one the whole thesis turns on: a record written by
      the party being described carries different weight from one written by a
      party that party cannot reach, and a consumer cannot apply that judgement
      unless the distinction is on the wire and defined somewhere.
      issuers_in_production stays empty deliberately. Our own corpus emits this
      field, and by the promotion rule in meta our own issuer does not count, so
      the term is proposed until an independently-maintained system files a
      crosswalk declaring it emitted with a resolvable source path.

  field_evidence_partition:
    status: proposed
    criticality: critical
    review_by: "2027-02-11"
    values: [substrate_covered, producer_asserted]
    definition: >
      A per-artifact declaration of which identity's signature backs which
      field within a mixed claim: which values are covered by an observation
      the observed party could not have produced, and which are backed only by
      the enclosing envelope and are therefore the producer's own assertion.
      Most execution-evidence artifacts mix observed and self-declared fields
      under one signature with no way to tell which is which from the wire
      alone; this term names the split explicitly.
    issuers_in_production: []
    promotion_trigger: >
      An independent implementation that is not us, declaring this field
      per-artifact (not merely in prose) and filing a crosswalk with
      evidence: emitted.

  issuance_time_basis:
    status: proposed
    criticality: critical
    review_by: "2027-02-11"
    values: [beacon_anchored, asserted]
    definition: >
      Whether a record's earliest-possible signing time is PROVEN, meaning the
      signed pre-image folds in a publicly datable value that was unpredictable
      before its round (e.g. a drand round output, or an RFC 9334 Section 10.3
      epoch identifier), so the signature cannot predate its round, or merely
      ASSERTED by the issuer with no such binding. Deliberately one-sided: a
      proven floor and an asserted ceiling, never claimed as a two-sided proof
      of freshness.
    source_path: "predicate.observationRecords[].payload (arming pre-image)"
    issuers_in_production: []
    promotion_trigger: "An independent implementation that is not us, with a real beacon binding."

  commitment_anchor:
    status: proposed
    criticality: critical
    review_by: "2027-02-24"
    values: [anchored, asserted]
    definition: >
      Whether the latest possible time a record existed (its CEILING) is PROVEN
      by an external anchor over a digest that recomputes from the record, or
      merely ASSERTED by the issuer. The mirror of issuance_time_basis: that
      term proves a floor on signing time, this one proves a ceiling on
      existence. A ceiling is proven only under the anchor_time_rule the record
      states, because the same proof yields different ceilings under different
      rules (a Bitcoin anchor under header_time_plus_tolerance and under
      later_median). anchored therefore requires anchor_time_rule; a record
      that is anchored without one is read under the rule's stated default and
      a verifier SHOULD report which rule a verdict used. The anchored digest
      MUST recompute from the record under a named deterministic procedure, or
      the record has no anchor for this term. asserted MUST NOT be read as a
      ceiling at all. A proven ceiling establishes that the bytes existed no
      later than that time, and nothing about who made them or whether their
      content is true.
    source_path: "record.commitment_anchor {mechanism, digest, digest_rule, anchor_time_rule, ...}"
    issuers_in_production: [invinoveritas]
    promotion_trigger: "An independent implementation that is not us emits a real anchor with anchor_time_rule on the wire."
    source: >
      OBS-06 corpus, babyblueviper1/preaction-governance-conformance at 5ae6344
      (examples/commitment-anchor-obs06: README, check.py, vectors.json, a real
      .ots). Read blind by two readers on probityai/agent-evidence#32 at
      bd70521 and 17bb5ad, an implementation that is not the author's reading
      the text.

  anchor_time_rule:
    status: proposed
    criticality: critical
    review_by: "2027-02-24"
    values: [header_time_plus_tolerance, later_median, height]
    definition: >
      The rule by which a commitment_anchor's ceiling is derived, and the
      required companion of commitment_anchor: anchored, header_time_plus_tolerance
      means ceiling = anchor_time + anchor_time_tolerance_s (right where the clock
      states its own accuracy, as an RFC 3161 TSA does; for Bitcoin only a
      convention, since nothing caps how far a header time may lag). later_median
      means ceiling = the median time of the 11 blocks after the anchor block, on
      the stated assumption that a majority of those timestamps are honest.
      height means the outcome is ordered by the same chain, and precedence holds
      only if the anchor height is strictly below the outcome height, with no
      time compared. Absent means header_time_plus_tolerance, for records written
      before the field existed. A rule whose inputs are missing establishes
      nothing.
    source_path: "record.commitment_anchor.anchor_time_rule"
    issuers_in_production: []
    promotion_trigger: "An independent implementation that is not us emits anchor_time_rule on a real record."

  attestation_tier:
    status: proposed
    criticality: critical
    review_by: "2027-03-19"
    values: [voluntary, authoritative]
    definition: >
      Whether the subject a platform signed was RE-DERIVED by that platform from
      evidence the caller does not control (authoritative), or was accepted from
      the caller and signed as supplied (voluntary). A voluntary record is
      non-repudiable for exactly what was signed: this platform signed these
      bytes, at this time, under this key. It is not a capture and it is not
      unbypassable. A verifier MUST NOT read a voluntary attestation as evidence
      that the attested content corresponds to any independently observed fact.
      The tier is set by the PLATFORM and read by a verifier from the record. A
      caller MUST NOT select it. A caller-selected tier is the whole attack: the
      one party with an interest in the answer would be choosing how much weight
      the answer carries.
      Closed and fail-closed, on the same rule as containment_posture: an absent,
      non-string, or unregistered value makes the enclosing statement malformed,
      and a missing tier is never read as the stronger of the two.
      The bounds of what was re-derived are part of the claim. Where a caller
      supplied any bound of the re-derivation input, the record MUST declare
      that, and a verifier MUST NOT read an authoritative tier as coverage of
      everything the subject did.
      SELECTION is part of the same question. A caller that chooses which subject
      to request an attestation over, and when, has bounded the claim without
      supplying any bound, so the rule above is not satisfied by a record that
      merely had no bound to declare. coverage_denominator is the field that
      closes that gap, and an authoritative record making any claim about a
      population needs it.
      An authoritative tier is a claim about a re-derivation, which is a claim
      about bytes a platform fetched. It composes with observation_vantage and
      never substitutes for it: whether anyone observed the execution is a
      separate question this field does not answer. So a record declaring
      authoritative MUST also declare observation_vantage, and a verifier MUST
      reject an authoritative record that does not. Without that pairing the
      composition rule has nothing to compose with, and a platform the observed
      party operates can set the stronger tier on its own records forever.
    issuers_in_production: []
    promotion_trigger: >
      An independently-maintained system that is not us, emitting the tier as a
      field in a real signed statement and filing its own crosswalk with
      evidence: emitted and a resolvable source_path.
    why_this_registry: >
      The split itself is not ours. A published Internet-Draft, cited in
      crosswalk/asqav.yaml, defines these two tiers for one platform's own
      attestation statements and states the verifier prohibition in the words
      carried above. What this registry adds is the form a third party can
      crosswalk onto, and two rules that draft leaves open.
      First, its authoritative tier re-derives a digest over a commit range whose
      base identifier the caller MAY supply, so the signer re-derives honestly
      across a window the observed party chose. The draft concedes the
      consequence in its own words, that the signed digest is not a claim the
      range covers every change the producer authored, and a reader who sees only
      the tier will read it as one. So the bound declaration above is a MUST here.
      Second, a tier is only as independent as the platform that sets it. Where
      the platform is operated by the party being observed, a platform-set tier is
      caller-controlled through one more hop. That is why this field composes with
      observation_vantage and is refused any standing on its own.

  origin_kind:
    status: proposed
    criticality: critical
    review_by: "2027-03-19"
    values: [self, first-hand, third-party-control-plane, log-import]
    definition: >
      Which party produced the evidence a record is assembled from: the runtime
      that performed the execution produced its own record (self); the record was
      assembled from another vendor's runtime governance output, asserted by the
      system that produced it with no root outside that system
      (third-party-control-plane); or it was assembled from a log or export whose
      producer is not a control plane, such as a SIEM export, an audit trail, or
      a batch job (log-import).
      first-hand is a FOURTH value this registry adds and the source enum does not
      carry: the producer obtained the evidence by its own observation and is not
      the party that executed, so it neither performed the execution nor holds
      somebody else's output. It exists because the borrowed enum is written from
      the perspective of a record about its own execution, while this registry also
      carries observation_vantage, which names a producer that is neither the
      executing party nor an assembler. Without the fourth value the field is
      REQUIRED and unfillable for exactly the records an independent observer
      emits, and the pressure is then to spell one of them self, which is the one
      reading that makes the field lie.
      The value says HOW the evidence arrived and never where the producer stood.
      observation_vantage says where, and the two compose: first-hand with peer and
      first-hand with below-observed are both real producers, and a value that
      carried the layer in its own name would have left one of them unfillable
      again. Two spellings were drafted and dropped for that reason, and the
      second for a second reason: observer collides with observer-attested in the
      source specification's own family, where it means a third party that fetched
      and measured the subject from outside it.
      A record MUST NOT declare observation_vantage: below-observed unless its
      origin_kind is first-hand, and a verifier MUST reject it otherwise. A party
      attesting its own execution is not below itself, and an assembler holding
      somebody else's output was not there at all. Each of
      the other three values names a producer that did not observe from below the
      observed party: self IS the observed party, and the two assembling values
      hold output somebody else produced. This is the rule that reaches the
      importer the platform rule below does not. An importer can carry
      software-only exactly as required, satisfy every other rule here, and still
      claim a vantage it never occupied, because the platform field answers what
      the producer runs on and the vantage field answers where it stood.
      A record whose origin_kind is third-party-control-plane or log-import MUST
      declare a software-only runtime platform, and a verifier MUST reject it
      otherwise. An importer holding someone else's log has no quote to present,
      so a hardware platform value on such a record is not a stronger claim but an
      untrue one. first-hand MAY declare a hardware platform, because such an
      observer
      below the observed party can hold a root of its own, and that is the case the
      borrowed rule had no value for.
      The value is REQUIRED. Absent, non-string, or unregistered makes the
      enclosing statement malformed, and absence is never read as self.
      This field names the assembler and establishes nothing about independence. A
      verifier MUST NOT read third-party-control-plane as evidence that the
      producer is independent of the observed party: the two can be one legal
      entity, or one can operate the other. Independence is an
      observation_vantage question and this field does not answer it.
      It launders assurance in neither direction. Naming a producer does not make
      unattested evidence attested, and a record with a hardware platform and a
      verified quote is what it is whether or not it says self.
      The value is a PRODUCER ASSERTION in the sense of field_evidence_partition,
      never a substrate-covered field, and nothing in this registry can make it
      one. A verifier MUST NOT read self as evidence of provenance: a record
      assembled from somebody else's log and declared self is indistinguishable
      on the wire from one the runtime produced. What the field is worth is that
      a false value is then a false statement inside signed bytes, attributable
      to the key that signed them. A record that carries
      field_evidence_partition MUST place origin_kind on the producer_asserted
      side of the split.
      Three of the four values are borrowed verbatim, hyphens included, from the
      specification cited in crosswalk/trace.yaml. Re-spelling them in this
      file's usual underscore style would have produced a false friend across two
      registries for no gain. The fourth, first-hand, is this registry's own, and
      the
      direction of the resulting mismatch is stated, not glossed: this value
      set is a SUPERSET, so every value that specification emits validates here,
      and one value this registry admits does not validate there. A crosswalk
      consumer reads the fourth value as unmapped, not as a renaming of any
      of the three.
    issuers_in_production: []
    promotion_trigger: >
      An independently-maintained system that is not us, emitting the value as a
      field in a real signed statement and filing its own crosswalk with
      evidence: emitted and a resolvable source_path.
    why_this_registry: >
      Every other term here describes how a claim was obtained. This one
      describes how it ARRIVED, and that is the question an adapter answers by
      accident. The failure is documented in the specification the enum comes
      from: an adapter built by starting from a hardware example and editing the
      fields it understood emits a hardware platform on a record transcribed from
      somebody else's log. No single field in that record is false and the whole
      of it is untrue.
      Three departures from the source are recorded in the crosswalk and all three
      are hardenings. The value is required here with no absence default, because
      there the permissive reading is the default and a silent record cannot be
      told from a self-produced one. The field is explicitly denied any
      independence meaning, because the value that reads most like corroboration
      is the one a party can emit about its own control plane. And the value set
      gains the first-hand role the source model has no rung for, together with the
      rule that binds the independence claim to it, because a required
      field with no true value for a real producer is a field that gets filled with
      a false one. The source family's own assurance ladder is the evidence that the
      rung is missing, not unwanted: it runs publisher-asserted,
      observer-attested, tee-attested, and the middle rung carries the caveat that
      it "does not catch a server that behaves one way for the observer and another
      way for you", while the top rung is the observed party attesting itself from
      inside a TEE and, in their own words, "requires the operator to have adopted a
      confidential runtime". A producer standing below the observed party answers
      that caveat without that requirement, and their ladder has no row for it.

  independence_basis:
    status: proposed
    criticality: critical
    review_by: "2027-09-20"
    values: [independent_sources, subject_supplied, undeclared]
    definition: >
      Whether the guarantee a claim rests on was demonstrated by sources
      independent of the party the claim is about (independent_sources), came
      from that party itself (subject_supplied), or carries no declaration at
      all (undeclared). Independence here is a relation between two named
      parties and never a property of one of them, so a record declaring
      independent_sources MUST name the independent party under party_role.
      The value is REQUIRED and fail-closed. Absent, non-string or unregistered
      makes the enclosing statement malformed, and absence is never read as
      independent_sources.
      A verifier MUST NOT infer this value from observation_vantage, and MUST
      NOT infer observation_vantage from this one. The two are orthogonal: a
      substrate-vantage observation can be made by the observed party's own
      platform, and an independent party can file a claim whose inputs were all
      artifact-vantage.
    issuers_in_production: []
    promotion_trigger: >
      An independently-maintained system that is not us, emitting the value as a
      field in a real signed statement and filing its own crosswalk with
      evidence: emitted and a resolvable source_path.
    external_anchor:
      instrument: cada_2026
      cited: >
        Annex II, Union assurance level 1, criterion 1.1(g), and the same phrase
        at two higher levels (three occurrences in total); Article 20(4)(a)(i)
        to (iii); Article 20(5)(c).
      quote: >
        "the cloud computing service provider guarantees that there are no
        existing laws and practices in that third country, demonstrated by
        independent sources, that require the cloud computing service provider
        to report information on software vulnerabilities to authorities of that
        third country prior to those vulnerabilities being known to have been
        exploited"
      anchor_reasoning: >
        The phrase "demonstrated by independent sources" is a public legal
        instrument's own name for this axis, and having it means a policy reader
        meets a term already in their vocabulary. The checkable test sits four
        articles away, which is why both are cited together: the instrument
        makes independence arithmetic. No non-audit services in the 12 months
        before the audit and a commitment to none for the 12 months after, no
        audit services in the preceding 10 years, no fees "contingent on the
        result of the audit", and a "declaration of interests" required in the
        report itself. A date-and-money test is what this registry wants from an
        independence claim, and it is what a prose assurance of independence
        never gives a verifier.
    why_this_registry: >
      Every other dimension here describes the obtaining of a claim. This one
      describes the relation between the obtainer and the obtained, which is the
      question a reader who trusts nobody asks first and which no term here
      answered. observation_vantage says a claim was taken at a boundary the
      executed artifact could not forge; it says nothing about who owns that
      boundary. The two values a producer would most like to conflate are
      therefore split, and the split is stated as a verifier MUST NOT in both
      directions.

  party_role:
    status: proposed
    criticality: critical
    review_by: "2027-09-20"
    values:
      - audited_provider
      - auditing_organisation
      - evaluating_authority
      - reviewing_authority
      - registry_operator
    definition: >
      The role a named party holds with respect to one evidence set: the party
      the evidence is about (audited_provider), the party that assessed it
      (auditing_organisation), the party that decides admission on the strength
      of it (evaluating_authority), a peer party entitled to object to that
      decision without having seen the system (reviewing_authority), and the
      party that publishes the resulting entry and its withdrawal
      (registry_operator).
      The five spellings are borrowed verbatim in sense from the instrument
      cited below, because a role vocabulary is worth nothing if each reader
      translates it. One party MAY hold two roles in one exchange and a record
      declaring that MUST say so by carrying the party twice; a verifier MUST
      NOT read two roles as two parties.
      A record declaring independence between two roles held by one party is
      malformed, and that is the whole reason the roles are enumerated.
    issuers_in_production: []
    promotion_trigger: >
      An independently-maintained system that is not us, emitting the role as a
      field in a real signed statement and filing its own crosswalk with
      evidence: emitted and a resolvable source_path.
    external_anchor:
      instrument: cada_2026
      cited: >
        Article 2, point (2) and points (17) to (20); Article 17(2) for the
        evaluating authority; Article 17(5)(a) and 17(6) for the reviewing
        authority; Article 22(1) and 22(3) for the registry operator and the
        publication of a withdrawal.
      quote: >
        "'auditing organisation' means an individual organisation, a consortium
        or other combination of organisations, including any subcontractors,
        that the audited cloud computing service provider has contracted to
        perform an independent audit". And: "The competent authority of
        establishment shall be the evaluating national competent authority."
      anchor_reasoning: >
        The instrument separates five parties across an evidence exchange and
        keeps them separate through every article that moves a record between
        them. The phrase "audited provider" is used throughout the operative
        text without a definition of its own in Article 2, so it is recorded
        here as used-and-undefined there, and this registry defines it. The
        instrument also holds recognition apart from certification: what the
        authority grants is recognition of a service at a level, on evidence,
        with no certificate issued by this procedure, which is why the role is
        named evaluating_authority and not a certifier.
    why_this_registry: >
      independence_basis asserts a relation and needs two ends. Without a
      registered role vocabulary each filer names the ends in their own words
      and the relation stops being machine-checkable, which is how an
      independence claim becomes decoration. The enumeration also makes the
      commonest defect expressible: one legal entity holding both the observed
      and the observing role, declared as independent because the two names in
      the record differ.

  control_relation:
    status: proposed
    criticality: critical
    review_by: "2027-09-20"
    values: null
    definition: >
      A structured statement of who can direct the party or the system a claim
      is about: holders of at least 5% of capital or at least 5% of voting
      rights including through intermediaries and voting agreements, the body
      empowered to take strategic decisions, the rules for appointing and
      removing that body, the quorum and majority a strategic decision needs,
      blocking and veto rights short of a majority, and influence exercised
      through commercial or financial links.
      This term is a producer assertion in the sense of field_evidence_partition
      and nothing in this registry can make it one of the covered fields. A
      record carrying field_evidence_partition MUST place it on the
      producer_asserted side. Its worth is that a false value is a false
      statement inside signed bytes, attributable to the key that signed them.
      A verifier MUST NOT read an absent control_relation as an absence of
      control.
    issuers_in_production: []
    promotion_trigger: >
      An independently-maintained system that is not us, emitting the structure
      as a field in a real signed statement and filing its own crosswalk with
      evidence: emitted and a resolvable source_path.
    external_anchor:
      instrument: cada_2026
      cited: >
        Annex III, assessment of ownership and control, points (1)(a) to (1)(f)
        and (2)(a)(i) to (2)(a)(ii); Article 2, point (21), which takes
        "control" by reference from Article 2, point (6), of Regulation (EU)
        2021/697.
      quote: >
        "the quorums and majority required for adopting strategic decisions, in
        order to determine if any shareholder can take a strategic decision
        (either because they have the required majority to approve such a
        decision or because they can block such a decision through a veto or
        other specific rights even if they cannot impose such a decision on
        their own, etc.)". And: "hold, directly or indirectly, at least 5% of
        the capital or at least 5% of the voting rights, including through any
        content, understanding, relationship or intermediary."
      anchor_reasoning: >
        A vantage claim is worth what the observer's independence is worth, and
        an observer's independence is worth what the control chain over both
        ends says it is. The instrument supplies a full taxonomy for the
        question, including the two limbs a shareholding threshold alone
        misses: a veto that blocks a decision without carrying it, and
        influence through a commercial or financial link with no shareholding
        at all. The instrument's own enumeration is the taxonomy; the threshold
        is quoted as it is written and this registry sets no threshold of its
        own.
    why_this_registry: >
      No execution-evidence format expresses the governance half of a vantage
      claim. The formats describe an artifact, a build, or a run, and then rest
      an independence claim on the identity of a signing key, which says who
      signed and nothing about who can direct the signer. The value is the ugly
      one to carry and the one a distrusting reader wants first.

  evidence_origin_class:
    status: proposed
    criticality: critical
    review_by: "2027-09-20"
    values: [document, database_or_it_system, interview, test]
    definition: >
      Which kind of act produced an evidence item: a document was read, a
      database or IT system was queried, a person was asked, or a test was
      performed. The four classes are exhaustive for this registry and closed:
      an absent, non-string or unregistered value makes the enclosing statement
      malformed.
      This says nothing about who produced the item, which origin_kind answers,
      and nothing about the vantage the item was obtained at, which
      observation_vantage answers. A verifier MUST NOT read test as a
      substrate-vantage claim: a test performed by the observed party on itself
      is a test, and its vantage is artifact.
      A claim assembled from more than one class SHOULD carry the class per item.
      A single class declared over a mixed set is a statement about the set's
      weakest member, in the same composition rule observation_vantage uses.
    issuers_in_production: []
    promotion_trigger: >
      An independently-maintained system that is not us, emitting the class as a
      field in a real signed statement and filing its own crosswalk with
      evidence: emitted and a resolvable source_path.
    external_anchor:
      instrument: cada_2026
      cited: "Article 2, point (20)."
      quote: >
        "'audit evidence' means any information used by an auditing organisation
        to support the audit findings and conclusions and to issue an audit
        opinion, including data collected from documents, databases or IT
        systems, interviews or testing performed"
      anchor_reasoning: >
        A statutory definition of evidence that spans machine-emitted and
        human-sourced material in one breath, with the four origins named in the
        definition itself. It is worth having for two reasons. It is citable, so
        a claim about what evidence is does not rest on this registry's own
        assertion. And the four classes cut across the split this registry
        already carries: an interview is evidence under the instrument's
        definition and can never be a covered field under
        field_evidence_partition, so a format that carries only machine-emitted
        items is narrower than the legal definition of the thing it claims to
        carry, and saying so is more useful than widening the format.
    why_this_registry: >
      The registry describes how directly a claim was obtained and from what
      vantage, and had no term for what the obtaining physically was. The gap
      shows up whenever a record mixes a query against a running system with a
      document somebody wrote about it, which is the ordinary case in every
      assurance exchange and is invisible on the wire when one class is assumed.

  intent_binding:
    status: proposed
    criticality: critical
    review_by: "2027-04-07"
    values: [committed_before_execution, asserted_after_execution]
    definition: >
      Whether the identifier of the intent an action ran under (the authority
      that permitted it, naming who requested it and who executed it) is folded
      into a commitment the observer signed BEFORE the action began
      (committed_before_execution), or only attached to the record once the
      action was over (asserted_after_execution). A committed identifier
      survives fan-out, retries and hops between agents as signed content: every
      record descended from one intent carries the same value inside bytes
      fixed before each action opened, so linking them needs no header that
      every hop must forward. An asserted identifier is a label a producer can
      choose after seeing the outcome. Composes by weakest input: a chain of
      actions is committed_before_execution only if every link is.
    source_path: "observed-effect predicate: predicate.authorityDigest, bound by predicate.observation.priorCommitment.commitmentDigest"
    issuers_in_production: []
    why_this_registry: >
      Tracing work for multi-agent and MCP systems keeps arriving at the same
      missing primitive, an original intent identifier that survives fan-out,
      retries and multi-agent hops, and keeps proposing it as a propagated
      header. A propagated header is reconstructed after the fact and breaks at
      the first hop that drops it. The question a consumer needs answered is not
      whether the identifier is present but whether it was fixed before the
      action ran, and no existing term names that.
    promotion_trigger: "An independent implementation that is not us, emitting the intent identifier inside a commitment signed before the action opens."

# posture_and_coverage: what an execution environment was actually in, and
# how much of a declared population a claim actually assessed.
posture_and_coverage:

  containment_posture:
    status: proposed
    criticality: critical
    review_by: "2027-02-11"
    values:
      - no_network
      - allowlist
      - sinkhole
      - unsafe_bypass_egress
    definition: >
      The network-egress posture of the execution environment a governed
      artifact actually ran inside. Digest-committed and substrate-authoritative,
      never runner-asserted. Closed and fail-closed: an absent,
      non-string, or unregistered value makes the enclosing statement
      malformed, never defaulting to a permissive reading.
    source_path: "predicate.observationEnvironment.networkPosture.posture"
    issuers_in_production: []
    why_this_registry: >
      Most evidence about software describes an artifact. This term describes
      the environment the artifact was actually running in, which is a different
      claim and a harder one, because it needs a value the running code could
      not have chosen for itself. So the posture is committed by digest, and it
      is read from the substrate, never from the process being observed. A
      posture the subject could set for itself is decoration.
    opencre:
      - cre: https://www.opencre.org/cre/515-021
        match: structural
        basis: "The term records which network isolation the artifact actually ran inside, read from the substrate, so a consumer can require the isolation that requirement asks for."

  coverage_denominator:
    status: proposed
    criticality: critical
    review_by: "2027-02-11"
    values: null
    definition: >
      A digest-committed partition of the population a claim is drawn from
      into three pairwise-disjoint sets (assessed, out-of-scope-with-a-reason,
      and routed-elsewhere) whose union MUST equal the keys of a
      digest-committed manifest the producer does not control. Without this, a
      claim of "found nothing" and a claim of "looked at nothing" are
      indistinguishable on the wire.
    source_path: "predicate.coverage.{assessedClasses,outOfScope,routedElsewhere}"
    issuers_in_production: []
    why_this_registry: >
      A producer that commits to its denominator can be caught understating it
      later. That is the point, and it is why the field is here and not in a
      methodology note. The usual substitute is a rule about withholding a
      result when the sample is too small, which decides whether to publish and
      says nothing about what the population was.
    opencre:
      - cre: https://www.opencre.org/cre/433-442
        match: partial
        basis: "Testing at a stated depth and coverage (SA-11) needs the assessed population named; the term commits that population so an empty result over nothing assessed cannot pass as a clean one."

  does_not_assert:
    status: proposed
    criticality: critical
    review_by: "2027-02-11"
    values: null
    definition: >
      A machine-readable list of short strings, carried inside the signed
      statement itself, stating what this evidence explicitly cannot claim.
      One agreed spelling per claim, no accepted alias, never buried in
      free-text documentation where a consumer has to go looking for it.
    source_path: "predicate.doesNotAssert"
    issuers_in_production: []
    why_this_registry: >
      Comparable registries carry this concept, when they carry it at all, as
      file-level prose (a repository-wide "out of scope" list), not as a
      per-artifact field. A file-level list cannot say what one claim withholds,
      which is the whole question anyone relying on that claim is asking.

  claim_subject:
    status: proposed
    criticality: critical
    review_by: "2027-04-07"
    values: [tool, agent, organization]
    value_definitions:
      tool: >
        A callable capability with a fixed definition, such as an MCP tool, a
        function exposed to a model, or a server's tool manifest. A claim at
        this class is about that definition and the code behind it.
      agent: >
        A running system that chooses which tools to call and with what
        arguments. A claim at this class is about the decisions and effects of
        that system during a stated run.
      organization: >
        The party that operates, deploys or answers for agents and tools. A
        claim at this class is about its controls, keys or accountability.
    definition: >
      The class of subject a claim is about. A claim at one class is never
      evidence at another: a result about a tool's definition says nothing
      about an agent that called it, and a result about an agent's run says
      nothing about the organization that operates it. A consumer MUST NOT
      satisfy a requirement stated at one class with a claim carrying another,
      and a claim with no declared class MUST be treated as not satisfying any
      class-specific requirement.
    source_path: "predicate.claimSubject"
    issuers_in_production: []
    why_this_registry: >
      Indexes that grade tools, agents and organizations side by side invite a
      consumer to read a passing tool grade as a statement about the agent or
      the operator. The class has to travel with the claim, as a closed value,
      or the collapse happens silently at the point of use.

  base_state_resolution:
    status: proposed
    criticality: critical
    review_by: "2027-03-19"
    values: [supplied, authority_recorded, empty_tree]
    definition: >
      How the before-state root of an observed interval was obtained, declared
      per record as one of three: supplied, the base was named in the request and
      is a full-length lowercase hexadecimal object name; authority_recorded, the
      base is the one the state authority itself records for the change, which
      for a version-control authority is the merge-base anchor and is stable
      across merge and squash rewrites; empty_tree, the interval began from no
      prior state at all and the base is the empty-tree constant of the declared
      object format.
      Resolution is ORDERED. A producer MUST try supplied, then
      authority_recorded, then empty_tree, and MUST refuse to emit the record
      where none of the three yields a base. A producer MUST NOT infer a base
      from the parents of the named state, which are ambiguous for merge and
      squash rewrites. A guessed base produces a record that verifies cleanly
      over an interval nobody chose.
      A before-state root is therefore unconditionally REQUIRED. The empty_tree
      case is what makes one always available, so a missing before-state root is
      a refusal and never a permitted omission.
      The empty-tree constant is a property of the object format and MUST be read
      from the format the record declares. For git's SHA-1 object format it is
      4b825dc642cb6eb9a060e54bf8d69288fbee4904. For git's SHA-256 object format
      it is
      6ef19b41225c5369f1c104d45d8d85efa9b057b53b14b4b9b939dd74decc5321. A record
      carrying the SHA-1 constant under a SHA-256 object format names an object
      that does not exist, and a verifier MUST reject it.
      empty_tree is permitted only where the authority shows the prior state was
      empty, which for a version-control authority means a parentless commit. It
      MUST NOT be used to mean that the observer did not enumerate the prior
      state. A record using it that way satisfies every other rule above and
      misstates the interval, which is why the permitted condition is normative.
      The state authority MUST be named in the record, for all three values. And
      empty_tree MUST NOT be resolved from the observer's own first sight of the
      state: a first observation establishes that the observer saw nothing
      earlier, never that nothing was there. A volume pre-populated by an image
      and mounted fresh is the case this closes, because it presents to a first
      observation exactly as an empty one does. Where no authority independent of
      the observed party can show the prior state was empty, the producer MUST
      refuse the record under the ordered rule above.
    issuers_in_production: []
    promotion_trigger: >
      An independently-maintained system that is not us, emitting the resolved
      branch as a field in a real signed statement and filing its own crosswalk
      with evidence: emitted and a resolvable source_path.
    why_this_registry: >
      It sits in this block, beside coverage_denominator, because it answers the
      same kind of question on a different axis. coverage_denominator says which
      population a claim assessed. This says which interval it assessed, and an
      unresolved base leaves the lower bound of that interval to the reader.
      The ordered rule and the terminal case are lifted from a published
      Internet-Draft, cited in crosswalk/asqav.yaml, which defines them for one
      host's diff rendering of a commit range. Three things are added here. The
      constant is bound to a declared object format, which that draft leaves
      implicit while naming the SHA-1 value alone, and both values were checked
      against a repository in each format on 2026-09-19 before being written into
      this file. The resolved BRANCH is itself the registered value, so a
      verifier reads which of the three produced the base and does not re-derive
      the ordering from what the record happens to carry. And the terminal case
      carries a permitted condition, so it cannot stand for a prior state nobody
      looked at.

  set_sufficiency:
    status: proposed
    criticality: critical
    review_by: "2027-09-20"
    values: [sufficient, insufficient, not_assessed]
    definition: >
      Whether the evidence SET a claim rests on was relevant and sufficient to
      reach the claim, held as a separate axis from whether any individual ITEM
      in it was reliable. A set of items each independently verified can still
      be too thin to decide, and a single unreliable item can sit inside a set
      that is otherwise ample. Collapsing the two axes into one pass or fail
      makes both unsayable.
      The value is REQUIRED and fail-closed. Absent, non-string or unregistered
      makes the enclosing statement malformed, and absence is never read as
      sufficient. A verifier MUST NOT derive this value from item-level
      verification results, and MUST NOT read sufficient as a statement about
      any item.
      insufficient is a result and not an error: it says the assessment ran and
      the set did not reach the claim. not_assessed says the axis was never
      examined, and a consumer MUST treat those two as different.
    issuers_in_production: []
    promotion_trigger: >
      An independently-maintained system that is not us, emitting the value as a
      field in a real signed statement and filing its own crosswalk with
      evidence: emitted and a resolvable source_path.
    external_anchor:
      instrument: cada_2026
      cited: "Article 21(2), points (a) and (b)."
      quote: >
        "The audit evidence shall be: (a) relevant and sufficient to enable the
        auditing organisation to prepare an audit report and provide an audit
        opinion; and (b) reliable, according to the auditing organisation's
        professional judgment and scepticism."
      anchor_reasoning: >
        Two admissibility axes in one sentence, each with its own grammatical
        subject: (a) is a property of the set and (b) is a property of the item.
        The instrument then puts item reliability in the assessor's professional
        judgment, which is exactly the seam a machine-checkable registry
        occupies: reliability defined by digest, emitter and collection time is
        a value a distrusting reader re-derives, and a judgment is not. This
        term takes the set-level half, where the instrument's wording is
        already mechanical, and leaves the item-level half to the terms that
        define it mechanically.
    why_this_registry: >
      coverage_denominator says what population a claim was drawn from. This
      term says whether what was drawn reached the claim, which is a different
      question and the one a reader asks when a denominator is honest and small.
      Without it a producer with a complete, correctly declared denominator and
      three items in it has no registered way to say so, and a consumer reads
      the claim as it reads every other passing claim.

  material_change_trigger:
    status: proposed
    criticality: critical
    review_by: "2027-09-20"
    values: null
    definition: >
      The named event that ends a standing claim's validity and obliges a
      re-assessment: a material change in the circumstances a claim was made
      about. A record carrying this term states which circumstances were assumed
      stable, so a later change in one of them is an event a third party can
      detect by comparison and not a disclosure the observed party is trusted to
      volunteer.
      A verifier MUST treat a claim carrying no such statement as making no
      commitment about its own continued validity, and MUST NOT read the absence
      as a claim of stability.
      The trigger is a property of the claim and never a policy threshold: it
      names what would invalidate the claim, and a consumer's own re-check
      interval sits on top of it.
    issuers_in_production: []
    promotion_trigger: >
      An independently-maintained system that is not us, emitting the statement
      as a field in a real signed statement and filing its own crosswalk with
      evidence: emitted and a resolvable source_path.
    external_anchor:
      instrument: cada_2026
      cited: >
        Article 23(1) to 23(3); recital (58); Article 20(8) for the annual
        review by the same or a different assessor.
      quote: >
        "On becoming aware of any information or any material change in
        circumstances that may affect the audit report and the 'positive'
        opinion under Article 20 or the recognition under Article 17, the
        recognised cloud computing service provider shall, as soon as possible,
        notify the auditing organisation and the national competent authority of
        establishment."
      anchor_reasoning: >
        "Material change in circumstances" is a public legal instrument's name
        for the event a change-detection claim is about, and it arrives with the
        notification chain attached: the observed party notifies the assessor
        and the authority, the assessor reassesses and may revoke, and the
        authority reassesses its admission. The instrument routes the whole
        chain through self-report by the observed party, which is the one party
        with an interest in a late notification. Naming the trigger inside the
        claim is what turns it into something a distrusting reader detects by
        comparing two records, and the term is registered here for that reason
        and not to restate the duty.
    why_this_registry: >
      Every term here describes one claim at one time. A claim that is relied on
      for a year is a claim about an interval, and nothing registered said when
      the interval ends. base_state_resolution resolves the lower bound of an
      interval already carried; this term states the condition under which the
      upper bound has already passed. The pair is what lets a reader tell a
      current claim from an old one whose subject moved.

  revocation_establishment:
    status: proposed
    criticality: critical
    review_by: "2027-05-21"
    values: [recorded, not_recorded, query_failed, cross_federation_unsynchronised, undetermined]
    value_definitions:
      recorded: "A revocation of the credential is on a ledger the verifier checked, inside the interval asked about: the chain from the interval's start to a signed, timestamped checkpoint is unbroken and carries the event."
      not_recorded: "The ledger the verifier checked holds no revocation of the credential inside the interval: the chain is unbroken, a signed and timestamped checkpoint covers the end of the interval, and the ledger holds no event for the credential inside the interval, listed or not. It says no revocation was recorded and never that none was decided."
      query_failed: "The question could not be put to the ledger: the call timed out, errored or returned nothing a verifier can read. Nothing is established about the credential, and a failed query is never read as an empty interval."
      cross_federation_unsynchronised: "The credential's ledger belongs to a federation the verifier's own checkpoint does not cover, and no synchronisation record bridges the two, so a missing event may only mean the federations have not yet exchanged it."
      undetermined: "The record gives the verifier too little to reach another value, or fails one of its checks: a signature that does not verify, a chain that is broken, a checkpoint that stops short of the interval or carries no time. It is the fallback and is never read as not_recorded."
    definition: >
      How far a verifier established whether a credential was revoked inside a
      stated interval of a ledger it did not write, with the evaluation time
      carried beside the value. Closed and fail-closed: an absent or
      unregistered value makes the statement malformed, and a record that does
      not support another value is undetermined. The value is about the ledger
      and not about the world. not_recorded means that no revocation event is
      on the checked ledger inside the interval, and a revocation decided and
      never logged cannot show here, so it is not evidence that the credential
      was never revoked. It is unrelated to the not_recorded value a
      producer writes for a tool-call argument it chose not to record, which is
      a value of a different term; this one is read only with the interval,
      the ledger and the checkpoint it names.
    check: >
      A verifier checks, in order, that the query returned an answer
      (query_failed otherwise), that the ledger's federation is the verifier's
      or a synchronisation record bridges to it (cross_federation_unsynchronised
      otherwise), that the statement and the checkpoint verify under the
      ledger's key, that the checkpoint carries a signing time and covers the
      end of the interval, that every event verifies and links to the one
      before, and that the checkpoint names the head it holds. A failure of
      any of these is undetermined. It then reads the events for the credential
      inside the interval from the ledger itself, never from the statement:
      one revocation makes the value recorded, whatever the statement lists;
      none makes it not_recorded.
    source_path: "predicate.revocationEstablishment.value (declared); derived from the ledger events inside the interval and the signed checkpoint"
    issuers_in_production: []
    promotion_trigger: "An independently maintained registry or ledger that is not us emits one of these values for a revocation query, with the interval and the evaluation time, in a signed record and files a crosswalk with evidence: emitted."
    why_this_registry: >
      A revocation registry answers a verifier's question about one credential
      and one interval, and the answer a relying party most often needs is the
      empty one: nothing was recorded. A relying party that cannot tell an
      empty interval over an unbroken, checkpointed chain from a failed query,
      from a ledger in another federation and from a chain with a hole in it
      reads all four the same way, as nothing to worry about. Naming the five
      states, with undetermined as the fallback, keeps the weak ones from
      passing as the strong one.

# outcome_lattice: the recomputable verdict a consumer derives, never a
# policy threshold and not producer-asserted.
outcome_lattice:

  result:
    status: proposed
    criticality: critical
    review_by: "2027-02-11"
    values: [fail, degraded, pass_indirect, pass]
    definition: >
      A total, deterministic, severity-independent minimum over the declared
      conditions, in the fixed order fail < degraded < pass_indirect < pass,
      recomputable by any consumer from carried bytes alone, against a
      normative recompute table published with the spec. Not a policy verdict:
      it carries no threshold and no severity input, and a consumer applying
      its own policy threshold does so on top of this value, never inside it.
    source_path: "predicate.result"
    issuers_in_production: []

# verdict_classes: an open set of verdict codes under the closed result lattice.
# Added so that a new verdict code does not make every deployed verifier reject
# the record that carries it: the parent says what an older verifier must do.
verdict_classes:
  parent_term: result
  rule: >
    A verdict is carried as {class: <code>, parent: <value of result>}. The
    parents are the four values of result and are closed: a parent outside
    them makes the record malformed under every case of open_value_rule. A
    class equal to its parent is the parent itself. A registered child code
    must carry the parent registered for it, or the record is malformed. A
    child code the verifier does not have registered is accepted with its
    parent's meaning, and the code is preserved in the verifier's output,
    when the record names a registry the verifier does not hold (case 3 of
    open_value_rule); under cases 1 and 2 it makes the record malformed. A
    child is never read as stronger than its parent, so an unknown child under
    fail is a fail. Each child's URI is the result term's URI with the code as
    its fragment.
  children: {}

# record_lifecycle: how a published record says that one of its own values
# changed after publication. A derived value that automated consumers gate on is
# not prose: revising it with only a last-updated date to signal the change breaks
# the ability to reconcile the same record read at two different times. Added in
# 0.4.0 for registries whose records carry derived fields, the first being AVE
# (aveproject/ave issue 219), where stamping a missing vantage declaration flips
# a derived verification basis on several records in one pass.
record_lifecycle:

  revision_reason:
    status: proposed
    criticality: informational
    review_by: "2027-04-07"
    values:
      - declaration_added
      - declaration_corrected
      - vocabulary_member_added
      - derivation_rule_changed
    value_definitions:
      declaration_added: "A field the record omitted is now declared, and a value derived from it changed as a result (for example, a vantage declaration added where none existed)."
      declaration_corrected: "A field the record already declared was wrong and now carries a different value."
      vocabulary_member_added: "The schema the record is validated against gained a closed-vocabulary member, and re-deriving the record under it changed a derived value; the record's own declarations did not change."
      derivation_rule_changed: "The rule that computes a derived value changed; the record's own declarations did not change."
    definition: >
      A closed code stating why one entry in a record's revision history exists,
      carried beside a free-text reason so a consumer can count and filter
      revisions by cause without parsing prose. One code per revision entry. The
      entry it belongs to is an element of an optional, append-only revisions
      array on the record, each element carrying date, field, from, to, reason and
      reason_code. A record with no revisions array makes no claim about its own
      history; a consumer MUST NOT read its absence as "never revised". Closed and
      fail-closed: an unregistered reason_code makes the entry malformed.
    entry_shape:
      required: [date, field, from, to, reason_code]
      optional: [reason]
    issuers_in_production: []
    promotion_trigger: >
      An independently maintained registry, not us, whose published records carry
      a revisions entry with one of these codes, filed as a crosswalk with
      evidence: emitted and a source_path into a real record.
    opencre:
      - cre: https://www.opencre.org/cre/757-271
        match: partial
        basis: "Both require every change to carry its reason so changes can be traced; the requirement covers source check-ins, while this term covers a published record's derived values."

# change_admission: the decision that admits or rejects one proposed change to
# an AI agent's harness (its system prompt, procedures, tool-call guards and tool
# allowlist), and the evidence that decision names. Added in 0.4.0 with the
# agent-change-admission predicate, version 1, at
# docs/predicates/agent-change-admission-v1.md, whose verification steps say how
# a consumer checks each term on the wire.
change_admission:

  admission_decision:
    status: proposed
    criticality: critical
    review_by: "2027-04-11"
    values: [admitted, rejected]
    definition: >
      The outcome of one decision on one proposed harness change, carried on the
      wire as the boolean admitted (true is admitted, false is rejected). A
      decision is consistent only when an admitted change passed every gate the
      consumer requires and a rejected change failed at least one; a consumer
      recomputes this from the decision's own checks and treats either
      inconsistency as contradicted. A rejection is a record in its own right,
      signed and verifiable like an admission, never a decision that was not
      made.
    source_path: "predicate.admitted"
    issuers_in_production: []
    why_this_registry: >
      A harness change that was tried and refused is the evidence that the
      process can say no. If only admissions are signed, a reader cannot tell a
      process that rejects bad changes from one that never evaluated them.
    opencre:
      - cre: https://www.opencre.org/cre/112-648
        match: structural
        basis: "Each proposed change to an agent's harness gets one recorded admit or reject decision, and a rejection is signed like an admission."

  admission_gate:
    status: proposed
    criticality: critical
    review_by: "2027-04-11"
    values: [replay, heldout, no_regression, benign_twins, overfit_lint, authority]
    value_definitions:
      replay: "Every new guard, run over a declared, digest-frozen snapshot of recorded traces with each call's recorded pre-call state, fires on every target failure at or before the causing step and on no passing trace and no benign twin. Clearance needs every trace checked."
      heldout: "On fresh held-out runs the candidate beats the better of two fresh parent runs by at least the larger of 2 and one more than the number of cases whose outcome differed between those parent runs, and a second fresh candidate run confirms it."
      no_regression: "No must-succeed case that passed in either parent run fails in a candidate run."
      benign_twins: "The candidate intervenes on no benign twin, a case built to resemble a failure that needs no intervention."
      overfit_lint: "The candidate's new text carries no identifier, amount or name copied from the training traces."
      authority: "The candidate grants no authority the parent lacked: its tool allowlist is a subset of the parent's, every parent guard and procedure is kept, and the parent's system prompt is a prefix of the candidate's, unless a human-signed approval names the exact candidate digest."
    definition: >
      The closed names of the checks an admission rests on, carried as
      checks[].name with a boolean checks[].passed. The consumer pins which
      gates it requires. A required gate absent from the record leaves the
      decision not established. A check whose name the consumer does not
      require, such as a cost report, is informational and never a gate.
      Closed and fail-closed: a consumer requiring a name outside this set has
      no definition to check it against.
    source_path: "predicate.checks[].name"
    issuers_in_production: []
    why_this_registry: >
      Two evaluators that both say "passed evaluation" can mean a single
      re-run on the training cases or a fresh held-out comparison against a
      measured noise floor. A gate name with one definition is what lets a
      consumer require the second and refuse the first.
    opencre:
      - cre: https://www.opencre.org/cre/124-564
        match: structural
        basis: "Names the checks a harness change must pass before it is admitted, the change-control and impact-analysis step (CM-3, CM-4) applied to an agent's harness."
      - cre: https://www.opencre.org/cre/547-824
        match: partial
        basis: "The heldout and no_regression gates validate the changed agent's behaviour on fresh runs; the change is to the harness, not the model, and the other gates are not validation."

  evaluation_mode:
    status: proposed
    criticality: critical
    review_by: "2027-04-11"
    values: [FRESH, RECORDED, CACHED]
    value_definitions:
      FRESH: "Produced by a run made for this decision, every model call answered fresh."
      RECORDED: "A stored FRESH result shown again, with the time it was produced."
      CACHED: "A byte-identical replay of a recorded model request, for debugging."
    definition: >
      How an evaluation result attached to an admission was obtained. Only
      FRESH counts toward a gate; a RECORDED or CACHED result is labelled as such
      in the report and excluded from every count a gate uses. Values are
      recorded in the casing the wire carries, upper case.
    source_path: "report.results[].mode"
    issuers_in_production: []
    why_this_registry: >
      A cached model response replays the past and cannot show that a changed
      harness behaves better now. Without the label, a pass count built from
      cached answers and one built from fresh runs read identically.

  replay_coverage:
    status: proposed
    criticality: critical
    review_by: "2027-04-11"
    values: [exhaustive, partial]
    definition: >
      Whether a guard's replay checked every trace in its declared snapshot
      (exhaustive, stated as N of N traces checked) or stopped before the end
      (partial, k of N). A replay may stop at its first counterexample to reject
      a guard; only an exhaustive replay clears one. Replay shows what the guard
      predicate does on recorded inputs, never that the counterfactual
      continuation would have succeeded.
    source_path: "report.coverage"
    issuers_in_production: []
    why_this_registry: >
      "No false positives found" over a sample and over the whole recorded
      history are different claims. The count travels with the verdict so a
      consumer can require the second.
    opencre:
      - cre: https://www.opencre.org/cre/433-442
        match: partial
        basis: "States whether a replay checked every recorded trace or stopped early, the coverage a test result has to declare (SA-11); it covers replays of guards only."

  replay_snapshot:
    status: proposed
    criticality: critical
    review_by: "2027-04-11"
    values: null
    definition: >
      The SHA-256 that freezes the set of recorded traces a guard was replayed
      over, keyed by guard in the decision. A replay over a different set of
      traces has a different digest, so a decision cannot be re-argued over a
      more favourable history after the fact.
    source_path: "predicate.corpus_digests"
    issuers_in_production: []
    why_this_registry: >
      A replay result without the history it ran over cannot be repeated, and
      a result that cannot be repeated cannot be checked.

  authority_change:
    status: proposed
    criticality: critical
    review_by: "2027-04-11"
    values: [none, human_approved]
    definition: >
      Whether a candidate harness grants authority its parent lacked, meaning a
      tool outside the parent's allowlist, a removed or altered guard or
      procedure, or a rewritten system prompt: none, or human_approved when a
      human-signed approval names the exact candidate digest. A candidate that
      grants authority without such an approval fails the authority gate. This
      is an enforced policy about who may widen a harness, not a proof that the
      harness is safe.
    source_path: "predicate.checks[name=authority].evidence"
    issuers_in_production: []
    why_this_registry: >
      A process that improves a harness automatically must not be able to grant
      itself new tools. The term names the one exception, a human signature over
      the exact candidate, so a consumer can count how often it was used.
    opencre:
      - cre: https://www.opencre.org/cre/524-603
        match: structural
        basis: "A harness change that adds a tool or removes a guard modifies the agent's access policy, and needs a human-signed approval naming the exact candidate."
      - cre: https://www.opencre.org/cre/220-442
        match: partial
        basis: "Holds a candidate's tool allowlist to its parent's unless a human approves the widening; it bounds growth, and does not show the parent's set was minimal."

# done_verification: how a claim that an agent's work is done is decided by
# something other than the agent. Added in 0.6.0. A done contract fixes what
# done means before the agent acts, a verifier outside the agent's container
# runs it, and a receipt carries the contract, the observation, the grade and
# the claims so a third party can replay the verdict. Each term carries a
# `check`: the rule a verifier applies to decide it, so a reader can tell a term
# that is claimed from a term that is checked. The records and the three checks
# are specified in the done-receipt guide of the probity-verify repository,
# docs/done-receipt.md, at https://github.com/probityai/probity-verify.
# Source paths that begin predicate. name fields of the done-receipt predicate,
# whose specification fixes them at its release; the others name the record
# formats that guide defines.
done_verification:

  done_contract:
    status: proposed
    criticality: critical
    review_by: "2027-04-17"
    values: null
    definition: >
      The definition of done for one task, sealed before the agent's first turn:
      the paths the agent must leave alone, each with a digest; the acceptance
      commands a verifier will run; how many generated mutants those commands
      killed; and optionally the digests of a held-out split, a mutant set and
      an authority record. The agent does not write it and cannot change it, and
      every later record names its digest.
    check: >
      A verifier recomputes the SHA-256 of the contract's canonical bytes and
      requires the grade record and the receipt to name that digest. A grade run
      on any other contract is refused (grade_contract_mismatch).
    source_path: "probity-done-contract/v1: protected_paths, acceptance, adequacy"
    issuers_in_production: []
    why_this_registry: >
      "Done" judged against a condition the agent can still reword is judged
      against the agent. Sealing the condition and naming its digest in the
      grade is what lets a consumer tell a verdict about the contract from a
      verdict about something else.

  done_receipt:
    status: proposed
    criticality: critical
    review_by: "2027-04-17"
    values: null
    definition: >
      The record of one done decision: the contract's digest, the final tree's
      digest, the observation of the agent's run, the verifier's grade, the
      agent's tool claims, and the verdict the three checks reach. It is a
      replay bundle, so a party who distrusts the producer can rerun the
      checks on the same bytes.
    check: >
      A verifier given the bundle recomputes each check's verdict and the
      combined verdict, and requires them to equal the receipt's. Any
      contradicted check gives contradicted; all supported gives supported;
      anything else gives not_established.
    source_path: "predicate.verdict"
    issuers_in_production: []
    why_this_registry: >
      A verdict stated without its evidence is a claim. A verdict that ships with
      the records it was computed from can be checked by someone who does not
      trust the party that produced it.

  acceptance_observed:
    status: proposed
    criticality: critical
    review_by: "2027-04-17"
    values: [supported, contradicted, not_established]
    value_definitions:
      supported: "The verifier rebuilt the agent's final tree, reset the protected paths from the contract, ran every acceptance command, and every command exited zero, under a contract that killed at least one mutant."
      contradicted: "At least one acceptance command exited non-zero in the verifier, or the grade names another contract."
      not_established: "The grade is absent, was run on another tree, is not independent of the observed party, or the contract killed no mutant and so cannot tell a fix from a no-op."
    definition: >
      Whether the contract's acceptance commands pass when a separate verifier
      runs them on the agent's final tree. The agent's own report that its tests
      passed is not an input.
    check: >
      acceptance_observed/v1. The grade must name the pinned contract digest
      (grade_contract_mismatch) and the final tree's digest (grade_tree_unbound),
      answer every acceptance command with the contract's exact argv and nothing
      else, and come from a producer independent of the observed party. Any
      non-zero exit contradicts (acceptance_failed_in_verifier); all passing
      supports (acceptance_passed_in_verifier) only when the contract killed at
      least one mutant (contract_adequacy_zero otherwise).
    source_path: "predicate.checks[claim=acceptance_observed].verdict"
    issuers_in_production: []
    why_this_registry: >
      A pass printed by the agent's own tool call tells a reader what the agent
      chose to show. The same command run by a verifier that rebuilt the tree
      tells the reader what the tree does.
    opencre:
      - cre: https://www.opencre.org/cre/433-442
        match: partial
        basis: "Testing in development and acceptance (ISO 27001, SA-11) asks that tests be run and their results kept; the term adds that a separate verifier reruns the contract's commands on the rebuilt final tree, which the requirement does not ask for."

  protected_path:
    status: proposed
    criticality: critical
    review_by: "2027-04-17"
    values: null
    definition: >
      A file or directory the contract names as off limits to the agent, with a
      digest. A directory entry may list path segment names (such as
      __pycache__) left out of its digest and its event match. Tests, graders
      and reward files are the usual members.
    check: >
      protected_paths/v1. A recorded mutation of a protected path, or a rename or
      link onto one, contradicts (protected_path_mutated) even under incomplete
      coverage, which catches an edit the agent reverted. Otherwise an
      independent final tree whose protected digests differ from the contract
      contradicts (protected_path_digest_changed). An empty record supports only
      when the observer makes every mutation type visible, coverage is complete
      and the independent final tree matches the contract.
    source_path: "probity-done-contract/v1: protected_paths[].path"
    issuers_in_production: []
    why_this_registry: >
      A final-state diff misses an edit that was made and reverted, and an event
      log misses an edit it did not see. The term fixes the list both are held
      to, so each can be checked against the same paths.

  claimed_tool_output:
    status: proposed
    criticality: informational
    review_by: "2027-04-17"
    values: null
    definition: >
      A command the agent says it ran, as an argument vector with an optional
      claimed exit status, parsed from the agent's transcript. It is the agent's
      statement and carries no vantage pin; no check treats it as evidence of
      the run.
    check: >
      tool_claim_match/v1 compares every claim with observed_tool_output. A claim
      with no matching exec was never run (tool_claim_unmatched).
    source_path: "probity-tool-claims/v1: claims[].argv, claims[].exit"
    issuers_in_production: []
    why_this_registry: >
      A fabricated "12 passed" is a well-formed claim. Naming the claim as a
      distinct term keeps it from being counted as the observation that would
      confirm it.

  observed_tool_output:
    status: proposed
    criticality: critical
    review_by: "2027-04-17"
    values: null
    definition: >
      The exec events an independent observer recorded for a command, with the
      process's exit status when the observer saw it end, and the order of every
      file mutation around it. It is what a claim is checked against, and it is
      usable only from an observation that is independent of the observed party,
      sees exec and every mutation type, and has complete coverage.
    check: >
      tool_claim_match/v1. Candidates are the exec events with exactly the
      claimed argv. A run is fresh when its step follows the last edit made
      outside its own process tree (tool_claim_precedes_last_edit otherwise); a
      claimed exit must equal a fresh run's recorded exit (tool_claim_exit_mismatch),
      and a fresh run whose exit was not seen leaves the claim not_established
      (tool_exit_unobserved).
    source_path: "probity-observation/v2: events[type=exec]"
    issuers_in_production: []
    why_this_registry: >
      The check that separates a run from a story about a run needs a record the
      story's author could not write. The term names that record and the three
      conditions under which it counts.

  stop_decision:
    status: proposed
    criticality: critical
    review_by: "2027-04-17"
    values: [continue, replan, escalate, stop]
    value_definitions:
      continue: "The agent proceeds; the verdict history does not call for a change."
      replan: "The agent is told once to change its plan, with the reason code of the verdict."
      escalate: "Control returns to a person, after two contradicted verdicts."
      stop: "The run ends because its budget is spent."
    definition: >
      The action a published policy table returns for the history of verdicts in
      one run. The table is public and its digest is carried by the receipt, so
      whether an agent was allowed to carry on is a function of records, not of
      anyone's judgement in the moment.
    check: >
      A verifier recomputes the action from the receipt's verdict history using
      the table whose digest the receipt carries, and requires it to equal the
      recorded action.
    source_path: "predicate.stop_decision"
    issuers_in_production: []
    why_this_registry: >
      An agent loop that keeps going until a model says it is satisfied has no
      stopping rule a third party can check. A table keyed by verdicts does.

  inconclusive_verdict:
    status: proposed
    criticality: critical
    review_by: "2027-04-17"
    values: null
    definition: >
      The verdict not_established: the records do not show the claim true and do
      not show it false. It is a result in its own right, never a pass and never
      a failure. Reasons include a self-reported or mismatched observation,
      missing visibility, incomplete coverage, no usable final tree
      (contract_adequacy_zero, tool_exit_unobserved and witness_scope_below_required
      are three codes), and a consumer that requires an external witness
      receiving evidence that rests on a peer witness.
    check: >
      A verifier returns not_established, with its reason, whenever the evidence
      a supported or contradicted verdict rests on is missing, and never returns
      supported from it. A consumer treats it as not done.
    source_path: "predicate.verdict"
    issuers_in_production: []
    why_this_registry: >
      A harness that reads a lost record as a pass has made the commonest
      failure invisible. Giving the unknown its own name keeps it from being
      folded into either side.

# incident_response: how a party that does not trust the responder checks that
# a response to an incident happened and held. NIST SP 800-61r3 RC.RP-05 and
# the NIST Key Practices 7.3 and 7.5 ask for verification and a documented decision
# before resumption and define no record for either.
incident_response:

  response_decision:
    status: proposed
    criticality: critical
    review_by: "2027-04-30"
    values: [act, continue, escalate]
    value_definitions:
      act: "The decision was to take at least one response action; the record carries the action and its response_function values."
      continue: "The decision was to take no action and let the activity run on; the record carries the authority that decided and the reason."
      escalate: "The decision was to hand the matter to a party with wider authority; the record names that party."
    definition: >
      The decision taken at one incident decision point, recorded whether or not
      anything was done. A decision not to act is a first-class value, so a
      non-action is a signed, checkable record and not an absence: a reader of a
      log that shows no action cannot tell a considered continue from an alert
      nobody saw. Closed and fail-closed: an absent or unregistered value makes
      the statement malformed.
    check: >
      A verifier requires every continue to carry the identity of the deciding
      authority and a non-empty reason, and requires every act to carry at least
      one response_function value. A continue with either missing is read as a
      record that establishes nothing about the decision, and is never counted
      as a considered choice.
    source_path: "predicate.decision.{outcome,authorityRef,reason}"
    issuers_in_production: []
    promotion_trigger: "An independently maintained system that is not us emits the decision, including a continue, in a signed record and files a crosswalk with evidence: emitted."
    why_this_registry: >
      Responders record what they did and rarely what they chose not to do. The
      OpenAI report says that on 27 June the on-call response staff advised that
      stopping the evaluation run was not required (report p8); nothing a third
      party can check says who advised it or on what.

  response_function:
    status: proposed
    criticality: critical
    review_by: "2027-04-30"
    values: [monitoring_increase, notification, restriction, isolation, pause, remediation, restoration]
    value_definitions:
      monitoring_increase: "Observation of the subject was widened or deepened."
      notification: "The incident was reported to a party outside the responding team: an affected party, a regulator, law enforcement or another organisation."
      restriction: "A credential, permission or tool was withdrawn or narrowed."
      isolation: "Channels the subject could use were cut."
      pause: "The subject was halted, wholly or in part."
      remediation: "A compromised component was rebuilt or a persistence route closed."
      restoration: "A containment was ended and the subject resumed."
    definition: >
      The function an incident action served. One action MAY carry several
      values (a rebuild is remediation and also stops activity). restoration is
      never combined with another value, because resuming is a separate decision
      from any action that contained or repaired. notification changes nothing
      about the subject: it records that the incident was reported, and a
      record that lists only notification says nothing was contained. Added in
      0.9.0; a record that names an earlier registry by its registryDigest is
      read against that registry's six values. Closed and fail-closed: an
      absent or unregistered value makes the statement malformed.
    check: >
      A verifier refuses an action that lists restoration together with another
      value, and refuses an act decision whose action lists no value.
    source_path: "predicate.action.functions[]"
    issuers_in_production: []
    promotion_trigger: "An independently maintained system that is not us emits these values on an incident action and files a crosswalk with evidence: emitted."
    why_this_registry: >
      Guidance names the same act under different words (eradication in NIST SP
      800-61r3 RS.MI-02, shutdown and mitigation in the NIST Key Practices,
      Full Disable in AIIR); a closed list lets
      two parties count the same thing. NIST SP 800-61r3 RS.CO-02 asks that
      internal and external stakeholders be notified of incidents, and an
      incident table that has a notification column needs a value to code it.

  enforcement_vantage:
    status: proposed
    criticality: critical
    review_by: "2027-04-30"
    values: [subject_self, co_located_runtime, substrate, relying_party]
    value_definitions:
      subject_self: "The restricted or contained party reports or honours the action itself."
      co_located_runtime: "A runtime the subject shares a trust boundary with (same process or host account)."
      substrate: "A layer beneath the subject that the subject cannot configure (hypervisor, network, IAM)."
      relying_party: "The service whose access was cut reports refusing the subject."
    definition: >
      Where an incident action is enforced and observed. An action enforced at
      subject_self is an instruction, not a control.
    check: >
      A verifier MUST NOT return supported for a claim that a restriction,
      isolation or pause held when the only evidence is at subject_self.
    source_path: "predicate.action.enforcement.vantage"
    issuers_in_production: []
    promotion_trigger: "An independently maintained system that is not us emits the vantage on an enforcement record and files a crosswalk with evidence: emitted."
    why_this_registry: >
      A restriction honoured only by the restricted party reads, in its own
      logs, exactly like one enforced beneath it. The OWASP Agent Control
      Standard says the same of its decision events: only the observed agent
      knows the applied outcome, so no decision event proves enforcement on its
      own.

  control_failure_posture:
    status: proposed
    criticality: critical
    review_by: "2027-04-30"
    values: [fail_closed, fail_open, unguarded_start, late_decision]
    value_definitions:
      fail_closed: "The decision service gave no usable decision and the action was denied."
      fail_open: "The decision service gave no usable decision and the action proceeded."
      unguarded_start: "The session started without a decision service."
      late_decision: "A decision arrived after the action had run."
    definition: >
      The posture applied when the decision service for a gated action did not
      return a usable decision.
    check: >
      A verifier MUST NOT count fail_open, unguarded_start or late_decision as
      an enforced outcome.
    source_path: "predicate.action.enforcement.failurePosture"
    issuers_in_production: []
    promotion_trigger: "An independently maintained system that is not us emits the posture on a gated action and files a crosswalk with evidence: emitted."
    why_this_registry: >
      Names, as values a third party can count, four cases the OWASP Agent
      Control Standard describes: decision failure under on_decision_failure
      (section 6.4), a session started unguarded after a failed handshake
      (section 4.1), and a late decision under fail-open.

  revocation_state:
    status: proposed
    criticality: critical
    review_by: "2027-04-30"
    values: [issued, enforced_observed, use_after_revocation, not_established]
    value_definitions:
      issued: "The revocation was issued by its authority; no relying party has reported an observation."
      enforced_observed: "The relying party recorded a refusal of the revoked credential after the effective time."
      use_after_revocation: "The relying party recorded an accepted use at or after the effective time."
      not_established: "The relying party produced no observation."
    definition: >
      Where a revocation of a credential or grant stands at one relying party at
      one time. Issuing a revocation and enforcing it are different facts, and a
      record states which one it holds.
    check: >
      A verifier returns use_after_revocation when any accepted use carries a
      time at or after the revocation's effective time, and never returns
      enforced_observed from an issuance record alone.
    source_path: "predicate.revocations[].relyingParties[].state"
    issuers_in_production: []
    promotion_trigger: "An independently maintained system that is not us emits the state from a relying party's own observation and files a crosswalk with evidence: emitted."
    why_this_registry: >
      Revoking credentials is a containment step in every source read (AWS
      AGENTSEC07-BP04, NIST Key Practices 6.4, OpenAI's report) and the step most
      easily reported as done when it was only issued.

  containment_scope:
    status: proposed
    criticality: critical
    review_by: "2027-04-30"
    values: null
    definition: >
      A digest-committed partition of the channels a contained subject could use
      (network routes, credentials, tools, shared stores, peer agents) into cut,
      retained-with-reason and unassessed, whose union MUST equal a channel
      manifest the subject does not control, with the interval [effectiveAt,
      observedUntil] over which each cut channel was observed closed. A
      containment with a non-empty unassessed set is reported as partial, never
      as complete.
    check: >
      A verifier recomputes the union of cut, retained and unassessed and
      requires it to equal the manifest. A non-empty unassessed set makes the
      verdict partial. A cut channel with no observed interval counts as
      unassessed.
    source_path: "predicate.containment.{cut,retained,unassessed,manifest}"
    issuers_in_production: []
    promotion_trigger: "An independently maintained system that is not us emits a channel partition against a manifest and files a crosswalk with evidence: emitted."
    why_this_registry: >
      Extends containment_posture (one egress posture at one time) and
      coverage_denominator (the population of a claim) to a containment over
      time. OpenAI's report describes mitigations deployed on 5 and 6 July and,
      from 8 July, access to the public internet through a separate,
      previously unknown vulnerability in the same service.

  pause_hold:
    status: proposed
    criticality: critical
    review_by: "2027-04-30"
    values: [held, in_flight_unknown, effect_after_pause, residual_state_remains, not_established]
    value_definitions:
      held: "The substrate observed no effect by the paused subject after effectiveAt, and no state it created before effectiveAt remains active."
      in_flight_unknown: "An operation the subject started before effectiveAt has no confirmed outcome."
      effect_after_pause: "An effect caused by an operation the paused subject initiated carries a time after effectiveAt."
      residual_state_remains: "No effect by the paused subject after effectiveAt, but state it created before effectiveAt (an account, credential, pod or job) is still active."
      not_established: "There was no substrate observation."
    definition: >
      Whether a pause held. An effect by the paused subject is an effect whose
      operation the subject initiated at or after effectiveAt; state the subject
      left behind is anything it created before effectiveAt. The two are
      different values because only the first shows the pause failed to stop the
      subject; the second shows what remains to be remediated. When several
      apply the record carries the first in this order: effect_after_pause,
      in_flight_unknown, residual_state_remains, held.
    check: >
      A verifier returns effect_after_pause only for an effect whose initiating
      operation is timed at or after effectiveAt, never for state created
      earlier, and never returns held while an in-flight operation has no
      confirmed outcome or created state is still active.
    source_path: "predicate.pause.hold"
    issuers_in_production: []
    promotion_trigger: "An independently maintained system that is not us emits the hold state from substrate observation and files a crosswalk with evidence: emitted."
    why_this_registry: >
      A pause that stops new calls but not committed side effects reads as a
      successful stop. A pause that is read as failed because the subject's
      earlier work is still there reads as a failure of the wrong thing.

  escalation_outcome:
    status: proposed
    criticality: critical
    review_by: "2027-04-30"
    values: [paged, paged_late, not_paged, not_established]
    value_definitions:
      paged: "A named responder with authority to act was notified within the stated bound after the alert."
      paged_late: "A named responder was notified, after the stated bound."
      not_paged: "The alert reached no responder with authority to act."
      not_established: "The alert time, the notification time or the bound is missing, or comes only from the responder's own system."
    definition: >
      Whether a detection alert reached someone able to act in time. The record
      carries alertAt (when the monitor raised the alert), pagedAt (when a named
      responder was notified), actionAt (the effective time of the first
      response action, or of a continue decision) and the policy bound in
      seconds, so the delay from alert to action is computable from the record
      and is not a prose claim.
    check: >
      A verifier computes pagedAt minus alertAt against the bound and returns
      paged or paged_late, returns not_paged when pagedAt is absent, and reports
      actionAt minus alertAt beside the value. Times that come only from the
      responder's own system give not_established.
    source_path: "predicate.escalation.{alertAt,pagedAt,actionAt,boundSeconds}"
    issuers_in_production: []
    promotion_trigger: "An independently maintained system that is not us emits alert, notification and action times on an escalation and files a crosswalk with evidence: emitted."
    why_this_registry: >
      OpenAI's report lists a 12:03 UTC alert on 19 July and the start of
      stopping runs at 17:37 UTC the same day, and states a goal of notifying
      personnel within 30 minutes of concerning activity (report p28). Hugging
      Face writes that its stack failed to raise an alert's criticality and
      trigger the on-call team, and that it now pages a responder in minutes.
      Each is a claim about a delay that a record with the three times lets a
      third party compute.

  restoration_decision:
    status: proposed
    criticality: critical
    review_by: "2027-04-30"
    values: [resume_full, resume_staged, remain_restricted, not_established]
    value_definitions:
      resume_full: "The containment is ended and the subject resumes in full."
      resume_staged: "The containment is ended in part or in stages."
      remain_restricted: "The containment stays in force."
      not_established: "A required element of the decision is missing."
    definition: >
      The decision that ends a recorded containment, bound to it by digest, with
      an approver identity different from the actor who activated the containment.
      A missing element makes the verdict not_established. A decision not to
      resume is remain_restricted, and it is recorded the same way as a resumption.
    check: >
      A verifier requires the binding to the containment and requires approver
      to differ from activator.
    source_path: "predicate.restoration"
    issuers_in_production: []
    promotion_trigger: "An independently maintained system that is not us emits the decision bound to a containment digest and files a crosswalk with evidence: emitted."
    why_this_registry: >
      NIST SP 800-61r3 (RC.RP-05) and the NIST Key Practices (7.3 and 7.5) ask
      for verification and a documented decision before resumption, AWS
      AGENTSEC07-BP04 asks for multi-person authorization for restoration, and
      NIST SP 800-184 section 2.3.3 allows a partial restoration as an interim
      measure; none defines a record that binds the decision, and the scope it
      restores, to the containment it ends.
      OpenAI's report recommends clarifying who approves restoration (p31) and
      names no approver.

  restoration_gate:
    status: proposed
    criticality: critical
    review_by: "2027-04-30"
    values: [gated, ungated, gate_unmet, not_established]
    value_definitions:
      gated: "A resume was observed, and a restoration_decision of resume_full or resume_staged bound to the containment by digest, with every element met, is timed before it."
      ungated: "A resume was observed and no restoration_decision is bound to the containment it ended."
      gate_unmet: "A resume was observed after a decision that is bound to the containment but fails a requirement of that decision."
      not_established: "The resume was not observed by the substrate."
    definition: >
      Whether an observed restart passed the gate that restoration_decision
      sets. restoration_decision records the decision; this records whether the
      restart that actually happened was preceded by one that met its
      requirements. The restart time comes from the substrate, not from the
      party that restarted.
    check: >
      A verifier takes the resume time from a substrate observation, finds the
      restoration_decision bound by digest to the containment and timed before
      it, and applies the restoration_decision check to that decision. No such
      decision gives ungated.
    source_path: "predicate.restoration.gate"
    issuers_in_production: []
    promotion_trigger: "An independently maintained system that is not us emits an observed resume with its gate result and files a crosswalk with evidence: emitted."
    why_this_registry: >
      OpenAI's report says cyber evaluation workloads resumed on 7 July, after
      mitigations on 5 and 6 July and before the access of 8 July; it names no
      decision, approver or validation for the resume.

  incident_identifier:
    status: proposed
    criticality: critical
    review_by: "2027-04-30"
    values: null
    definition: >
      An identifier for one incident, carried in the records that each party
      signs, so that two organisations' records of the same incident can be
      joined. The first party to open the incident mints it as an issuer and an
      id. A party that learns of the incident from another adopts the
      identifier by listing it in a related array and keeps its own id; nobody
      rewrites a signed record to change an identifier. Two records concern one
      incident when they carry the same issuer and id, or when one lists the
      other's in related, and the join is the transitive closure of that
      relation.
    check: >
      A verifier joins records only on equal issuer and id, or on a related
      entry, and never on timing, names or overlap of credentials alone. An
      identifier without its issuer is read as unscoped and joins nothing.
    source_path: "predicate.incident.{issuer,id,related[]}"
    issuers_in_production: []
    promotion_trigger: "Two independently maintained systems that are not us carry the same identifier in records they each sign, and one files a crosswalk with evidence: emitted."
    why_this_registry: >
      An incident that crosses organisations leaves each side with a record in
      its own vocabulary and no field to line them up by. OpenAI's report says it
      identified on 20 July, after alerts on 19 July and its own outreach to
      Hugging Face, that its agents may have been involved in the incident
      Hugging Face had publicly disclosed.

  decision_role:
    status: proposed
    criticality: critical
    review_by: "2027-04-30"
    values: [advised, authorized, executed, accountable]
    value_definitions:
      advised: "The party gave advice on the decision and did not hold the right to decide it."
      authorized: "The party held the right to decide, and the decision was taken under that right."
      executed: "The party carried the decision out."
      accountable: "The party answers for the outcome of the decision."
    definition: >
      The roles one named party held in one decision. A record names each party
      once with the sorted list of every role it held, so a party that both
      authorized and executed an action carries both values. Advice is not
      authority: a party whose only role in a decision is advised did not
      authorize it. Closed and fail-closed: an absent or unregistered value
      makes the statement malformed.
    check: >
      A verifier requires at least one party holding authorized and at least
      one holding accountable. A decision with no party holding authorized is
      reported as having no authorizer, and one with no party holding
      accountable as having no accountable party; neither is counted as owned.
    source_path: "predicate.parties[].roles[]"
    issuers_in_production: []
    promotion_trigger: "An independently maintained system that is not us emits the roles each party held in a response decision and files a crosswalk with evidence: emitted."
    why_this_registry: >
      Incident reports name the people who were involved and rarely the role
      each held in a given decision. The OpenAI report says that on 27 June the
      on-call response staff advised that stopping the evaluation run was not
      required (report pdf p8), and it lists among its changes to clarify
      decision rights for consequential decisions such as pausing or
      terminating affected activity, isolating systems, imposing containment
      and approving restoration (report pdf p31); neither passage says who held
      the right to decide. NIST SP 800-61r3 asks that all appropriate
      individuals or parties be designated the authority necessary to fulfill
      their incident response responsibilities (GV.RR-02 R2, Table 2, pdf
      p21-22) and says asset owners may have valuable insights on response and
      recovery priorities (section 2.2, pdf p15), which is advice, while
      leadership may hold decision-making authority on high-impact response
      actions (section 2.2, pdf p15). Neither defines a record of the role held
      in one decision.

  authority_basis:
    status: proposed
    criticality: critical
    review_by: "2027-04-30"
    values: [role_grant, policy_preauthorized, contract_third_party, executive_approval, unknown]
    value_definitions:
      role_grant: "The authorizer acted under authority attached to a role that a named person held when the decision was taken."
      policy_preauthorized: "The action was taken under a policy that authorized it in advance for stated trigger conditions, and no person decided it at the time."
      contract_third_party: "A third party acted under authority a contract gives it to act on the organisation's behalf."
      executive_approval: "A named executive approved this specific action, outside the authority their role carries by default."
      unknown: "The record states that the basis of the authority is not known."
    definition: >
      What kind of grant let the authorizer of a decision act. unknown is a
      value and an absent member is not unknown: a verifier MUST NOT read an
      absent authorityBasis as role_grant or as any other registered value.
      The term names the kind of grant and does not say the grant was valid;
      the grant itself is carried and checked elsewhere. Closed and
      fail-closed: an absent or unregistered value makes the statement
      malformed.
    check: >
      A verifier requires the member on every party that holds authorized.
      An absent member and an unregistered value are each malformed. unknown is
      accepted as well formed and is never counted as an established basis.
    source_path: "predicate.parties[].authorityBasis"
    issuers_in_production: []
    promotion_trigger: "An independently maintained system that is not us emits the basis of the authority on a response decision and files a crosswalk with evidence: emitted."
    why_this_registry: >
      Containment that an automated process starts has no person to name, and
      containment that a provider starts acts on a contract. NIST SP 800-61r3
      suggests configuring technologies to perform some containment actions
      automatically, such as halting the execution of an infected container,
      and authorizing third parties to automatically act to contain certain
      types of incidents on behalf of the organization (RS.MI-01 C1 and C2,
      Table 3, pdf p40-41), and asks that contracts define the authority to act
      on behalf of the organization (section 2.2, pdf p16). The NIST Key
      Practices ask to implement a control policy laying out intended
      responses to defined scenarios and infrastructure for automated
      enforcement (practice 1.6, pdf p4). None says how a record names the
      kind of grant, so an authorization that rested on a standing policy
      reads the same as one a person gave that hour.

  revocation_coverage:
    status: proposed
    criticality: critical
    review_by: "2027-04-30"
    values: [complete_verified, issued_after_only, partial, unknown]
    value_definitions:
      complete_verified: "The revocation reached every credential in the issuance population, and the record carries a revocation for each one the manifest names."
      issued_after_only: "The revocation reached only credentials issued at or after a stated time; credentials issued earlier were not revoked."
      partial: "The revocation reached a named subset of the issuance population, and the record names the subset."
      unknown: "The record does not establish which part of the issuance population the revocation reached."
    definition: >
      What share of the issuance population a revocation reached. The
      population is the set of credentials, tokens, sessions and delegations
      issued to the subject, and the record MUST cite a coverage_denominator
      that partitions it against a manifest the revoker does not control. This
      is a fact about the population and not about enforcement: revocation_state
      says, for one relying party, whether a revoked credential was refused,
      and this says how much of the population the revocation covered.
      Closed and fail-closed: an absent or unregistered value makes the
      statement malformed.
    check: >
      A verifier requires a coverage_denominator and recomputes its union
      against the manifest. It returns complete_verified only when every key of
      the manifest is in the revoked set and none is outside it, returns
      issued_after_only when the revoked set equals the credentials issued at or
      after the stated time, and reads a declared complete_verified whose
      denominator leaves a credential outside the revoked set as exceeding its
      proof. A record with no coverage_denominator is read as unknown.
    source_path: "predicate.coverage.claim"
    issuers_in_production: []
    promotion_trigger: "An independently maintained system that is not us emits the coverage of a revocation against an issuance manifest and files a crosswalk with evidence: emitted."
    why_this_registry: >
      A revocation that removes a credential from new workloads leaves the
      credential in the ones already running. The OpenAI report says that over
      5 and 6 July it deployed mitigations including removing the shared
      credential from new research workloads (report pdf p8), which is the
      issued_after_only case for a credential already in running workloads.
      NIST Key
      Practices 6.4 asks to revoke credentials accessed during the incident
      and says nothing of how much of the population a revocation reached.
      revocation_state records the outcome at one relying party and
      containment_scope the channels of a contained subject; neither records
      the part of the issuance population that was revoked.

  evidence_state:
    status: proposed
    criticality: critical
    review_by: "2027-04-30"
    values: [ES0, ES1, ES2, ES3, ES4, ES5, ES6, ES7, ES8]
    value_definitions:
      ES0: "No anomaly is recorded and the coverage of the monitors that would have recorded one was not measured."
      ES1: "No anomaly is recorded and the coverage of the monitors that would have recorded one was measured."
      ES2: "At least one anomaly is recorded and no declared change-detection threshold has been crossed."
      ES3: "The recorded anomalies have crossed a declared change-detection threshold."
      ES4: "Propagation from one component or agent to another is observed and its pathway is not identified."
      ES5: "The propagation pathway is identified and the scope is not yet bounded with containment verified."
      ES6: "The scope is bounded and containment is verified."
      ES7: "Effects outside the organisation are confirmed."
      ES8: "Containment is recorded and a restart is requested."
    definition: >
      The state of the evidence about one system at one time, as nine codes
      ordered from silence to a requested restart. Each code is defined only by
      what a responder can observe: whether an anomaly is recorded, whether the
      coverage of the monitors was measured, whether a change-detection
      threshold was crossed, whether propagation and its pathway were observed,
      whether the scope is bounded and containment verified, whether effects
      outside the organisation are confirmed, and whether containment is
      recorded and a restart requested. A record's state is the highest code
      whose entry condition its observations meet. The code says what was
      observed; it does not say what response is right, and it does not decide
      whether a restart is admitted. It is not crosswalk_evidence_states,
      which classes how a crosswalk filing supports a mapping (emitted,
      inferred, asserted, recomputed); evidence_state classes what is known
      about an incident. A code is cited as the term URI with the code as its
      fragment, for example
      https://w3id.org/agent-evidence/vocab/v1/evidence_state#ES1. Closed and
      fail-closed: an absent or unregistered value where a record requires one
      makes the statement malformed.
    check: >
      A verifier derives the state from the record's own observations as the
      highest code whose entry condition holds and refuses a declared code
      that differs. ES1 is never accepted without measured coverage, so a
      missing observation is not read as a clean one, and a declared code
      lower than the observations support is refused as understated.
    source_path: "predicate.evidenceState"
    issuers_in_production: []
    promotion_trigger: "An independently maintained system that is not us emits an evidence state with the observations that ground it and files a crosswalk with evidence: emitted."
    why_this_registry: >
      Incident guidance asks responders to judge how much is known before they
      act and before they restore (NIST SP 800-61r3 DE.AE and RC.RP; NIST Key
      Practices 7.3 to 7.5), and no shared term records that judgment in a form
      a third party can recompute. A recurring gap in published incident
      records is a silence read as clean: a report that nothing was seen, with
      no measure of what the monitors could see. ES0 and ES1 separate the two.

# multi_agent_run: how a party that does not trust a multi-agent defence checks
# what the defence did to the agents' communication graph during one run, and
# what it rested a re-enable on. A defence that rewrites the graph (for
# example Huang et al. 2026, Findings of ACL 2026,
# doi 10.18653/v1/2026.findings-acl.426) is checked against the deliveries that
# follow each decision, so the record is one hash-chained journal of typed
# entries. Source paths begin `predicate.` and name members of the
# containment-journal predicate, whose conformance corpus is
# vectors-containment-journal in agent-evidence-vectors. A term the verifier computes, and does not read,
# names the members it is computed from. The section reuses and does not redefine
# terms of other sections: a decision's responseFunction is an
# incident_response.response_function value (restriction, isolation or
# restoration), a fallback's failurePosture is an
# incident_response.control_failure_posture value, a response entry's decision
# is an incident_response.response_decision, and an assessment's witness is an
# evidence_dimensions.witness_scope value.
multi_agent_run:

  message_delivery_disposition:
    status: proposed
    criticality: critical
    review_by: "2027-04-30"
    values: [delivered_in_topology, delivered_over_absent_edge, dropped_over_absent_edge]
    value_definitions:
      delivered_in_topology: "The message was delivered over an edge present in the topology in force."
      delivered_over_absent_edge: "The message was delivered over an edge absent from the topology in force."
      dropped_over_absent_edge: "The router refused the message because its edge was absent from the topology in force."
    definition: >
      How the router handled one agent-to-agent message relative to the
      topology in force when it was sent. The verifier computes the value from
      the delivery's sender, receiver and dropped flag and from the topology it
      rebuilds out of the journal's earlier topology, decision and fallback
      entries; it never takes the value from the producer. A message dropped
      over an edge that is present is not a value: the journal is refused.
      Closed and fail-closed.
    check: >
      A verifier refuses a delivery whose edgeInForce flag differs from the
      recomputed edge, refuses a drop over a present edge, and refuses a
      delivery over an absent edge when the run is enforced. A relying party
      MUST NOT read an edge removed by a decision as a closed channel while
      any delivery over an absent edge is recorded or while the run is
      advisory.
    source_path: "predicate.entries[].{sender,receiver,edgeInForce,dropped}"
    issuers_in_production: []
    promotion_trigger: "An independently maintained multi-agent system that is not us emits delivery entries in a signed journal and files a crosswalk with evidence: emitted."
    why_this_registry: >
      A defence that removes an edge reports the removal; whether a message
      still crossed that edge is a separate fact that only the router saw.
      Naming the three outcomes lets a reader count messages over cut edges,
      so the removal is not taken on trust.

  topology_enforcement:
    status: proposed
    criticality: critical
    review_by: "2027-04-30"
    values: [advisory, enforced]
    value_definitions:
      advisory: "The topology is only stated to the agents; nothing refuses a message over an absent edge."
      enforced: "The router refuses every message over an edge absent from the topology in force."
    definition: >
      Whether the router of a run enforces the declared topology or only states
      it to the agents. Required on every journal; an absent member is
      malformed and is never read as enforced. Closed and fail-closed.
    check: >
      For an advisory run a verifier MUST NOT return supported for a claim that
      a channel was closed, whatever the delivery entries show, and refuses a
      journal whose claims say channels were closed. For an enforced run the
      claim is decided by message_delivery_disposition.
    source_path: "predicate.enforcement"
    issuers_in_production: []
    promotion_trigger: "An independently maintained multi-agent system that is not us emits the enforcement member in a signed journal and files a crosswalk with evidence: emitted."
    why_this_registry: >
      A topology written into each agent's prompt is honoured only by the
      agents it restricts, and its logs read exactly like a router that
      refuses. The value keeps an instruction from being counted as a control.

  topology_decision_basis:
    status: proposed
    criticality: critical
    review_by: "2027-04-30"
    values: [detector_online_label, detector_no_label, random_rate_matched, ground_truth_oracle, fixed_schedule, evidence_gate]
    value_definitions:
      detector_online_label: "A detector updated during the run on a label computed with knowledge of the attack's goal steered the decision."
      detector_no_label: "A detector with no update during the run steered the decision."
      random_rate_matched: "Edges or agents were chosen at random at a rate matched to another arm."
      ground_truth_oracle: "The decision used which agents were compromised, a fact no deployed defence holds."
      fixed_schedule: "The decision followed a timer or a fixed step count."
      evidence_gate: "The decision followed a recorded rule over earlier journal entries, such as an admitted restoration."
    definition: >
      What label or input steered one topology decision. A decision whose basis
      begins detector_ carries a decimal risk estimate for every agent and the
      list of message fields the detector read. Closed and fail-closed: an
      absent or unregistered basis makes the decision malformed.
    check: >
      A verifier reports the basis next to any effect claim and MUST NOT read a
      ground_truth_oracle or detector_online_label decision as an oracle-free
      result. For a detector_ basis it refuses a decision whose detector read a
      field the router never writes, and refuses one that cut an edge or
      isolated an agent while every agent carried the same risk estimate.
    source_path: "predicate.entries[].basis"
    issuers_in_production: []
    promotion_trigger: "An independently maintained multi-agent system that is not us emits the basis on decision entries in a signed journal and files a crosswalk with evidence: emitted."
    why_this_registry: >
      Two decisions that cut the same edges are not the same evidence when one
      was steered by a detector and the other by knowing the answer. Without
      the basis a result measured with an oracle reads as a defence that works
      unaided.

  restart_scope:
    status: proposed
    criticality: critical
    review_by: "2027-04-30"
    values: [memory_only, memory_and_cause_removed]
    value_definitions:
      memory_only: "The agent's memory was cleared and its configuration digest is unchanged, so the cause it carried remains."
      memory_and_cause_removed: "The agent's memory was cleared and its configuration digest changed, recording the removal of the cause."
    definition: >
      What a restart of one agent removed. The verifier computes the value from
      the restart entry: memory_and_cause_removed when the configuration digest
      before differs from the digest after, memory_only when they are equal. A
      restart that did not clear memory has no value: the journal is refused.
      Closed and fail-closed.
    check: >
      A verifier refuses a restart whose remediated flag differs from whether
      the two configuration digests differ, and refuses a restart that did not
      clear memory. A relying party MUST NOT read memory_only as a clean state.
    source_path: "predicate.entries[].{remediated,memoryCleared,configBefore,configAfter}"
    issuers_in_production: []
    promotion_trigger: "An independently maintained multi-agent system that is not us emits restart entries with both configuration digests in a signed journal and files a crosswalk with evidence: emitted."
    why_this_registry: >
      A restart that clears an agent's memory and leaves the configuration
      that made it hostile resumes the same agent. Its log says "restarted"
      either way; the digests are what tell the two apart.

  restoration_evidence_binding:
    status: proposed
    criticality: critical
    review_by: "2027-04-30"
    values: null
    definition: >
      One evaluation of a rule that admits or refuses re-enabling a contained
      agent, bound by entry digest to the earlier journal entries it rests on
      (the agent's restart and an assessment of its output) and to the rule by
      its digest, so a party holding only the journal re-derives whether the
      admission held. It is the evidence side of restoration_decision and does
      not replace that term's approver requirement. A structured record with
      no closed values.
    check: >
      For an admitted restoration a verifier refuses an empty evidence list, a
      cited digest that is not the digest of an earlier entry, evidence that
      cites no restart of the agent, evidence that cites no assessment of the
      agent, and a latest cited assessment that is unscored, self-witnessed or
      at or above the threshold. Where the run claims its restorations were
      gated, a decision that gives a previously isolated agent an outgoing
      edge without an earlier admitted restoration for it is refused.
    source_path: "predicate.entries[].{evidence,threshold,ruleDigest,admitted}"
    issuers_in_production: []
    promotion_trigger: "An independently maintained multi-agent system that is not us emits restoration entries with cited evidence in a signed journal and files a crosswalk with evidence: emitted."
    why_this_registry: >
      A defence that re-enables an agent after a timer, or on the agent's own
      account of itself, writes the same "restored" line as one that checked
      independent evidence. Binding the admission to the cited entries by
      digest is what lets a reader tell them apart.

  assessment_availability:
    status: proposed
    criticality: critical
    review_by: "2027-04-30"
    values: [scored, no_output, judge_missing]
    value_definitions:
      scored: "The assessment returned an integer score."
      no_output: "The agent produced nothing to assess in the window."
      judge_missing: "The judge returned no usable score."
    definition: >
      Whether an assessment of an agent's output exists as a number and, when
      it does not, why. A missing score is carried as a value, never as a
      number. Closed and fail-closed.
    check: >
      A verifier refuses a score recorded with no_output or judge_missing,
      refuses a scored assessment with no score, MUST NOT replace a missing
      score by zero, and MUST NOT count no_output or judge_missing as evidence
      for an admission. An aggregate excludes the missing scores and reports
      how many it excluded.
    source_path: "predicate.entries[].availability"
    issuers_in_production: []
    promotion_trigger: "An independently maintained multi-agent system that is not us emits availability on assessment entries in a signed journal and files a crosswalk with evidence: emitted."
    why_this_registry: >
      A judge call that fails and is recorded as a score of zero reads as the
      cleanest possible agent. Giving the failure its own value keeps a
      missing observation from being read as a clean one.

  generation_outcome:
    status: proposed
    criticality: critical
    review_by: "2027-04-30"
    values: [produced, errored, empty_reply]
    value_definitions:
      produced: "The agent's call to its model returned a reply."
      errored: "The call raised an error, recorded with its text."
      empty_reply: "The call returned an empty reply."
    definition: >
      The result of one call of an agent to its model. No published predicate
      carries this field yet; the source path names the member a journal
      entry would carry. Closed and fail-closed.
    check: >
      A verifier reports a run with any errored call together with its count,
      and MUST NOT read the assessment of an agent whose call errored as an
      observation of a healthy agent. A run that records calls but no outcome
      for them is not_established for a claim of no generation failures.
    source_path: "predicate.entries[].generationOutcome"
    issuers_in_production: []
    promotion_trigger: "An independently maintained multi-agent system that is not us emits generation outcomes in a signed journal and files a crosswalk with evidence: emitted."
    why_this_registry: >
      An agent framework that swallows a model error and returns an empty
      reply makes a failed call look like an agent that chose to say nothing.
      The value keeps the two apart.

# system_attributes: four things a FILER declares about their own system, all
# four together. This block carries no status and no review-by date, and it is
# not a term: nothing here is ever promoted or demoted, so the lifecycle above
# does not reach it.
#
# What it gates is somebody else's promotion. A crosswalk supporting a term's
# move to canonical must declare all four of these, alongside at least one
# evidence-dimension term at evidence: emitted. Any one of them alone leaves the
# signed pre-image shape undifferentiated, which is why they travel as a set.
# principal_identity: who stands behind the issuer of the token a decision point
# validated. principal.source in the agent-audit-record predicate names the KIND
# of token (jwt-access-token, id-token, jwt-assertion) and stays that; these terms
# name the identity provider that runs the issuer and whether the issuer's key was
# pinned before the first call. Neither scores an actor, so the out_of_scope line
# on agent identity and reputation is untouched.
principal_identity:

  identity_provider:
    status: proposed
    criticality: critical
    review_by: "2027-05-08"
    values: [okta, entra, auth0, keycloak, self_issued, other]
    value_definitions:
      okta: "The issuer is an Okta org or custom authorization server: an https issuer whose host ends in okta.com, oktapreview.com, okta-emea.com or okta-gov.com, or a custom domain the record declares as okta."
      entra: "The issuer is Microsoft Entra ID or Entra External ID: an https issuer on login.microsoftonline.com, login.microsoftonline.us, login.chinacloudapi.cn, sts.windows.net or a host ending in ciamlogin.com, or a custom domain the record declares as entra."
      auth0: "The issuer is an Auth0 tenant: an https issuer whose host ends in auth0.com, or a custom domain the record declares as auth0."
      keycloak: "The issuer is a Keycloak realm: an https issuer whose path is /realms/<realm> or /auth/realms/<realm>."
      self_issued: "The issuer is the deploying party itself, or the OpenID self-issued issuer https://self-issued.me/v2: no third-party identity provider vouches for the principal."
      other: "An identity provider this registry does not name. The issuer URL is the only description, and a consumer requiring one of the named providers refuses it."
    definition: >
      The identity provider that operates the issuer of the token a decision
      point validated, derived from principal.issuer. principal.source keeps
      naming the kind of token; this term names who issued it, so one closed
      set covers the four hosted and self-hosted providers agents meet most
      and the case where nobody but the deployer vouches. Closed and
      fail-closed.
    check: >
      A verifier derives the value from principal.issuer by the host and path
      rules in value_definitions, checking self_issued first against the
      issuers the relying party declares as its own. Where the derivation
      names a provider, a declared value that differs is refused, never
      reconciled. Where the issuer is a custom domain and the derivation
      gives other, a declared named value is accepted as declared and
      reported as declared, not derived. An issuer that is not an https URL
      is malformed. A self_issued principal MUST NOT be read as vouched for
      by a third party.
    source_path: "predicate.principal.issuer (derived); a declared value at predicate.principal.identityProvider"
    issuers_in_production: []
    promotion_trigger: "An independently maintained agent gateway, decision point or identity broker that is not us emits the provider of a validated principal in a signed record and files a crosswalk with evidence: emitted."
    why_this_registry: >
      Gateways and brokers already name these providers in their own
      configuration, each with its own spelling, and a broker that federates
      several of them hides which one vouched for a given call. One value per
      provider, derived from the issuer the record already signs, lets an
      auditor ask which calls ran on a self-issued principal without trusting
      each vendor's label.

  issuer_key_pinning:
    status: proposed
    criticality: critical
    review_by: "2027-05-08"
    values: [pinned_before_first_call, unpinned]
    value_definitions:
      pinned_before_first_call: "The client held the RFC 7638 SHA-256 thumbprint of the issuer key in its configuration before its first call to the issuer and refused any key whose thumbprint differed."
      unpinned: "The client trusted whatever key the issuer's JWKS served at the time, with no thumbprint configured."
    definition: >
      Whether the client that obtained the token pinned the issuer's signing
      key by its RFC 7638 thumbprint before its first call. A pin is all or
      nothing: a configuration that pins one issuer and leaves another
      unpinned, or names two thumbprints for one issuer, is malformed and is
      never read as pinned. A pin is never downgraded: on a thumbprint
      mismatch or a failed key fetch the client refuses, and does not fall
      back to the unpinned path. Closed and fail-closed.
    check: >
      A verifier reads pinned_before_first_call only when the record carries
      the configured thumbprint and it equals principal.keyThumbprint, which
      the verifier recomputes from principal.key. A record claiming a pin
      whose thumbprint differs, or a mixed configuration, is refused. A
      relying party that requires a pin refuses unpinned.
    source_path: "predicate.principal.keyThumbprint compared with the configured pin at predicate.principal.pinnedThumbprint"
    issuers_in_production: []
    promotion_trigger: "An independently maintained agent client or SDK that is not us records whether it pinned the issuer key in a signed record and files a crosswalk with evidence: emitted."
    why_this_registry: >
      A client that fetches the issuer's JWKS on first use trusts whoever
      answers that fetch, and a client that falls back to that path when its
      pin fails has no pin at all. Naming the two states, with mixed and
      downgraded configurations refused, lets a reader tell a client that
      would have caught a swapped issuer key from one that would not.

# decision_receipt: the fields a signed record of one allow-or-refuse decision
# carries so that a party who does not trust the decision point can check what
# it decided over, in what world and as one of how many. Every term here is a
# state a verifier derives from which fields are present and what they equal.
# The load-bearing rule across the section: an absent field and an empty one are
# different claims, and a zero-filled digest is never a stand-in for either.
# upstream_receipt is the one term about a second party: a provider that
# answered the call can be asked, at a re-check address, whether it agrees.
decision_receipt:

  decision_verdict:
    status: proposed
    criticality: critical
    review_by: "2027-05-10"
    values: [allow, constrain, require_approval, block, halt]
    value_definitions:
      allow: "The action may run as proposed."
      constrain: "The action may run only after the decision point rewrites it as the record states; the bytes bound by the permit are the rewritten bytes."
      require_approval: "The action waits for a named approver other than the proposer; until the approval is recorded it is not allowed."
      block: "This one action is refused. The run may continue with other actions. A two-valued decision that says deny is read as block."
      halt: "The action is refused and the run ends; no later action of the run is allowed without a new run."
    definition: >
      The outcome a decision point reached for one proposed action, in a fixed
      strictness order from least to most strict: allow, constrain,
      require_approval, block, halt. When more than one policy answers the same
      action, the strictest verdict wins, the same way in every verifier, and a
      verifier reports every policy that answered at the winning verdict. A
      check that failed without producing a verdict of its own, such as a
      content guardrail, is read as block. An unregistered verdict, a
      differently spelled one and an empty set of answers are never read as
      allow. Closed and fail-closed.
    check: >
      A verifier orders the verdicts by the strictness order above and returns
      the strictest, with the policies that gave it sorted by identifier. It
      returns no decision, never allow, for an empty set, and refuses an
      unregistered or differently spelled verdict as malformed. It treats deny
      from a two-valued decision point as block and allow as allow.
    source_path: "predicate.decision.verdict (one per policy); the resolved verdict at predicate.decision.resolved"
    issuers_in_production: []
    promotion_trigger: "An independently maintained decision point that is not us emits a resolved verdict from this order in a signed record and files a crosswalk with evidence: emitted."
    why_this_registry: >
      Decision points already return a verdict from a small closed set, each
      with its own spelling and its own answer to what wins when two policies
      disagree. A reader comparing two vendors' records otherwise has to
      reverse-engineer the tie-break from code. One order, stated once and
      checked by vectors, lets two verifiers resolve the same conflict to the
      same answer.

  request_commitment:
    status: proposed
    criticality: critical
    review_by: "2027-05-10"
    values: [committed, uncanonicalizable]
    value_definitions:
      committed: "The record carries the SHA-256 of the canonical bytes of the request the decision was made over."
      uncanonicalizable: "The decision point could not canonicalize the request, and the record carries no request digest."
    definition: >
      Whether the decision is bound to the bytes of the request it judged. A
      digest is carried only when the request was canonicalized. When it was
      not, the field is omitted, never null and never filled with zero bytes,
      so that a missing commitment cannot be read as one over an empty or
      zero request. A verifier that holds the request recomputes the digest and
      refuses a record whose digest differs.
    check: >
      A verifier reads committed only when the field is a 64-hex SHA-256 that is
      not all zeros, and refuses a null, an empty string and a zero-filled
      digest as malformed. It reads an omitted field as uncanonicalizable and
      says so; a relying party that requires a commitment refuses
      uncanonicalizable. Given the request bytes, it recomputes the digest and
      refuses a mismatch.
    source_path: "predicate.decision.requestHash"
    issuers_in_production: []
    promotion_trigger: "An independently maintained decision point that is not us records a request digest, or its absence, by this rule in a signed record and files a crosswalk with evidence: emitted."
    why_this_registry: >
      A decision record that says allowed without saying over what is
      unfalsifiable: any request can be claimed after the fact. A digest turns
      the claim into a check, and the rule that an absent digest is omitted and
      not zero-filled keeps a failed canonicalization from looking like a
      commitment.

  policy_commitment:
    status: proposed
    criticality: critical
    review_by: "2027-05-10"
    values: [committed, not_committed]
    value_definitions:
      committed: "The record carries the SHA-256 of the policy configuration in force at decision time."
      not_committed: "The record carries no digest of the policy configuration."
    definition: >
      Whether the record names, by digest, the policy configuration the
      decision point applied. Without it two decisions that differ only because
      the policy changed between them cannot be told apart from one that was
      wrong. The digest is over the canonical bytes of the configuration and a
      verifier holding the configuration recomputes it.
    check: >
      A verifier reads committed only when the field is a 64-hex SHA-256 that is
      not all zeros, and reads an omitted field as not_committed. Given the
      configuration bytes it recomputes the digest and refuses a mismatch. A
      relying party that requires a policy commitment refuses not_committed.
    source_path: "predicate.decision.policyDefinitionHash"
    issuers_in_production: []
    promotion_trigger: "An independently maintained decision point that is not us records the digest of the policy it applied in a signed record and files a crosswalk with evidence: emitted."
    why_this_registry: >
      A decision is a function of its policy. A record that omits the policy
      leaves a reader to trust the decision point's own account of what it was
      enforcing when it decided.

  trust_root_commitment:
    status: proposed
    criticality: critical
    review_by: "2027-05-10"
    values: [committed, not_committed]
    value_definitions:
      committed: "The record carries the SHA-256 of the set of trusted roots the decision point honoured at decision time."
      not_committed: "The record carries no digest of the trusted root set."
    definition: >
      Whether the record names, by digest, the set of issuers the decision
      point was trusting when it decided. The chain embedded in a record shows
      which root issued the authority, and not that the decision point had any
      business trusting that root. The digest is over the canonical bytes of
      the sorted root set.
    check: >
      A verifier reads committed only when the field is a 64-hex SHA-256 that is
      not all zeros, and reads an omitted field as not_committed. Given the
      root set it recomputes the digest over the roots sorted by their
      encoding and refuses a mismatch. A relying party that holds its own root
      set refuses a record whose digest names a different one.
    source_path: "predicate.decision.trustedRootsHash"
    issuers_in_production: []
    promotion_trigger: "An independently maintained decision point that is not us records the digest of its trusted root set in a signed record and files a crosswalk with evidence: emitted."
    why_this_registry: >
      With the policy digest and the revocation view, the trusted root set pins
      the world the decision point was operating in. A record without it says a
      credential was valid and leaves open who the decision point believed
      could vouch for it.

  revocation_list_in_force:
    status: proposed
    criticality: critical
    review_by: "2027-05-10"
    values: [versioned_list, unversioned_list, no_list_loaded]
    value_definitions:
      versioned_list: "The decision point held a revocation list that carries a monotonic version; the record carries the list digest and the version."
      unversioned_list: "The decision point held a revocation list with no version; the record carries the list digest and no version."
      no_list_loaded: "The decision point held no revocation data; the record carries neither a digest nor a version."
    definition: >
      Which revocation data the decision point held when it decided. Holding no
      list and holding a list that revoked nothing are different claims: the
      first says revocation was never consulted, the second says it was
      consulted and did not match. A list that revoked nothing still has a
      digest, the digest of the empty list's canonical bytes, and so is never
      no_list_loaded. Without this term a stale or absent list is
      indistinguishable from a current one.
    check: >
      A verifier derives the value from which fields are present: a list digest
      with a version is versioned_list, a list digest with no version is
      unversioned_list, and neither is no_list_loaded. A version with no digest,
      a zero-filled digest and a null in either field are malformed. A relying
      party that requires revocation to have been consulted refuses
      no_list_loaded and accepts a versioned_list whose digest is the digest of
      the empty list. A verifier holding a published list recomputes its
      digest and refuses a mismatch.
    source_path: "predicate.decision.revocationListHash and predicate.decision.revocationListVersion"
    issuers_in_production: []
    promotion_trigger: "An independently maintained decision point that is not us records which revocation list it held, or that it held none, in a signed record and files a crosswalk with evidence: emitted."
    why_this_registry: >
      Without it, "the credential was not revoked when this ran" cannot be
      falsified. revocation_state says what a relying party observed after a
      revocation was issued; this says what the decision point knew when it
      decided.

  receipt_chain_link:
    status: proposed
    criticality: critical
    review_by: "2027-05-10"
    values: [first, linked, unchained]
    value_definitions:
      first: "The record is the first one its signer emitted in the chain and carries no previous digest."
      linked: "The record carries the SHA-256 of the previous record its signer emitted."
      unchained: "The signer does not chain its records."
    definition: >
      Whether a record names, by digest, the record its signer emitted before
      it, so that deleting a record breaks every record after it. Individually
      valid records do not make a set of records whole: a decision point can
      decline to emit a record for a decision it would rather forget. A chain
      proves its middle and its start; it proves nothing about newer records
      cut from the end, so a verifier states the end it could not establish
      unless the consumer holds the last digest and the count outside the
      signer's reach. A chain is read in order, a repeated record is refused,
      and two records that claim the same predecessor are a fork.
    check: >
      A verifier walks the records in the order they were emitted. It refuses a
      linked record whose previous digest is not the digest of the record before
      it, a record that appears twice and two records naming one predecessor.
      It reads a stream whose first record carries a previous digest as
      starting mid-chain, and a later record with no previous digest as a
      reset, which it reports as unchained and never as continuous. It reports
      an end it could not establish when no head anchor was supplied, and
      refuses a stream whose last digest or count differs from a supplied
      anchor.
    source_path: "predicate.decision.previousReceiptHash"
    issuers_in_production: []
    promotion_trigger: "An independently maintained decision point that is not us emits a hash-chained record stream and a verifier that is not ours checks it by this rule, filing a crosswalk with evidence: emitted."
    why_this_registry: >
      A chain walker that keys records by digest in a set accepts a repeated
      record and a reordered stream, and one that stops at the last link cannot
      see a cut tail. Stating order, duplicate, fork and end as the rules makes
      the claim rise from "this decision happened" to "these are all the
      decisions up to a stated end".

  possession_proof:
    status: proposed
    criticality: critical
    review_by: "2027-05-10"
    values: [bound, absent]
    value_definitions:
      bound: "The record carries the holder's proof-of-possession signature over this invocation."
      absent: "The record carries no proof-of-possession signature."
    definition: >
      Whether an allow carries the holder's own proof that it held the key for
      this invocation, signed over the request and a time window. The proof is
      what anchors the decision instant: the holder signs the window and the
      window is recomputed from the record's timestamp, so the instant is
      attested by a key the decision point does not hold. An allow with no
      proof is evidence of the signer's word alone.
    check: >
      A verifier reads bound only when the field is a signature of the length
      the scheme names, verifies it against the holder key the record's
      authority names over the request digest and the window recomputed from
      the record's timestamp, and refuses an allow whose proof is absent or
      does not verify. The same proof carried by two allows is a replay and
      the second is refused.
    source_path: "predicate.decision.possessionSignature"
    issuers_in_production: []
    promotion_trigger: "An independently maintained decision point that is not us records the holder's possession signature with each allow in a signed record and files a crosswalk with evidence: emitted."
    why_this_registry: >
      Delegated authority is only as good as the proof that the holder was the
      one asking. Recording the proof beside the decision lets a third party
      check the instant and refuse a replayed one.

  decision_code:
    status: proposed
    criticality: critical
    review_by: "2027-05-10"
    values: null
    definition: >
      A canonical kebab-case name for why a decision was not allow, drawn from a
      list the decision point publishes. It is required whenever the verdict is
      not allow and absent when it is allow. It never holds free text, an
      argument value or an identifier from the request, because the field is
      meant to be safe to retain indefinitely.
    check: >
      A verifier matches the value against ^[a-z][a-z0-9]*(-[a-z0-9]+)*$ with at
      most 64 characters, refuses a record whose verdict is not allow and whose
      code is absent, refuses one whose verdict is allow and whose code is
      present, and refuses a code that is not in a code list the relying party
      holds when it holds one.
    source_path: "predicate.decision.code"
    issuers_in_production: []
    promotion_trigger: "An independently maintained decision point that is not us records a canonical refusal code with each refusal in a signed record and files a crosswalk with evidence: emitted."
    why_this_registry: >
      A refusal reason in prose leaks arguments into a long-lived record and
      cannot be counted. A closed grammar keeps the field retainable and lets
      a reader tally refusals by cause.

  enforcement_point_label:
    status: proposed
    criticality: informational
    review_by: "2027-05-10"
    values: null
    definition: >
      A human-readable label a deployment gives to an enforcement point. It is
      descriptive only: the signer's key is the identity and the only field a
      verifier keys trust on. Two enforcement points may carry one label and a
      label may change while the key stays.
    check: >
      A verifier never uses the label as a lookup key into a registry of
      signers, never reports a record as coming from a labelled enforcement
      point on the label alone, and reports the label next to the key it was
      signed under.
    source_path: "predicate.decision.enforcementPointLabel"
    issuers_in_production: []
    promotion_trigger: "An independently maintained decision point that is not us records a descriptive label next to its signing key in a signed record and files a crosswalk with evidence: emitted."
    why_this_registry: >
      A reader who trusts a label trusts whoever can type it. Saying in the
      registry that the label is descriptive keeps a verifier from building
      trust on it.

  correlation_handle:
    status: proposed
    criticality: informational
    review_by: "2027-05-10"
    values: null
    definition: >
      An identifier the host supplies so a decision record can be matched with
      the host's own logs: a request id, a trace or span id, a workflow
      activity id. It is not an identity guarantee. Two invocations may carry
      the same handle and nothing enforces uniqueness. Telling repeats apart is
      the chain link's job, and matching a decision to its arguments is the
      request commitment's job.
    check: >
      A verifier never treats two records with one handle as one decision,
      never refuses a record because its handle repeats, and never accepts a
      handle as proof that a decision was made over particular arguments.
    source_path: "predicate.decision.correlationHandle"
    issuers_in_production: []
    promotion_trigger: "An independently maintained decision point that is not us records a host-supplied correlation handle in a signed record and files a crosswalk with evidence: emitted."
    why_this_registry: >
      A handle that looks like an identifier invites a verifier to key on it.
      Saying it is correlation only stops a repeated handle from being read as
      a replay or a single decision.

  upstream_receipt:
    status: proposed
    criticality: critical
    review_by: "2027-05-10"
    values: [agrees, disagrees, unreachable, not_checked]
    value_definitions:
      agrees: "The verifier asked the upstream provider at the re-check address and the provider's own record of the call matches the fact the receipt states."
      disagrees: "The verifier asked the upstream provider and its record differs from the fact the receipt states."
      unreachable: "The verifier asked and the provider did not answer with a record, for any reason, including a record that has expired."
      not_checked: "The verifier did not ask."
    definition: >
      One fact about a call, stated by the agent platform in its receipt and
      re-checkable at the independent party that served the call. The receipt
      names the provider, the provider's own identifier for the call (a
      generation id) and an https re-check address. A verifier checks the one
      fact against the provider's record without trusting the agent platform or
      the producer of the receipt. The result is reported as one of four
      values, and only agrees is a pass: unreachable and not_checked are never
      counted as pass. Every failure to obtain a record, whether the call is
      unknown, the record expired, the address answered with something other
      than a record or the transport failed, is reported as unreachable with
      one error text, so the answer reveals nothing about which.
    check: >
      A verifier refuses a receipt whose re-check address is not an https URL,
      whose provider or generation id is empty, or whose fact is not named. It
      fetches the address, compares the named fact with the provider's record
      field by field, returns agrees only on equality, returns disagrees on any
      difference, and returns unreachable for every other outcome. It counts
      unreachable and not_checked as unchecked in any tally of passes.
    source_path: "predicate.upstreamReceipt.{provider,generationId,recheckUrl,fact}"
    issuers_in_production: []
    promotion_trigger: "An independently maintained agent platform that is not us emits a provider, a generation id and a re-check address in a signed record and a verifier that is not ours re-checks it, with a crosswalk with evidence: emitted."
    why_this_registry: >
      Most claims in an agent platform's receipt can only be trusted on the
      platform's word. A fact the serving provider also records, such as which
      model actually answered, can be asked of the provider. Naming the
      provider, the call and the address in the record turns that one claim
      into a check, and the four outcomes keep a provider that could not be
      reached from reading as a provider that agreed.

# record_binding: how the bytes of a record are fixed, hashed, ordered, signed,
# and whose key may sign them. Added in 0.10.0. Every term here answers one
# question a verifier must settle before any claim inside the record is read:
# which bytes does the digest or signature cover, under which rule were those
# bytes produced, and was the key that signed them entitled to speak for the
# record. A verifier that skips any one of them can be shown a valid signature
# over bytes that are not the record it reads.
record_binding:

  canonicalization:
    status: proposed
    criticality: critical
    review_by: "2027-05-15"
    values: [rfc8785, jcs_safe_integer_v1, jcs_integer_only_v1, cbor_deterministic, raw]
    value_definitions:
      rfc8785: "The JSON Canonicalization Scheme of RFC 8785, applied to the parsed value. Numbers are serialized from their IEEE 754 double, so two number tokens with the same nearest double give the same bytes."
      jcs_safe_integer_v1: "RFC 8785, plus one refusal applied to the parsed double: a number token whose nearest double is an integer of magnitude 2^53 or more is refused, whether the token was written as an integer, with a fraction or with an exponent. Fractions below that magnitude are allowed. Duplicate member names, lone surrogates and invalid UTF-8 are refused before parsing."
      jcs_integer_only_v1: "RFC 8785 restricted to integer numbers: every number token is an integer of magnitude below 2^53, written without a fraction or an exponent, and never -0 (RFC 8785 writes it as 0, a rewrite this profile refuses). Any other number token puts the object outside this profile, which is a refusal by declared profile and not a canonicalization failure. Duplicate member names, lone surrogates and invalid UTF-8 are refused before parsing."
      cbor_deterministic: "The deterministic encoding of RFC 8949 section 4.2.1: preferred serialization, definite lengths and map keys sorted by their encoded bytes."
      raw: "No canonicalization: the digest or signature covers the exact bytes as transmitted or stored, and a verifier must hold those exact bytes."
    definition: >
      The rule that turns a record, or the object a digest names, into the
      bytes that are hashed or signed. A digest or signature without a declared
      canonicalization cannot be recomputed by a second party: two correct
      implementations that guess differently get different bytes and one of
      them reports a forgery that is not there. The two safe-integer profiles
      are different rules, not two spellings of one: jcs_safe_integer_v1
      allows fractions and judges the parsed double, jcs_integer_only_v1
      refuses any fraction or exponent. A verifier never substitutes one for
      the other, never reads plain rfc8785 as either, and never reads a
      refusal by a declared profile as a failure of the record under rfc8785.
    check: >
      A verifier reads the declared value, recomputes the bytes under exactly
      that rule and compares. It reports an undeclared canonicalization as
      cannot tell, never as a mismatch. Under either safe-integer profile it
      refuses a duplicate member name, a lone surrogate and invalid UTF-8
      before it builds a value, and it refuses an input it would have to
      rewrite to canonicalize (a respelled integer past 2^53 under
      jcs_safe_integer_v1, any fraction, exponent or -0 under
      jcs_integer_only_v1). An input
      refused by the declared profile is reported as outside the profile, a
      count of its own, and never folded into agreement or disagreement.
    source_path: "the canonicalization member next to any digest or signature (for example evidence_ref.canonicalization, integrity.canonicalization)"
    issuers_in_production: []
    promotion_trigger: "An independently maintained producer that is not us writes one of these values next to a digest or signature in a real record, and a verifier that is not ours recomputes it, filing a crosswalk with evidence: emitted."
    why_this_registry: >
      Hand-written canonicalizers fail in the same places: a duplicate member
      kept last-wins, a lone surrogate passed through, an integer past 2^53
      rewritten to its neighbour. Naming the rule, and naming the subset
      profiles as separate values, lets a verifier say which rule it judged by
      and lets a subset implementation be scored inside its own profile.

  hash_alg:
    status: proposed
    criticality: critical
    review_by: "2027-05-15"
    values: [sha_256, sha_384, sha_512]
    value_definitions:
      sha_256: "SHA-256 of FIPS 180-4, carried as 64 lowercase hex characters."
      sha_384: "SHA-384 of FIPS 180-4, carried as 96 lowercase hex characters."
      sha_512: "SHA-512 of FIPS 180-4, carried as 128 lowercase hex characters."
    definition: >
      The hash function a digest was computed with. It is named next to the
      digest and never inferred from the digest's length, because two
      functions of one length cannot be told apart by length, and a verifier
      that guesses accepts whichever reading verifies.
    check: >
      A verifier refuses a digest whose length or alphabet does not match the
      named function, refuses an unregistered function under cases 1 and 2 of
      the open value rule, and recomputes the digest over the bytes the
      declared canonicalization produces.
    source_path: "the hash_alg member next to any digest"
    issuers_in_production: []
    promotion_trigger: "An independently maintained producer that is not us names the hash function next to each digest in a real record and files a crosswalk with evidence: emitted."
    why_this_registry: >
      A digest without its function is half a claim. Most records carry
      SHA-256 by convention, and a convention is exactly what a second
      implementation reads differently.

  sequence_number:
    status: proposed
    criticality: critical
    review_by: "2027-05-15"
    values: null
    definition: >
      The position of a record in its producer's stream for one trajectory,
      a non-negative integer that starts at 0 and rises by exactly 1 with each
      record. Together with the link to the previous record's digest (the rule
      of receipt_chain_link, applied to any stream of records) it lets a
      verifier tell a dropped, repeated or reordered record from a complete
      stream. The sequence number alone proves nothing: it is inside the
      producer's reach, and only the digest link and a head held outside the
      producer's reach make a gap visible.
    check: >
      A verifier refuses a stream whose numbers do not start at 0 (or at the
      number a supplied anchor names), repeat, skip or fall, refuses a number
      outside 0 to 2^53-1 (the anchor's starting number included), and refuses a record whose number disagrees with
      its position in the digest chain.
    source_path: "the seq member of a log or receipt record"
    issuers_in_production: []
    promotion_trigger: "An independently maintained producer that is not us numbers its records by this rule in a real stream and files a crosswalk with evidence: emitted."
    why_this_registry: >
      Event logs that are hashed record by record but never numbered or
      linked let anyone delete a record without trace: every remaining record
      still verifies. Numbering and linking are what turn a set of valid
      records into a stream whose gaps are visible.

  trajectory_head:
    status: proposed
    criticality: critical
    review_by: "2027-05-15"
    values: [witnessed, producer_signed, absent]
    value_definitions:
      witnessed: "The stream identity, the digest of the last record and the record count are signed by a witness key whose public half the consumer pinned and the producer does not hold."
      producer_signed: "The stream identity, the digest of the last record and the count are signed only by the producer's own key."
      absent: "No signed statement of the stream identity, the last record and the count exists."
    definition: >
      What fixes the end of a record stream. A digest chain proves its middle
      and its start, and says nothing about records cut from the end: the
      producer, or anyone holding its storage, can truncate the tail and every
      remaining record still verifies. Only a head signed by a key outside the
      producer's reach turns "these records verify" into "these are all the
      records up to this point". producer_signed fixes the end against a
      third party who edits storage, never against the producer itself.
      The head names the stream it closes: a head over a digest and a count
      alone can be presented as the end of another stream by the same
      producer, so one stream's head would close a second, truncated one.
      The signed bytes are the stream identity, the last digest and the
      count under a signing domain that names the head, so a head signature
      is never valid as a record signature or the reverse. Exactly: the
      ASCII bytes agent-evidence/record-binding/v1/trajectory-head, one byte
      0x0A, the stream identity, 0x0A, the last digest, 0x0A, then the count
      in decimal ASCII digits with no sign and no leading zero, with nothing
      after it. The identity and the digest are the exact strings the head
      carries, UTF-8 encoded with no normalization; neither may be empty or
      contain 0x0A, and the count is an integer in 0 to 2^53-1.
    check: >
      A verifier reports witnessed only when the head's signature verifies
      under a pinned witness key, the head's stream identity equals the
      identity the consumer asked for, the head's digest equals the digest of
      the last record it walked and the count equals the number walked. A
      head with no stream identity, or one naming a different stream, does
      not close the stream being read. A head whose identity or digest
      contains 0x0A has no signed bytes and is refused, whatever a signature
      check reported. registry.trajectory_head applies the
      rule and registry.trajectory_head_preimage builds the signed bytes. It reports
      a stream with an absent head as complete only up to an end it could not
      establish, and never as complete.
    source_path: "the signed head object of a log (stream identity, head digest, count, signature)"
    issuers_in_production: []
    promotion_trigger: "An independently maintained producer that is not us publishes a witness-signed head over its record stream and files a crosswalk with evidence: emitted."
    why_this_registry: >
      Tail truncation is the edit no per-record check can see. Naming who
      signed the head is the difference between a log the producer can
      silently shorten and one it cannot.

  coverage_boundary:
    status: proposed
    criticality: critical
    review_by: "2027-05-15"
    values: [declared, undeclared]
    value_definitions:
      declared: "The record names which events or objects the stream or digest is meant to cover, so an absent one inside the boundary is an omission and one outside it is not."
      undeclared: "The record does not name what it is meant to cover."
    definition: >
      The stated extent of what a digest or a record stream covers: which
      event kinds, which trajectory, which copy of an object. Without it an
      absence cannot be judged: a missing event may be an omission or may
      never have been in scope, and a digest may bind a copy of the object that
      no consumer reads. The boundary includes which copy is covered: a digest
      over one file while the consumer reads another binds nothing the
      consumer uses.
    check: >
      A verifier reports an omission only inside a declared boundary, reports
      completeness as cannot tell when the boundary is undeclared, and refuses
      a digest whose covered copy differs from the copy the consumer declares
      it reads.
    source_path: "the coverage or scope member of a log head or evidence reference"
    issuers_in_production: []
    promotion_trigger: "An independently maintained producer that is not us declares the coverage boundary of its stream or digest in a real record and files a crosswalk with evidence: emitted."
    why_this_registry: >
      coverage_denominator says how much of a population a claim covers; this
      says what the population is for one stream or one digest, so that a
      verifier can tell a missing record from one that never belonged.

  signature_coverage:
    status: proposed
    criticality: critical
    review_by: "2027-05-15"
    values: [full, endpoint_only, none]
    value_definitions:
      full: "The signature verifies and covers every member of the record a consumer acts on."
      endpoint_only: "The signature verifies and covers only the endpoint members (name, target, port, protocol); the other members a consumer acts on are not attested."
      none: "No signature covers the record, or the signature that is present does not verify."
    definition: >
      How much of a record a verifying signature actually covers. A valid
      signature that covers part of a record is a true statement about that
      part and no statement about the rest, and reporting it as plain verified
      is a false statement about what was proven: whoever chooses which genuine
      signature to replay chooses one that leaves the members they want to
      change uncovered. A key that could not be fetched leaves the question
      unanswered, which is cannot tell and never none.
    check: >
      A verifier compares the signed members with the members the consumer
      acts on and reports full only when every one is covered. It reports
      endpoint_only with the uncovered members named, and never folds it into
      full. It reports an unreachable key as cannot tell, not none.
    source_path: "the verifier's report over a signed discovery or capability record"
    issuers_in_production: []
    promotion_trigger: "An independently maintained verifier that is not us reports partial signature coverage as its own state on real records and files a crosswalk with evidence: emitted."
    why_this_registry: >
      Partial coverage is the verdict most verifiers have no word for, so it
      is reported as success. One term with three values gives it a name that
      a consumer can refuse.

  key_authority:
    status: proposed
    criticality: critical
    review_by: "2027-05-15"
    values: [pin, dnssec_chain, kt_inclusion, none]
    value_definitions:
      pin: "The verifier holds the signer's public key, or its thumbprint, from a source outside the record and the record's own transport."
      dnssec_chain: "The key is published in DNS and the verifier validated the DNSSEC chain from a trust anchor it holds to the record that carries the key."
      kt_inclusion: "The key is in a key-transparency log and the verifier checked an inclusion proof against a log head signed by a key it holds."
      none: "The key came only from the record itself or from an unauthenticated fetch."
    definition: >
      What proves that the key a signature verifies under is entitled to speak
      for the record. A signature proves only that some key signed some bytes.
      A key carried inside the record, or fetched over a channel the attacker
      controls, proves nothing about who signed: a forger signs with their own
      key and ships it alongside. A verdict that the record agrees with its
      signer needs one of the first three values; none tops out at cannot
      tell, however well the signature verifies.
    check: >
      A verifier names the authority path it used and reports agreement only
      under pin, dnssec_chain or kt_inclusion with the path actually checked.
      It refuses a signature under a key the record names that is not the key
      the authority path yields. Under none it reports cannot tell and states
      that the key was self-carried.
    source_path: "the verifier's report (key authority path) for any signed record"
    issuers_in_production: []
    promotion_trigger: "An independently maintained verifier that is not us reports the authority path of the key behind each verdict on real records and files a crosswalk with evidence: emitted."
    why_this_registry: >
      Verifier after verifier accepts a signature without proving the key may
      speak for the record, and reports a forgery under a foreign key as
      verified. One closed list of authority paths makes the question
      unavoidable and makes none visible.

  signing_construction:
    status: proposed
    criticality: critical
    review_by: "2027-05-15"
    values: [ard_draft_bu_00, ai_catalog_2026_11, ai_catalog_snapshot, field_whole_entry]
    value_definitions:
      ard_draft_bu_00: "draft-bu-dawn-ard-discovery-00 section 3.5: the RFC 8785 canonical form of the trustManifest object minus its signature member, signed as a detached JWS string."
      ai_catalog_2026_11: "The AI Catalog specification with ADR-0027 and ADR-0028, pinned at Agent-Card/ai-catalog commit e2b425f9e7678a5e6497c5fcff4826d906a4a605: the RFC 8785 canonical form of the trust manifest minus the immediate signature.jws and additionalSignatures members, removed non-recursively, with protected typ ai-catalog-trust-manifest+jws. The same input was defined before ADR-0028 (commit 4a341fae92ba79bebac9cbd927c4c3acbeb534c8, specification line 937) for a string signature."
      ai_catalog_snapshot: "ADR-0028, section on signing catalog snapshots, at the same pinned commit: the RFC 8785 canonical form of the whole catalog minus the immediate root signature.jws and additionalSignatures members, removed non-recursively, with protected typ ai-catalog+jws. Nested Trust Manifests and their signatures stay in the signed bytes."
      field_whole_entry: "Measured practice in published catalogs, defined by no normative document: the RFC 8785 canonical form of the whole catalog entry minus trustManifest.signature."
    definition: >
      Which bytes a signature over an agent catalog object is computed on.
      One object family is signed three different ways in normative text and
      in the field, and a record valid under one construction is invalid or
      not applicable under the others. The construction is therefore a named,
      closed parameter of every signature verdict over such an object: a
      verdict that names no construction cannot be reproduced, and a verifier
      that tries each construction until one verifies accepts whatever an
      attacker can make verify under any of them.
    check: >
      A verifier takes the construction as an input, never searches for one,
      refuses an unregistered construction under cases 1 and 2 of the open
      value rule, and states in every verdict which construction it applied.
      It reports the same object under two constructions as two verdicts.
    source_path: "the verifier's input and report for a signed catalog object"
    issuers_in_production: []
    promotion_trigger: "An independently maintained catalog publisher or verifier that is not us names the construction its signature or verdict uses in a real artifact and files a crosswalk with evidence: emitted."
    why_this_registry: >
      Three signing inputs for one object family is a measured divergence, not
      a hypothetical one. Until the documents converge, the only way two
      verifiers reach one verdict is to name the input.

  key_history:
    status: proposed
    criticality: critical
    review_by: "2027-05-15"
    values: [key_current, key_rotated_out, key_not_authorized_at_issue, key_revoked, key_unknown]
    value_definitions:
      key_current: "The signing key was authorized when the record was issued, an authorization window that holds the issuance time is still open, and the history records no revocation of the key."
      key_rotated_out: "The signing key was authorized when the record was issued, and every window that held the issuance time has since ended, by an ordinary rotation or by a revocation whose effective time is after issuance. The record stays valid."
      key_not_authorized_at_issue: "The signing key is known to the history, but its authorization began after the record's issuance time or ended before it by rotation. The record is refused."
      key_revoked: "The signing key was revoked at or before the record's issuance time, or revoked afterwards for compromise with an effective time at or before issuance. The record is refused."
      key_unknown: "The verifier holds no history that names the signing key. Nothing is decided: the result is indeterminate, never refused as forged and never accepted."
    definition: >
      The standing of a signing key as of the time a record was issued, read
      from a key history the verifier holds (authorization start, rotation
      end, revocation with its effective time and reason). It separates a key
      rotated out after issuance, which leaves the record valid, from a key
      that was never authorized at issuance, which makes it a forgery. Without
      that separation a pre-rotation record and a forgery look the same, and a
      verifier either refuses every old record or accepts every forged one.
    check: >
      A verifier evaluates the history at the record's issuance time, not at
      the time of checking, and only when the issuance time is itself bound
      by the signature. It refuses a history whose entry is not an object or
      whose window ends (retired_at) before it starts (authorized_from),
      never reading it as an empty window. A revocation for compromise is applied at its
      effective time, which may precede its publication. It reads every
      entry that names the key (a key may hold several authorization
      windows), never only the first, so a later entry that revokes the key
      is never hidden behind an earlier one. A key absent from the history
      gives key_unknown and an indeterminate result.
    source_path: "the verifier's report over a signed record, against a key history document"
    issuers_in_production: []
    promotion_trigger: "An independently maintained verifier that is not us reports key standing as of issuance with these distinctions on real records and files a crosswalk with evidence: emitted."
    why_this_registry: >
      Keys rotate. Records outlive the keys that signed them. A verifier that
      checks keys against today's list refuses honest history; one that ignores
      history accepts forgeries signed under a key that was never authorized.

# evaluation_claim: how a verdict a record states about itself is turned into
# a check. Added in 0.10.0. A record that says "within mandate", "passed" or
# "authorized equals executed" is evidence only once a second party can re-derive
# the verdict from the record's own inputs under a rule both of them can name.
# Every term here either names that rule, names an outcome of re-deriving it, or
# names a condition under which a stated pass is empty.
evaluation_claim:

  evaluator:
    status: proposed
    criticality: critical
    review_by: "2027-05-15"
    values: null
    definition: >
      The URI of a published, versioned evaluation function that turns a
      record's recorded inputs into its verdict. The function is normative and
      complete: it names its inputs, its output values and the order in which
      it checks, so two implementations given the same inputs return the same
      verdict and the same first failing dimension. A version is never edited
      after publication; a change is a new version under a new URI. The first
      registered evaluator is
      https://probityai.github.io/agent-evidence-vectors/evaluator/payment-scope/v1,
      which judges a payment against the scope a principal granted.
    check: >
      A verifier refuses an evaluator value that is not an absolute https URI
      with a host (https:// alone is refused, never read as unknown),
      re-derives the verdict when it holds the named function, and returns
      evaluator_unknown (an indeterminate result) when it does not. It never
      substitutes a function it holds for the one the record names.
    source_path: "the evaluator member next to an asserted verdict"
    issuers_in_production: []
    promotion_trigger: "An independently maintained producer that is not us names a published evaluator next to a verdict in a real record and a verifier that is not ours re-derives it, filing a crosswalk with evidence: emitted."
    why_this_registry: >
      A record that asserts a verdict without naming the rule asks to be
      trusted. Naming a published function turns the assertion into a
      computation any party can repeat, and makes the producer's own key
      irrelevant to whether the verdict is right.

  asserted_verdict:
    status: proposed
    criticality: critical
    review_by: "2027-05-15"
    values: [rederived_agrees, asserted_verdict_contradicted, evaluator_unknown]
    value_definitions:
      rederived_agrees: "The verifier re-derived the verdict from the recorded inputs under the named evaluator and got the verdict the record asserts."
      asserted_verdict_contradicted: "The re-derived verdict differs from the asserted one. The record is refused, whoever signed it."
      evaluator_unknown: "The record names no evaluator, or one the verifier does not hold. The asserted verdict is reported and nothing is decided."
    definition: >
      The outcome of checking a verdict a record asserts about its own inputs.
      A signature over an asserted verdict proves who asserted it, never that
      it is right: the key that is entitled to sign can sign a verdict its own
      inputs refute. So an asserted verdict is read only through re-derivation,
      and a verifier that trusts the asserted field accepts every such record.
    check: >
      A verifier never reads the asserted verdict as an input to its own. It
      recomputes the verdict under the named evaluator from the recorded
      inputs, compares, and refuses on a difference even when the signature
      and the key are valid. It refuses a record whose inputs the named
      evaluator holds as malformed (missing, of another type, out of range)
      and never re-derives a verdict from them. It refuses a record that
      names an evaluator it holds and carries no asserted verdict, or one
      that is not among the evaluator's output values (for payment-scope/v1,
      within or outside, compared byte for byte), and never reports either
      as asserted_verdict_contradicted: there is no claim to contradict.
      Without the evaluator it reports evaluator_unknown and an
      indeterminate result.
    source_path: "the asserted verdict member and the evaluator member of a record"
    issuers_in_production: []
    promotion_trigger: "An independently maintained verifier that is not us re-derives asserted verdicts and refuses contradicted ones on real records, filing a crosswalk with evidence: emitted."
    why_this_registry: >
      Records that carry their own verdict are becoming common in payment
      disputes and agent audit trails. The trusted-key-holder who signs a
      wrong verdict is the case a signature check cannot catch and a
      re-derivation always does.

  verification_decision:
    status: proposed
    criticality: critical
    review_by: "2027-05-15"
    values: [accepted, rejected, indeterminate]
    value_definitions:
      accepted: "Every check the profile requires ran and passed."
      rejected: "At least one check ran and failed."
      indeterminate: "No check failed, and at least one required check could not be decided from what the verifier holds (an unknown evaluator, an unknown key, an unreachable source)."
    definition: >
      The verifier's decision on one record, with a third outcome beside
      accept and reject. A two-valued decision forces an undecidable record
      into one of the two: read as accepted it lets an unknown key through,
      read as rejected it reports a forgery that is not there. indeterminate
      is a decision in its own right, carried in the verifier's exit status
      (0 accepted, 1 rejected, 2 indeterminate) and in its report, and never
      counted as a pass.
    check: >
      A verifier returns rejected whenever any check failed, even if another
      could not be decided; indeterminate only when none failed and one could
      not be decided; accepted only when all were decided and passed. A tally
      counts indeterminate separately from both.
    source_path: "the verifier's exit status and report"
    issuers_in_production: []
    promotion_trigger: "An independently maintained verifier that is not us returns a three-valued decision on real records and files a crosswalk with evidence: emitted."
    why_this_registry: >
      Transparency receipts, payment receipts and agent records all meet the
      key nobody can resolve and the rule nobody named. A shared third outcome
      keeps those from being silently counted either way.

  check_outcome:
    status: proposed
    criticality: critical
    review_by: "2027-05-15"
    values: [pass, fail, not_evaluated]
    value_definitions:
      pass: "The check ran and its condition held."
      fail: "The check ran and its condition did not hold."
      not_evaluated: "The check did not run: an earlier check in the profile's order failed, or its inputs were absent."
    definition: >
      The outcome of one check inside a verification that runs its checks in a
      fixed order and stops at the first failure. Every check after the first
      failure is not_evaluated, never pass: a report that lists later checks
      as passing claims they held when they never ran. A report lists every
      check of the profile, in order, with its outcome.
    check: >
      A verifier reports every check the profile names, in the profile's
      order, refuses a report that lists a check as pass after a fail, and
      refuses a report that omits a check the profile names. The report as a
      whole is fail when a check failed, pass only when every check ran and
      passed, and not_evaluated when none failed and one did not run: a
      report of checks that did not run never reads as a pass. It refuses a
      profile that names no check, since a pass over no checks is a pass over
      nothing, and one that names a check twice, so one run cannot stand for
      two.
    source_path: "the per-check list of a verifier's report"
    issuers_in_production: []
    promotion_trigger: "An independently maintained verifier that is not us reports checks after the first failure as not evaluated on real records and files a crosswalk with evidence: emitted."
    why_this_registry: >
      A list of passes after a failure is the most common way a verifier's
      report overstates what it checked.

  vacuity_witness:
    status: proposed
    criticality: critical
    review_by: "2027-05-15"
    values: [witnessed, vacuous_pass, no_witness]
    value_definitions:
      witnessed: "A witness run shows the condition the property guards is reachable: at least one honest execution of the checked model or system reaches the state the property is about."
      vacuous_pass: "The property was reported as holding, and the witness for its precondition is falsified: no honest execution reaches the guarded state, so the property holds because nothing happens. The pass is refused."
      no_witness: "No witness was declared or run for the property."
    definition: >
      Whether a property reported as holding on all traces was ever exercised.
      An all-traces property holds trivially over a model with no honest
      trace, and a case set that counts such a result as a pass reports
      coverage it does not have. The witness is a separate, declared check
      that the guarded state is reachable; a pass whose witness is falsified
      is a vacuous pass, a code of its own, and the case is recorded as not
      run.
    check: >
      A verifier reads a pass as a pass only with a witnessed result for the
      same variant. A pass with a falsified witness is refused as
      vacuous_pass and the case is counted as not run. A pass with no witness
      is reported as no_witness and never counted toward coverage that the
      case set claims to have exercised. A failing result whose witness is
      falsified is refused as contradictory: a property over an unreachable
      guarded state has no trace that can violate it. A result or a witness
      that is not a boolean is refused, never read by truthiness.
    source_path: "the witness member of a case in a case set, and the verifier's per-case report"
    issuers_in_production: []
    promotion_trigger: "An independently maintained formal-model or test case set that is not ours declares a witness per property and a verifier that is not ours refuses vacuous passes, filing a crosswalk with evidence: emitted."
    why_this_registry: >
      A formal model that proves a protocol property usually proves it over
      every variant at once, and the variants where no honest run exists pass
      every safety property for free. The witness is the one check that tells
      a proof from an empty one.

  evidence_attribution:
    status: proposed
    criticality: critical
    review_by: "2027-05-15"
    values: [co_signed, single_signed, unattributed_evidence]
    value_definitions:
      co_signed: "Two parties with distinct keys signed the same record bytes, both signatures verify, and key authority lets each key speak for its own party."
      single_signed: "One party signed the record, the signature verifies, and key authority lets the key speak for that party."
      unattributed_evidence: "The record carries no verifying signature, a co-signature member that is present does not verify, or key authority refuses a signing key for its party; the evidence is attributed to no party."
    definition: >
      Which parties a record binds. Two signatures bind two parties to one
      record. They do not prove the record true, and they do not prove the
      two parties independent: one operator can hold both keys, and two
      parties can agree on a false statement. A co-signature that is present
      and does not verify is not a weaker co-signature; it makes the record
      unattributed evidence, because the record claims a binding it does not
      have. A signature under a key that may not speak for its party binds no
      party either, so the value is decided with key authority: a forger who
      signs as the agent under a key of his own makes the record unattributed
      evidence, not co-signed.
    check: >
      A verifier reports co_signed only when both signatures verify under two
      distinct keys and key authority, asked about each key with that party
      as the subject, lets each speak for its own party; reports a present
      signature that fails, or a key an authority refuses, as
      unattributed_evidence; reports no value while key authority is
      undecided; and never raises a verdict about the record's content
      because a second signature is present.
    source_path: "the signature and co-signature members of a receipt"
    issuers_in_production: []
    promotion_trigger: "An independently maintained producer that is not us emits co-signed receipts and a verifier that is not ours checks both signatures by this rule, filing a crosswalk with evidence: emitted."
    why_this_registry: >
      Co-signed receipts are read as stronger evidence than they are. Stating
      the trust boundary in the term keeps two signatures from being read as
      two independent witnesses of the truth.

  signer_distinctness:
    status: proposed
    criticality: critical
    review_by: "2027-05-15"
    values: [distinct, key_named_not_signing, one_key_two_ids, own_key_as_cosigner, one_authority_threshold, below_threshold]
    value_definitions:
      distinct: "Every signature the record requires verifies, under a different key, and the keys resolve to different authorities."
      key_named_not_signing: "The record names a key as a signer, and no signature in it verifies under that key, including a signer named under an identifier another named signer already uses, whose one signature cannot verify under two keys."
      one_key_two_ids: "One key is listed under two key identifiers and counted twice toward a required number of signers."
      own_key_as_cosigner: "The issuer's own key is listed among the signers counted toward the required number. The issuer never counts toward that number, so a record that needs the issuer and one other party states a required count of 1."
      one_authority_threshold: "A threshold of signers is met by keys that all resolve to one authority."
      below_threshold: "Fewer distinct keys sign than the record requires, with no key counted twice: the count is not met at all."
    definition: >
      Whether the signers a record counts toward a required number are
      distinct, both as keys and as authorities. A threshold of signatures is
      worth what the number of independent authorities behind it is worth: two
      identifiers for one key, the issuer counted as its own cosigner, or a
      threshold met by keys of one authority each meet the count and none of
      them meets the purpose; a count that is simply short is a fifth
      failure. Applies to agent capability credentials,
      threshold-signed receipts and any record that requires more than one
      signer.
    check: >
      A verifier counts a signer once per distinct key and once per distinct
      authority, refuses a record whose required count is met only by
      counting a key or an authority twice, refuses a named signer whose
      signature is absent or does not verify, refuses two named signers under
      one identifier, and reports a count of distinct keys below the required
      number as below_threshold. It reports own_key_as_cosigner for a record
      that lists the issuer's own key among its signers whatever the count,
      since the issuer never counts toward it, and refuses a required count
      that is not an integer of at least 1: a threshold of 0 is met by nobody
      signing.
    source_path: "the signatures, signer list and required-signer count of a record"
    issuers_in_production: []
    promotion_trigger: "An independently maintained verifier that is not us counts signers by distinct key and authority on real records and files a crosswalk with evidence: emitted."
    why_this_registry: >
      Signer counts are checked by length far more often than by identity. Four
      failure values are the ways a count is met without independence; the
      fifth keeps a short count from being reported as one of them.

  lifecycle_binding:
    status: proposed
    criticality: critical
    review_by: "2027-05-15"
    values: [satisfied, failure, missing, not_evaluated, indeterminate]
    value_definitions:
      satisfied: "Every artifact in the group is admitted, authenticated under an active key binding and unique by identity, and every authorized action digest equals every executed action digest."
      failure: "The authorized and executed digests differ among admitted, authenticated, unique, actively bound artifacts, an authorizing record disagrees with another authorizing record in the group, or an artifact in the group, or the decision it cites, does not authenticate (its signature fails, or its key is not the one its producer's binding names)."
      missing: "The group lacks an authorizing record, an execution record, or the decision record it cites."
      not_evaluated: "An artifact needed for the comparison, or the decision it cites, is signed under a key binding that is not active in the supplied revocation snapshot, or the execution cites an instruction no authorization in the supplied set covers."
      indeterminate: "Two artifacts in the group share one identity; no winner is chosen and nothing is compared."
    definition: >
      Whether the authenticated execution report names the action the
      authenticated control authorized, for one decision and one instruction.
      Records are grouped by (decision, instruction). Every authorizing record
      in the group, from the issuing and the receiving side, is compared with
      every execution record in the group; a match on one pair proves nothing
      about the others. Each digest is computed by the convention declared for
      its pointer (raw or a named canonicalization), the signature suite is
      the one the verifier-accepted key binding names (the wire algorithm
      member is informative only), the key binding is resolved from the
      record's producer, and a revocation snapshot is required. Hash and
      signature pre-images are domain-separated: each is a tag naming the
      format version, the artifact type and whether it is a hash or a
      signature input, a line feed, then the canonical bytes, and the tags
      come from a closed registry, so an unregistered tag fails closed and one
      signature can never be replayed as another artifact type or as a hash.
      The registry is exactly six ASCII tags of the form
      agent-evidence/lifecycle-binding/v1/TYPE/PURPOSE, TYPE one of decision,
      control or execution and PURPOSE one of hash or signature; the
      pre-image is the tag bytes, one byte 0x0A, then the canonical bytes,
      with nothing between them and nothing after. A v2 format is a new set
      of tags, never a respelling of these.
      Absent evidence is never satisfied. The claim is about records: it never says that the
      executed bytes themselves were observed.
    check: >
      A verifier groups by decision and instruction, refuses to choose between
      two artifacts with one identity (indeterminate, independent of order,
      and for every group that holds the identity, even when the two
      artifacts sit in different groups), refuses an artifact that lacks a
      member or carries one of another type (authenticated is a boolean, the
      rest are strings),
      applies its rules in one order to every artifact of the group, the
      cited decision record included: identity first, then an execution no
      control covers (not_evaluated), then a missing control, execution or
      decision record (missing), then authentication (failure), then an
      inactive key binding (not_evaluated), then the digest comparison. It
      reports satisfied only when every pair in the group matches, and
      refuses an artifact of an unregistered type and never skips it. A grouping that compares the first authorization with
      the first execution, or that reads a keyless self-hash as
      authentication, is not this profile.
    source_path: "the verifier's report over a set of control and execution records"
    issuers_in_production: []
    promotion_trigger: "An independently maintained runtime that is not us emits control and execution records a verifier that is not ours judges by this profile, filing a crosswalk with evidence: emitted."
    why_this_registry: >
      "Authorized is not executed" is the question a platform security team
      asks first and the one most runtime evidence formats answer by matching
      one pair. Grouping, identity, authentication and revocation are each a
      way to get the answer wrong, and the five states keep an unknown from
      reading as a match.

  on_behalf_of:
    status: proposed
    criticality: critical
    review_by: "2027-05-15"
    values: null
    definition: >
      The party an agent acted for in the recorded action: a user, an
      organisation or another agent, named by an identifier the relying party
      can resolve. It is distinct from the acting entity and from the party
      that authorized the action, and a record that names only the acting
      entity cannot answer whose instruction was carried out. The value is a
      claim inside the signed record, attributed to its signer, and never
      proof that the named party consented.
    check: >
      A verifier refuses an empty value and an identifier it cannot parse,
      reports the value next to the signer that attributed it, and never
      reports the named party as the signer.
    source_path: "the on-behalf-of member of an agent audit record"
    issuers_in_production: []
    promotion_trigger: "An independently maintained producer that is not us names the party acted for in a real audit record and files a crosswalk with evidence: emitted."
    why_this_registry: >
      Audit records name the agent and the action and leave out the person the
      action was for, which is the first thing an investigator asks.

  anchor_within:
    status: proposed
    criticality: critical
    review_by: "2027-05-15"
    values: null
    definition: >
      The number of seconds after a record's issuance time within which its
      external time anchor must fall: the late bound on the anchor. It is an
      integer between 0 and 2^53-1. The anchor's own uncertainty is added to
      this bound by block_time_allowance where the anchor's clock lags its
      commitment; the bound is checked with equality allowed, so an anchor
      exactly at issuance plus anchor_within plus the allowance is in time.
    check: >
      A verifier refuses a value outside 0 to 2^53-1 before any arithmetic,
      refuses an anchor later than issuance plus anchor_within plus the
      applicable allowance, accepts one exactly at the bound, and holds one
      vector at the bound and one a second past it.
    source_path: "the anchorWithin member of an agent audit record"
    issuers_in_production: []
    promotion_trigger: "An independently maintained producer that is not us declares an anchor bound in a real record and files a crosswalk with evidence: emitted."
    why_this_registry: >
      An anchor proves a ceiling only if the record says how late it may be.
      Without a stated bound a year-old anchor reads as fresh.

  anchor_early_allowance:
    status: proposed
    criticality: critical
    review_by: "2027-05-15"
    values: null
    definition: >
      The number of seconds by which a record's external time anchor may
      precede the record's issuance time: the early bound on the anchor. It
      is an integer between 0 and 2^53-1. An anchor commits to bytes that
      already exist, so an anchor earlier than issuance means the issuance
      time was written later than the record existed, which makes the record
      read fresher than it is, unless the anchor's clock runs behind. A block
      header time may be set earlier than the moment its block was made, so
      this allowance covers that clock error and nothing else. It is the
      early bound's own allowance: block_time_allowance widens the late bound
      only, and neither value widens the other bound.
    check: >
      A verifier refuses a value outside 0 to 2^53-1 before any arithmetic,
      refuses a profile that names an anchor time but lacks this member
      (never a default of zero or of the late allowance), refuses an anchor
      earlier than issuance minus the allowance, accepts one exactly at the
      bound, and holds one vector at the bound and one a second before it.
    source_path: "the early anchor allowance of a time-anchored record or verifier profile"
    issuers_in_production: []
    promotion_trigger: "An independently maintained producer or verifier that is not us declares an early bound for an anchor time in a real artifact and files a crosswalk with evidence: emitted."
    why_this_registry: >
      A late bound alone accepts an anchor from before the record was issued,
      so a post-dated issuance time passes every freshness check. The early
      bound needs its own allowance, because the clock error that delays an
      anchor is not the error that makes it read early.

  block_time_allowance:
    status: proposed
    criticality: critical
    review_by: "2027-05-15"
    values: null
    definition: >
      The seconds added to a time bound to cover the uncertainty of the clock
      behind an anchor, stated per bound. A block-chain header time trails the
      commitment it carries by confirmation latency and may be set loosely by
      the miner, so a bound compared against it needs an allowance; a bound
      compared against a clock that states its own accuracy does not. The
      allowance belongs to the bound it widens and is never shared: this
      term widens the late anchor bound, anchor_early_allowance is the early
      anchor bound's own, and neither widens the future bound on issuance.
    check: >
      A verifier applies the allowance only to the bound it is declared for,
      refuses a value outside 0 to 2^53-1, and holds one vector pair per
      bound so that removing the allowance from one bound turns that pair
      red.
    source_path: "the per-bound allowance of a time-anchored record or profile"
    issuers_in_production: []
    promotion_trigger: "An independently maintained producer or verifier that is not us declares a per-bound allowance for an anchor time in a real artifact and files a crosswalk with evidence: emitted."
    why_this_registry: >
      Time checks fail by sharing one tolerance between bounds that need
      different ones. A named allowance per bound keeps each bound testable.

  clock_skew_tolerance:
    status: proposed
    criticality: critical
    review_by: "2027-05-15"
    values: null
    definition: >
      The seconds by which a record's issuance time may lie in the verifier's
      future. Freshness is asymmetric: the past bound is the record's maximum
      age plus the uncertainty allowed for its clock, and the future bound is
      the skew tolerance alone, never the maximum age. A symmetric check of the
      absolute age against the maximum age admits a record issued up to the
      maximum age in the future, which is a record that cannot exist yet.
    check: >
      A verifier refuses a value outside 0 to 2^53-1 before any arithmetic,
      refuses a profile that lacks a bound the check needs (never a default),
      refuses a profile member it does not define by name (a misspelled
      allowance is never ignored), refuses a record whose issuance time is later than the check time plus
      the skew tolerance, accepts one exactly at that bound, and never uses
      the maximum age for the future bound.
    source_path: "the skew tolerance of a verifier profile or record"
    issuers_in_production: []
    promotion_trigger: "An independently maintained verifier that is not us applies an asymmetric future bound with a stated skew tolerance on real records and files a crosswalk with evidence: emitted."
    why_this_registry: >
      The symmetric freshness check is the default in most code, and it lets a
      future-dated record through. A separate term for the future bound makes
      the asymmetry part of the record's contract.

  conformance_extension:
    status: proposed
    criticality: informational
    review_by: "2027-05-15"
    values: null
    definition: >
      An identifier an agent card or capability document lists among its
      declared extensions to state that the records its agent emits are
      judged by a named corpus revision under a named verifier. The
      identifier is this term's own URI,
      https://w3id.org/agent-evidence/vocab/v1/conformance_extension, written
      inside the signed card, so the statement is covered by the card's
      signature: removing it invalidates the card. Its params object carries
      exactly four members, each a non-empty string: corpus (the corpus
      package name), corpus_version, verifier (the verifier package name) and
      verifier_version. A version is one exact release in one spelling: a
      normalized PEP 440 public version (0.7.0, 1.0rc1, 0.7.0.post1, 2.0.dev3)
      or a SemVer 2.0.0 version without build metadata (1.0.0-rc.1). Leading
      zeros, spellings PEP 440 normalizes away (1.0-rc1, 1.0.0alpha), an
      epoch, a local label, build metadata and any range, operator or
      wildcard are refused. The card lists the extension once. The statement is a claim by the card's signer that a third party
      checks by running the named verifier on the named corpus; it is never a
      claim that the agent behaves well.
    check: >
      A verifier reads the extension only inside a card whose signature
      verifies under a key the card's own DID is authorised to use, refuses
      params with a missing or extra member, an empty value, a version range
      or a second listing of the extension, runs the named verifier on the
      named corpus revision when asked, and reports the card's claim as
      contradicted when that run does not reach the corpus's expected
      verdicts.
    source_path: "capabilities.extensions[] of a signed agent card, uri equal to this term's URI"
    issuers_in_production: []
    promotion_trigger: "An independently maintained agent that is not ours lists this extension in a signed card and files a crosswalk with evidence: emitted."
    why_this_registry: >
      A conformance claim in a README is unsigned and travels nowhere. Inside a
      signed card it travels with every discovery of the agent and cannot be
      dropped without breaking the card.

system_attributes:
  values:
    signature_capability:
      - classical
      - post_quantum_hybrid
      - other
    canonicalization_profile: [jcs_rfc_8785, other]
    hash_family: [sha_256, other]
    domain_separation_profile: [declared, undeclared]
  definition: >
    Four attributes every crosswalk-in system should declare together.
    domain_separation_profile is the one most easily forgotten, and the one
    whose absence is silent:
    whether signed pre-images across an implementation's different artifact
    types are tagged with distinct, per-format identifiers (so one signing key
    cannot be confused across formats), or whether all formats share one
    undifferentiated pre-image shape. Declaring canonicalization_profile alone
    is necessary but not sufficient for byte-equal signatures across two
    implementations. Two systems can both declare the same canonicalization
    profile and still fail to produce byte-identical output, because the profile
    fixes the algorithm and not the set of inputs it is applied to, so the
    interoperable input set has to be named separately.

# `crosswalk_match_types` and `crosswalk_evidence_states`: the vocabulary a
# THIRD PARTY uses when filing a crosswalk against this registry.
crosswalk_match_types:
  exact: "Same definition, same subject, same values."
  structural: "Same mechanism and same question answered, different concrete shape (e.g. a set of digests vs. one version hash)."
  partial: "Real overlap, with at least one named, material divergence recorded in the crosswalk."
  non_equivalent_similar_label: "Same or similar term name, materially different definition, a false friend. Declared explicitly so neither side is misread as claiming the other's ground."
  no_mapping: "Honest gap. The filing system does not do this; the crosswalk says so and stops."

# crosswalk_evidence_states carries exactly four members, and every key below is
# one of them. The axis exists so a filer's declaration is not read on trust: the
# promotion trigger is keyed to evidence: emitted with a resolvable source_path,
# checked by running validate_crosswalks.py against the cited URL.
#
# recomputed was added in 0.3.0 for the filer that only a verifier can be. A
# second implementation that reads other people's signed statements emits no
# field of its own, so emitted is closed to it, and before 0.3.0 its strongest
# honest filing was inferred -- the same state a filer computing a value once, on
# nothing anybody can re-run, would declare. Agreement with the reference on
# every accepted member of a pinned corpus is a stronger fact than that and it
# is checkable, so it gets its own state. It still promotes nothing: two
# verifiers agreeing shows the recompute rule reproduces, and says nothing about
# whether any issuer puts the value on the wire.
#
# This prose sits in a comment on purpose. It was a `definition:` key here until
# 2026-08-30, which made a fourth sibling that any consumer enumerating this
# mapping would read as a registered state. out_of_scope below says a verifier
# MUST reject an unregistered enum value, so the registry was publishing one.
crosswalk_evidence_states:
  emitted: "The declared value is a field in a real, signed statement a third party can fetch and read without computing or inferring anything. The ONLY state that counts toward promotion."
  inferred: "The declared value is computed by the filer from other fields, and is distinct from a value the artifact carries directly."
  asserted: "The declared value is claimed in prose (a README, a spec) with no machine-checkable artifact behind it."
  recomputed: "The filer's own independent verifier recomputes the value from statements somebody else signed, and its value equals the reference verdict on EVERY accepted member of one pinned corpus revision. The claim names that revision in corpus_digest and states the count as accepted_agreed of accepted_total, and the two numbers must be equal; agreement on fewer than all is inferred. It records that the term's recompute rule reproduces across independent implementations. It counts toward no promotion, because two verifiers agreeing is not an issuer emitting the value."

# out_of_scope: explicit non-goals, stated so a filer knows this registry
# does not contest ground it does not claim.
out_of_scope:
  - "Agent identity, reputation, or wallet-bound scoring of any kind. This registry describes claims about an execution, never a scored assessment of an actor over time."
  - "Renaming or reinterpreting a live signed envelope's own type/format field. A verifier MUST reject an unregistered enum value for a known field when the record names a registry the verifier holds or names none (meta.open_value_rule cases 1 and 2); the wire bytes of that field are never renamed by this registry."
  - "Policy thresholds. This registry's outcome_lattice term is a recomputable minimum, never a pass/fail threshold a consumer's own policy applies on top."

# reserved: terms that are not live, kept here so a decision is not silently
# re-litigated. Two routes in, and they are different states worth telling apart
# when reading a row: a term considered and explicitly declined, which was never
# proposed here, and a term that WAS proposed and reached its review-by date with
# no production issuer. The second was not declined by anyone; it simply found no
# emitter. Each row says which.
#
# Removal is the separate later step named in promotion_lifecycle. A removed term
# leaves the file entirely, so nothing below ever records one.
reserved: []
