name: pin-refresh

# Moves the family lock in version-pins.toml and the pages it holds to the newest
# releases as a pull request, and runs the workflows that support a manual run on it.
# A finished release run triggers it at once. main-protection also requires dco,
# governance, no-internal-drafts and identity-scan, which run only on pull_request
# events that a token-created pull request does not raise, so the bump waits for
# a person to merge until those four accept workflow_dispatch; there is no hourly
# run here for that reason (it would fail every hour on the merge).

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      reason:
        description: "why it runs now"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: pin-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # The action pushes with its own GH_TOKEN header; a persisted checkout
          # credential adds a second Authorization header and GitHub refuses the push
          # with HTTP 400 ("Duplicate header"), which left the family lock stale.
          persist-credentials: false
      - name: write the table download badges as static files
        run: python3 scripts/refresh-badges.py || true
        env:
          PEPY_API_KEY: ${{ secrets.PEPY_API_KEY }}
      - uses: probityai/.github/actions/pin-refresh@bfaca9ac2695e0bb5c669adaf19c7caad19761d3 # main
        with:
          ci: |
            ci.yml
          token: ${{ github.token }}
