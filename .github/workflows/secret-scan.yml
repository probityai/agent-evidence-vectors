name: secret-scan

# gitleaks over the whole history with .gitleaks.toml. The corpus is full of
# public key material, so the config allowlists those field shapes; this job
# keeps a real credential shape from landing, and keeps a consumer that vendors
# these files from inheriting findings we have not looked at.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install gitleaks 8.30.1 (pinned by hash)
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: scan the full history
        run: ./gitleaks git --config .gitleaks.toml --no-banner --redact .
