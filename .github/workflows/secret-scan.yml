name: secret-scan

# gitleaks over the history of the commit under test with .gitleaks.toml. The
# corpus is full of public key material, so the config allowlists those field
# shapes; this job keeps a real credential shape from landing, and keeps a
# consumer that vendors these files from inheriting findings we have not looked
# at. The scan reads the history reachable from the checked-out commit only: the
# checkout fetches every branch, and gitleaks defaults to all of them, so one open
# branch holding a finding failed this job on main and on every other branch.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install gitleaks 8.30.1 (pinned by hash)
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: scan the history of this commit
        run: ./gitleaks git --config .gitleaks.toml --no-banner --redact --log-opts=HEAD .
      - name: prove the scan ignores other branches
        env:
          GITLEAKS: ${{ github.workspace }}/gitleaks
        run: |
          python3 -m pip install pytest==8.4.2
          python3 -m pytest -q scripts/secret-scan-scope-test.py
