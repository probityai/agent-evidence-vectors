name: secret-scan

# gitleaks over the history of the commit under test with .gitleaks.toml. The
# corpus is full of public key material, so the config allowlists those field
# shapes; this job keeps a real credential shape from landing, and keeps a
# consumer that vendors these files from inheriting findings we have not looked
# at. scripts/secret-scan.sh pins gitleaks 8.30.1 by hash and is the same command
# the pre-push hook runs. It reads the history reachable from the checked-out
# commit only: the checkout fetches every branch, and gitleaks defaults to all of
# them, so one open branch holding a finding failed this job on main and on every
# other branch.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: scan the history of this commit
        run: scripts/secret-scan.sh
      - name: prove the scan ignores other branches
        run: |
          python3 -m pip install pytest==8.4.2
          python3 -m pytest -q scripts/secret-scan-scope-test.py
