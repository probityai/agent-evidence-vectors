name: secret-scan

# gitleaks over the whole history with .gitleaks.toml. The corpus is full of
# public key material, so the config allowlists those field shapes; this job
# keeps a real credential shape from landing, and keeps a consumer that vendors
# these files from inheriting findings we have not looked at.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install gitleaks 8.28.0 (pinned by hash)
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: scan the full history
        run: ./gitleaks git --config .gitleaks.toml --no-banner --redact .
