name: governance

# The change process, checked rather than described.
#
# GOVERNANCE.md and CONTRIBUTING.md make commitments to anyone deciding whether
# to cite this suite: a published revision is never mutated, an objection gets a
# published disposition with a reason, a partial resolution states its residual.
# Prose making a commitment is a promise; a gate refusing the change that breaks
# it is a process. This workflow is the second thing.
#
# It is a separate workflow rather than another step in ci.yml because its
# subject is separate: ci.yml asks whether the corpus and the rails are correct,
# and this asks whether the record of how they got that way is honest. The two
# fail for unrelated reasons and a reader of a red run should be able to tell
# which question failed without opening the log.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dispositions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7

      - name: sync toolchain
        run: uv sync --extra dev

      # Type-checked here rather than in ci.yml's mypy step because these two
      # files arrived with this workflow and the check travels with the thing it
      # checks. Same settings: pyproject.toml carries strict = true.
      - name: mypy --strict
        run: uv run mypy scripts/dispositions-gate.py scripts/dispositions-gate-test.py

      # Every row resolves against a primary record this repository already
      # carries -- a revision the changelog names, vectors the manifest holds, a
      # phrase still present in the file the row attributes it to -- and the
      # published table is the one the ledger renders. The step name carries no
      # count of the rows on purpose: the gate prints its own tally by
      # resolution, which is the one derived source for that number, and a
      # figure typed here would be a copy of it that nothing invalidates.
      - name: every published disposition resolves against the record
        run: python3 scripts/dispositions-gate.py

      # The gate's own cases, which are mostly refusals, plus a control that
      # requires the unmutated staged copy to PASS. Without the control every
      # refusal could be a staging bug; without the refusals a green run would
      # be compatible with a gate that enforces nothing, which this repository
      # has shipped before.
      - name: the disposition gate can fail
        run: python3 scripts/dispositions-gate-test.py
