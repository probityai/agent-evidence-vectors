name: A2A provisional S3 retained-field gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'interop/a2a-s3-retain-2026-10-01/**'
      - '.github/workflows/a2a-s3-retain.yml'
  pull_request:
    branches: [main]
    paths:
      - 'interop/a2a-s3-retain-2026-10-01/**'
      - '.github/workflows/a2a-s3-retain.yml'

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: interop/a2a-s3-retain-2026-10-01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install bounded runner and test dependencies
        run: python -m pip install -r requirements.txt
      - name: Exercise native signatures and adverse inputs
        env:
          PYTHONPATH: .
        run: python -m pytest -q
      - name: Recompute and retain source-pinned result
        run: python run_regression.py > run-report.json
      - name: Retain result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a2a-s3-retain-report
          path: interop/a2a-s3-retain-2026-10-01/run-report.json
          if-no-files-found: error
          retention-days: 14
