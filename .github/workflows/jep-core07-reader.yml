name: JEP Core 0.7 reader

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['interop/jep-core07-reader/**', '.github/workflows/jep-core07-reader.yml']
  push:
    branches: [main, feat/jep-core07-reader-2026-10-02]
    paths: ['interop/jep-core07-reader/**', '.github/workflows/jep-core07-reader.yml']

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.15'
      - name: Install reader and test dependencies
        run: python -m pip install -r interop/jep-core07-reader/requirements.txt pytest==8.4.2 hypothesis==6.168.3
      - name: Test signatures and acceptance refusals
        run: python -m pytest -q interop/jep-core07-reader/test_jep_reader.py
      - name: Retain fresh 25/4/8 assertion execution
        env:
          READER_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python interop/jep-core07-reader/run.py
          --upstream interop/jep-core07-reader/upstream
          --output .build/jep-core07-result
          --reader-revision "${READER_REVISION:-$(git rev-parse HEAD)}"
      - name: Retain complete exchanges and committed synthetic state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jep-core07-reader
          path: .build/jep-core07-result
          if-no-files-found: error
          retention-days: 90
