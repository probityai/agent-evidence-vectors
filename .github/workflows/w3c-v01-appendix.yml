name: W3C v0.1 paper appendix reruns

# Reruns every row of the results-to-inputs table for the W3C Agent Conformance
# CG's v0.1 reporting-format paper from its pins, and fails when a posted
# digest does not come out. interop/w3c-v01-appendix/README.md has the table.
# The weekly run catches a pin that stops resolving upstream.

on:
  workflow_dispatch:
  schedule:
    - cron: '35 5 * * 1'
  push:
    branches: [main]
    paths:
      - 'interop/w3c-v01-appendix/**'
      - '.github/workflows/w3c-v01-appendix.yml'
  pull_request:
    branches: [main]
    paths:
      - 'interop/w3c-v01-appendix/**'
      - '.github/workflows/w3c-v01-appendix.yml'

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.13'
      - name: Refusal paths
        working-directory: interop/w3c-v01-appendix
        run: uv run --no-project --with pytest==9.1.1 python -m pytest -q tests

  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # R14 reads the reports R1, R2, R4 and R5 write, so its job reruns those too.
        rows:
          - 'R1'
          - 'R2'
          - 'R3'
          - 'R4'
          - 'R4-driver'
          - 'R5'
          - 'R6'
          - 'R7'
          - 'R8'
          - 'R9'
          - 'R10'
          - 'R11'
          - 'R12'
          - 'R13'
          - 'R1 R2 R4 R5 R14'
          - 'R15'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.rows == 'R10'
        with:
          go-version: '1.26'
          cache: false
      - name: Rerun from pins
        run: uv run --no-project python interop/w3c-v01-appendix/rerun.py ${{ matrix.rows }} --work "$RUNNER_TEMP/w3c" --results results
      - name: Show results
        if: always()
        run: for f in results/*.json; do echo "== $f"; cat "$f"; done
      - name: Retain results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: w3c-v01-appendix-${{ strategy.job-index }}
          path: results/
          if-no-files-found: error
          retention-days: 90
