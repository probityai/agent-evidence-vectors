name: observed invocation binding candidate

on:
  # Not a required check, so a workflow-level path filter is safe. The paths are
  # everything the generator, the test, the original reader and the Go reader open.
  pull_request:
    paths:
      - interop/observed-invocation-binding-candidate/**
      - corpora/vectors-observed-effect/**
      - observedeffect/**
      - packaging/**
      - spec/**
      - go.mod
      - go.work
      - go.work.sum
      - pyproject.toml
      - uv.lock
      - .github/workflows/observed-invocation-binding.yml
  push:
    branches: [main]
    paths:
      - interop/observed-invocation-binding-candidate/**
      - corpora/vectors-observed-effect/**
      - observedeffect/**
      - packaging/**
      - spec/**
      - go.mod
      - go.work
      - go.work.sum
      - pyproject.toml
      - uv.lock
      - .github/workflows/observed-invocation-binding.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same pull request or branch supersedes the older run.
  # Main and tags never cancel: each main push keeps its own group by sha.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')) }}

jobs:
  invocation-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - name: Install candidate test dependencies
        run: python -m pip install -r interop/observed-invocation-binding-candidate/requirements-test.txt
      - name: Rebuild only candidate fixtures
        run: |
          python interop/observed-invocation-binding-candidate/generate.py
          git diff --exit-code -- interop/observed-invocation-binding-candidate
      - name: Check syntax, joins, signatures and unchanged released outcomes
        run: python -m pytest interop/observed-invocation-binding-candidate/test_invocation_binding.py -q
      - name: Original reader and every mutation rule
        run: |
          python corpora/vectors-observed-effect/check_vectors.py
          python corpora/vectors-observed-effect/mutation_check.py
      - name: Go reader and candidate mutation controls
        env:
          GOWORK: 'off'
        run: go test ./observedeffect -count=1
