# Moved from site/.github/workflows/discovery-capture.yml when the package was imported;
# its steps run from site.
name: discovery-capture

on:
  push:
    paths: ['site/**', '.github/workflows/site-discovery-capture.yml']
    branches: [main]
  pull_request:
    paths: ['site/**', '.github/workflows/site-discovery-capture.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: site

jobs:
  synthetic-custody-controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the declared local test dependencies
        run: python3 -m pip install -r requirements/discoverability-test.txt coverage==7.13.4
      - name: Check private capture, crash recovery and public export boundaries
        run: |
          python3 -m coverage run --include='tools/discovery_capture*.py' -m pytest -q \
            tests/test_discovery_capture.py tests/test_discovery_capture_v2.py \
            tests/test_discovery_capture_recovery.py
          python3 -m coverage json -o discovery-capture-coverage.json
          python3 -c 'import json; r=json.load(open("discovery-capture-coverage.json")); expected={"tools/discovery_capture.py","tools/discovery_capture_journal.py","tools/discovery_capture_v2.py","tools/discovery_capture_recovery.py"}; assert set(r["files"]) == expected; assert all(v["summary"]["percent_covered"] >= 80 for v in r["files"].values())'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: discovery-capture-coverage
          path: site/discovery-capture-coverage.json
          if-no-files-found: error
