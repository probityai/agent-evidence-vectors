  trace_acta_receipts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python:
        - 3.13.15
        - 3.14.7
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
    - name: Retain and check the immutable upstream verifier
      run: |
        set -euo pipefail
        mkdir -p .build
        capture=$(mktemp -d .build/trace-acta-receipts.XXXXXXXX)
        echo "TRACE_CAPTURE_DIR=$capture" >> "$GITHUB_ENV"
        curl --fail --location --proto '=https' --max-time 60 \
          --dump-header "$capture/source-http-headers.txt" \
          'https://raw.githubusercontent.com/agentrust-io/trace-spec/b938790f7f46d3a943c76a5360d2de60bb72112c/tools/acta_receipt_verifier.py' \
          --output "$capture/acta_receipt_verifier.py" \
          2> "$capture/source-fetch.stderr"
        printf '%s  %s\n' \
          44fd005825432c1179d4722f7439f1225b45fde6f36e827e911aa64f88bc5349 \
          "$capture/acta_receipt_verifier.py" > "$capture/source.sha256"
        sha256sum --check "$capture/source.sha256" | tee "$capture/source-check.txt"
    - name: Run the repository corpus against the upstream reader
      run: |
        set -euo pipefail
        uv run --locked --extra dev python --version > "$TRACE_CAPTURE_DIR/python-version.txt"
        status=0
        uv run --locked --extra dev python packaging/run_vectors.py \
          --corpus vectors-receipt-signature \
          --verifier "python3 $TRACE_CAPTURE_DIR/acta_receipt_verifier.py" \
          --report "$TRACE_CAPTURE_DIR/report.json" \
          > "$TRACE_CAPTURE_DIR/harness.stdout" 2> "$TRACE_CAPTURE_DIR/harness.stderr" || status=$?
        # Exit 1 means the harness judged at least one member as failing, which is the
        # recorded answer below; any other status means it did not run the comparison.
        test "$status" -le 1
        uv run --locked --extra dev python interop/trace-acta-receipts/check_report.py \
          "$TRACE_CAPTURE_DIR/report.json"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: trace-acta-receipts-${{ matrix.python }}-${{ github.run_attempt }}
        path: ${{ env.TRACE_CAPTURE_DIR }}
        include-hidden-files: true
        if-no-files-found: error
    needs:
    - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['trace_acta_receipts'] }}
    permissions:
      contents: read
