  # from a2a-s3-retain.yml:
  #  A newer push to the same pull request or branch supersedes the older run.
  #  Main and tags never cancel: each main push keeps its own group by sha.
  a2a_s3_retain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: interop/a2a-s3-retain-2026-10-01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install bounded runner and test dependencies
        run: python -m pip install -r requirements.txt
      - name: Exercise native signatures and adverse inputs
        env:
          PYTHONPATH: .
        run: python -m pytest -q
      - name: Recompute and retain source-pinned result
        run: python run_regression.py > run-report.json
      - name: Retain result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a2a-s3-retain-report
          path: interop/a2a-s3-retain-2026-10-01/run-report.json
          if-no-files-found: error
          retention-days: 14
    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['a2a_s3_retain'] }}
    permissions:
      contents: read

  # from a2a-s4-dual-name.yml:
  #  A newer push to the same pull request or branch supersedes the older run.
  #  Main and tags never cancel: each main push keeps its own group by sha.
  a2a_s4_dual_name:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: interop/a2a-s4-dual-name-2026-10-02
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install selected regression dependencies
        run: python -m pip install -r ../a2a-s3-retain-2026-10-01/requirements.txt
      - name: Test alias and signature controls
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests
      - name: Recompute both native readings
        run: python run_dual_name.py > fresh-report.json
      - name: Retain report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: a2a-s4-dual-name-report
          path: interop/a2a-s4-dual-name-2026-10-02/fresh-report.json
          if-no-files-found: error
          retention-days: 90
    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['a2a_s4_dual_name'] }}
    permissions:
      contents: read

  # from aae-verdict-binding.yml:
  #  A newer push to the same pull request or branch supersedes the older run.
  #  Main and tags never cancel: each main push keeps its own group by sha.
  aae_verdict_binding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.13'
      - name: Set fresh report destination
        run: printf 'AAE_BINDING_ATTEMPT=%s/aae-verdict-binding-attempt\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install locked development dependencies
        run: uv sync --locked --extra dev
      - name: Lint the package
        run: uv run ruff check interop/aae-verdict-binding-v1
      - name: Test kernel, binding, pins and refusal paths
        run: uv run python -m pytest interop/aae-verdict-binding-v1 -q
      - name: Reproduce the vectors and run every binding case
        run: uv run python interop/aae-verdict-binding-v1/run_binding.py --output-dir "$AAE_BINDING_ATTEMPT"
      - name: Require the report and check pinned outcomes
        run: uv run python interop/aae-verdict-binding-v1/check_report.py "$AAE_BINDING_ATTEMPT/report.json"
      - name: Retain measured report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aae-verdict-binding-report
          path: ${{ runner.temp }}/aae-verdict-binding-attempt/report.json
          if-no-files-found: error
          retention-days: 30
    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['aae_verdict_binding'] }}
    permissions:
      contents: read

  # from acs-outage.yml:
  #  A newer push to the same pull request or branch supersedes the older run.
  #  Main and tags never cancel: each main push keeps its own group by sha.
  acs_outage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.15'
      - name: Install pinned control dependencies
        run: python -m pip install pytest==8.4.2
      - name: The committed corpus is what the builder writes
        run: python scripts/acs-outage-build.py --check
      - name: Test every expected answer, refusal and rule kill
        run: python -m pytest -q scripts/acs-outage-test.py
      - name: Retain the checkout run
        working-directory: packaging
        run: >-
          python -m agent_evidence_vectors.acs_outage.run
          --output ../.build/acs-outage/checkout
          --implementation-revision "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Run the installed entry point from the built wheel alone
        run: |
          python -m pip install build==1.3.0
          python -m build --wheel --outdir .build/dist
          python -m venv .build/wheel-venv
          .build/wheel-venv/bin/python -m pip install .build/dist/*.whl
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.build/wheel-venv/bin/agent-evidence-vectors-acs-outage" \
            --output "$GITHUB_WORKSPACE/.build/acs-outage/wheel"
          grep -q '"implementation_revision": "agent-evidence-vectors==' \
            "$GITHUB_WORKSPACE/.build/acs-outage/wheel/report.json"
      - name: Retain the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acs-outage
          path: .build/acs-outage
          if-no-files-found: error
          retention-days: 90
    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['acs_outage'] }}
    permissions:
      contents: read

  # from action-tuple-framed.yml:
  #  A newer push to the same pull request or branch supersedes the older run.
  #  Main and tags never cancel: each main push keeps its own group by sha.
  action_tuple_framed:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test fixed bytes and actual process refusals
        run: python -m unittest discover -s interop/action-tuple-framed-v1 -p 'test_*.py' -v
      - name: Run selected candidate corpus with a fresh report
        shell: bash
        run: |
          python interop/action-tuple-framed-v1/reader.py corpus interop/action-tuple-framed-v1/MANIFEST.json \
            --manifest-sha256 0a81393d3e9af4e5ef020a7325a0d7c51196506f83292064ec17c6676f1446f1 \
            --output-dir "${{ runner.temp }}/action-tuple-first-attempt"
      - name: Retain the per-case result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: action-tuple-${{ matrix.os }}-${{ matrix.python-version }}
          path: ${{ runner.temp }}/action-tuple-first-attempt/report.json
          if-no-files-found: error
          retention-days: 30
    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['action_tuple_framed'] }}
    permissions:
      contents: read

  # from agentavow-signed-map.yml:
  #  A newer push to the same pull request or branch supersedes the older run.
  #  Main and tags never cancel: each main push keeps its own group by sha.
  agentavow_signed_map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: interop/agentavow-signed-map-v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install selected regression dependencies
        run: python -m pip install -r ../a2a-s3-retain-2026-10-01/requirements.txt
      - name: Shared-source lock is current
        run: python lock_sources.py --check
      - name: Exercise signed-map and mutation controls
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests
      - name: Fetch one selected native packet
        run: python fetch_fixture.py --output "$RUNNER_TEMP/agentavow-native-packet.json"
      - name: Recompute native packet result
        run: python run_agentavow.py --fixture "$RUNNER_TEMP/agentavow-native-packet.json" > fresh-report.json
      - name: Retain fresh report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: agentavow-signed-map-report
          path: interop/agentavow-signed-map-v1/fresh-report.json
          if-no-files-found: error
          retention-days: 90
    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['agentavow_signed_map'] }}
    permissions:
      contents: read

  # from agentid-action-ref-v2.yml:
  #  A newer push to the same pull request or branch supersedes the older run.
  #  Main and tags never cancel: each main push keeps its own group by sha.
  agentid_action_ref_v2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Set fresh report destination
        run: printf 'ACTION_REF_ATTEMPT=%s/action-ref-v2-attempt\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install locked development dependencies
        run: uv sync --locked --extra dev
      - name: Check reader and refusal paths
        run: |
          uv run ruff check interop/agentid-action-ref-v2
          uv run ruff format --check interop/agentid-action-ref-v2
          uv run python -m pytest interop/agentid-action-ref-v2/test_reader.py -q
      - name: Recompute the pinned vectors and domain cases
        run: uv run python interop/agentid-action-ref-v2/reader.py --output-dir "$ACTION_REF_ATTEMPT"
      - name: Retain measured report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentid-action-ref-v2-report
          path: ${{ runner.temp }}/action-ref-v2-attempt/report.json
          if-no-files-found: error
          retention-days: 30
    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['agentid_action_ref_v2'] }}
    permissions:
      contents: read

  # from agentid-offline.yml:
  #  A newer push to the same pull request or branch supersedes the older run.
  #  Main and tags never cancel: each main push keeps its own group by sha.
  agentid_offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Set fresh report destination
        run: printf 'AGENTID_ATTEMPT=%s/agentid-offline-attempt\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install locked development dependencies
        run: uv sync --locked --extra dev
      - name: Check reader and refusal paths
        run: |
          uv run ruff check interop/agentid-offline
          uv run python -m pytest interop/agentid-offline/test_reader.py -q
      - name: Produce a fresh offline report
        run: |
          uv run python interop/agentid-offline/run.py \
            --attestation interop/agentid-offline/fixtures/positive.raw.json \
            --request interop/agentid-offline/fixtures/request.json \
            --jwks interop/agentid-offline/fixtures/jwks.json \
            --output-dir "$AGENTID_ATTEMPT"
      - name: Require report and check pinned outcomes
        run: uv run python interop/agentid-offline/check_result.py "$AGENTID_ATTEMPT/report.json"
      - name: Retain measured report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentid-offline-report
          path: ${{ runner.temp }}/agentid-offline-attempt/report.json
          if-no-files-found: error
          retention-days: 30
    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['agentid_offline'] }}
    permissions:
      contents: read

  # from agmi-anchored-chain.yml:
  #  Runs vectors-anchored-chain from this checkout through agmi's own
  #  anchored-record-chain/v1 verifier (tech4biz-yasha/agent-memory-integrity,
  #  agmi/anchored_chain.py), pinned by commit in
  #  interop/agmi-anchored-chain/requirements.txt. agmi runs the published corpus
  #  the other way round: agent-evidence-vectors==0.18.1 in its vectors extra and a
  #  corpus-drift job in its scorecard workflow. A change here that moves a verdict
  #  agmi's verifier disagrees with fails this check before it ships.
  #  Weekly, Wednesday 07:23 UTC: catches drift in the runner image, not in the pins.
  #  A newer push to the same pull request or branch supersedes the older run.
  #  Main and tags never cancel: each main push keeps its own group by sha.
  agmi_anchored_chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install this checkout and the pinned agmi verifier
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps .
          python -m pip install -r interop/agmi-anchored-chain/requirements.txt
      - name: Replay vectors-anchored-chain through agmi
        working-directory: ${{ runner.temp }}
        run: |
          agent-evidence-vectors --corpus vectors-anchored-chain \
            --verifier "python -m agmi.anchored_chain" \
            --report "$RUNNER_TEMP/agmi-anchored-chain-report.json"
      - name: Retain the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: agmi-anchored-chain-report
          path: ${{ runner.temp }}/agmi-anchored-chain-report.json
          if-no-files-found: error
          retention-days: 90
    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['agmi_anchored_chain'] }}
    permissions:
      contents: read

  # from airgap-bundle.yml:
  #  A newer push to the same pull request or branch supersedes the older run.
  #  Main and tags never cancel: each main push keeps its own group by sha.
  airgap_bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.15'
      - name: Install pinned test dependency
        run: python -m pip install pytest==8.4.2
      - name: Build, verify and install a bundle with every network route dead
        run: python -m pytest -q scripts/airgap-bundle-test.py
      - name: Build a bundle of the pinned release and install it offline
        run: |
          python scripts/airgap-bundle.py build --lock release/airgap/requirements.lock \
            --release-dir release --out "$RUNNER_TEMP/aev-airgap"
          python scripts/airgap-bundle.py verify "$RUNNER_TEMP/aev-airgap"
          env HTTP_PROXY=http://127.0.0.1:9 HTTPS_PROXY=http://127.0.0.1:9 \
            PIP_INDEX_URL=http://127.0.0.1:9/simple PYTHON="$(command -v python)" \
            sh "$RUNNER_TEMP/aev-airgap/install.sh" "$RUNNER_TEMP/aev-venv"
          "$RUNNER_TEMP/aev-venv/bin/agent-evidence-vectors" --list-corpora | grep -qx vectors
    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['airgap_bundle'] }}
    permissions:
      contents: read

  # from aps-jcs.yml:
  #  A newer push to the same pull request or branch supersedes the older run.
  #  Main and tags never cancel: each main push keeps its own group by sha.
  aps_jcs:
    name: APS receipt and JCS (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Check out the comparison
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check out the APS source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: agent-passport-system/agent-passport-system
          ref: 646490a834e1eca4aad230033502b73f3b5cd9d1
          path: source/aps
          persist-credentials: false

      - name: Check out the corpus and native admission source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: probityai/jcs-admit
          ref: ecc8b5ef4b380a2fe38e5079d128307a1c702717
          path: source/jcs-admit
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Check execution attribution
        run: node --test interop/aps-jcs/provenance.test.mjs

      - name: Install the locked APS dependencies
        working-directory: source/aps
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build the pinned native admission probe
        run: |
          set -euo pipefail
          mkdir -p retained
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 build --locked --manifest-path interop/aps-jcs/runner/Cargo.toml 2>&1 | tee retained/native-build.log
          cargo +1.90.0 --version > retained/cargo-version.txt
          rustc +1.90.0 --version > retained/rustc-version.txt

      - name: Run the APS native JCS and serialized receipt tests
        working-directory: source/aps
        run: |
          set -euo pipefail
          node --import ./node_modules/tsx/dist/loader.mjs --test tests/canonical-jcs.test.ts tests/canonical-jcs-lone-surrogate.test.ts tests/receipt-core-serialized.test.ts 2>&1 | tee ../../retained/aps-native-tests.log

      - name: Compare the original raw bytes and signed receipts
        run: |
          set -euo pipefail
          node --import ./source/aps/node_modules/tsx/dist/loader.mjs interop/aps-jcs/check.mjs \
            --aps source/aps --jcs source/jcs-admit \
            --rust-bin interop/aps-jcs/runner/target/debug/probity-aps-jcs-probe \
            --output retained/comparison.json 2>&1 | tee retained/comparison.log
          node --import ./source/aps/node_modules/tsx/dist/loader.mjs interop/aps-jcs/check.mjs \
            --aps source/aps --jcs source/jcs-admit --candidate true \
            --rust-bin interop/aps-jcs/runner/target/debug/probity-aps-jcs-probe \
            --output retained/candidate-comparison.json 2>&1 | tee retained/candidate-comparison.log
          sha256sum retained/* > retained/SHA256SUMS

      - name: Retain reports and native logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: aps-jcs-node-${{ matrix.node }}
          path: retained/
          if-no-files-found: error
    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['aps_jcs'] }}
    permissions:
      contents: read

  # from building-effect.yml:
  #  A newer push to the same pull request or branch supersedes the older run.
  #  Main and tags never cancel: each main push keeps its own group by sha.
  building_effect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.15'
      - name: Install pinned control dependencies
        run: python -m pip install pytest==8.4.2
      - name: The committed corpus is what the builder writes
        run: python scripts/building-effect-build.py --check
      - name: Test every expected answer, refusal and rule kill
        run: python -m pytest -q scripts/building-effect-test.py
      - name: Retain the checkout run
        working-directory: packaging
        run: >-
          python -m agent_evidence_vectors.building_effect.run
          --output ../.build/building-effect/checkout
          --implementation-revision "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Run the installed entry point from the built wheel alone
        run: |
          python -m pip install build==1.3.0
          python -m build --wheel --outdir .build/dist
          python -m venv .build/wheel-venv
          .build/wheel-venv/bin/python -m pip install .build/dist/*.whl
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.build/wheel-venv/bin/agent-evidence-vectors-building-effect" \
            --output "$GITHUB_WORKSPACE/.build/building-effect/wheel"
          grep -q '"implementation_revision": "agent-evidence-vectors==' \
            "$GITHUB_WORKSPACE/.build/building-effect/wheel/report.json"
      - name: Retain the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: building-effect
          path: .build/building-effect
          if-no-files-found: error
          retention-days: 90
    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['building_effect'] }}
    permissions:
      contents: read

  # from ccs-draft10-reader.yml:
  #  A newer push to the same pull request or branch supersedes the older run.
  #  Main and tags never cancel: each main push keeps its own group by sha.
  ccs_draft10_reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: install the Rust toolchain the jcs-admit cross-check builds with
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          echo "RUSTUP_TOOLCHAIN=1.90.0" >> "$GITHUB_ENV"
      - name: install the pinned reader dependencies
        run: python -m pip install -r interop/ccs-draft10-reader/requirements.txt ruff==0.16.0
      - name: lint the reader
        run: ruff check interop/ccs-draft10-reader
      - name: rerun the reader twice and compare every output with the committed results
        run: python -m pytest -q interop/ccs-draft10-reader/test_ccs_reader.py
    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['ccs_draft10_reader'] }}
    permissions:
      contents: read

  # from ci.yml:
  #  The conformance suite is two Go modules (the stdlib-only core `aee/` plus the
  #  go-witness attestor `witnessattestor/`, workspace-linked by go.work) and a
  #  Python vector-generator + differential harness. CI runs the same gate the
  #  repo is developed against: build, vet, format, race-test, and lint every Go
  #  package; type-check and lint the Python; and replay all vectors on the Python
  #  rail. Nothing here needs the repository to be public.
  #  Bot-token merges suppress push events; allow the native jobs on exact main.
  #  A newer push to the same pull request or branch supersedes the older run.
  #  Main and tags never cancel: each main push keeps its own group by sha.
  ci__release-integrity:
    runs-on: ubuntu-latest
    env:
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.13'
      - name: install the pinned signature verifier
        run: |
          set -euo pipefail
          [ "$(uname -m)" = x86_64 ]
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
          mkdir -p "$RUNNER_TEMP/cosign-bin"
          binary="$RUNNER_TEMP/cosign-bin/cosign"
          curl --retry 5 --retry-delay 5 --retry-all-errors --fail --location --silent --show-error \
            https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64 \
            --output "$binary"
          printf '%s  %s\n' 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71 "$binary" | sha256sum --check -
          chmod 0755 "$binary"
          echo "$RUNNER_TEMP/cosign-bin" >> "$GITHUB_PATH"
      - name: sync the owning Python environment
        run: uv sync --locked --extra dev --extra generators
      - name: release controls use transient fixture keys and real refusals
        run: |
          .venv/bin/python -B scripts/release-digests-test.py
          .venv/bin/python -B scripts/release-gate-test.py
      # The install release.yml's publish job runs, on every pull request, so a
      # lock pip refuses in --require-hashes mode (an unpinned transitive
      # requirement, a missing hash) fails here and never at a release.
      - name: the pinned Hugging Face command installs from its hash-locked file
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/hf-venv"
          "$RUNNER_TEMP/hf-venv/bin/python" -m pip install --quiet --require-hashes --only-binary :all: \
            -r scripts/hf-publish-requirements.txt
          "$RUNNER_TEMP/hf-venv/bin/hf" upload --help > /dev/null
          "$RUNNER_TEMP/hf-venv/bin/hf" repos tag create --help > /dev/null

    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['ci'] }}
    permissions:
      contents: read

  ci__installed-wheel:
    # The publish job's wheel replay, run before a tag can exist. Until v0.17.8
    # it ran only in release.yml, so a wheel that dropped a corpus's vendored
    # specification passed every pull request and failed at publication.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.13'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - name: build the wheel and the directory reader
        run: |
          rm -rf dist
          uv build
          go build -o "$RUNNER_TEMP/aee-verify-installed" ./cmd/aee-verify
      - name: the wheel runs from outside the checkout and replays every corpus
        run: scripts/installed-wheel-replay.sh "$(ls "$PWD"/dist/agent_evidence_vectors-*.whl)" "$RUNNER_TEMP/aee-verify-installed"
      # corpora/REGISTRY.toml declares every corpus; the packaging block of
      # pyproject.toml and corpora/README.md are written from it.
      - name: the corpus registry is valid and its derived files are current
        run: uv run --locked --extra dev python scripts/corpus-registry.py --check
      # Outside CI pins the Action's names, corpus ids, wheel paths, the signing
      # key, the digest list's line format and the Go install path. A layout
      # change that moves any of them fails here, before a release ships it.
      - name: every name and path an adopter pins still resolves, in the tree and the wheel
        run: python3 scripts/adopter-pins-test.py --wheel "$(ls "$PWD"/dist/agent_evidence_vectors-*.whl)"

    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['ci'] }}
    permissions:
      contents: read

  ci__go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - name: gofmt (no diffs)
        run: |
          unformatted=$(gofmt -l aee cmd corpusreaders observedeffect witnessattestor)
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to run on:"; echo "$unformatted"; exit 1
          fi
      - name: build
        run: |
          go build ./aee/... ./cmd/... ./corpusreaders/... ./observedeffect/...
          (cd witnessattestor && go build ./...)
      - name: vet
        run: |
          go vet ./aee/... ./cmd/... ./corpusreaders/... ./observedeffect/...
          (cd witnessattestor && go vet ./...)
      - name: test (race)
        run: |
          go test ./aee/... ./cmd/... ./corpusreaders/... ./observedeffect/... -race -count=1 -timeout 30m
          (cd witnessattestor && go test ./... -race -count=1 -timeout 30m)
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: check canonical JSON transcript bytes
        run: node corpora/jcs-byte-vectors/check.mjs
      - name: the JCS drift and depth families are generated and agree with the Python reference
        run: |
          python3 scripts/gen-jcs-drift-vectors.py --check
          python3 scripts/jcs-drift-vectors-test.py
      # These readers use the package's supported Python runtime. The
      # obligation proof also loads the reject generator to re-sign a record,
      # so this job needs its declared dependencies. The separate Python
      # job's sync cannot supply this runner.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.13'
      - name: sync the Python readers' generator dependencies
        run: uv sync --locked --extra generators
      # The README advertises cmd/aee-verify as a consumer implementation and
      # separately tells a third party how to wire a rail into the harness.
      # Nothing ran the one against the other, and the shipped CLI scored 0 of
      # 186 the first time anybody tried: its -json mode wrote indented JSON,
      # and the harness parses the last line of stdout. This step runs the real
      # corpus through the real harness against the freshly built binary. It
      # lives in this job rather than the Python one because it needs the Go
      # toolchain, and it refuses rather than skips when that toolchain is
      # absent.
      - name: the shipped CLI clears the published corpus as an external rail
        run: uv run --locked --extra generators python scripts/external-rail-gate.py scripts/forcing-gate.py scripts/forcing-gate-test.py
      # The W3C report corpus is judged by three readers: corpusreaders/w3creport.go,
      # packaging/agent_evidence_vectors/w3creport.py, and readers/w3c-report-rs,
      # a Rust reader written from the v0.1 text and the corpus with no code path
      # shared with the other two (docs/research/w3c-reader-independence.md).
      # The parity test runs here because it builds aee-verify; it also builds
      # the Rust reader, and a toolchain that is absent fails it rather than
      # skipping the third rail.
      - name: install the Rust toolchain the third W3C reader builds with
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component clippy,rustfmt
          echo "RUSTUP_TOOLCHAIN=1.90.0" >> "$GITHUB_ENV"
      - name: the Rust W3C reader is formatted, lint-clean and tested
        run: |
          cargo fmt --manifest-path readers/w3c-report-rs/Cargo.toml --check
          cargo clippy --locked --manifest-path readers/w3c-report-rs/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path readers/w3c-report-rs/Cargo.toml
      - name: the three W3C report readers print the same bytes
        run: uv run --locked --extra generators python scripts/w3c-rails-parity-test.py
      - name: the Rust reader validates the published emitter run and re-writes it byte for byte
        run: |
          cargo run --locked --release --manifest-path readers/w3c-report-rs/Cargo.toml -- \
            --report corpora/vectors-w3c-report/observed/aee-v0.12.0/report.json
      # The receipt-signature corpus is judged by a Go reader in aee-verify and a
      # Python reader in the packaged harness, and a named verifier runs through
      # the harness's contract. This holds the two readers to identical output on
      # the committed corpus and on mutated copies, and drives stub verifiers
      # through the contract so the executed count is measured, not assumed.
      - name: the two receipt-signature readers print the same bytes
        run: uv run --locked --extra generators python scripts/receipt-signature-rails-test.py
      # The delegation-lifecycle corpus is judged by corpusreaders/delegationlifecycle.go
      # in aee-verify and by packaging/agent_evidence_vectors/delegationlifecycle.py.
      # This holds the two readers to the same outcome for every case and for
      # every mutated copy of every case.
      - name: the two delegation-lifecycle readers derive the same outcomes
        run: uv run --locked --extra generators python scripts/delegation-lifecycle-rails-test.py
      # The W3C intake-criteria corpus is judged by corpusreaders/w3cintake.go in
      # aee-verify and by packaging/agent_evidence_vectors/w3cintake.py. This
      # holds the two to identical output on the corpus and on copies in which
      # one field of every member's record is removed or retyped, so the two
      # refusal sets are compared member by member.
      - name: the two W3C intake readers print the same bytes
        run: uv run --locked --extra generators python scripts/w3c-intake-parity-test.py
      # Every corpus in release/CORPUS-DIGESTS.txt is submitted as an intake
      # record under release/intake/. This runs each corpus's checker again,
      # rebuilds every record and native output, refuses any byte that differs,
      # and reads each record back with the intake checker under the repository
      # root. It needs the Go toolchain, so it lives in this job.
      - name: every derived file is what a fresh run writes (intake records, digest list, source lock)
        run: uv run --locked --extra generators python scripts/regenerate-derived.py --check
      # The derived files (digest list, intake records, shared-source lock) are
      # marked in .gitattributes; this holds that marking, the ruff layout and
      # the merge resolution that replaces hand-editing generated records.
      - name: derived files are marked, checked together and resolved by regeneration
        run: python3 scripts/regenerate-derived-test.py
      # The a2a-jcs-v01 corpus is judged by a Go reader in aee-verify and the
      # Python reader other projects import as agent_evidence_vectors.a2ajcs,
      # each with its own canonicalizer. This holds the two to the same failing
      # members on resealed mutated copies, where only a reader that recomputes
      # the bytes can see the edit, and drives the in-process conformance API
      # with correct and incorrect canonicalizers.
      - name: the two a2a-jcs readers agree and the conformance API catches a wrong canonicalizer
        run: uv run --locked --extra generators python scripts/a2a-jcs-rails-test.py

      # The step above asks whether each rail clears the corpus. It cannot ask
      # whether the two rails AGREE on a reason, because the MANIFEST declares
      # codes measured rather than normative and the reject contract grades by
      # intersecting the declared and observed code sets -- so two rails that
      # reject one statement for entirely different reasons both pass. That is
      # the right contract for a third-party rail and the wrong one for the two
      # rails in this repository, which share one code vocabulary. This step
      # drives both directly over the three empty predicate states and refuses
      # unless every outcome is identical, within each rail and between them.
      # It lives here because it builds the Go binary, and it refuses rather
      # than skips when the toolchain is absent.
      - name: both rails read the three empty predicate states identically
        run: uv run --locked --extra generators python scripts/predicate-state-gate.py

      # Each rail was measured against the corpus and neither was ever measured
      # against the other. The Go vector test asserts the Go rail's PRIMARY code
      # is in the declared set; the observed-code-closure gate pins what the
      # Python rail emits. Both looked complete, and between them a statement
      # existed that the Go rail refused and the Python rail declared VALID with
      # a result token the recompute never derives. This step replays both rails
      # over every member and refuses a verdict split outright. It lives in this
      # job because it builds the Go CLI.
      - name: the two first-party rails agree, member by member
        run: |
          set -euo pipefail
          uv run --locked --extra generators python scripts/rail-parity-gate.py --check
          uv run --locked --extra generators python scripts/rail-parity-gate-test.py

      # One binary judges every corpus in this repository. Each corpus used to
      # ship a Python runner beside its vectors, so the command a third party
      # was told to run was a different command per corpus and three of the six
      # runners were wired into no workflow at all. This step walks every
      # vectors* directory that carries a MANIFEST.json and hands each to
      # aee-verify. A directory whose suite names no reader exits non-zero and
      # is named, so a corpus can never stop being checked quietly.
      - name: one harness judges every corpus
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
          binary="$RUNNER_TEMP/aee-verify"
          go build -o "$binary" ./cmd/aee-verify
          status=0
          for dir in vectors*/ corpora/vectors*/; do
            [ -f "${dir}MANIFEST.json" ] || continue
            echo "== ${dir%/}"
            rc=0
            "$binary" "${dir%/}" || rc=$?
            case "$rc" in
              0) ;;
              # 2 is the reader saying it cannot judge this suite yet, and it says
              # so rather than reporting a corpus nothing read as clean. That is
              # only acceptable while the corpus is judged by its own checker, so
              # the absence of one is a failure here: it is the state where a
              # corpus is covered by nothing at all and every exit status still
              # looks fine.
              2)
                if [ -f "${dir}check_vectors.py" ]; then
                  # "runs in the python job" was a sentence, not a check. A corpus
                  # arrived with a checker, a mutation sweep and no step invoking
                  # either, and this branch reported it as judged while nothing
                  # judged it: the Go reader exits 2, the checker exists, and the
                  # loop said so approvingly. The claim is now verified against
                  # this file, so a corpus whose checker no step runs fails here.
                  if grep -q "${dir}check_vectors.py" .github/workflows/ci.yml; then
                    echo "   no Go reader yet; ${dir}check_vectors.py judges this corpus and a step in this workflow runs it"
                  else
                    echo "   ${dir}check_vectors.py exists and no step in this workflow runs it: judged by nothing" >&2
                    status=1
                  fi
                else
                  echo "   no Go reader and no ${dir}check_vectors.py: this corpus is judged by nothing" >&2
                  status=1
                fi
                ;;
              *) status=1 ;;
            esac
          done
          exit "$status"

      # No workflow referenced this proof at all. It had been refusing since the
      # specification was re-vendored under it -- its pinned sentence split no
      # longer matched the vendored text -- and nothing was there to hear it,
      # which is the first member of the family every silently-stopped reader
      # belongs to: a check nothing runs cannot report that it has stopped
      # applying. It lives in this job because it builds cmd/aee-verify from
      # source rather than trusting a binary beside the corpus.
      - name: every newly cited obligation is paid for by a rail that gets it wrong
        run: |
          uv run --locked --extra generators python scripts/uncited-obligations-proof.py
          uv run --locked --extra generators python scripts/uncited-obligations-proof-test.py

      - name: coverage (per-file 80% minimum)
        run: |
          go test ./aee/... ./cmd/... ./corpusreaders/... ./observedeffect/... -coverprofile=core.cov -count=1
          (cd witnessattestor && go test ./... -coverprofile=../wa.cov -count=1)
          # The aee-witness-demo command is a runnable library-mode example; its
          # attest lifecycle is covered by the attestor tests, so it is excluded.
          uv run --locked --extra generators python scripts/coverage-gate.py --threshold 80 \
            --exclude cmd/aee-witness-demo core.cov wa.cov
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./aee/... ./cmd/... ./corpusreaders/... ./observedeffect/...
          (cd witnessattestor && "$(go env GOPATH)/bin/staticcheck" ./...)
      # The accepted-complexity table in docs/architecture/DESIGN_DECISIONS.md
      # names each branch-heavy Go function and its measured complexity. This
      # gate re-measures and fails on drift. Only the Go rail runs here; the
      # same script gates the Python records in the sibling job, because the two
      # analyzers come from different toolchains. gocyclo is installed from
      # source exactly as staticcheck is above, and this job already runs a
      # python3 gate script (coverage-gate.py).
      - name: accepted-complexity table matches the source
        run: |
          # Pinned, unlike staticcheck@latest above: this tool's numeric output
          # is committed in the table, so an upstream change to how complexity
          # is counted would fail an unrelated PR. Bump deliberately, then run
          # the gate with --sync.
          go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0
          uv run --locked --extra generators python scripts/complexity-table-gate.py --rail go \
            --gocyclo "$(go env GOPATH)/bin/gocyclo"
      - name: golangci-lint (core module)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
      - name: golangci-lint (attestor module)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          working-directory: witnessattestor

    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['ci'] }}
    permissions:
      contents: read

  ci__python:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags, because the consumer-lag gate measures the
      # vendored copies against the newest release tag the DEFAULT BRANCH
      # carries -- the only corpus a rail in another repository can vendor, since
      # the vendoring script pins rails to release tags. fetch-depth 0 fetches
      # every branch and tag. A shallow checkout carries the pushed commit, no
      # origin/main and no tags, and that gate then reports that it did not run
      # rather than guessing, so the whole job would stop here.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # The package floor is 3.11 (the held-out runner workflow proves it), so
      # an unpinned sync would pick the runner's system 3.12. The development
      # environment, and the pre-push hook this job tests, require 3.13.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.13'
      - name: sync toolchain
        run: uv sync --locked --extra dev --extra generators
      - name: Install checkout wheel for distribution imports
        run: uv pip install --no-deps .
      - name: mypy --strict
        run: uv run mypy packaging/run_vectors.py packaging/agent_evidence_vectors/verdictlines.py packaging/agent_evidence_vectors/w3creport.py packaging/agent_evidence_vectors/observedeffect.py packaging/agent_evidence_vectors/auditrecord.py packaging/agent_evidence_vectors/runmetrics.py packaging/agent_evidence_vectors/contextdiscovery.py corpora/vectors-w3c-report/gen_vectors.py corpora/vectors-w3c-report/origin/derive_pairs.py scripts/w3c-rails-parity-test.py scripts/w3c-reader-differential.py scripts/w3c-report-rules-test.py scripts/json-encoding-differential-test.py packaging/agent_evidence_vectors/receiptsignature.py packaging/agent_evidence_vectors/a2ajcs.py scripts/a2a-jcs-rails-test.py packaging/agent_evidence_vectors/changeadmission.py packaging/agent_evidence_vectors/agenticprocess.py scripts/receipt-signature-rails-test.py packaging/agent_evidence_vectors/delegationlifecycle.py scripts/delegation-lifecycle-rails-test.py corpora/vectors-delegation-lifecycle/mutate.py corpora/vectors-receipt-signature/digest.py 
          corpora/vectors-receipt-signature/tools/veritasacta-verify.py scripts/gen-w3c-appendix.py vectors/reject/gen_invalid_vectors.py vectors/accept/gen_valid_vectors.py vectors/gen_manifest.py scripts/spec-drift-gate.py scripts/interpretation-registry-gate.py scripts/interpretation-registry-gate-test.py scripts/coverage-matrix-gate.py scripts/complexity-table-gate.py scripts/specpins.py scripts/spec-anchor-gate.py scripts/spec-anchor-gate-test.py scripts/code-contract-gate.py scripts/code-contract-gate-test.py scripts/receipt-verdict-codes-gate.py scripts/receipt-verdict-codes-gate-test.py scripts/offline-verify-page-test.py docs/guides/offline-verify/make_case.py docs/guides/offline-verify/summary.py scripts/consumer-lag-gate.py scripts/consumer-lag-gate-test.py scripts/independent-runs-gate.py scripts/suite-commit-gate.py scripts/suite-commit-gate-test.py scripts/condition-registry-gate.py scripts/condition-registry-gate-test.py scripts/condition-forcing-gate.py scripts/condition-forcing-gate-test.py scripts/condition-forcing-crosscheck.py scripts/condition-forcing-crosscheck-test.py 
          scripts/external-rail-gate.py scripts/predicate-state-gate.py scripts/forcing-gate.py scripts/forcing-gate-test.py scripts/countcensus.py scripts/countcensus-sparse-test.py scripts/count-gate.py scripts/count-gate-test.py scripts/distribution-gate.py scripts/distribution-gate-test.py scripts/test_doc_gate_migration.py scripts/test_site_navigation.py docs/site/build.py scripts/regenerability-gate.py scripts/mutationdiff.py scripts/accept-anchor-gate.py scripts/accept-anchor-gate-test.py scripts/liveness-probe.py scripts/liveness-probe-test.py scripts/citation-metadata-gate.py scripts/citation-metadata-gate-test.py scripts/expectation-slack-gate.py scripts/expectation-slack-gate-test.py scripts/observed-code-closure-gate.py scripts/observed-code-closure-gate-test.py scripts/uncited-crosscheck-gate.py scripts/reading-differential.py scripts/reading-differential-test.py scripts/vendor-remap-test.py scripts/vector-distinctness-gate.py scripts/vector-distinctness-gate-test.py 
          scripts/surface-leakage-gate.py scripts/surface-leakage-gate-test.py scripts/harness-output-contract-test.py scripts/stage-column-test.py scripts/starhint-test.py packaging/agent_evidence_vectors/starhint.py scripts/verifier-must-run-test.py scripts/report-provenance-test.py scripts/action-retention-test.py scripts/action-build-pin-test.py scripts/verify-release-tag.py scripts/verify-release-tag-test.py scripts/workflow-steps-gate.py scripts/workflow-steps-gate-test.py scripts/readme-lint.py scripts/readme-lint-test.py scripts/action-download-budget.py scripts/action-download-budget-test.py scripts/runner-labels-gate.py scripts/runner-labels-gate-test.py scripts/_go_selector.py scripts/go-selector-test.py scripts/_lockfile.py scripts/_lockfile-test.py scripts/manifest-revision-test.py scripts/statement-layer-test.py scripts/independent-runs-gate-test.py scripts/indeterminate-readers-test.py scripts/write-chain-replay-test.py scripts/audit-record-dating-rows-test.py 
          scripts/indeterminate-scoring-gate.py scripts/indeterminate-scoring-gate-test.py interop/action-tuple-framed-v1/reader.py packaging/agent_evidence_vectors/heldout.py scripts/heldout-runner-test.py scripts/predicate-uri-gate.py scripts/predicate-uri-gate-test.py scripts/oracle-verifier.py scripts/oracle-every-corpus-test.py packaging/agent_evidence_vectors/admission.py scripts/admission-rails-test.py packaging/agent_evidence_vectors/w3cintake.py scripts/w3c-intake-parity-test.py scripts/gen-intake-records.py scripts/badge-grants-gate.py scripts/badge-grants-gate-test.py packaging/agent_evidence_vectors/selfreportedrecord.py scripts/self-reported-record-rails-test.py packaging/agent_evidence_vectors/approvalbinding.py scripts/approval-binding-rails-test.py
      # Type-checks by DIRECTORY, which is why it sits beside the pass above
      # rather than replacing it. That one is driven from the list of files
      # written out on the line above, and a list is only accurate on the day it
      # is edited: four files had accumulated that it never named, among them
      # the runner that executes every step in this file. This one derives its
      # scope from [tool.pyright].include and refuses if any Python file in the
      # repository falls outside it, so a new script is covered by existing and
      # not by being remembered. It also refuses if it analysed fewer files than
      # the repository has -- a checker aimed at nothing reports no problems in
      # the same breath and the same exit status as a clean tree.
      #
      # A shell step and not a marketplace action, deliberately: scripts/
      # workflow-steps-gate.py runs every shell step in this directory before a
      # push, so declaring it here is what makes it run locally too. There is no
      # second place to register it and no second place to forget.
      - name: strict Gemara reader and test types
        run: uv run mypy interop/gemara-method-link
      # A separate invocation because mypy maps a file to a module by its
      # basename, and this generator shares the name gen_vectors with
      # corpora/vectors-w3c-report/gen_vectors.py in the pass above: one run that names
      # both refuses with "Duplicate module named gen_vectors". Each corpus
      # directory is a script directory, not a package, so the fix is a second
      # run, and the corpus's tests travel with its generator.
      - name: strict W3C intake generator and test types
        run: uv run mypy corpora/vectors-w3c-intake/gen_vectors.py corpora/vectors-w3c-intake/tests/test_corpus.py
      - name: type-check every python file
        run: uv run python scripts/typecheck-gate.py
      # Corpus directories are matched by glob, never listed: a new corpus is
      # linted by default and its pull request does not edit this line. A tree
      # that still fails is named under [tool.ruff] extend-exclude in
      # pyproject.toml, which only shrinks.
      - name: ruff
        run: uv run ruff check packaging vectors corpora/vectors-* scripts interop/*/
      - name: timestamp candidate custody and refusal controls
        run: python3 scripts/retain-timestamp-candidate-test.py
      - name: E2 compatibility tests in the shared development environment
        run: uv run python -m pytest -q interop/aps-priorseal-e2-2026-09-30/test_reproduction.py
      - name: WS4 prior witness candidate cases
        run: |
          PYTHONPATH=packaging uv run python interop/ws4-prior-witness-candidate/gen_fixture.py --check
          PYTHONPATH=packaging uv run python -m unittest discover -s interop/ws4-prior-witness-candidate -p 'test_profile.py'
      - name: Live MCP named-tool definition cases
        run: |
          PYTHONPATH=packaging uv run python interop/agentavow-live-mcp/build_cases.py --check
          PYTHONPATH=packaging uv run python interop/agentavow-live-mcp/run.py
          PYTHONPATH=packaging uv run python -m unittest discover -s interop/agentavow-live-mcp -p 'test_definition_pin.py'
      - name: E2 reports reproduce in the shared development environment
        run: |
          cd interop/aps-priorseal-e2-2026-09-30
          sh fetch_inputs.sh
          uv run python check_reproduction.py
      # The other half of the accepted-complexity gate. It runs here rather than
      # beside the Go half because it measures with ruff, and it measures with
      # --ignore-noqa because the marker that brings a function into
      # docs/complexity-rationales.toml is the same marker that stops the step
      # above from reporting its number.
      - name: accepted-complexity rationales match the source
        run: uv run python scripts/complexity-table-gate.py --rail python
      - name: spec/corpus non-drift gate
        run: python3 scripts/spec-drift-gate.py
      # The generators' slug-to-identifier maps. A vector is published under a
      # digest of its own bytes while its generator files the vector's anchors
      # under the slug somebody typed, so the anchor gate below cannot compare a
      # published row against the source row that records it without the
      # pairing. The maps are build intermediates and deliberately uncommitted:
      # the slug surface is label-bearing, which is what content addressing
      # removed. Each generator writes its map on every run, and both are
      # deterministic -- the regenerability gate later in this job is the check
      # that says so, which is also why running them here cannot dirty the tree.
      #
      # This runs BEFORE the anchor gate rather than being read opportunistically
      # by it. A missing map is a did-not-run, and the gate refuses on one; read
      # as an empty map instead it would resolve no row, file every vector row
      # under an owner no source has, and drop all of them into a weaker
      # whole-file question while still printing OK.
      - name: the generator identifier maps the anchor gate resolves rows through
        run: |
          python3 vectors/accept/gen_valid_vectors.py
          python3 vectors/reject/gen_invalid_vectors.py
      # Every line anchor into the specification is rewritten when the spec is
      # re-vendored, and that rewrite had never been exercised against an
      # insertion -- which is exactly what the next re-vendor carries. Its
      # failure is silent by construction: an anchor landing a few lines off its
      # subject still resolves, still passes the anchor gate, and addresses text
      # that does not carry its rule, which is the defect that gate exists to
      # refuse arrived at from the other direction.
      #
      # The test asserts the invariant rather than that the remap ran: every
      # anchor must still open and close on the words the pin ledger recorded
      # for it. It proves its own instrument first, against an identity map
      # after an insertion -- the shape a lazy remap has -- and refuses to
      # report on the real re-vendor unless that mutation went red.
      # --synthetic, and the flag is the whole point. This check has two halves.
      # The synthetic half constructs an insertion and a replacement and proves the
      # remap carries every anchor onto the same prose; it needs nothing but this
      # checkout and it is what runs here. The other half compares against the
      # PINNED upstream revision in spec/VENDOR-PIN.json, read out of a local clone
      # of the upstream fork -- which a hosted runner does not have and cannot get,
      # because the pinned revision is not on any remote yet.
      #
      # That half has therefore never run on a runner. It did not say so: it
      # printed SKIPPED and exited 0, so every green CI run has reported a pass for
      # a question nobody asked. It now REFUSES when it cannot be asked, which is
      # why it is not invoked here: a check that must refuse in CI forever is not a
      # CI check. Run it before a re-vendor, where it is the whole point:
      #
      #     python3 scripts/vendor-remap-test.py
      - name: the vendor remap keeps every anchor on its own prose
        run: python3 scripts/vendor-remap-test.py --synthetic
      # The line-number citation spelling is retired and so is its gate. What it
      # checked -- that a citation still addresses the prose it was written for,
      # not merely that it resolves to text -- is now the second half of
      # spec-drift-gate above, over `spec:<anchor-id>@<digest>` citations, and
      # spec-anchor-gate below still covers the `Lnnn` table anchors. There is no
      # step here because a gate whose population is empty by design can only
      # refuse, and a step that must refuse forever is not a check.
      # The anchor gate's own tests, which are mostly refusals for the reason
      # every other gate test here is. This one has now run green while
      # enforcing less than it claimed twice: once when resolution was the only
      # question, and once when a synchronise would refuse a citation that left
      # its subject but waved through one that merely shortened onto part of it.
      # Two of the cases also cover the empty subject set, where the old
      # collector could stop matching, the check could report zero, --sync could
      # write an empty ledger and exit zero, and every run after that was green.
      - name: spec anchor gate
        run: |
          python3 scripts/spec-anchor-gate.py
          python3 scripts/spec-anchor-gate-test.py
      # Two artifacts describe the same population of normative sentences, and
      # they are deliberately not merged: the `[[uncited]]` rows in
      # spec/READINGS.toml are the enforced ledger, each pinning a sentence
      # digest, and docs/UNCITED-OBLIGATIONS.md is the document a person reads,
      # carrying the remedy and the evidence for every sentence the sweep
      # examined including the ones a later citation closed. Merging them was
      # proposed and would have lost the closed dispositions, which are the
      # record of what the sweep achieved; keeping two copies with nothing
      # comparing them is the other failure, and this repository has hit that
      # shape often enough to name it -- two internally correct documents
      # drifting until they disagree about the size of the thing they describe.
      # This gate holds them together in both directions, and it answers a
      # parse that found nothing with its own exit code rather than with
      # agreement, because a ledger read as empty agrees with everything.
      - name: the uncited-obligation ledger and the document about it agree
        run: python3 scripts/uncited-crosscheck-gate.py
      # A named forcing vector proves a rule is EXERCISED. Only a vector whose
      # observable moves when the reading changes proves it is FORCED. The gate
      # conflated the two until a twenty-first decision -- a genuinely open
      # question, classified forced, citing five vectors measured at zero
      # verdict flips -- was injected and accepted at exit 0. The test runs the
      # same attack, so the conflation cannot return silently.
      - name: interpretation-decision registry gate
        run: |
          python3 scripts/interpretation-registry-gate.py
          python3 scripts/interpretation-registry-gate-test.py
      # A condition id is the normative link between a vector and the rule it
      # forces. Both index files pointed a reader at an id-to-spec-line table in
      # the README that has never existed in any revision, and the table that
      # does exist was generated from the ids the reject set happened to use, so
      # 17 ids were cited by live vectors and registered nowhere. This gate
      # reconciles both directions, and its own tests are mostly refusals
      # because a gate evidenced only by a green run is the shape the seven
      # documented pass-while-enforcing-nothing checks had.
      - name: condition-registry gate
        run: |
          python3 scripts/condition-registry-gate.py
          python3 scripts/condition-registry-gate-test.py
      # The failure-code contract the README states, checked against the
      # evaluator that enforces it and against the enumerated code set. It runs
      # the documented third-party response shapes through the runner rather
      # than counting codes, because the drift it exists to catch was prose
      # describing a fallback the evaluator never had.
      #
      # Its tests are new and mostly refusals, for the reason the other gates'
      # are: this one ran green for the life of the corpus while the values of an
      # indeterminate vector's declared readings -- which the runner folds into
      # that vector's expected code set -- sat outside its subject, so a failure
      # code in no registry at all could be authored, regenerate byte-identically
      # and clear a whole-corpus replay with every gate green. A gate evidenced
      # only by a green run says nothing about what it is quantified over.
      - name: failure-code contract gate
        run: |
          python3 scripts/code-contract-gate.py
          python3 scripts/code-contract-gate-test.py
      # The seven receipt verdict codes classify the failure codes above. The
      # registry is held to aee/codes.go and the manifest in both directions, so a
      # new failure code cannot land without a verdict code and a code the registry
      # does not name is refused, never defaulted.
      - name: receipt verdict-code gate
        run: |
          python3 scripts/receipt-verdict-codes-gate.py
          python3 scripts/receipt-verdict-codes-gate-test.py
      # The offline verification page must quote only commands its scripts run,
      # the registry's verdict codes and the recorded --network none transcript.
      - name: offline verification page
        run: python3 scripts/offline-verify-page-test.py
      # A reject vector is graded by intersecting the codes a rail emits with
      # the codes it declares, so a cell naming both conditions a statement
      # deliberately carries is satisfied by either one of them and forces
      # neither. The corpus owns exactly one discriminator between the narrow
      # and broad readings of the sealed existential, and it is one such cell.
      # Widening it by a word was performed and measured: the replay stayed
      # green, seven other gates exited 0, and the only vector that separates
      # the two readings had quietly stopped measuring anything. The rule was
      # already stated in two docstrings, which is where a rule the next edit
      # is free to break lives. So this gate measures the property rather than
      # the spelling of the cell -- it runs the reference rail over every
      # reject vector and refuses when more than one DECLARED code is actually
      # EMITTED -- and the vectors already in that state are frozen by
      # identifier and by the pair that overlaps, so an inherited one that
      # changes shape fails as loudly as a new one. Its test runs beside it
      # because a gate evidenced only by a green run is the defect it exists
      # to catch.
      - name: no reject expectation is satisfied by more than one emitted code
        run: |
          python3 scripts/expectation-slack-gate.py
          python3 scripts/expectation-slack-gate-test.py
      # The mirror of the step above, and the half that was missing. That one
      # refuses an expectation satisfied by too many of the codes a statement
      # emits; this one refuses a code a statement emits that no expectation
      # mentions at all. The intersection grading leaves the second kind
      # entirely unchecked: `bad-817` declared two codes and emitted four, and
      # when suiteRevision 27 moved its parent from a caught row to a
      # reconstructed one, one of the two undeclared codes changed with it and
      # nothing refused. Measured over the corpus as it then stood, nineteen
      # vectors were in that state with 24 unpinned emissions between them.
      #
      # It is a gate here rather than a rule inside the replay for one reason:
      # the replay runs over external rails, and a closure rule there would turn
      # this repository's private code vocabulary into an obligation on everyone
      # who replays the corpus. The manifest's comparisonSurface promises the
      # opposite, and README promises that a superset-emitting implementation
      # certifies against the same manifest as a single-code one. Both promises
      # survive this gate unchanged, because the gate only ever drives the
      # reference rail. Its test runs beside it and includes a case that patches
      # the rail rather than the manifest, since every manifest-only case would
      # also pass a gate that compared the manifest against nothing but itself.
      - name: the reference rail emits no code the corpus declares nowhere
        run: |
          python3 scripts/observed-code-closure-gate.py
          python3 scripts/observed-code-closure-gate-test.py
      # A verifier that rejects its input unconditionally passes every reject
      # vector ever written, and scored against a reject-only corpus it looks
      # perfect. The cure is a paired accept anchor, and the corpus said so in
      # exactly one index row while nothing checked that the property held
      # anywhere else. This gate checks it at both granularities: every reject
      # vector's parent ships as an accept vector, and the traceability gap --
      # the conditions only refusals cite -- is measured and ratcheted rather
      # than left as a caveat in prose. It also reads the two sentences that
      # publish those figures, because the count census skips them on the
      # strength of recording this gate as their owner, and an owner that never
      # opens the prose leaves the one published number in the corpus with
      # nothing behind it. Its own tests are refusals, because a gate that
      # cannot go red is the defect it exists to catch.
      - name: every refusal ships beside a vector that must be accepted
        run: |
          python3 scripts/accept-anchor-gate.py
          python3 scripts/accept-anchor-gate-test.py
      # Detector liveness, computed per channel. A check that never fires and a
      # boundary nothing reached emit the same clean run, so the vectors plant a
      # stimulus per channel and the probe recomputes, from the carried bytes,
      # which channels can show they caught it.
      #
      # The first line is the headline assertion and the second is what makes it
      # worth anything. A probe hard-wired to answer "demonstrated" would clear
      # the first line and report a live detector for a corpus of dead ones, so
      # the test switches off each arm of the construction in turn -- the planted
      # expectation, the commitment comparison, the caught row, the resolved
      # interception, the stronger attribution, the record signature and the
      # run-end seal -- and requires the affected channel to degrade to a named
      # state. It also pins every per-channel verdict the documentation
      # publishes, so prose and computation cannot drift apart.
      - name: per-channel detector liveness, and each arm of it switched off
        run: |
          uv run python scripts/liveness-probe.py --require-demonstrated \
            --key 496cbe15e391eccd3a0864f2709df0eeb4f5b6c1bad750c95cc80ee49bceae62 \
            vectors/statements/vda285efc96ac6e75.json
          uv run python scripts/liveness-probe-test.py
      - name: requirement-coverage matrix is current
        run: python3 scripts/coverage-matrix-gate.py --check
      # The suite publishes what it does NOT force, and that figure is the one an
      # outside reader is most entitled to distrust. Two projections of one
      # mutation campaign -- by rail site, and by the normative condition ids the
      # vectors cite -- were taken at two different corpus revisions and then
      # quoted side by side, which reads as two measurements disagreeing when it
      # is one measurement seen twice. The condition projection is now derived
      # from the published baseline on every run rather than recorded by hand, so
      # a corpus that moves without the figure moving fails here. Its own tests
      # are refusals, including the one that stops an unrecognised failure-code
      # identifier being resolved by nearest match, which is how a published weak
      # spot would turn into a claim of coverage.
      #
      # The last two lines are a SECOND implementation of the same three
      # definitions, sharing no code with the generator. --check compares the
      # page against what the generator would write again, which cannot see a
      # generator that read the definitions wrongly: it would write a wrong page
      # and then agree with it. The crosscheck recomputes from the manifest and
      # the baseline and reads the page's prose back, so the two disagree if
      # either is wrong. Its own tests distinguish the two exit codes, because
      # a broken input reported as a disagreement is the same class of defect.
      #
      # --without-history on the two suites, because this job checks out at
      # depth 1 and nineteen of their cases read the git objects the earlier
      # figure is pinned to. Without the flag those cases do not merely fail
      # here: a shallow clone answers exit 2 to every one of them, and four of
      # the nineteen WANT exit 2, so they would have gone green in a clone that
      # could read nothing at all. The flag runs the rest and prints how many it
      # left; the full suites run in forcing-nightly.yml, which fetches
      # everything. A default run in a clone that cannot reach the pinned
      # objects refuses rather than reporting a smaller suite as a passing one.
      - name: the published weak-spot figure follows from the forcing baseline
        run: |
          python3 scripts/condition-forcing-gate.py --check
          python3 scripts/condition-forcing-gate-test.py --without-history
          python3 scripts/condition-forcing-crosscheck.py
          python3 scripts/condition-forcing-crosscheck-test.py --without-history
      # The one column here that is not this author's work is a record of what
      # somebody else ran, so it is worth less than nothing when it is stale.
      # The sentence naming which revisions were NOT run had rotted in three
      # documents at once, each naming a different set and none naming revision
      # 4. This gate derives that set from docs/INDEPENDENT-RUNS.json and fails
      # when the published prose names anything else.
      - name: the independence column is the run ledger
        run: |
          python3 scripts/independent-runs-gate.py
          python3 scripts/independent-runs-gate-test.py
      # A run record binds itself to this corpus by commit ID, and on 2026-09-18
      # a history rewrite gave every commit a new one. Every outside record then
      # named a commit no clone carries, and the run ledger went on recording an
      # old ID for three dispatches. The API and actions/checkout both still
      # served those commits, so nothing went red. This gate asks what a fresh
      # clone would carry: the default branch and the tags, which this job
      # fetches because it checks out with full history.
      - name: every commit an outside record cites is reachable in a clone
        run: |
          python3 scripts/suite-commit-gate.py
          python3 scripts/suite-commit-gate-test.py
      # The two files that decide how this corpus is cited carried an author, an
      # address and an identifier that nothing read back. They were correct when
      # written and checked by nothing afterwards, which is indistinguishable
      # from checked until the day it is not. This gate parses both, requires
      # them to name the same people, and verifies the check digit an ORCID
      # carries -- a transposed digit is arithmetic, not something to be noticed
      # by eye.
      # It also reads the corpus size the deposit publishes. That number was
      # typed, and by the time anyone looked it named a revision the corpus had
      # left five revisions earlier -- unseen because the count gate reads .md,
      # .yml, .yaml, .py, .go and .toml, and this file is .json. Every other stale
      # count in this repository is a file edit away from right; this one mints a
      # DOI, whose metadata is permanent and is what anybody citing the corpus
      # quotes from then on.
      - name: the citation metadata parses and agrees with itself
        run: uv run --extra dev python scripts/citation-metadata-gate.py
      # And the gate is watched to go red. Each case breaks one figure in a
      # staged copy of the tree and asserts the refusal names it, because a
      # citation gate that could not refuse is the safeguard the last one was.
      - name: the citation gate refuses a wrong figure
        run: uv run --extra dev python scripts/citation-metadata-gate-test.py
      # The agent-evidence repository was merged here and archived. A live link to it
      # sends a reader to a frozen copy, so every reference outside the records
      # that exist only there, and the files the allowlist names with a reason,
      # must point at this repository. The test watches the gate go red.
      - name: no live reference to the archived agent-evidence repository
        run: python3 scripts/archived-repo-gate.py
      - name: the archived-repository gate refuses a live reference
        run: python3 scripts/archived-repo-gate-test.py
      # Two identifiers addressed one statement for as long as both existed: a
      # reject vector was byte-identical to another condition's, so a condition
      # was credited with a discriminator it did not have. The manifest carries
      # no per-vector digest, so nothing pinned vector content at all and every
      # count still added up. The suite's own weakness report could not see it
      # either, because it counts declared conditions rather than distinct
      # statements.
      #
      # It has since been widened twice, and both widenings found something. It
      # read one manifest, so the AI Agent Action corpus was outside the only
      # check asking this question, and a byte-identical accept pair had been
      # sitting in it since it shipped. And it compared bytes only, so two files
      # that differ in their bytes and decode to one statement were invisible to
      # it -- which for a pair carrying DIFFERENT labels means the corpus is
      # asking a decoding rail for two verdicts about one input, and the only
      # thing separating them is the `ok-`/`bad-` prefix in the identifier. Both
      # readings a rail can take are now asked, over both corpora, and every
      # collision has to be declared with a reason in docs/VECTOR-COLLISIONS.json
      # or the gate refuses it.
      #
      # The test runs beside the gate for the reason every other gate test in
      # this file does, and one of its cases exists specifically to catch the
      # narrowing coming back: it puts a collision in the second corpus and
      # nowhere else, so a gate rescoped to one manifest fails that case while
      # passing all the others.
      - name: no two vector identifiers address one statement
        run: |
          python3 scripts/vector-distinctness-gate.py
          python3 scripts/vector-distinctness-gate-test.py
      # Every other check in this directory asks whether one vector forces one
      # rule. This one asks the question a corpus can fail as a whole: can a
      # consumer answer it without implementing anything? A cheap classifier is
      # trained on the surface -- the tokens of the vector's whole path, the
      # file's size, the statement's shape, the member paths it carries, its
      # member names and short string values -- and asked to predict
      # accept-or-reject.
      #
      # The threshold is MEASURED rather than chosen, and getting that wrong is
      # the most useful thing this gate has done so far. It first refused above a
      # flat 0.55, on the reasoning that chance is 0.5. But the statistic is
      # folded, max(auc, 1 - auc), so it cannot go below 0.5 and ordinary
      # sampling spread lifts it above 0.5 with no signal present at all:
      # permuting the labels of the larger corpus gives a mean near 0.54 and
      # exceeds 0.585 one run in twenty. A corpus with zero leakage would have
      # failed that gate more often than it passed. Each surface is now held to
      # its OWN null, and calibrating retired four rows that had confident
      # causal explanations written against sampling noise.
      #
      # Six of the twelve measurements are genuinely outside their null and each
      # names its constraint in docs/SURFACE-LEAKAGE-BASELINE.json. The largest
      # is the identifier namespace: measured over the whole manifest-relative
      # path it is a PERFECT predictor, because the prefix and the directory each
      # name the label and either alone is enough.
      - name: the corpus is not scoreable from its surface
        run: |
          uv run python scripts/surface-leakage-gate.py
          uv run python scripts/surface-leakage-gate-test.py
      # The corpus is vendored into rails that live in other repositories, and
      # each of those checks its own copy against its own stamp. Nothing asked
      # whether the copy was current, so the refresh ran when somebody
      # remembered and twice it was not remembered. This gate makes a corpus
      # change here fail until the rails carry it, which is the only place the
      # question can be asked without one repository reading another in CI. It
      # also holds the implementation report to that ledger: the note and the
      # per-rail cells describing what the rails vendor were written at
      # suiteRevision 6 and still said so at 14, and a rail the report named
      # had no row behind it at all.
      # A historical corpus reader in vectors/gen_manifest.py used to sit beside
      # this gate, for one caller and one reason: the gate materializes the
      # DEFAULT BRANCH's tree to learn what the rails could actually have
      # vendored, and until the flattening reached that branch, that tree
      # carried the retired per-verdict layout. An expiry gate of its own
      # watched for the reason to lapse, because the obvious placement could not
      # work -- making this gate refuse a flat default branch would have made it
      # fail its own fixtures, which stage a self-contained repository from this
      # corpus and are therefore always flat.
      #
      # The flattening reached the default branch at suiteRevision 28, the
      # expiry gate turned red on the first run afterwards exactly as designed,
      # and the reader, the two-layout dispatch and the gate itself were deleted
      # together in the commit that answered it.
      - name: consumers carry the corpus the latest release publishes, and the report says so
        run: python3 scripts/consumer-lag-gate.py --check

      # Every gate above that COMPARES a committed artifact against a regenerable
      # one has a repair, and the repair is written down rather than remembered.
      # This step reads the workflow itself and refuses when a comparing gate has
      # no row in scripts/repairs.toml -- so a gate added here without one turns
      # the build red instead of leaving the next operator to work out which
      # generator to run at the moment it goes red.
      #
      # It audits and writes nothing. `python3 scripts/regen.py` with no flag is
      # the repair path, and it runs to a fixed point because the repairs are not
      # independent: regenerating one artifact can move a figure another derives.
      - name: every comparing gate declares how to repair it
        run: |
          python3 scripts/regen.py --audit
          python3 scripts/regen-test.py
      # And the gate is watched to go red, and to go red at the right moment.
      # Measured against the checked-out tree instead of the default branch it
      # refused correctly and too early: a branch adding vectors could not be
      # pushed until rails had vendored a commit no rail could fetch, and the
      # corpus could not be published because the push was refused. Measured
      # against the default branch's tip it did the same one step later: a
      # merged corpus change could not be vendored, because rails vendor release
      # tags only. Both halves of every pair below are asserted, because a gate
      # that never refuses and a gate that refuses what cannot yet be satisfied
      # are the same failure.
      - name: the lag gate refuses a real lag and only a real lag
        run: python3 scripts/consumer-lag-gate-test.py
      # The local gates refuse a second copy of themselves, and the refusal names
      # the holder. `flock` binds the open file description rather than the
      # process, so a child that inherits the descriptor keeps the lock after its
      # parent is killed, while the file still names the parent. The refusal read
      # that name and reported it as a running process without asking whether it
      # was one, so an operator who stopped the named pid found the lock still
      # held and no pid left to blame. Both directions are asserted here, because
      # the obvious repair breaks the other one: a killed holder nothing
      # inherited from must free the lock, and an inherited lock must keep
      # refusing while saying the recorded holder is gone.
      - name: the gate lock refuses only what it confirmed, and frees itself
        run: python3 scripts/_lockfile-test.py
      # A count is a derived fact with exactly one source, and every copy of it
      # in prose is a cache nothing invalidates. The copies went stale at
      # different rates until two documents here disagreed about the size of the
      # same corpus: a badge, a build note and a published crosswalk were each
      # wrong by a different amount, and the crosswalk cited the manifest it
      # disagreed with. This gate checks every published count against its
      # source, and then takes a census: a count-shaped integer that nothing
      # declares fails, so the next one typed into a new paragraph fails on the
      # push that adds it rather than on the revision that outdates it.
      # The one path a reader walks with nothing installed. It is asserted from
      # outside, in a subprocess that cannot see site-packages, because every
      # environment that runs this workflow has the generator extras and would
      # therefore pass a check that a fresh clone fails. v0.10.0 shipped exactly
      # that way.
      - name: the digest check runs with no third-party package
        run: python3 scripts/scitt-digest-isolation-test.py
      - name: every published count is derived, and no new one is hand-written
        run: |
          python3 scripts/count-gate.py
          python3 scripts/count-gate-test.py
          python3 scripts/countcensus-sparse-test.py
      - name: every corpus manifest carries counts that match its entries
        run: |
          python3 scripts/manifest-counts-gate.py
          python3 scripts/manifest-counts-gate-test.py
      - name: no path that left this repository is tracked again
        run: |
          python3 scripts/removed-paths-gate.py
          python3 scripts/removed-paths-gate-test.py
      # Keep the release recipe, corpus list and form aligned with their sources.
      - name: check distribution metadata and release recipe
        run: |
          python3 scripts/distribution-gate.py
          python3 scripts/distribution-gate-test.py
          uv run --extra dev python -m pytest -q scripts/test_doc_gate_migration.py
      # A Verified by Probity grant is re-checked against the evidence rule on
      # every run, so a revoked workflow SHA shows up before the release.
      - name: every Verified by Probity grant still meets the evidence rule
        run: |
          python3 scripts/badge-grants-gate.py
          python3 scripts/badge-grants-gate-test.py
      # The pre-push mirror runs every step of every workflow locally, and it
      # ran them under a plain bash while Actions runs them under `bash -e`.
      # A step with one command cannot tell the two apart; a step with several
      # reports only its last command's status, so a block whose first command
      # failed passed locally and failed here. It did, on the forcing step. The
      # mirror is only worth having if it agrees with this file, so the test
      # runs here rather than only in the hook it protects.
      - name: the local pre-push mirror agrees with this workflow's shell
        run: .venv/bin/python -B scripts/workflow-steps-gate-test.py
      - name: an unreadable account is inconclusive, not a refused runner label
        run: .venv/bin/python -B scripts/runner-labels-gate-test.py
      # A push must supersede its older runs, and a required check must report on
      # every pull request. The table of required checks lives in the gate.
      - name: every workflow cancels superseded runs and every required check can report
        run: |
          .venv/bin/python -B scripts/workflow-concurrency-gate.py
          .venv/bin/python -B scripts/workflow-concurrency-gate-test.py
      # The release procedure runs the leak tier locally and leaves the proof to
      # this workflow. A procedure that asks for the full local mirror of these
      # jobs ran about 15 hours on one box and held v0.30.0 back.
      - name: the release procedure runs only the leak tier locally
        run: .venv/bin/python -B scripts/release-procedure-test.py
      # One approval of one release publishes the wheel and the dataset. No
      # workflow may publish without the public-release environment or from a
      # trigger other than the release.
      - name: every publish job sits behind the approved release
        run: |
          .venv/bin/python -B scripts/publish-gate-test.py
          .venv/bin/python -B scripts/publish-gate-selftest.py
      # The README is the first screen and nothing more: what the suite is, who it
      # is for, the pinned install line, an example, the status and the links.
      # Detail lives in docs/, and this keeps it there.
      - name: the README stays one screen and every link in it resolves
        run: |
          .venv/bin/python -B scripts/readme-lint.py README.md
          .venv/bin/python -B scripts/readme-lint-test.py
      - name: the vantage grid keeps a link in every cell and every link resolves
        run: |
          python3 scripts/vantage-grid-gate.py
          python3 scripts/vantage-grid-gate-test.py
      - name: the archive every Action job downloads stays under its budget
        run: |
          python3 scripts/action-download-budget.py
          python3 scripts/action-download-budget-test.py
      - name: the install pins on the inbound pages match the published release
        run: |
          python3 scripts/sync-install-pins.py --check
          python3 scripts/sync-install-pins-test.py
      - name: the Action summary and every spec README carry the Probity bridge line
        run: python3 scripts/probity-bridge-test.py
      - name: the pool venue retains source-bound native results and refuses incomplete runs
        run: .venv/bin/python -B scripts/pre-push-pool-test.py
      - name: the pre-push hook refuses a pushed commit message the commit-msg hook never saw
        run: bash scripts/prepush-commit-msg-test.sh
      - name: the pre-push hook runs the pushed commit's own identity scanner and rules
        run: bash scripts/prepush-own-scanner-test.sh --mutate
      - name: required native providers bind real tools and refuse unsafe archives
        run: .venv/bin/python -B scripts/native-provider-test.py
      - name: setup-go selects the declared workspace file before dependent commands
        run: .venv/bin/python -B scripts/go-selector-test.py
      # Both vector indexes publish a determinism recipe saying the set
      # regenerates byte-identically from the generator beside it, and until
      # this gate nothing ran it. Seven vector files and seven manifest entries
      # were committed with no builder and no index row behind them, and the
      # tree stayed green: the harness replays the committed bytes against the
      # committed manifest, and both had been written by hand. This gate
      # regenerates everything into a copy and diffs, so a file no generator
      # produces fails on the push that adds it.
      # `uv run` since the SCITT/COSE generator joined the set this gate drives:
      # it shells each generator with sys.executable, and that corpus is built
      # with pycose, so the interpreter running the gate has to be the one the
      # `generators` extra was synced into.
      - name: every generated file regenerates byte-identically
        run: uv run python scripts/regenerability-gate.py
      - name: the regenerability gate counts only tracked files as committed
        run: uv run python scripts/regenerability-gate-test.py
      # The v0.1 report reader's rules that no corpus member can pin: a tree
      # shape outside the closed set is refused rather than hashed as another
      # shape, and each registered shape is hashed by the construction its name
      # denotes, checked against the RFC text written out independently. It also
      # runs every worked digest INDEX.md prints and every command the corpus
      # README prints, under sh, and holds each to the root or the corpusDigest
      # it states.
      - name: the v0.1 report reader's tree-shape rules
        run: python3 scripts/w3c-report-rules-test.py
      # One table of JSON documents and the bytes each digest encoding writes
      # for them, computed here from the Python implementations. The go job's
      # corpusreaders/pyjson_table_test.go holds the Go encoders to the same file, so
      # a Go encoder and its Python twin are compared over the same inputs. The
      # Go encoder once wrote the token -0 where CPython writes 0, and a list
      # participant found it by measuring both readers; this is that
      # measurement, kept.
      - name: the shared JSON encoding table holds against the Python encoders
        run: python3 scripts/json-encoding-differential-test.py
      # The corpus revision has one home, the newest heading in
      # vectors/CHANGES.md, and the manifest copies it. Before it was a field an
      # outside implementer read the suite NAME for it, because that was the only
      # suite-shaped key in the file. The two refusals matter as much as the
      # match: an unreadable changelog and one with no heading each mean the
      # revision could not be established, which is not the same as the corpus
      # having none, and a reader that answered anyway would publish that
      # ambiguity.
      - name: the manifest's suite revision is the changelog's
        run: python3 scripts/manifest-revision-test.py
      # Three members carry a Statement-layer verdict beside the AEE one: the
      # empty predicate, spelled three ways, is an invalid AEE statement and a
      # valid in-toto Statement. A verdict written into a manifest and never
      # executed is a sentence, so this runs a Statement-layer check over the
      # members that carry one and holds the recorded verdict to it, with
      # controls that refuse a check which accepts everything.
      - name: the recorded Statement-layer verdicts are the executed ones
        run: python3 scripts/statement-layer-test.py
      # Whether every corpus BEHAVES as its manifest claims is a different
      # question from whether its bytes regenerate, and it is asked once for
      # all six corpora by the "one harness judges every corpus" step in the Go
      # job. It used to be asked here, per corpus, by a Python runner that
      # shipped beside each vector set -- and only two of the six were ever
      # wired into this file, so four of them passed because somebody ran them
      # by hand on the day they landed.
      #
      # The artifact-binding tool that produces those records still has its own
      # properties to hold, and the four demonstration arms still have to reach
      # the outcomes the contract requires end to end. The last is the one an
      # outside reader runs first, so a break there fails here rather than in
      # their terminal.
      - name: the artifact-binding tool holds its properties
        run: uv run --extra dev python -m pytest tools/artifact-binding/tests -q
      - name: the four-arm demonstration reaches the contract outcomes
        run: uv run --extra artifact-binding ./demo/four-arms.sh
      # The SCITT/COSE carriage suite's own mutation check. Same question as the
      # step above and a different subject: whether a member claiming a root
      # divergence actually diverges, whether every accept member's signature
      # and inclusion proof actually verify, and whether each reject member
      # carries the specific fault it names rather than some other one.
      #
      # `uv run` and not bare `python3`, unlike its two neighbours, because this
      # corpus is COSE and CBOR is not in the standard library. The checker
      # decodes with cbor2 and verifies through pycose, both declared in the
      # `generators` extra this job already synced. A bare python3 here would
      # find neither and the step would die on an ImportError, which reads like
      # a broken corpus.
      - name: the SCITT/COSE corpus behaves as its manifest claims
        run: uv run python corpora/vectors-scitt-cose/check_vectors.py
      # The artifact-binding corpus keeps a Python checker after the other five
      # were deleted, and the reason is one check the Go reader cannot make. A
      # member already expected to fail absorbs a second fault of the same class
      # in silence, because both faults raise the same code and the member
      # identifier covers the record rather than the files the record names. The
      # generator therefore records a digest over the reference verifier's own
      # sorted message list and this checker recomputes it. That digest is
      # implementation-pinned by construction: it hashes one verifier's message
      # prose, so a second implementation cannot satisfy it without copying the
      # wording, which is why the check stayed here rather than moving into
      # corpusreaders/artifactbinding.go with the rest of the corpus's rules.
      - name: the artifact-binding corpus carries exactly the faults it names
        run: uv run --extra artifact-binding python corpora/vectors-artifact-binding/check_vectors.py
      - name: the dependency-selection corpus carries exactly the faults it names
        run: uv run --extra artifact-binding python corpora/vectors-artifact-binding/check_vectors.py corpora/vectors-dependency-selection
      # The observed-effect corpus needs the `generators` extra for the same
      # reason the SCITT one does: its reference verifier checks Ed25519
      # signatures, including the prior-commitment signature, and that is not in
      # the standard library.
      - name: the observed-effect corpus behaves as its manifest claims
        run: uv run --extra generators python corpora/vectors-observed-effect/check_vectors.py
      # Worked receipts for a sequential MCP call chain and a parallel fan-out,
      # built from the corpus's own helpers and verified by its reference
      # verifier, with two controls that must fail.
      - name: the MCP receipt examples verify and link
        run: uv run --extra generators python examples/mcp-receipts/check_examples.py
      - name: source-coverage fixtures regenerate and refuse invalid replays
        run: uv run --extra dev pytest corpora/vectors-source-coverage/tests -q
      - name: open-weight cases regenerate and force every condition
        run: uv run --extra dev pytest corpora/vectors-open-weight-art53/tests -q
      - name: anchored-chain cases regenerate and force every check
        run: uv run --extra dev pytest corpora/vectors-anchored-chain/tests -q
      - name: receipt-chain-end cases regenerate and force every check
        run: uv run --extra dev pytest corpora/vectors-receipt-chain-end/tests -q
      - name: identity-binding cases regenerate and force every check
        run: uv run --extra dev pytest corpora/vectors-identity-binding/tests -q
      - name: authority-at-dispatch cases regenerate and force every check
        run: uv run --extra dev pytest corpora/vectors-authority-at-dispatch/tests -q
      - name: approval-binding cases regenerate and force every check
        run: uv run --extra dev pytest corpora/vectors-approval-binding/tests -q
      - name: dispatch-fence cases regenerate and force every check
        run: uv run --extra dev pytest corpora/vectors-dispatch-fence/tests -q
      - name: refund-connected runs are judged from their bytes and each mutation turns the reader red
        run: uv run --extra dev pytest corpora/vectors-refund-connected/tests -q
      - name: aggregate-accounting cases regenerate and force every check
        run: uv run --extra dev pytest corpora/vectors-aggregate-accounting/tests -q
      - name: uncertain-effect cases regenerate, force every check and fail a blind retry
        run: uv run --extra dev pytest corpora/vectors-uncertain-effect/tests -q
      - name: monitor-coverage cases regenerate, force every check and refuse an inert defence
        run: uv run --extra dev pytest corpora/vectors-monitor-coverage/tests -q
      - name: signature-coverage cases regenerate, force every check and fail each naive signer
        run: uv run --extra dev pytest corpora/vectors-signature-coverage/tests -q
      - name: evidence-state cases regenerate, force every check and refuse an unmeasured silence read as clean
        run: uv run --extra dev pytest corpora/vectors-evidence-state/tests -q
      - name: incident-evidence-cell cases regenerate, force every check and refuse an empty cell labelled supported
        run: uv run --extra dev pytest corpora/vectors-incident-evidence-cell/tests -q
      - name: propagation-step cases regenerate, force every check and refuse a common cause read as propagation
        run: uv run --extra dev pytest corpora/vectors-propagation-step/tests -q
      - name: containment-journal cases regenerate, force every check and refuse a cut edge that still delivers
        run: uv run --extra dev pytest corpora/vectors-containment-journal/tests -q
      - name: decision-client cases regenerate, force every check and fail a client that reads a fault as an allow
        run: uv run --extra dev pytest corpora/vectors-decision-client-failure-modes/tests -q
      - name: refusal-reason-priority cases regenerate, force every check and refuse a checker that scores any applicable value
        run: uv run --extra dev pytest corpora/vectors-refusal-reason-priority/tests -q
      - name: agent-card-receipt cases regenerate and force every check
        run: uv run --extra dev pytest corpora/vectors-agent-card-receipt/tests -q
      - name: credential-release cases regenerate and force every check
        run: uv run --extra dev pytest corpora/vectors-credential-release/tests -q
      - name: converted-argument-binding cases regenerate and force every check
        run: uv run --extra dev pytest corpora/vectors-converted-argument-binding/tests -q
      - name: delegator-right cases regenerate and force every check
        run: uv run --extra dev pytest corpora/vectors-delegator-right/tests -q
      - name: badge-vc-verify cases regenerate and force every check
        run: uv run --extra dev pytest corpora/vectors-badge-vc-verify/tests -q
      - name: completion-confirmation cases regenerate and force every check
        run: uv run --extra dev pytest corpora/vectors-completion-confirmation/tests -q
      - name: chunked-export cases regenerate and force every check
        run: uv run --extra dev pytest corpora/vectors-chunked-export/tests -q
      - name: done corpora regenerate, are judged clean and force every rule
        run: uv run --extra dev pytest corpora/vectors-done-receipt/tests -q
      # agent-evidence-verify is the implementation the done rules come from, pinned in
      # pyproject.toml's crosscheck group. Every done member goes through it, and so
      # do its own example runs, read from the same release's sdist (checked against
      # the sha256 locked in uv.lock) and read by our reader.
      - name: the done readers agree with agent-evidence-verify on every member
        run: |
          set -euo pipefail
          verify="${RUNNER_TEMP:-$(mktemp -d)}/verify-sdist"
          mkdir -p "$verify"
          examples=$(python3 - "$verify" <<'PY'
          import hashlib, sys, tarfile, tomllib, urllib.request
          from pathlib import Path

          out = Path(sys.argv[1])
          pkg = next(p for p in tomllib.load(open("uv.lock", "rb"))["package"]
                     if p["name"] == "agent-evidence-verify")
          data = urllib.request.urlopen(pkg["sdist"]["url"], timeout=120).read()
          if "sha256:" + hashlib.sha256(data).hexdigest() != pkg["sdist"]["hash"]:
              sys.exit("the sdist does not match the hash locked in uv.lock")
          archive = out / "sdist.tar.gz"
          archive.write_bytes(data)
          root = f"agent_evidence_verify-{pkg['version']}/examples/done-receipt"
          with tarfile.open(archive) as tar:
              tar.extractall(out, members=[m for m in tar.getmembers() if m.name.startswith(root)], filter="data")
          print(out / root)
          PY
          )
          uv run --locked --extra dev --group crosscheck python corpora/vectors-done-receipt/crosscheck_probity_verify.py \
            corpora/vectors-done-contract corpora/vectors-done-receipt corpora/vectors-spoofed-tool-output \
            corpora/vectors-test-tampering corpora/vectors-grader-isolation corpora/vectors-done-probes \
            --examples "$examples"
      - name: TRACE registry anchor cases regenerate and force every check
        run: uv run --extra dev pytest corpora/vectors-trace-anchor/tests -q
      - name: vectors-agent-payment-mandate cases regenerate, agree and every rule is load-bearing
        run: |
          set -euo pipefail
          uv run --extra dev pytest corpora/vectors-agent-payment-mandate/tests -q
          uv run python corpora/vectors-agent-payment-mandate/check_vectors.py
          uv run python corpora/vectors-agent-payment-mandate/mutation_check.py
      - name: vectors-connector-scope cases regenerate, agree and every rule is load-bearing
        run: |
          set -euo pipefail
          uv run --extra dev pytest corpora/vectors-connector-scope/tests -q
          uv run python corpora/vectors-connector-scope/check_vectors.py
          uv run python corpora/vectors-connector-scope/mutation_check.py
      - name: grade-floor cases regenerate, agree and every rule is load-bearing
        run: |
          set -euo pipefail
          uv run --extra dev pytest corpora/vectors-grade-floor/tests -q
          uv run python corpora/vectors-grade-floor/check_vectors.py
          uv run python corpora/vectors-grade-floor/mutation_check.py
      - name: change-admission cases regenerate, agree and every rule is load-bearing
        run: |
          set -euo pipefail
          uv run --extra dev pytest corpora/vectors-agent-change-admission/tests -q
          uv run python corpora/vectors-agent-change-admission/check_vectors.py
          uv run python corpora/vectors-agent-change-admission/mutation_check.py
      - name: agentic-process-evidence cases regenerate, agree and every rule is load-bearing
        run: |
          set -euo pipefail
          uv run --extra dev pytest corpora/vectors-agentic-process-evidence/tests -q
          uv run python corpora/vectors-agentic-process-evidence/check_vectors.py
          uv run python corpora/vectors-agentic-process-evidence/mutation_check.py
      - name: delegation-lifecycle cases regenerate and their digest recomputes
        run: uv run --extra dev pytest corpora/vectors-delegation-lifecycle/tests -q
      - name: restart-records members regenerate, every rule is forced and the checker agrees
        run: |
          set -euo pipefail
          uv run --extra dev pytest corpora/vectors-restart-records/tests -q
          uv run python corpora/vectors-restart-records/check_vectors.py
      # The a2a canonicalization corpus is upstream's bytes, not ours: the
      # lock check refuses any drift from the pinned a2a-tck commit and corpus
      # digest, and the tests replay it through the rail with a conformant and
      # a non-conformant verifier.
      - name: the vendored a2a-jcs-v01 corpus matches its source lock
        run: python3 corpora/vectors-a2a-jcs-v01/upstream.py check
      - name: the a2a-jcs-v01 corpus replays under its verifier contract
        run: uv run --extra dev pytest corpora/vectors-a2a-jcs-v01/tests -q
      - name: OWASP MCP drafts regenerate and every rule owns its reject
        run: |
          uv run python corpora/vectors-mcp-owasp/gen_vectors.py --check
          uv run python scripts/mcp-owasp-reader-test.py
      - name: probity-verify checks source coverage
        run: |
          mkdir -p .build
          uv run python packaging/run_vectors.py \
            --corpus vectors-source-coverage \
            --verifier "uv run --no-project --python 3.13 --with probity-verify==0.1.1 probity-verify" \
            --report .build/probity-source-coverage.json
      # A second question the checker above cannot ask about itself: would any
      # member still be refused if a rule were removed? The sweep disables one
      # rule at a time and requires some member to stop being refused. It earns
      # its own step because it has already failed for real: two rules added in
      # one pass were each masked by another rule that refused the same member
      # first, so both measured nothing and the suite was green.
      - name: every observed-effect rule is load-bearing
        run: uv run --extra generators python corpora/vectors-observed-effect/mutation_check.py
      # The agent audit record corpus is Appendix B of an Internet-Draft. Its
      # checker judges it with the packaged reader, verifies the signatures with a
      # second Ed25519 library, and sweeps every rule for load-bearing effect.
      - name: the agent-audit-record corpus behaves as its manifest claims
        run: uv run --extra generators python corpora/vectors-agent-audit-record/check_vectors.py
      - name: producer aggregation preserves source pairs at representable boundaries
        run: |
          uv run mypy --strict scripts/auditrecord-aggregation-test.py
          uv run python scripts/auditrecord-aggregation-test.py
      - name: issuedAt must parse and must not be earlier than sealedAt
        run: |
          uv run mypy --strict scripts/auditrecord-issuedat-test.py
          uv run python scripts/auditrecord-issuedat-test.py
      # The agent-decision corpus pins the args_hash rule proposed on
      # in-toto/attestation#554. Its checker judges every member, recomputes each
      # canonical argument form with a second number writer, and disables each
      # rule in turn, standing in the library behaviour a reject is built against.
      - name: the agent-decision corpus behaves as its manifest claims
        run: uv run --extra generators python corpora/vectors-agent-decision/check_vectors.py
      # The control-decision corpus binds an Agent Control Specification verdict
      # to its input and policy digests. The checker judges every member and
      # shows each rule refuses at least one; the replay runs the recorded
      # runtime release on every member's disclosed bytes, the check a
      # distrusting consumer makes.
      - name: the control-decision corpus behaves as its manifest claims
        run: uv run --extra generators python corpora/vectors-acs-decision-record/check_vectors.py
      - name: the recorded ACS runtime reproduces every control-decision verdict
        working-directory: corpora/vectors-acs-decision-record/run
        run: uv run --locked python replay.py
      # The W3C intake-criteria corpus: judged clean, regenerated byte for byte,
      # each ground's check deleted in turn from the checker's source to show the
      # corpus goes red without it, the command line's root reporting, and every
      # record under release/intake/ admitted with the repository as its root.
      - name: the W3C intake corpus and records behave as claimed
        run: uv run --extra dev --extra generators pytest corpora/vectors-w3c-intake/tests -q
      # The IETF agent-record drafts corpus holds cases for three SCITT-wave
      # Internet-Drafts. Its checker judges every member, re-reads each under the
      # draft's own procedure to confirm the recorded draftReading, decodes every
      # CBOR item again with cbor2, and disables each rule in turn.
      - name: the IETF agent-record drafts corpus behaves as its manifest claims
        run: uv run --extra generators python corpora/vectors-ietf-agent-record-drafts/check_vectors.py
      # An indeterminate member is a row the specification leaves open, and a
      # verifier conforms on it by reaching any verdict its readings list. N1 and
      # N2 shipped with expected.verdict pinned to one of their two readings while
      # the manifest said to score on that field, and every judge passed them
      # because none read it. An outside reader found it. These cases pin a
      # verdict and delete each reading in turn, and require both packaged
      # readers to refuse the result.
      - name: indeterminate members are scored on their readings
        run: uv run --extra generators python scripts/indeterminate-readers-test.py
      # The rule sweep disables the write-chain rule as a whole. This drops one
      # comparison of the replay at a time (start, link, end, the empty case)
      # and requires the judge to catch exactly the member that pins it.
      - name: each comparison of the write-chain replay has its own member
        run: uv run --extra generators python scripts/write-chain-replay-test.py
      - name: each revision-01 dating rule is pinned by its own retained member
        run: uv run --extra generators python scripts/audit-record-dating-rows-test.py
      # The same rule over every corpus, including one added after this step was
      # written: a member whose readings allow more than one verdict pins none.
      - name: no corpus pins a verdict on an open member
        run: |
          python3 scripts/indeterminate-scoring-gate.py
          python3 scripts/indeterminate-scoring-gate-test.py
      # The rail's own oracle, which is a different question from the corpus.
      # A vector states what the rail must decide about bytes on disk; the
      # self-test states what the rail must decide about a statement it builds
      # itself, and it reaches two layers no vector can: the hand-rolled RFC
      # 8032 signer, checked against a value the cryptography library produced,
      # and the UTF-16 comparator, whose order stops being expressible once the
      # BMP-only profile is enforced.
      #
      # It shipped with the harness and nothing ran it. Held that way it decayed
      # exactly as an uncalled capability decays: four members the rail now
      # requires were missing from the statement it builds, so its base was
      # invalid, five checks were red, and one of the checks still reporting
      # PASS was satisfied by a code the invalid base emitted anyway rather than
      # by the mutation it names. It runs before the corpus replay because a
      # rail that cannot verify its own statement should be reported as a rail
      # fault rather than as a corpus-wide replay failure.
      #
      # The step name carries no check count on purpose. The self-test prints
      # its own total on every run, which is the one derived source; a number
      # typed here would be a copy of it that nothing invalidates.
      - name: the reference rail clears its own oracle
        run: python3 packaging/run_vectors.py --self-test
      # This step name DOES carry a count, unlike the one above it, and the
      # difference is where the number comes from rather than a preference
      # about names. The self-test's total has one source, which is the
      # self-test's own output, so a figure typed here would be a copy nothing
      # could check. The replay's total has a source outside this file --
      # vectors/MANIFEST.json -- and scripts/count-gate.py declares this step
      # name as one of the claims it resolves against that source on every run,
      # so a corpus change fails on the push that makes it rather than on the
      # revision that outdates the name. A checked copy of a derived number is
      # what the census asks for; an unchecked one is what it refuses.
      - name: replay every vector on the Python rail (must be 288/288)
        run: python3 packaging/run_vectors.py
      # The replay above says a rail cleared the corpus. This step says the
      # corpus can refuse one, which is a different claim and the one nothing
      # here held. A rail that emitted no tier column passed all six pinned tier
      # expectations by staying silent, because the evaluator compared a column
      # only when it had been handed one and a skipped comparison prints exactly
      # like a satisfied one. So this drives rails that are broken in one named
      # way each -- no output, unparseable output, a missing member, a null
      # member, a failed second pass -- and requires a refusal that names the
      # fault, plus always-accept and always-reject controls that must both fail
      # the census. It runs AFTER the replay on purpose: a green replay beside a
      # harness that cannot fail is the shape of evidence this repository exists
      # to stop shipping.
      - name: the harness refuses a rail that answers nothing
        run: python3 scripts/harness-output-contract-test.py
      # A verifier that stops at its first refusal never reaches a later stage.
      # This step holds the stage columns to that: a stage after a refusal the
      # vector names reads unreached, never FAIL beside a passing status.
      - name: a stage the verifier never reached is not printed as FAIL
        run: python3 scripts/stage-column-test.py
      - name: the star hint stays quiet in CI, beside JSON and after its first showing
        run: python3 scripts/starhint-test.py
      # A named verifier is the program that runs, or the run fails saying it
      # did not. Until this step existed the harness probed the verifier's bytes
      # for the predicate type URI and, when the probe failed, replayed the
      # corpus on its own reference rail and exited 0 on that rail's pass. The
      # test ends by restoring that fallback in a copy of the harness and
      # requiring itself to go red.
      - name: a named verifier runs, or the harness says it did not
        run: python3 scripts/verifier-must-run-test.py
      # The RFC 8785 byte cases ship in the wheel so an SDK's CI can pin the
      # package and read them offline. The test builds the wheel, compares the
      # shipped bytes with the repository copy and resolves the documented
      # locator from outside the checkout. It also runs a test module
      # parametrized with a2ajcs.params() against the installed wheel, so the
      # pytest route another project depends on is collected from the package
      # and not from this checkout.
      - name: the wheel ships the JCS byte cases at the path the package names
        run: python3 scripts/wheel-jcs-bytes-test.py
      # Every corpus the signed digest list names is in the wheel and the sdist, byte
      # for byte. The gate refuses a release build that dropped one, and its test
      # drops a corpus from both artifacts and requires the gate to name it.
      - name: the wheel and the sdist carry every corpus the signed list names
        run: |
          python3 scripts/wheel-corpora-gate-test.py
          rm -rf "$RUNNER_TEMP/corpora-dist"
          uv build --out-dir "$RUNNER_TEMP/corpora-dist"
          python3 scripts/wheel-corpora-gate.py "$RUNNER_TEMP/corpora-dist"/agent_evidence_vectors-*.whl "$RUNNER_TEMP/corpora-dist"/agent_evidence_vectors-*.tar.gz
      # A report names the corpus release and digest it ran, matched against
      # the signed digest list. The test ends by deleting the block in a copy of
      # the harness and requiring itself to go red.
      - name: a report names the corpus release and digest it ran
        run: python3 scripts/report-provenance-test.py
      # The report's retention period is an input with the old fixed value as
      # its default; the test restores the fixed number in a copy of the action
      # and requires itself to go red.
      - name: the action's report retention is an input
        run: uv run python scripts/action-retention-test.py
      # The action builds on an exact Python release with a hash-locked build
      # backend and no index; the test restores the floating version and the
      # unhashed install in copies of the action and requires itself to go red.
      - name: the action builds on a pinned interpreter and a locked backend
        run: uv run python scripts/action-build-pin-test.py
      # The action's default-on second stage: reference-checked conformance N of
      # M, FULL-RELEASE only when N equals M, installed by hash, not switchable.
      # The test deletes the guards in copies of the action and requires itself
      # to go red.
      - name: the action's reference stage counts, prints and cannot be switched off
        run: uv run --group crosscheck python scripts/action-reference-stage-test.py
      # The per-corpus N of M on the status shields (assets/status/reference/) is
      # recomputed from the reference verifier and must equal the committed files.
      - name: the reference coverage shields match the reference verifier
        run: |
          uv run --group crosscheck python scripts/reference-coverage-test.py
          uv run --group crosscheck python scripts/reference-coverage.py --check
      # The release tag check accepts only a tag signed by the pinned key. The
      # test builds throwaway keys and ends by deleting the fingerprint pin in
      # a copy of the script and requiring itself to go red.
      - name: the release tag check refuses a tag the pinned key did not sign
        run: python3 scripts/verify-release-tag-test.py
      # A perfect verifier scores a perfect run. scripts/oracle-verifier.py
      # answers every member exactly as its MANIFEST declares, so any failure
      # or suite-level refusal it draws describes the harness, not a verifier.
      # The AI Agent Action corpus used to fail it on four refusals about the
      # harness's own layout rules, which made the Action report fail for every
      # implementer who pointed it at that corpus. The test covers every corpus
      # in the tree and fails on one it has not been told how to classify.
      - name: a perfect verifier passes every corpus that runs one
        run: python3 scripts/oracle-every-corpus-test.py
      # The admission corpus has two readers, one per rail, that share no code
      # below the statement. They must give the manifest's answer on every
      # member and the same answer as each other on every statement crossed
      # with a policy moved one knob at a time.
      - name: the two admission rails agree
        run: python3 scripts/admission-rails-test.py
      # The approval-binding corpus has a packaged reader, its own command and a
      # Go reader. They must give the manifest's verdict on every member and the
      # same verdict as each other on mutated copies of every member.
      - name: the approval-binding readers agree
        run: python3 scripts/approval-binding-rails-test.py
      # The self-reported-record corpus has two readers, one per rail. They must
      # give the manifest's answer on every member and the same bytes as each
      # other on the committed corpus and on mutated copies of its members.
      - name: the two self-reported-record rails agree
        run: uv run --locked --extra generators python scripts/self-reported-record-rails-test.py
      # The corpus README presents check_vectors.py as the reference verifier and
      # mutation_check.py as the proof that every rule is load-bearing. Neither
      # ran in CI, so a regression in either, or in the members they judge,
      # could not turn a build red.
      - name: the self-reported-record reference verifier and its mutation check pass
        run: |
          uv run --locked --extra generators python corpora/vectors-self-reported-record/check_vectors.py
          uv run --locked --extra generators python corpora/vectors-self-reported-record/mutation_check.py
      # A predicate type URI sits inside bytes a third party signs, and a 404
      # on one reads as a withdrawn type. predicate/v1/self-reported-record was
      # named in every signed member of its corpus and 404ed, because nothing
      # held the named URIs to the registry the site is built from.
      - name: every predicate URI the tree names has a page on the site
        run: |
          uv run python scripts/predicate-uri-gate.py
          uv run python scripts/predicate-uri-gate-test.py

  # What the corpus FORCES, held as a tighten-only ratchet. A vector count is an
  # upper bound on forcing and never a measurement of it: a vector declaring
  # several expected codes is satisfied by any one of them, so deleting the
  # result-vocabulary emission from the rail turns two vectors' gate-0 column
  # FAIL and the suite still reports 288 of 288, exit 0. The only way to know
  # what this corpus obliges a third party to implement is to switch one rule
  # off at a time and replay, which is what this job does.
  #
  # It is a separate job, on a wider runner, for two reasons. It is the only job
  # here that is CPU-bound rather than latency-bound -- it rebuilds and replays
  # one mutant per rule -- so it wants cores rather than a place in the queue
  # behind the linters; and it must not lengthen the path a contributor waits on
  # for a lint error.
  #
  # SCOPE: this runs the sites the baseline records as KILLED, which is the
  # complete set where a regression is possible (a regression is by definition a
  # site that used to be killed and is not) and also, by construction, the set
  # already known to build, run and terminate. The remaining sites can only
  # improve; an improvement is invisible to a check that would pass either way,
  # and the nightly full sweep is what sees one. The gate prints what it did not
  # run, by class and count, on every run.
  #
  # MEASURED on a 16-worker workstation, in CPU-seconds because that is the number
  # that carries between machines: 470 of 928 sites and ~1670 CPU-seconds there, against
  # ~3370 for the full sweep. Wall time on that box was 88-110s at 8-16 workers. Both
  # CPU-second figures were taken while the sweep was smaller, before the quantifier
  # operator was added, and are not re-measured here: restating a figure for a machine
  # this change never ran on would be inventing a measurement rather than taking one.
    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['ci'] }}
    permissions:
      contents: read

  ci__forcing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - name: the corpus still forces every rule it is recorded as forcing
        run: python3 scripts/forcing-gate.py --scope forced --workers 8
      # The gate's own tests, which are mostly refusals: this repository has
      # shipped a verifier that scored 0 of 186 while its unit test passed, so a
      # gate evidenced only by a green run is a known failure shape here. Two of
      # the cases are live and one of them is rigged to regress, so the path from
      # a weakened corpus to a non-zero exit is exercised rather than argued.
      - name: the forcing gate can fail
        run: python3 scripts/forcing-gate-test.py
      # The step above mutates the RAIL, which is why it cannot reach this. A
      # sentence whose text admits two readings has no site to mutate: the rail
      # implements one of them, the code expressing the rival was never
      # written, and the two implementations score identically over the whole
      # corpus. An outside implementer found that exact shape four times in one
      # review, each time by accident of instrumenting his own checker, and at
      # one of them we wrote the lesson down and built nothing on it. So the
      # thing to mutate is the reading: build the rail under each declared
      # reading of one sentence, replay every vector under both, and ask
      # whether any observable moved. Zero difference is a finding here and
      # never a confirmation, which is the property that let a full green
      # replay read as settling a question it could not see.
      #
      # It belongs in this job rather than beside the Python gates for the same
      # two reasons the forcing gate does. It needs the Go toolchain to build
      # each variant rail, and a missing toolchain is a failure and never a
      # skip; and it is CPU-bound for over a minute rather than latency-bound,
      # so it wants the cores on this runner and must not sit in the path a
      # contributor waits on for a lint error.
      #
      # --fail-on-finding is deliberately NOT set. Every declared reading comes
      # back DISCRIMINATED or REPORT-ONLY today, so the flag would change
      # nothing and this step would be green either way. Turning it on before
      # every reading is settled would be a gate whose passing means nothing,
      # which is the shape the rest of this file exists to refuse. It goes on
      # in the change that settles the last open reading, not before.
      - name: the corpus can tell two readings of a rule apart, or it says so
        run: |
          python3 scripts/reading-differential.py --workers 8
          python3 scripts/reading-differential-test.py

  # The action a relying party adds to its own workflow, run here against the
  # shipped verifier, the way theupdateframework/tuf-conformance runs its own
  # action in its own CI. Nothing else exercises action.yml before a consumer
  # does: the release workflow proves the wheel and the Python job proves the
  # harness, and a composite action that wires the two together could still
  # name an input wrong or write the report where the upload step does not
  # look. The verifier is built into the workspace first because the action
  # resolves a relative first token from there.
    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['ci'] }}
    permissions:
      contents: read

  ci__action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - name: build the shipped verifier into the workspace
        run: go build -o ./aee-verify ./cmd/aee-verify
      - name: the action replays the corpus against it
        id: replay
        uses: ./
        with:
          verifier: ./aee-verify -validity-only -json
      - name: the outputs carry the totals
        env:
          RESULT: ${{ steps.replay.outputs.result }}
          VECTORS: ${{ steps.replay.outputs.vectors }}
          CONFORM: ${{ steps.replay.outputs.conform }}
          EXECUTED: ${{ steps.replay.outputs.executed }}
        run: |
          echo "result=$RESULT vectors=$VECTORS conform=$CONFORM executed=$EXECUTED"
          test "$RESULT" = pass
          test "$VECTORS" -gt 0
          test "$CONFORM" = "$VECTORS"
          test "$EXECUTED" = "$VECTORS"
      # The action must fail a job whose verifier never ran. Before the fix a
      # verifier the harness could not start was replaced by its reference rail
      # and this step went green, so the negative case is run through the
      # action itself rather than argued from the harness's unit test.
      - name: the action refuses a verifier it cannot run
        id: unrunnable
        continue-on-error: true
        uses: ./
        with:
          verifier: ./no-such-verifier -json
          artifact-name: agent-evidence-vectors-results-unrunnable
          report-path: unrunnable-report.json
      - name: and that job would have failed
        env:
          OUTCOME: ${{ steps.unrunnable.outcome }}
          RESULT: ${{ steps.unrunnable.outputs.result }}
        run: |
          echo "outcome=$OUTCOME result=$RESULT"
          test "$OUTCOME" = failure
          test "$RESULT" = fail
      # A corpus other than the default, through the same action: the a2a
      # Agent Card canonicalization corpus vendored from a2a-tck, replayed
      # against the packaged reference canonicalizer and then against one
      # that canonicalizes the way a2a-python did, which must fail the job.
      - name: the action replays the a2a-jcs-v01 corpus
        id: a2a
        uses: ./
        with:
          corpus: vectors-a2a-jcs-v01
          verifier: python -m agent_evidence_vectors.a2ajcs
          artifact-name: agent-evidence-vectors-results-a2a
          report-path: a2a-report.json
      - name: every a2a signing-input vector ran and conformed
        env:
          RESULT: ${{ steps.a2a.outputs.result }}
          VECTORS: ${{ steps.a2a.outputs.vectors }}
          CONFORM: ${{ steps.a2a.outputs.conform }}
          EXECUTED: ${{ steps.a2a.outputs.executed }}
        run: |
          echo "result=$RESULT vectors=$VECTORS conform=$CONFORM executed=$EXECUTED"
          test "$RESULT" = pass
          test "$VECTORS" -gt 0
          test "$CONFORM" = "$VECTORS"
          test "$EXECUTED" = "$VECTORS"
      - name: the action fails a canonicalizer that writes 1e-06
        id: a2abad
        continue-on-error: true
        uses: ./
        with:
          corpus: vectors-a2a-jcs-v01
          verifier: python corpora/vectors-a2a-jcs-v01/tests/bad_verifier.py
          artifact-name: agent-evidence-vectors-results-a2a-bad
          report-path: a2a-bad-report.json
      - name: and that job would have failed
        env:
          OUTCOME: ${{ steps.a2abad.outcome }}
          RESULT: ${{ steps.a2abad.outputs.result }}
          EXECUTED: ${{ steps.a2abad.outputs.executed }}
          VECTORS: ${{ steps.a2abad.outputs.vectors }}
        run: |
          echo "outcome=$OUTCOME result=$RESULT executed=$EXECUTED"
          test "$OUTCOME" = failure
          test "$RESULT" = fail
          test "$VECTORS" -gt 0
          test "$EXECUTED" = "$VECTORS"
      # A runtime, not a verifier, through the runtime input: the reference
      # adapter reconciles before it resends and must pass every scenario, and
      # the blind-retry adapter must fail the job on the write it duplicates.
      - name: the action drives a runtime through the uncertain-effect scenarios
        id: runtime
        uses: ./
        with:
          corpus: vectors-uncertain-effect
          runtime: python3 corpora/vectors-uncertain-effect/tests/runtime_adapter.py
          artifact-name: agent-evidence-vectors-results-runtime
          report-path: runtime-report.json
      - name: every scenario ran and passed
        env:
          RESULT: ${{ steps.runtime.outputs.result }}
          VECTORS: ${{ steps.runtime.outputs.vectors }}
          EXECUTED: ${{ steps.runtime.outputs.executed }}
        run: |
          echo "result=$RESULT scenarios=$VECTORS executed=$EXECUTED"
          test "$RESULT" = pass
          test "$VECTORS" -gt 0
          test "$EXECUTED" = "$VECTORS"
      - name: the action fails a runtime that resends after a lost reply
        id: runtimebad
        continue-on-error: true
        uses: ./
        with:
          corpus: vectors-uncertain-effect
          runtime: python3 corpora/vectors-uncertain-effect/tests/runtime_adapter.py --policy blind
          artifact-name: agent-evidence-vectors-results-runtime-bad
          report-path: runtime-bad-report.json
      - name: and that job would have failed
        env:
          OUTCOME: ${{ steps.runtimebad.outcome }}
          RESULT: ${{ steps.runtimebad.outputs.result }}
        run: |
          echo "outcome=$OUTCOME result=$RESULT"
          test "$OUTCOME" = failure
          test "$RESULT" = fail
      # A decision client through the same runtime input: the closed reference
      # client withholds the action on every fault and must pass every scenario;
      # the open client reads a fault or an unknown verdict as an allow and must
      # fail the job.
      - name: the action drives a decision client through the failure-mode matrix
        id: decisionclient
        uses: ./
        with:
          corpus: vectors-decision-client-failure-modes
          runtime: python3 corpora/vectors-decision-client-failure-modes/tests/client_adapter.py --policy closed
          artifact-name: agent-evidence-vectors-results-decision-client
          report-path: decision-client-report.json
      - name: every decision-client scenario ran and passed
        env:
          RESULT: ${{ steps.decisionclient.outputs.result }}
          VECTORS: ${{ steps.decisionclient.outputs.vectors }}
          EXECUTED: ${{ steps.decisionclient.outputs.executed }}
        run: |
          echo "result=$RESULT scenarios=$VECTORS executed=$EXECUTED"
          test "$RESULT" = pass
          test "$VECTORS" -gt 0
          test "$EXECUTED" = "$VECTORS"
      - name: the action fails a decision client that fails open
        id: decisionclientbad
        continue-on-error: true
        uses: ./
        with:
          corpus: vectors-decision-client-failure-modes
          runtime: python3 corpora/vectors-decision-client-failure-modes/tests/client_adapter.py --policy open
          artifact-name: agent-evidence-vectors-results-decision-client-bad
          report-path: decision-client-bad-report.json
      - name: and that decision-client job would have failed
        env:
          OUTCOME: ${{ steps.decisionclientbad.outcome }}
          RESULT: ${{ steps.decisionclientbad.outputs.result }}
        run: |
          echo "outcome=$OUTCOME result=$RESULT"
          test "$OUTCOME" = failure
          test "$RESULT" = fail
      # The same corpus from a directory in the workspace, through the vectors
      # input, which is how a consumer that pins a corpus by commit replays its
      # own checkout rather than the copy this release carries. The clean copy
      # must pass and report the lock's digest. A copy with one expected byte
      # string changed must fail the job, which it can do only if the action
      # read the directory it was given.
      - name: stage the a2a-jcs-v01 corpus as workspace directories
        run: |
          mkdir -p .build
          rm -rf .build/a2a-jcs-dir .build/a2a-jcs-dir-edited
          cp -R corpora/vectors-a2a-jcs-v01 .build/a2a-jcs-dir
          cp -R corpora/vectors-a2a-jcs-v01 .build/a2a-jcs-dir-edited
          sed -i 's/302e3030303030317d/31652d30367d/' .build/a2a-jcs-dir-edited/a5-number-serialization/A5-001.json
          ! cmp -s corpora/vectors-a2a-jcs-v01/a5-number-serialization/A5-001.json .build/a2a-jcs-dir-edited/a5-number-serialization/A5-001.json
      - name: the action replays a corpus directory named by the vectors input
        id: a2adir
        uses: ./
        with:
          vectors: .build/a2a-jcs-dir
          verifier: python -m agent_evidence_vectors.a2ajcs
          artifact-name: agent-evidence-vectors-results-a2a-dir
          report-path: a2a-dir-report.json
      - name: every vector in the directory ran, under the locked digest
        env:
          RESULT: ${{ steps.a2adir.outputs.result }}
          VECTORS: ${{ steps.a2adir.outputs.vectors }}
          EXECUTED: ${{ steps.a2adir.outputs.executed }}
          REPORT: ${{ steps.a2adir.outputs.report }}
        run: |
          echo "result=$RESULT vectors=$VECTORS executed=$EXECUTED"
          test "$RESULT" = pass
          test "$VECTORS" -gt 0
          test "$EXECUTED" = "$VECTORS"
          replayed=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["corpus"]["corpusDigest"])' "$REPORT")
          locked=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["corpusDigest"])' corpora/vectors-a2a-jcs-v01/source-lock.json)
          echo "replayed=$replayed locked=$locked"
          test "$replayed" = "$locked"
      - name: the action fails a directory whose bytes were changed
        id: a2adiredited
        continue-on-error: true
        uses: ./
        with:
          vectors: .build/a2a-jcs-dir-edited
          verifier: python -m agent_evidence_vectors.a2ajcs
          artifact-name: agent-evidence-vectors-results-a2a-dir-edited
          report-path: a2a-dir-edited-report.json
      - name: and that job would have failed
        env:
          OUTCOME: ${{ steps.a2adiredited.outcome }}
          RESULT: ${{ steps.a2adiredited.outputs.result }}
        run: |
          echo "outcome=$OUTCOME result=$RESULT"
          test "$OUTCOME" = failure
          test "$RESULT" = fail
    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['ci'] }}
    permissions:
      contents: read

  # from claim-record.yml:
  #  A newer push to the same pull request or branch supersedes the older run.
  #  Main and tags never cancel: each main push keeps its own group by sha.
  claim_record:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.15'
      - name: Install pinned control dependencies
        run: python -m pip install pytest==8.4.2 mypy==2.3.1
      - name: The committed corpus is what the builder writes
        run: python scripts/claim-record-build.py --check
      - name: Every case, every repair and every rule kill
        run: python -m pytest -q scripts/claim-record-test.py
      - name: The verifier type-checks under strict mode
        working-directory: packaging
        run: >-
          python -m mypy --strict agent_evidence_vectors/claim_record/reader.py
          agent_evidence_vectors/claim_record/run.py agent_evidence_vectors/claim_record/ops.py
      - name: Retain the checkout run
        working-directory: packaging
        run: >-
          python -m agent_evidence_vectors.claim_record.run run
          --output ../.build/claim-record/checkout
          --implementation-revision "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Run both installed entry points from the built wheel alone
        run: |
          python -m pip install build==1.3.0
          python -m build --wheel --outdir .build/dist
          python -m venv .build/wheel-venv
          .build/wheel-venv/bin/python -m pip install .build/dist/*.whl
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.build/wheel-venv/bin/agent-evidence-vectors" claim run \
            --output "$GITHUB_WORKSPACE/.build/claim-record/wheel"
          grep -q '"implementation_revision": "agent-evidence-vectors==' \
            "$GITHUB_WORKSPACE/.build/claim-record/wheel/report.json"
          "$GITHUB_WORKSPACE/.build/wheel-venv/bin/agent-evidence-vectors-claim" run \
            --output "$GITHUB_WORKSPACE/.build/claim-record/wheel-console"
      - name: Retain the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claim-record
          path: .build/claim-record
          if-no-files-found: error
          retention-days: 90
    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['claim_record'] }}
    permissions:
      contents: read

  # from codeql.yml:
  #  Static analysis of this repository's own code, by an analyser nobody here
  #  wrote.

  #  ci.yml already runs go vet, staticcheck, golangci-lint, mypy --strict and
  #  ruff, and all of them are held at zero warnings. Those tools are chosen by the
  #  maintainer and configured by him, so they answer the question he thought to
  #  ask. CodeQL asks a different set -- taint reaching a sink, a path that
  #  dereferences what it just checked for nil, an unsanitised value crossing a
  #  trust boundary -- and it asks them the same way in every repository it runs
  #  in, which is the property that matters here. A verifier that mis-parses is a
  #  verifier that accepts what it should refuse, so the analysis is about the
  #  corpus's argument and not only about hygiene.

  #  Two languages, and the split in build mode is not cosmetic: the Go core is
  #  compiled, so the database is built by compiling it, and the Python rail and
  #  the gates are interpreted, so there is nothing to build and asking for a build
  #  would only produce a failure to explain. go.work links the stdlib-only core to
  #  the attestor module, so autobuild covers both without a build command here
  #  that could drift from the one ci.yml runs.
  #  Prose-only changes carry nothing for the Go, Python or workflow queries.
  #  Weekly, because a query pack updates without this repository changing:
  #  a scheduled run is what finds the defect that was always there and only
  #  became detectable.
  #  A newer push to the same pull request or branch supersedes the older run.
  #  Main and tags never cancel: each main push keeps its own group by sha.
  codeql:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # The findings are written into code scanning.
      security-events: write
      actions: read
      contents: read

    strategy:
      # Not fail-fast: a Go result is not a reason to stop wanting the Python
      # one, and a matrix that cancels its siblings reports a partial analysis
      # as a finished one.
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: python
            build-mode: none
          # The workflow files themselves, for injection and over-permissioned
          # token patterns. This repository carries more workflows than it
          # carries Go packages and scanned none of them until this leg existed,
          # which is the one place a CodeQL matrix can be silently narrower than
          # the repository it claims to cover.
          - language: actions
            build-mode: none

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version: '1.26'

      - name: initialize codeql
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: perform codeql analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['codeql'] }}
  # from commit-message-lint.yml:
  #  The commit-message gate is a git hook, and a git hook is advisory:
  #  `git commit --no-verify` walks past it, and `core.hooksPath` is local config
  #  that no clone inherits, so a fresh clone that never ran the bootstrap has no
  #  hook at all. Neither of those is detectable from inside the hook. CI runs the
  #  SAME tracked file so the rule holds regardless of what any developer's clone
  #  is configured to do.
  #  A pull request's own run covers its branch; a branch push would repeat it.
  #  A newer push to the same pull request or branch supersedes the older run.
  #  Main and tags never cancel: each main push keeps its own group by sha.
  commit_message_lint:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      # Pinned to the tip of the v5 release train. The pin this file carried
      # before named a commit on the v6 line and commented it `# v4`, so the
      # comment described neither the SHA nor the major -- a mislabelled pin is
      # worse than a floating ref, because it reads as the discipline it is not.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gate self-test
        run: .githooks/commit-msg --selftest

      # Dependabot writes the pull request title ("bump X from A to B in /dir
      # (#N)" runs past 72 characters for any deep directory) and no setting
      # shortens it: commit-message.prefix changes only the first words. Its
      # pull requests are merged with the subject written by hand
      # (`gh pr merge --squash --subject ...`), so the generated title never
      # becomes a commit on the default branch, and the range lint below still
      # checks every commit that lands. Every other author keeps this check.
      - name: Lint the prospective merge subject
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] \
             || [[ "$PR_TITLE" == *$'\n'* || "$PR_TITLE" == *$'\r'* ]]; then
            echo 'Expected a single-line PR title and a positive PR number.' >&2
            exit 1
          fi
          subject="${PR_TITLE} (#${PR_NUMBER})"
          if [ "${#subject}" -gt 72 ]; then
            echo 'Shorten the PR title: the merge subject including (#number) exceeds 72 characters.' >&2
            exit 1
          fi
          message_file=$(mktemp)
          trap 'rm -f "$message_file"' EXIT
          printf '%s\n' "$subject" > "$message_file"
          .githooks/commit-msg "$message_file"

      - name: Lint the commit messages this event introduces
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PUSH_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [ -z "${DEFAULT_BRANCH:-}" ] \
             || ! git check-ref-format "refs/heads/$DEFAULT_BRANCH"; then
            echo 'Refusing a commit range without a valid repository default branch.' >&2
            exit 1
          fi
          if [ -n "${PR_BASE:-}" ]; then
            range="$(git merge-base "$PR_BASE" HEAD)..HEAD"
          elif [[ "${PUSH_REF:-refs/heads/local-gate}" == refs/heads/* ]] \
               && [ "${PUSH_REF:-}" != "refs/heads/$DEFAULT_BRANCH" ]; then
            # Published default-branch messages can arrive through a merge.
            # A missing base cannot establish which branch commits are new.
            if ! git cat-file -e "refs/remotes/origin/$DEFAULT_BRANCH^{commit}" 2>/dev/null; then
              echo 'Refusing a commit range whose published default base is unavailable.' >&2
              exit 1
            fi
            # With no event ref, the local gate checks all unpublished commits.
            range="refs/remotes/origin/$DEFAULT_BRANCH..HEAD"
          elif [ -n "${PUSH_BEFORE:-}" ] && [ "$PUSH_BEFORE" != "$zero" ] \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="${PUSH_BEFORE}..HEAD"
          elif git rev-parse -q --verify HEAD~1 >/dev/null; then
            # New branch, or a force-push whose old tip is gone: lint the tip.
            range="HEAD~1..HEAD"
          else
            range="HEAD"
          fi
          echo "linting $range"
          # Dependabot writes its own subjects ("bump X from A to B in /dir")
          # and stops maintaining a pull request once anyone else pushes to
          # it, so its commits cannot be brought under the subject limit. They
          # never reach the default branch either: the squash subject is the
          # PR title, which the step above lints. On a Dependabot pull request
          # or a Dependabot push to its own branch, the commits Dependabot
          # authored are therefore left out, and every other commit in the
          # range is still linted one by one against the same baseline.
          bot='dependabot[bot]'
          bot_email='49699333+dependabot[bot]@users.noreply.github.com'
          if [ "${PR_AUTHOR:-}" = "$bot" ] \
             || { [ -z "${PR_BASE:-}" ] && [ "${PUSH_ACTOR:-}" = "$bot" ] \
                  && [[ "${PUSH_REF:-}" == refs/heads/dependabot/* ]]; }; then
            status=0
            for commit in $(git rev-list "$range"); do
              if [ "$(git log -1 --format=%ae "$commit")" = "$bot_email" ]; then
                echo "left out: $(git log -1 --format='%h %s' "$commit") (written by Dependabot)"
                continue
              fi
              .githooks/commit-msg --check-range "$commit^!" || status=1
            done
            exit "$status"
          fi
          .githooks/commit-msg --check-range "$range"
    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['commit_message_lint'] }}
    permissions:
      contents: read

  # from crosswalk.yml:
  #  `crosswalks/aee-to-ave.json` is generated from two trees, and for most of its
  #  life nothing ran the generator. The committed file drifted three suite
  #  revisions and twenty-two vectors behind the repository it was generated in, and
  #  a reader could not see that: a figure with a recipe printed beside it reads as
  #  derived whether or not anybody ever re-ran the recipe.

  #  The reason it ran nowhere is that the generator needs a checkout of
  #  aveproject/ave, which a per-push job has no business cloning. So the check is
  #  split along the line that actually matters, which is who caused the change:

  #    check-local, on every push. It verifies only `source.conformance_suite` --
  #    the revision, the vector total and the three verdict counts -- against
  #    vectors/MANIFEST.json and vectors/CHANGES.md in this same tree. No network,
  #    no second checkout. This is the half that drifted, and it is the half a
  #    reader is most likely to act on, because it says what they will find when
  #    they clone this repository.

  #    crosswalk-upstream, weekly. It clones aveproject/ave, runs the full --check,
  #    and on divergence OPENS OR UPDATES AN ISSUE without failing anything. A
  #    third-party corpus growing is their event, not a fault in the commit being
  #    pushed, and a gate that goes red for something nobody here did is a gate
  #    people learn to skip. The issue is the right shape because closing it needs
  #    an editorial judgement: the generator refuses when upstream carries a value
  #    of a mapped field no row covers, and answering that is a person's decision
  #    about what the value means, not a regeneration. Only a read that could not
  #    COMPLETE fails this job, because an unread upstream and an agreeing one must
  #    never report the same way.

  #  EVERY `run:` BLOCK HERE IS RUNNABLE ON A WORKSTATION, and none of them
  #  interpolates a `${{ }}` expression. scripts/workflow-steps-gate.py executes
  #  every shell step of every workflow locally before a push, in order, with no
  #  runner variables set, so a step that needs $RUNNER_TEMP or an expression fails
  #  there and a workflow nobody can mirror locally is one nobody checks. The one
  #  step that writes to GitHub guards on $GITHUB_ACTIONS, which that mirror blanks
  #  on purpose, and it says out loud that it filed nothing.
  #  05:40 UTC on Mondays. Weekly rather than daily because the thing it watches
  #  is somebody else's release cadence, and off the hour so it does not queue
  #  behind everything scheduled at :00.
  #  A newer push to the same pull request or branch supersedes the older run.
  #  Main and tags never cancel: each main push keeps its own group by sha.
  crosswalk__check-local:
    if: ${{ fromJSON(needs.changes.outputs.run)['crosswalk'] && (github.event_name != 'schedule') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: the crosswalk publishes this corpus as it stands
        run: python3 scripts/crosswalk-gen.py --check-local

    needs:
      - changes
    permissions:
      contents: read

  crosswalk__crosswalk-upstream:
    if: ${{ fromJSON(needs.changes.outputs.run)['crosswalk'] && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7.0.1
      # A shallow clone is enough: the generator reads HEAD and the records, and
      # refuses a dirty or unrecognised checkout rather than trusting either. The
      # working directory is used instead of $RUNNER_TEMP so the same command
      # runs under the local mirror, and it is removed first so a second run
      # reads a fresh tree rather than a stale one.
      - name: clone the upstream corpus
        run: |
          rm -rf .crosswalk-upstream
          mkdir -p .crosswalk-upstream
          git clone --depth 1 https://github.com/aveproject/ave .crosswalk-upstream/ave
      - name: the crosswalk still describes both trees
        run: |
          set +e
          python3 scripts/crosswalk-gen.py --ave-repo .crosswalk-upstream/ave --check \
            > .crosswalk-upstream/report.txt 2>&1
          status=$?
          set -e
          cat .crosswalk-upstream/report.txt
          echo "$status" > .crosswalk-upstream/status
          # Exit 0 and exit 1 are both answers: agreement, and a divergence the
          # next step files. Anything else means the generator did not run to a
          # verdict, and an unread upstream is not an agreeing one.
          if [ "$status" != "0" ] && [ "$status" != "1" ]; then
            echo "crosswalk-gen.py exited $status, which is neither agreement nor a"
            echo "divergence. Nothing was compared, so nothing is being reported."
            exit 1
          fi
      # One issue, reopened and rewritten rather than a new one every week. A
      # weekly job that files a fresh issue teaches everybody to close them
      # unread, which is the same failure as a gate people learn to skip.
      - name: open or update the divergence issue
        env:
          GH_TOKEN: ${{ github.token }}
          CROSSWALK_REPO: ${{ github.repository }}
          CROSSWALK_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$(cat .crosswalk-upstream/status)" = "0" ]; then
            echo "the crosswalk agrees with both trees, so there is nothing to file"
            exit 0
          fi
          upstream=$(git -C .crosswalk-upstream/ave rev-parse HEAD)
          {
            echo "\`crosswalks/aee-to-ave.json\` no longer describes both trees."
            echo
            echo "Upstream aveproject/ave is at \`$upstream\`. What the generator said:"
            echo
            echo '```'
            cat .crosswalk-upstream/report.txt
            echo '```'
            echo
            echo "Regenerate, which needs a checkout because the upstream side is counted out of a real tree:"
            echo
            echo '```'
            echo "git clone https://github.com/aveproject/ave /tmp/ave"
            echo "python3 scripts/crosswalk-gen.py --ave-repo /tmp/ave"
            echo '```'
            echo
            echo "If the generator refuses on an uncovered value, that is not a regeneration. Upstream has added a value of a mapped field, and what it means in this predicate's vocabulary is an editorial decision: add a \`Row\` in \`scripts/crosswalk-gen.py\`, or a \`KNOWN_UNCOVERED\` entry carrying the reason it maps to nothing."
            echo
            echo "Run: ${CROSSWALK_RUN_URL:-not a runner}"
          } > .crosswalk-upstream/body.md
          cat .crosswalk-upstream/body.md
          if [ "$GITHUB_ACTIONS" != "true" ]; then
            echo
            echo "NOT ON A RUNNER: the body above was written and NOTHING was filed."
            echo "This step posts only where \$GITHUB_ACTIONS is true, so the local"
            echo "workflow mirror can run it without writing to the repository."
            exit 0
          fi
          title='crosswalk: aee-to-ave.json has diverged from upstream'
          existing=$(gh issue list --repo "$CROSSWALK_REPO" --state open \
            --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$CROSSWALK_REPO" \
              --body-file .crosswalk-upstream/body.md
          else
            gh issue create --repo "$CROSSWALK_REPO" --title "$title" \
              --body-file .crosswalk-upstream/body.md
          fi
      - name: leave no upstream checkout behind
        run: rm -rf .crosswalk-upstream
    needs:
      - changes
  # from e2-reproduction.yml:
  #  Bot-token merges suppress push events; allow the native jobs on exact main.
  #  A newer push to the same pull request or branch supersedes the older run.
  #  Main and tags never cancel: each main push keeps its own group by sha.
  e2_reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: interop/aps-priorseal-e2-2026-09-30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.15'
      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Test refusal paths
        run: python -m pytest -q test_reproduction.py
      - name: Fetch and hash-check all 31 inputs
        run: sh fetch_inputs.sh
      - name: Reproduce results and negative controls
        run: python check_reproduction.py
      - name: Retain reproduced outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2-reproduction
          path: |
            .build/e2-reproduction/RESULTS.json
            .build/e2-reproduction/NEGATIVES.json
          if-no-files-found: error
          retention-days: 14
    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['e2_reproduction'] }}
    permissions:
      contents: read

  # from eval-result.yml:
  #  A newer push to the same pull request or branch supersedes the older run.
  #  Main and tags never cancel: each main push keeps its own group by sha.
  eval_result:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.15'
      - name: Install pinned control dependencies
        run: python -m pip install pytest==8.4.2 mypy==2.3.1
      - name: The committed corpus is what the builder writes
        run: python scripts/eval-result-build.py --check
      - name: Every case, every repair and every rule kill
        run: python -m pytest -q scripts/eval-result-test.py
      - name: The reader type-checks under strict mode
        working-directory: packaging
        run: >-
          python -m mypy --strict agent_evidence_vectors/eval_result/reader.py
          agent_evidence_vectors/eval_result/run.py
      - name: Retain the checkout run
        working-directory: packaging
        run: >-
          python -m agent_evidence_vectors.eval_result.run run
          --output ../.build/eval-result/checkout
          --implementation-revision "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Run both installed entry points from the built wheel alone
        run: |
          python -m pip install build==1.3.0
          python -m build --wheel --outdir .build/dist
          python -m venv .build/wheel-venv
          .build/wheel-venv/bin/python -m pip install .build/dist/*.whl
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.build/wheel-venv/bin/agent-evidence-vectors" evalresult run \
            --output "$GITHUB_WORKSPACE/.build/eval-result/wheel"
          grep -q '"implementation_revision": "agent-evidence-vectors==' \
            "$GITHUB_WORKSPACE/.build/eval-result/wheel/report.json"
          "$GITHUB_WORKSPACE/.build/wheel-venv/bin/agent-evidence-vectors-evalresult" run \
            --output "$GITHUB_WORKSPACE/.build/eval-result/wheel-console"
      - name: Retain the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-result
          path: .build/eval-result
          if-no-files-found: error
          retention-days: 90
    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['eval_result'] }}
    permissions:
      contents: read

  # from event-absence-c1.yml:
  #  A newer push to the same pull request or branch supersedes the older run.
  #  Main and tags never cancel: each main push keeps its own group by sha.
  event_absence_c1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Run the three cases through the pinned verifier
        run: uv run --no-project --python 3.13 --with probity-verify==0.2.2 python interop/event-absence-c1-sergeev/run.py
    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['event_absence_c1'] }}
    permissions:
      contents: read

  # from field-readiness.yml:
  #  Five checks per field of predicates (scripts/field-readiness.py): the type URIs
  #  resolve, the latest release lists the corpus, the reference verifier that
  #  release pins judges every member, an outside workflow runs the corpus, and an
  #  adopter record names the field. Pull requests that touch the script run its
  #  offline cases and one live report. The schedule writes the daily report. Red
  #  checks are reported in the job summary and do not fail the job. A read that
  #  did not complete fails it, because then the count says nothing.
  #  Daily 06:30 UTC.
  #  A newer push to the same pull request or branch supersedes the older run.
  #  Main and tags never cancel: each main push keeps its own group by sha.
  field_readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: every check state is reached by its own case
        run: python3 scripts/field-readiness-test.py
      - name: restart field, live
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/field-readiness.py restart
    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['field_readiness'] }}
    permissions:
      contents: read

  # from gemara-method-link.yml:
  #  Bot-token merges suppress push events; allow the native jobs on exact main.
  #  A newer push to the same pull request or branch supersedes the older run.
  #  Main and tags never cancel: each main push keeps its own group by sha.
  gemara_method_link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13.15"
      - name: install pinned test dependencies
        run: python -m pip install -r interop/gemara-method-link/requirements-test.txt
      - name: relationship and tampering tests
        run: python -m pytest interop/gemara-method-link/test_method_link.py -q
      - name: reproduce pinned inputs and reader reports
        run: |
          set -euo pipefail
          cd interop/gemara-method-link
          mkdir -p .build
          python method_link.py > .build/result.json
          python method_link.py --adapter "python method_link.py --stdin" > .build/self-adapter.json
          status=0
          python method_link.py --adapter "python controls/accept_all.py" > .build/negative-control.json || status=$?
          test "$status" -eq 1
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from method_link import load_cases

          root = Path.cwd()
          manifest, cases = load_cases(root)
          pin = hashlib.sha256((root / "MANIFEST.json").read_bytes()).hexdigest()
          for name in ("result.json", "negative-control.json"):
              actual = json.loads((root / ".build" / name).read_text())
              expected = json.loads((root / name).read_text())
              assert actual == expected, f"report drift: {name}"
              assert (root / ".build" / name).read_bytes() == (root / name).read_bytes()
              assert actual["manifest_sha256"] == pin, f"manifest drift: {name}"
              assert actual["total"] == len(cases) == len(manifest["cases"])
          result = json.loads((root / ".build/result.json").read_text())
          adapter = json.loads((root / ".build/self-adapter.json").read_text())
          negative = json.loads((root / ".build/negative-control.json").read_text())
          assert adapter == result, "self-adapter drift"
          assert result["matched"] == result["total"]
          assert negative["matched"] < negative["total"]
          print(f"Pinned cases={len(cases)} sources={len(manifest['sources'])} manifest={pin}")
          print(f"Author reader={result['matched']}/{result['total']}; "
                f"self-adapter={adapter['matched']}/{adapter['total']}; "
                f"accept-all={negative['matched']}/{negative['total']} exit=1")
          PY
      - name: install checksum-pinned native CUE
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import io
          import json
          import os
          import tarfile
          import urllib.request
          from pathlib import Path

          manifest = json.loads(Path("interop/gemara-method-link/native/MANIFEST.json").read_text())
          tool = manifest["tool"]
          with urllib.request.urlopen(tool["archive_url"], timeout=60) as response:
              archive = response.read()
          assert hashlib.sha256(archive).hexdigest() == tool["archive_sha256"], "CUE archive drift"
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz") as release:
              member = release.getmember("cue")
              assert member.isfile(), "CUE executable is not a regular file"
              with release.extractfile(member) as stream:
                  binary = stream.read()
          assert hashlib.sha256(binary).hexdigest() == tool["binary_sha256"], "CUE binary drift"
          directory = Path(os.environ["RUNNER_TEMP"]) / "gemara-native-cue"
          directory.mkdir(exist_ok=True)
          executable = directory / "cue"
          executable.write_bytes(binary)
          executable.chmod(0o755)
          with Path(os.environ["GITHUB_ENV"]).open("a") as environment:
              environment.write(f"GEMARA_CUE_BINARY={executable}\n")
          print(f"CUE archive={tool['archive_sha256']} binary={tool['binary_sha256']}")
          PY
      - name: native schema and integrity tests
        run: python -m pytest interop/gemara-method-link/test_native_cue.py -q
      - name: reproduce separate native schema reports
        run: |
          set -euo pipefail
          cd interop/gemara-method-link
          python native_cue.py --cue "$GEMARA_CUE_BINARY" --output-dir native/.build > .build/native-combined.json
          python - <<'PY'
          import json
          from pathlib import Path

          from native_cue import separate_reports

          report = json.loads(Path(".build/native-combined.json").read_text())
          for filename, evidence in separate_reports(report).items():
              generated = Path("native/.build") / filename
              pinned = Path("native") / filename
              assert generated.read_bytes() == pinned.read_bytes(), f"native report drift: {filename}"
              assert json.loads(generated.read_text()) == evidence
              totals = evidence["totals"]
              print(f"{filename}: {totals['cases']} cases; {totals['policies']} Policy + "
                    f"{totals['logs']} EvaluationLog; accepted={totals['accepted']} "
                    f"rejected={totals['rejected']}; rejected logs={evidence['rejected_logs']}")
          PY
    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['gemara_method_link'] }}
    permissions:
      contents: read

  # from governance.yml:
  #  The change process, checked rather than described.

  #  GOVERNANCE.md and CONTRIBUTING.md make commitments to anyone deciding whether
  #  to cite this suite: a published revision is never mutated, an objection gets a
  #  published disposition with a reason, a partial resolution states its residual.
  #  Prose making a commitment is a promise; a gate refusing the change that breaks
  #  it is a process. This workflow is the second thing.

  #  It is a separate workflow rather than another step in ci.yml because its
  #  subject is separate: ci.yml asks whether the corpus and the rails are correct,
  #  and this asks whether the record of how they got that way is honest. The two
  #  fail for unrelated reasons and a reader of a red run should be able to tell
  #  which question failed without opening the log.
  #  A newer push to the same pull request or branch supersedes the older run.
  #  Main and tags never cancel: each main push keeps its own group by sha.
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v7

      - name: sync toolchain
        run: uv sync --extra dev

      # Type-checked here rather than in ci.yml's mypy step because these two
      # files arrived with this workflow and the check travels with the thing it
      # checks. Same settings: pyproject.toml carries strict = true.
      - name: mypy --strict
        run: uv run mypy scripts/dispositions-gate.py scripts/dispositions-gate-test.py

      # Every row resolves against a primary record this repository already
      # carries -- a revision the changelog names, vectors the manifest holds, a
      # phrase still present in the file the row attributes it to -- and the
      # published table is the one the ledger renders. The step name carries no
      # count of the rows on purpose: the gate prints its own tally by
      # resolution, which is the one derived source for that number, and a
      # figure typed here would be a copy of it that nothing invalidates.
      - name: every published disposition resolves against the record
        run: python3 scripts/dispositions-gate.py

      # The gate's own cases, which are mostly refusals, plus a control that
      # requires the unmutated staged copy to PASS. Without the control every
      # refusal could be a staging bug; without the refusals a green run would
      # be compatible with a gate that enforces nothing, which this repository
      # has shipped before.
      - name: the disposition gate can fail
        run: python3 scripts/dispositions-gate-test.py
    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['governance'] }}
    permissions:
      contents: read

  # from govops-capability-id.yml:
  #  A newer push to the same pull request or branch supersedes the older run.
  #  Main and tags never cancel: each main push keeps its own group by sha.
  govops_capability_id:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: rustup toolchain install 1.99.0 --profile minimal -c rustfmt -c clippy
      - run: rustup default 1.99.0
      - name: install pinned reader and check dependencies
        run: python -m pip install -r interop/govops-capability-id/requirements-check.txt
      - name: check native raw admission
        run: |
          cargo fmt --manifest-path interop/govops-capability-id/admission/Cargo.toml --check
          cargo clippy --locked --manifest-path interop/govops-capability-id/admission/Cargo.toml --all-targets -- -D warnings
          cargo build --locked --release --manifest-path interop/govops-capability-id/admission/Cargo.toml
      - name: lint the reader and finite controls
        run: |
          python -m ruff check --config interop/govops-capability-id/pyproject.toml \
            interop/govops-capability-id/govops_ids interop/govops-capability-id/fixtures.py \
            interop/govops-capability-id/qualify.py interop/govops-capability-id/test_reader.py
      - name: exercise trust, scope, raw input and failure controls
        run: |
          set -euo pipefail
          mkdir -p interop/govops-capability-id/.build
          python -m unittest discover -s interop/govops-capability-id -p test_reader.py -v \
            2>&1 | tee interop/govops-capability-id/.build/unit-tests.txt
      - name: qualify the installed API and command
        run: |
          python interop/govops-capability-id/qualify.py \
            --admitter interop/govops-capability-id/admission/target/release/govops-jcs-admission \
            --installation "$RUNNER_TEMP/govops-ids-installed"
      - name: retain original inputs, source and native responses
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: govops-ids-${{ matrix.python }}-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          path: |
            .github/workflows/govops-capability-id.yml
            interop/govops-capability-id/govops_ids/*.py
            interop/govops-capability-id/fixtures.py
            interop/govops-capability-id/qualify.py
