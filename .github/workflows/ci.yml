# One workflow for every pull-request and scheduled check. The changes job selects each
# check: on a pull request by the paths it declared (a change under .github/ or to a
# toolchain file selects all); on a schedule by its cron; on push to main, a merge-queue
# batch or a manual run, all of them, except that commit-range checks skip in the merge
# queue because they ran on the pull request. Branch protection requires only ci-ok.
# Generated by the folding script; workflows that stay separate say why in _report.json.
name: ci
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
  merge_group:
  push:
    branches:
      - main
  schedule:
    - cron: "19 8 * * 1"
    - cron: '23 7 * * 3'
    - cron: '30 6 * * *'
    - cron: '35 5 * * 1'
    - cron: '40 5 * * 1'
    - cron: '41 6 * * 3'
    - cron: "41 8 * * 1"
    - cron: "47 7 * * *"
    - cron: '50 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event.schedule || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
