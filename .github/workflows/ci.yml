  no_internal_drafts:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Reject forbidden strings in tracked files
      run: |
        # One scan covers the website host, private product names, and
        # markers that identify an internal note.
        # Both were literal lists in this file until 2026-08-17; both are
        # now salted digests in .githooks/commit-msg.forbidden-words, shared with
        # the commit-msg hook so the message surface and the content surface
        # cannot drift apart.
        #
        # The scan slides a window of each declared length over every lowercased
        # line, which is the same reach as the case-insensitive substring search
        # it replaces -- a name glued inside a longer identifier is still caught.
        # It never prints what it matched: doing so would reproduce the string
        # into this public Actions log, committing the leak in the failure report.
        #
        # Exit 2 means the rule list did not load. That is a failure, not a pass:
        # a guard that could not read its rules has verified nothing, and
        # reporting that as clean is how a check stops being a check.
        python3 scripts/forbidden-word-scan.py
        status=$?
        if [ "$status" -eq 1 ]; then
          echo "::error::A tracked file names the website or a private product."
          exit 1
        elif [ "$status" -ne 0 ]; then
          echo "::error::The forbidden-string rule list failed to load; nothing was verified."
          exit 1
        fi
    - name: Reject draft-named files
      run: |
        # A file named DRAFT-* in a public standards repo is a working document that
        # escaped. Publish the finished artifact, not the draft of it.
        if git ls-files | grep -E '(^|/)DRAFT-' ; then
          echo "::error::A DRAFT- file is tracked. Publish the finished artifact instead."
          exit 1
        fi
        echo "no DRAFT- files tracked"
    - name: No tool-state directories on a public repo
      run: |
        # The guard checked FILENAMES and PHRASES and missed a whole directory of
        # tool state. `.humanizer/pending.json` keys on absolute paths, so it
        # published the operator's home directory and an "armed" rewriting state.
        # A leak class is only closed when the check is widened to the shape that
        # escaped it, not to the one instance that was found.
        found=0
        for d in .humanizer .ledger .cache .scratch; do
          if git ls-files --error-unmatch "$d" >/dev/null 2>&1; then
            echo "::error::tool-state directory '$d' is tracked on a PUBLIC repo"
            found=1
          fi
        done
        # Absolute home paths are never legitimate in a published artifact.
        if git grep -nI -P '/home/(?!(?:runner|gate|default)/)[a-z_][a-z0-9_-]*/' -- . ':!*.yml' >/dev/null 2>&1; then
          echo "::error::an absolute /home/<user>/ path is tracked; it leaks the author's filesystem"
          git grep -nI -P '/home/(?!(?:runner|gate|default)/)[a-z_][a-z0-9_-]*/' -- . ':!*.yml' | head -20
          found=1
        fi
        exit $found
    needs:
    - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['no_internal_drafts'] }}
    permissions:
      contents: read
