  ci__action:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: '1.26'
    - name: build the shipped verifier into the workspace
      run: go build -o ./aee-verify ./cmd/aee-verify
    - name: the action replays the corpus against it
      id: replay
      uses: ./
      with:
        verifier: ./aee-verify -validity-only -json
    - name: the outputs carry the totals
      env:
        RESULT: ${{ steps.replay.outputs.result }}
        VECTORS: ${{ steps.replay.outputs.vectors }}
        CONFORM: ${{ steps.replay.outputs.conform }}
        EXECUTED: ${{ steps.replay.outputs.executed }}
      run: |
        echo "result=$RESULT vectors=$VECTORS conform=$CONFORM executed=$EXECUTED"
        test "$RESULT" = pass
        test "$VECTORS" -gt 0
        test "$CONFORM" = "$VECTORS"
        test "$EXECUTED" = "$VECTORS"
    - name: the action refuses a verifier it cannot run
      id: unrunnable
      continue-on-error: true
      uses: ./
      with:
        verifier: ./no-such-verifier -json
        artifact-name: agent-evidence-vectors-results-unrunnable
        report-path: unrunnable-report.json
    - name: and that job would have failed
      env:
        OUTCOME: ${{ steps.unrunnable.outcome }}
        RESULT: ${{ steps.unrunnable.outputs.result }}
      run: |
        echo "outcome=$OUTCOME result=$RESULT"
        test "$OUTCOME" = failure
        test "$RESULT" = fail
    - name: the action replays the a2a-jcs-v01 corpus
      id: a2a
      uses: ./
      with:
        corpus: vectors-a2a-jcs-v01
        verifier: python -m agent_evidence_vectors.a2ajcs
        artifact-name: agent-evidence-vectors-results-a2a
        report-path: a2a-report.json
    - name: every a2a signing-input vector ran and conformed
      env:
        RESULT: ${{ steps.a2a.outputs.result }}
        VECTORS: ${{ steps.a2a.outputs.vectors }}
        CONFORM: ${{ steps.a2a.outputs.conform }}
        EXECUTED: ${{ steps.a2a.outputs.executed }}
      run: |
        echo "result=$RESULT vectors=$VECTORS conform=$CONFORM executed=$EXECUTED"
        test "$RESULT" = pass
        test "$VECTORS" -gt 0
        test "$CONFORM" = "$VECTORS"
        test "$EXECUTED" = "$VECTORS"
    - name: the action fails a canonicalizer that writes 1e-06
      id: a2abad
      continue-on-error: true
      uses: ./
      with:
        corpus: vectors-a2a-jcs-v01
        verifier: python corpora/vectors-a2a-jcs-v01/tests/bad_verifier.py
        artifact-name: agent-evidence-vectors-results-a2a-bad
        report-path: a2a-bad-report.json
    - name: and that job would have failed
      env:
        OUTCOME: ${{ steps.a2abad.outcome }}
        RESULT: ${{ steps.a2abad.outputs.result }}
        EXECUTED: ${{ steps.a2abad.outputs.executed }}
        VECTORS: ${{ steps.a2abad.outputs.vectors }}
      run: |
        echo "outcome=$OUTCOME result=$RESULT executed=$EXECUTED"
        test "$OUTCOME" = failure
        test "$RESULT" = fail
        test "$VECTORS" -gt 0
        test "$EXECUTED" = "$VECTORS"
    - name: the action drives a runtime through the uncertain-effect scenarios
      id: runtime
      uses: ./
      with:
        corpus: vectors-uncertain-effect
        runtime: python3 corpora/vectors-uncertain-effect/tests/runtime_adapter.py
        artifact-name: agent-evidence-vectors-results-runtime
        report-path: runtime-report.json
    - name: every scenario ran and passed
      env:
        RESULT: ${{ steps.runtime.outputs.result }}
        VECTORS: ${{ steps.runtime.outputs.vectors }}
        EXECUTED: ${{ steps.runtime.outputs.executed }}
      run: |
        echo "result=$RESULT scenarios=$VECTORS executed=$EXECUTED"
        test "$RESULT" = pass
        test "$VECTORS" -gt 0
        test "$EXECUTED" = "$VECTORS"
    - name: the action fails a runtime that resends after a lost reply
      id: runtimebad
      continue-on-error: true
      uses: ./
      with:
        corpus: vectors-uncertain-effect
        runtime: python3 corpora/vectors-uncertain-effect/tests/runtime_adapter.py --policy blind
        artifact-name: agent-evidence-vectors-results-runtime-bad
        report-path: runtime-bad-report.json
    - name: and that job would have failed
      env:
        OUTCOME: ${{ steps.runtimebad.outcome }}
        RESULT: ${{ steps.runtimebad.outputs.result }}
      run: |
        echo "outcome=$OUTCOME result=$RESULT"
        test "$OUTCOME" = failure
        test "$RESULT" = fail
    - name: the action drives a decision client through the failure-mode matrix
      id: decisionclient
      uses: ./
      with:
        corpus: vectors-decision-client-failure-modes
        runtime: python3 corpora/vectors-decision-client-failure-modes/tests/client_adapter.py --policy closed
        artifact-name: agent-evidence-vectors-results-decision-client
        report-path: decision-client-report.json
    - name: every decision-client scenario ran and passed
      env:
        RESULT: ${{ steps.decisionclient.outputs.result }}
        VECTORS: ${{ steps.decisionclient.outputs.vectors }}
        EXECUTED: ${{ steps.decisionclient.outputs.executed }}
      run: |
        echo "result=$RESULT scenarios=$VECTORS executed=$EXECUTED"
        test "$RESULT" = pass
        test "$VECTORS" -gt 0
        test "$EXECUTED" = "$VECTORS"
    - name: the action fails a decision client that fails open
      id: decisionclientbad
      continue-on-error: true
      uses: ./
      with:
        corpus: vectors-decision-client-failure-modes
        runtime: python3 corpora/vectors-decision-client-failure-modes/tests/client_adapter.py --policy open
        artifact-name: agent-evidence-vectors-results-decision-client-bad
        report-path: decision-client-bad-report.json
    - name: and that decision-client job would have failed
      env:
        OUTCOME: ${{ steps.decisionclientbad.outcome }}
        RESULT: ${{ steps.decisionclientbad.outputs.result }}
      run: |
        echo "outcome=$OUTCOME result=$RESULT"
        test "$OUTCOME" = failure
        test "$RESULT" = fail
    - name: stage the a2a-jcs-v01 corpus as workspace directories
      run: |
        mkdir -p .build
        rm -rf .build/a2a-jcs-dir .build/a2a-jcs-dir-edited
        cp -R corpora/vectors-a2a-jcs-v01 .build/a2a-jcs-dir
        cp -R corpora/vectors-a2a-jcs-v01 .build/a2a-jcs-dir-edited
        sed -i 's/302e3030303030317d/31652d30367d/' .build/a2a-jcs-dir-edited/a5-number-serialization/A5-001.json
        ! cmp -s corpora/vectors-a2a-jcs-v01/a5-number-serialization/A5-001.json .build/a2a-jcs-dir-edited/a5-number-serialization/A5-001.json
    - name: the action replays a corpus directory named by the vectors input
      id: a2adir
      uses: ./
      with:
        vectors: .build/a2a-jcs-dir
        verifier: python -m agent_evidence_vectors.a2ajcs
        artifact-name: agent-evidence-vectors-results-a2a-dir
        report-path: a2a-dir-report.json
    - name: every vector in the directory ran, under the locked digest
      env:
        RESULT: ${{ steps.a2adir.outputs.result }}
        VECTORS: ${{ steps.a2adir.outputs.vectors }}
        EXECUTED: ${{ steps.a2adir.outputs.executed }}
        REPORT: ${{ steps.a2adir.outputs.report }}
      run: |
        echo "result=$RESULT vectors=$VECTORS executed=$EXECUTED"
        test "$RESULT" = pass
        test "$VECTORS" -gt 0
        test "$EXECUTED" = "$VECTORS"
        replayed=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["corpus"]["corpusDigest"])' "$REPORT")
        locked=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["corpusDigest"])' corpora/vectors-a2a-jcs-v01/source-lock.json)
        echo "replayed=$replayed locked=$locked"
        test "$replayed" = "$locked"
    - name: the action fails a directory whose bytes were changed
      id: a2adiredited
      continue-on-error: true
      uses: ./
      with:
        vectors: .build/a2a-jcs-dir-edited
        verifier: python -m agent_evidence_vectors.a2ajcs
        artifact-name: agent-evidence-vectors-results-a2a-dir-edited
        report-path: a2a-dir-edited-report.json
    - name: and that job would have failed
      env:
        OUTCOME: ${{ steps.a2adiredited.outcome }}
        RESULT: ${{ steps.a2adiredited.outputs.result }}
      run: |
        echo "outcome=$OUTCOME result=$RESULT"
        test "$OUTCOME" = failure
        test "$RESULT" = fail
    needs:
    - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['ci'] }}
    permissions:
      contents: read
  claim_record:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: 3.13.15
    - name: Install pinned control dependencies
      run: python -m pip install pytest==8.4.2 mypy==2.3.1
    - name: The committed corpus is what the builder writes
      run: python scripts/claim-record-build.py --check
    - name: Every case, every repair and every rule kill
      run: python -m pytest -q scripts/claim-record-test.py
    - name: The verifier type-checks under strict mode
      working-directory: packaging
      run: python -m mypy --strict agent_evidence_vectors/claim_record/reader.py agent_evidence_vectors/claim_record/run.py agent_evidence_vectors/claim_record/ops.py
    - name: Retain the checkout run
      working-directory: packaging
      run: python -m agent_evidence_vectors.claim_record.run run --output ../.build/claim-record/checkout --implementation-revision "${{ github.event.pull_request.head.sha || github.sha }}"
    - name: Run both installed entry points from the built wheel alone
      run: |
        python -m pip install build==1.3.0
        python -m build --wheel --outdir .build/dist
        python -m venv .build/wheel-venv
        .build/wheel-venv/bin/python -m pip install .build/dist/*.whl
        cd "$RUNNER_TEMP"
        "$GITHUB_WORKSPACE/.build/wheel-venv/bin/agent-evidence-vectors" claim run \
          --output "$GITHUB_WORKSPACE/.build/claim-record/wheel"
        grep -q '"implementation_revision": "agent-evidence-vectors==' \
          "$GITHUB_WORKSPACE/.build/claim-record/wheel/report.json"
        "$GITHUB_WORKSPACE/.build/wheel-venv/bin/agent-evidence-vectors-claim" run \
          --output "$GITHUB_WORKSPACE/.build/claim-record/wheel-console"
    - name: Retain the reports
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: claim-record
        path: .build/claim-record
        if-no-files-found: error
        retention-days: 90
    needs:
    - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['claim_record'] }}
    permissions:
      contents: read
  codeql:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
        - language: go
          build-mode: autobuild
        - language: python
          build-mode: none
        - language: actions
          build-mode: none
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      if: matrix.language == 'go'
      with:
        go-version: '1.26'
    - name: initialize codeql
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
    - name: perform codeql analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: /language:${{ matrix.language }}
    needs:
    - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['codeql'] }}
  commit_message_lint:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Gate self-test
      run: .githooks/commit-msg --selftest
    - name: Lint the prospective merge subject
      if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
      env:
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        export LC_ALL=C
        if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] \
           || [[ "$PR_TITLE" == *$'\n'* || "$PR_TITLE" == *$'\r'* ]]; then
          echo 'Expected a single-line PR title and a positive PR number.' >&2
          exit 1
        fi
        subject="${PR_TITLE} (#${PR_NUMBER})"
        if [ "${#subject}" -gt 72 ]; then
          echo 'Shorten the PR title: the merge subject including (#number) exceeds 72 characters.' >&2
          exit 1
        fi
        message_file=$(mktemp)
        trap 'rm -f "$message_file"' EXIT
        printf '%s\n' "$subject" > "$message_file"
        .githooks/commit-msg "$message_file"
    - name: Lint the commit messages this event introduces
      env:
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_REF: ${{ github.ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        PUSH_ACTOR: ${{ github.actor }}
      run: |
        set -euo pipefail
        zero=0000000000000000000000000000000000000000
        if [ -z "${DEFAULT_BRANCH:-}" ] \
           || ! git check-ref-format "refs/heads/$DEFAULT_BRANCH"; then
          echo 'Refusing a commit range without a valid repository default branch.' >&2
          exit 1
        fi
        if [ -n "${PR_BASE:-}" ]; then
          range="$(git merge-base "$PR_BASE" HEAD)..HEAD"
        elif [[ "${PUSH_REF:-refs/heads/local-gate}" == refs/heads/* ]] \
             && [ "${PUSH_REF:-}" != "refs/heads/$DEFAULT_BRANCH" ]; then
          # Published default-branch messages can arrive through a merge.
          # A missing base cannot establish which branch commits are new.
          if ! git cat-file -e "refs/remotes/origin/$DEFAULT_BRANCH^{commit}" 2>/dev/null; then
            echo 'Refusing a commit range whose published default base is unavailable.' >&2
            exit 1
          fi
          # With no event ref, the local gate checks all unpublished commits.
          range="refs/remotes/origin/$DEFAULT_BRANCH..HEAD"
        elif [ -n "${PUSH_BEFORE:-}" ] && [ "$PUSH_BEFORE" != "$zero" ] \
             && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
          range="${PUSH_BEFORE}..HEAD"
        elif git rev-parse -q --verify HEAD~1 >/dev/null; then
          # New branch, or a force-push whose old tip is gone: lint the tip.
          range="HEAD~1..HEAD"
        else
          range="HEAD"
        fi
        echo "linting $range"
        # Dependabot writes its own subjects ("bump X from A to B in /dir")
        # and stops maintaining a pull request once anyone else pushes to
        # it, so its commits cannot be brought under the subject limit. They
        # never reach the default branch either: the squash subject is the
        # PR title, which the step above lints. On a Dependabot pull request
        # or a Dependabot push to its own branch, the commits Dependabot
        # authored are therefore left out, and every other commit in the
        # range is still linted one by one against the same baseline.
        bot='dependabot[bot]'
        bot_email='49699333+dependabot[bot]@users.noreply.github.com'
        if [ "${PR_AUTHOR:-}" = "$bot" ] \
           || { [ -z "${PR_BASE:-}" ] && [ "${PUSH_ACTOR:-}" = "$bot" ] \
                && [[ "${PUSH_REF:-}" == refs/heads/dependabot/* ]]; }; then
          status=0
          for commit in $(git rev-list "$range"); do
            if [ "$(git log -1 --format=%ae "$commit")" = "$bot_email" ]; then
              echo "left out: $(git log -1 --format='%h %s' "$commit") (written by Dependabot)"
              continue
            fi
            .githooks/commit-msg --check-range "$commit^!" || status=1
          done
          exit "$status"
        fi
        .githooks/commit-msg --check-range "$range"
    needs:
    - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['commit_message_lint'] }}
    permissions:
      contents: read
  crosswalk__check-local:
    if: ${{ fromJSON(needs.changes.outputs.run)['crosswalk'] && (github.event_name != 'schedule') }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - name: the crosswalk publishes this corpus as it stands
      run: python3 scripts/crosswalk-gen.py --check-local
    needs:
    - changes
    permissions:
      contents: read
  crosswalk__crosswalk-upstream:
    if: ${{ fromJSON(needs.changes.outputs.run)['crosswalk'] && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
    - uses: actions/checkout@v7.0.1
    - name: clone the upstream corpus
      run: |
        rm -rf .crosswalk-upstream
        mkdir -p .crosswalk-upstream
        git clone --depth 1 https://github.com/aveproject/ave .crosswalk-upstream/ave
    - name: the crosswalk still describes both trees
      run: |
        set +e
        python3 scripts/crosswalk-gen.py --ave-repo .crosswalk-upstream/ave --check \
          > .crosswalk-upstream/report.txt 2>&1
        status=$?
        set -e
        cat .crosswalk-upstream/report.txt
        echo "$status" > .crosswalk-upstream/status
        # Exit 0 and exit 1 are both answers: agreement, and a divergence the
        # next step files. Anything else means the generator did not run to a
        # verdict, and an unread upstream is not an agreeing one.
        if [ "$status" != "0" ] && [ "$status" != "1" ]; then
          echo "crosswalk-gen.py exited $status, which is neither agreement nor a"
          echo "divergence. Nothing was compared, so nothing is being reported."
          exit 1
        fi
    - name: open or update the divergence issue
      env:
        GH_TOKEN: ${{ github.token }}
        CROSSWALK_REPO: ${{ github.repository }}
        CROSSWALK_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        if [ "$(cat .crosswalk-upstream/status)" = "0" ]; then
          echo "the crosswalk agrees with both trees, so there is nothing to file"
          exit 0
        fi
        upstream=$(git -C .crosswalk-upstream/ave rev-parse HEAD)
        {
          echo "\`crosswalks/aee-to-ave.json\` no longer describes both trees."
          echo
          echo "Upstream aveproject/ave is at \`$upstream\`. What the generator said:"
          echo
          echo '```'
          cat .crosswalk-upstream/report.txt
          echo '```'
          echo
          echo "Regenerate, which needs a checkout because the upstream side is counted out of a real tree:"
          echo
          echo '```'
          echo "git clone https://github.com/aveproject/ave /tmp/ave"
          echo "python3 scripts/crosswalk-gen.py --ave-repo /tmp/ave"
          echo '```'
          echo
          echo "If the generator refuses on an uncovered value, that is not a regeneration. Upstream has added a value of a mapped field, and what it means in this predicate's vocabulary is an editorial decision: add a \`Row\` in \`scripts/crosswalk-gen.py\`, or a \`KNOWN_UNCOVERED\` entry carrying the reason it maps to nothing."
          echo
          echo "Run: ${CROSSWALK_RUN_URL:-not a runner}"
        } > .crosswalk-upstream/body.md
        cat .crosswalk-upstream/body.md
        if [ "$GITHUB_ACTIONS" != "true" ]; then
          echo
          echo "NOT ON A RUNNER: the body above was written and NOTHING was filed."
          echo "This step posts only where \$GITHUB_ACTIONS is true, so the local"
          echo "workflow mirror can run it without writing to the repository."
          exit 0
        fi
        title='crosswalk: aee-to-ave.json has diverged from upstream'
        existing=$(gh issue list --repo "$CROSSWALK_REPO" --state open \
          --search "$title in:title" --json number --jq '.[0].number')
        if [ -n "$existing" ]; then
          gh issue edit "$existing" --repo "$CROSSWALK_REPO" \
            --body-file .crosswalk-upstream/body.md
        else
          gh issue create --repo "$CROSSWALK_REPO" --title "$title" \
            --body-file .crosswalk-upstream/body.md
        fi
    - name: leave no upstream checkout behind
      run: rm -rf .crosswalk-upstream
    needs:
    - changes
