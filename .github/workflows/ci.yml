  # from secret-scan.yml:
  #  gitleaks over the history of the commit under test with .gitleaks.toml. The
  #  corpus is full of public key material, so the config allowlists those field
  #  shapes; this job keeps a real credential shape from landing, and keeps a
  #  consumer that vendors these files from inheriting findings we have not looked
  #  at. scripts/secret-scan.sh pins gitleaks 8.30.1 by hash and is the same command
  #  the pre-push hook runs. It reads the history reachable from the checked-out
  #  commit only: the checkout fetches every branch, and gitleaks defaults to all of
  #  them, so one open branch holding a finding failed this job on main and on every
  #  other branch.
  #  A pull request's own run covers its branch; a branch push would repeat it.
  #  A newer push to the same pull request or branch supersedes the older run.
  #  Main and tags never cancel: each main push keeps its own group by sha.
  secret_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: scan the history of this commit
        run: scripts/secret-scan.sh
      - name: prove the scan ignores other branches
        run: |
          python3 -m pip install pytest==8.4.2
          python3 -m pytest -q scripts/secret-scan-scope-test.py
    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['secret_scan'] }}
    permissions:
      contents: read

  # from trace-acta-receipts.yml:
  #  A newer push to the same pull request or branch supersedes the older run.
  #  Main and tags never cancel: each main push keeps its own group by sha.
  trace_acta_receipts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13.15", "3.14.7"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Retain and check the immutable upstream verifier
        run: |
          set -euo pipefail
          mkdir -p .build
          capture=$(mktemp -d .build/trace-acta-receipts.XXXXXXXX)
          echo "TRACE_CAPTURE_DIR=$capture" >> "$GITHUB_ENV"
          curl --retry 5 --retry-delay 5 --retry-all-errors --fail --location --proto '=https' --max-time 60 \
            --dump-header "$capture/source-http-headers.txt" \
            'https://raw.githubusercontent.com/agentrust-io/trace-spec/b938790f7f46d3a943c76a5360d2de60bb72112c/tools/acta_receipt_verifier.py' \
            --output "$capture/acta_receipt_verifier.py" \
            2> "$capture/source-fetch.stderr"
          printf '%s  %s\n' \
            44fd005825432c1179d4722f7439f1225b45fde6f36e827e911aa64f88bc5349 \
            "$capture/acta_receipt_verifier.py" > "$capture/source.sha256"
          sha256sum --check "$capture/source.sha256" | tee "$capture/source-check.txt"
      - name: Run the repository corpus against the upstream reader
        run: |
          set -euo pipefail
          uv run --locked --extra dev python --version > "$TRACE_CAPTURE_DIR/python-version.txt"
          status=0
          uv run --locked --extra dev python packaging/run_vectors.py \
            --corpus vectors-receipt-signature \
            --verifier "python3 $TRACE_CAPTURE_DIR/acta_receipt_verifier.py" \
            --report "$TRACE_CAPTURE_DIR/report.json" \
            > "$TRACE_CAPTURE_DIR/harness.stdout" 2> "$TRACE_CAPTURE_DIR/harness.stderr" || status=$?
          # Exit 1 means the harness judged at least one member as failing, which is the
          # recorded answer below; any other status means it did not run the comparison.
          test "$status" -le 1
          uv run --locked --extra dev python interop/trace-acta-receipts/check_report.py \
            "$TRACE_CAPTURE_DIR/report.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trace-acta-receipts-${{ matrix.python }}-${{ github.run_attempt }}
          path: ${{ env.TRACE_CAPTURE_DIR }}
          include-hidden-files: true
          if-no-files-found: error
    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['trace_acta_receipts'] }}
    permissions:
      contents: read

  # from trace-anchor-tr-anc.yml:
  #  A newer push to the same pull request or branch supersedes the older run.
  #  Main and tags never cancel: each main push keeps its own group by sha.
  trace_anchor_tr_anc:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: The README table matches the recorded pins
        run: python3 interop/trace-anchor-tr-anc/test_record.py
      - name: Replay the corpus through TRACE's TR-ANC-002 at each pinned commit
        run: |
          set -euo pipefail
          mkdir -p .build
          capture=$(mktemp -d .build/trace-anchor-tr-anc.XXXXXXXX)
          echo "TRACE_CAPTURE_DIR=$capture" >> "$GITHUB_ENV"
          uv run --locked --extra dev python --version > "$capture/python-version.txt"
          uv run --locked --extra dev python interop/trace-anchor-tr-anc/compare.py "$capture" \
            | tee "$capture/compare.stdout"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trace-anchor-tr-anc-${{ github.run_attempt }}
          path: ${{ env.TRACE_CAPTURE_DIR }}
          include-hidden-files: true
          if-no-files-found: error
    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['trace_anchor_tr_anc'] }}
    permissions:
      contents: read

  # from trade-booking.yml:
  #  A newer push to the same pull request or branch supersedes the older run.
  #  Main and tags never cancel: each main push keeps its own group by sha.
  trade_booking:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.15'
      - name: Install pinned control dependencies
        run: python -m pip install pytest==8.4.2
      - name: The committed corpus is what the builder writes
        run: python scripts/trade-booking-build.py --check
      - name: Test every expected answer, refusal and rule kill
        run: python -m pytest -q scripts/trade-booking-test.py
      - name: Retain the checkout run
        working-directory: packaging
        run: >-
          python -m agent_evidence_vectors.trade_booking.run
          --output ../.build/trade-booking/checkout
          --implementation-revision "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Run the installed entry point from the built wheel alone
        run: |
          python -m pip install build==1.3.0
          python -m build --wheel --outdir .build/dist
          python -m venv .build/wheel-venv
          .build/wheel-venv/bin/python -m pip install .build/dist/*.whl
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.build/wheel-venv/bin/agent-evidence-vectors-trade-booking" \
            --output "$GITHUB_WORKSPACE/.build/trade-booking/wheel"
          grep -q '"implementation_revision": "agent-evidence-vectors==' \
            "$GITHUB_WORKSPACE/.build/trade-booking/wheel/report.json"
      - name: Retain the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trade-booking
          path: .build/trade-booking
          if-no-files-found: error
          retention-days: 90
    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['trade_booking'] }}
    permissions:
      contents: read

  # from verdict-evidence.yml:
  #  A newer push to the same pull request or branch supersedes the older run.
  #  Main and tags never cancel: each main push keeps its own group by sha.
  verdict_evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.15'
      - name: Install pinned control dependencies
        run: python -m pip install pytest==8.4.2
      - name: The committed corpus is what the builder writes
        run: python scripts/verdict-evidence-build.py --check
      - name: Test every expected answer, refusal, rule kill and verifier contract
        run: python -m pytest -q scripts/verdict-evidence-test.py
      - name: Retain the checkout run
        working-directory: packaging
        run: >-
          python -m agent_evidence_vectors.verdict_evidence.run
          --output ../.build/verdict-evidence/checkout
      - name: Run the installed entry point from the built wheel alone
        run: |
          python -m pip install build==1.3.0
          python -m build --wheel --outdir .build/dist
          python -m venv .build/wheel-venv
          .build/wheel-venv/bin/python -m pip install .build/dist/*.whl
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.build/wheel-venv/bin/agent-evidence-vectors-verdict-evidence" \
            --output "$GITHUB_WORKSPACE/.build/verdict-evidence/wheel"
          grep -q '"implementation_revision": "agent-evidence-vectors==' \
            "$GITHUB_WORKSPACE/.build/verdict-evidence/wheel/report.json"
      - name: Retain the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verdict-evidence
          path: .build/verdict-evidence
          if-no-files-found: error
          retention-days: 90
    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['verdict_evidence'] }}
    permissions:
      contents: read

  # from version-pins.yml:
  #  Holds every live page to the version its owner decides (pyproject.toml here), and
  #  holds each historical exclusion in version-pins.toml to a planted stale pin.
  #  A newer push to the same pull request or branch supersedes the older run.
  #  Main and tags never cancel: each main push keeps its own group by sha.
  version_pins__pins:
    if: ${{ fromJSON(needs.changes.outputs.run)['version_pins'] && (github.event_name != 'schedule') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: live pages agree with their owner
        uses: probityai/.github/actions/version-pins@bfaca9ac2695e0bb5c669adaf19c7caad19761d3 # main
        with:
          command: check
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: probityai/.github
          ref: bfaca9ac2695e0bb5c669adaf19c7caad19761d3
          path: pins-checker
          persist-credentials: false
      - name: historical exclusions hold
        env:
          VERSION_PINS_SCRIPT: ${{ github.workspace }}/pins-checker/scripts/version-pins.py
        run: python3 -B scripts/version-pins-config-test.py

    needs:
      - changes
    permissions:
      contents: read

  version_pins__registry:
    if: ${{ fromJSON(needs.changes.outputs.run)['version_pins'] && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: manifests, tags, registries and the family lock agree
        uses: probityai/.github/actions/version-pins@bfaca9ac2695e0bb5c669adaf19c7caad19761d3 # main
        with:
          command: registry
    needs:
      - changes
    permissions:
      contents: read

  # from w3c-v01-appendix.yml:
  #  Reruns every row of the results-to-inputs table for the W3C Agent Conformance
  #  CG's v0.1 reporting-format paper from its pins, and fails when a posted
  #  digest does not come out. interop/w3c-v01-appendix/README.md has the table.
  #  The weekly run catches a pin that stops resolving upstream. Every job runs on
  #  Linux x86_64, Linux arm64 and macOS arm64, and the results name the platform.
  #  A newer push to the same pull request or branch supersedes the older run.
  #  Main and tags never cancel: each main push keeps its own group by sha.
  w3c_v01_appendix__harness:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.13'
      - name: Refusal paths
        working-directory: interop/w3c-v01-appendix
        run: uv run --no-project --with pytest==9.1.1 python -m pytest -q tests second-producer

    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['w3c_v01_appendix'] }}
    permissions:
      contents: read

  w3c_v01_appendix__rerun:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        # R3-v01 reads the records R3 writes, and R14 reads the reports R1, R2,
        # R3-v01, R4 and R5 write, so those jobs rerun their inputs too.
        rows:
          - 'R1'
          - 'R2'
          - 'R3 R3-v01'
          - 'R4'
          - 'R4-driver'
          - 'R5'
          - 'R6 R6-v01'
          - 'R7'
          - 'R8'
          - 'R8-compare'
          - 'R9'
          - 'R10'
          - 'R11'
          - 'R12'
          - 'R13'
          - 'R1 R2 R3 R3-v01 R4 R5 R14'
          - 'R15'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.rows == 'R9' || matrix.rows == 'R10'
        with:
          go-version: '1.26'
          cache: false
      - name: Rerun from pins
        run: uv run --no-project python interop/w3c-v01-appendix/rerun.py ${{ matrix.rows }} --work "$RUNNER_TEMP/w3c" --results results
      - name: Show results
        if: always()
        run: for f in results/*.json; do echo "== $f"; cat "$f"; done
      - name: Retain results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: w3c-v01-appendix-${{ matrix.os }}-${{ strategy.job-index }}
          path: results/
          if-no-files-found: error
          retention-days: 90
    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['w3c_v01_appendix'] }}
    permissions:
      contents: read

  # from w3c-v01-matrix.yml:
  #  Reruns the appendix rows that write a v0.1 report, writes single-field
  #  mutants of each, and reads every report and mutant with every reader in
  #  interop/w3c-v01-appendix/matrix/matrix.py. Fails when a cell or an input
  #  digest differs from the committed matrix.json, on any of three platforms.
  #  The weekly run catches a pin or a reader that stops behaving as committed.
  w3c_v01_matrix__tables:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.13'
      - name: Mutants change what they say, and the tables agree with matrix.json
        working-directory: interop/w3c-v01-appendix/matrix
        run: uv run --no-project --with pytest==9.1.1 python -m pytest -q tests

    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['w3c_v01_matrix'] }}
    permissions:
      contents: read

  w3c_v01_matrix__matrix:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false
      - name: Install the Rust toolchain the Rust reader builds with
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          echo "RUSTUP_TOOLCHAIN=1.90.0" >> "$GITHUB_ENV"
      - name: Rerun the reports, write the mutants, read them all
        run: uv run --no-project python interop/w3c-v01-appendix/matrix/matrix.py run --work "$RUNNER_TEMP/m" --observed observed.json
      - name: Every cell as committed
        run: uv run --no-project python interop/w3c-v01-appendix/matrix/matrix.py check observed.json
      - name: Retain the run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: w3c-v01-matrix-${{ matrix.os }}
          path: |
            observed.json
            ${{ runner.temp }}/m/matrix-log.txt
            ${{ runner.temp }}/m/results/
          if-no-files-found: error
          retention-days: 90
    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['w3c_v01_matrix'] }}
    permissions:
      contents: read

  # from wimse-reader-reproduction.yml:
  #  A newer push to the same pull request or branch supersedes the older run.
  #  Main and tags never cancel: each main push keeps its own group by sha.
  wimse_reader_reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: interop/wimse-agent-audit-record-reader-2026-10-01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.14'
      - name: Install reader dependency
        run: python -m pip install cryptography==46.0.0
      - name: Fetch pinned sources
        run: python fetch_inputs.py
      - name: Reproduce reader results
        run: python run_reproduction.py
      - name: Retain stage outputs
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wimse-reader-rerun
          path: |
            interop/wimse-agent-audit-record-reader-2026-10-01/.build/corpus/envelope_results.json
            interop/wimse-agent-audit-record-reader-2026-10-01/.build/corpus/stage2_results.json
            interop/wimse-agent-audit-record-reader-2026-10-01/.build/corpus/stage34_results.json
          if-no-files-found: error
          retention-days: 14
    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['wimse_reader_reproduction'] }}
    permissions:
      contents: read

  jcs_admit_npm:
    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['jcs_admit_npm'] }}
    uses: ./.github/workflows/jcs-admit-npm.yml
  mcp_sdk_jcs:
    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['mcp_sdk_jcs'] }}
    uses: ./.github/workflows/mcp-sdk-jcs.yml
  parts:
    needs:
      - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['parts'] }}
    uses: ./.github/workflows/parts.yml
    secrets:
      DSSE_FORBIDDEN_SHA256: ${{ secrets.DSSE_FORBIDDEN_SHA256 }}
  ci-ok:
    if: ${{ always() }}
    needs:
      - changes
      - a2a_s3_retain
      - a2a_s4_dual_name
      - aae_verdict_binding
      - acs_outage
      - action_tuple_framed
      - agentavow_signed_map
      - agentid_action_ref_v2
      - agentid_offline
      - agmi_anchored_chain
      - airgap_bundle
      - aps_jcs
      - building_effect
      - ccs_draft10_reader
      - ci__release-integrity
      - ci__installed-wheel
      - ci__go
      - ci__python
      - ci__forcing
      - ci__action
      - claim_record
      - codeql
      - commit_message_lint
      - crosswalk__check-local
      - crosswalk__crosswalk-upstream
      - e2_reproduction
      - eval_result
      - event_absence_c1
      - field_readiness
      - gemara_method_link
      - governance
      - govops_capability_id
      - govops_trace_profile
      - heldout_runner
      - identity_scan
      - invocation_axes
      - jcsvectors
      - jep_core07_reader
      - nist_ai_300_1
      - no_internal_drafts
      - observed_code_digest
      - observed_invocation_binding
      - occurrence_binding
      - operand_provenance
      - ot_federation
      - poc_evidence
      - publish_hf_dataset
      - record_paths
      - remora_boundary_readers
      - remora_e7_reader__reproduce
      - remora_e7_reader__windows
      - resume_turns
      - secret_scan
      - trace_acta_receipts
      - trace_anchor_tr_anc
      - trade_booking
      - verdict_evidence
      - version_pins__pins
      - version_pins__registry
      - w3c_v01_appendix__harness
      - w3c_v01_appendix__rerun
      - w3c_v01_matrix__tables
      - w3c_v01_matrix__matrix
      - wimse_reader_reproduction
      - jcs_admit_npm
      - mcp_sdk_jcs
      - parts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          bad = {k: v["result"] for k, v in needs.items() if v["result"] in ("failure", "cancelled")}
          for k, v in sorted(needs.items()): print(f"{k}: {v['result']}")
          if bad: print("FAILED:", bad); sys.exit(1)
          print("all selected jobs passed")
          PY
