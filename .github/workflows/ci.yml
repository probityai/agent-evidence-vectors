        run: |
          python3 - <<'PY'
          import fnmatch, json, os, re, subprocess, sys

          def rx(glob):
              out, i = "", 0
              while i < len(glob):
                  if glob.startswith("**/", i): out += "(?:.*/)?"; i += 3
                  elif glob.startswith("**", i): out += ".*"; i += 2
                  elif glob[i] == "*": out += "[^/]*"; i += 1
                  elif glob[i] == "?": out += "[^/]"; i += 1
                  else: out += re.escape(glob[i]); i += 1
              return re.compile("^" + out + "$")

          def hit(pats, f):
              ok = False
              for p in pats:
                  neg = p.startswith("!")
                  if rx(p[1:] if neg else p).match(f): ok = not neg
              return ok

          filters = json.loads(os.environ["FILTERS"])
          event = os.environ["EVENT"]
          run = {}
          if event == "pull_request":
              files = subprocess.run(["git", "diff", "--name-only", os.environ["BASE"], os.environ["HEAD"]],
                                     check=True, capture_output=True, text=True).stdout.split()
              infra = any(f.startswith(".github/") or f in ("pyproject.toml", "uv.lock", "Cargo.toml", "Cargo.lock", "go.mod", "go.sum", "package.json", "package-lock.json") for f in files)
              for k, v in filters.items():
                  if infra or not (v["paths"] or v["ignore"]):
                      run[k] = True
                  elif v["paths"]:
                      run[k] = any(hit(v["paths"], f) for f in files)
                  else:
                      run[k] = any(not hit(v["ignore"], f) for f in files)
              print(f"{len(files)} changed files; infra={infra}")
          else:
              for k, v in filters.items():
                  run[k] = not (event == "merge_group" and v["range"])
          print(json.dumps(run, indent=1))
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("run=" + json.dumps(run) + "\n")
          PY

