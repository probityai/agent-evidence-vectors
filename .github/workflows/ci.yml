name: ci

# One workflow for every pull-request check. Each job calls one reusable workflow and runs only when the
# change touches its paths (any change under .github/ or to a toolchain file runs everything). Pushes to
# main and merge-queue batches run every job, except that commit-range checks skip in the merge queue
# because they already ran on the pull request. Branch protection requires only the ci-ok job.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  security-events: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

