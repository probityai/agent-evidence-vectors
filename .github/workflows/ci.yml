          import json, os, re, subprocess

          def rx(glob):
              out, i = "", 0
              while i < len(glob):
                  if glob.startswith("**/", i): out += "(?:.*/)?"; i += 3
                  elif glob.startswith("**", i): out += ".*"; i += 2
                  elif glob[i] == "*": out += "[^/]*"; i += 1
                  elif glob[i] == "?": out += "[^/]"; i += 1
                  else: out += re.escape(glob[i]); i += 1
              return re.compile("^" + out + "$")

          def hit(pats, f):
              ok = False
              for p in pats:
                  neg = p.startswith("!")
                  if rx(p[1:] if neg else p).match(f): ok = not neg
