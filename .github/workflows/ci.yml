      run: |
        python3 - <<'PY'
        import json, os, re, subprocess

        def rx(glob):
            out, i = "", 0
            while i < len(glob):
                if glob.startswith("**/", i): out += "(?:.*/)?"; i += 3
                elif glob.startswith("**", i): out += ".*"; i += 2
                elif glob[i] == "*": out += "[^/]*"; i += 1
                elif glob[i] == "?": out += "[^/]"; i += 1
                else: out += re.escape(glob[i]); i += 1
            return re.compile("^" + out + "$")

        def hit(pats, f):
            ok = False
            for p in pats:
                neg = p.startswith("!")
                if rx(p[1:] if neg else p).match(f): ok = not neg
            return ok

        filters = json.loads(os.environ["FILTERS"]); infra_paths = tuple(json.loads(os.environ["INFRA"]))
        event = os.environ["EVENT"]; run = {}
        if event == "pull_request":
            files = subprocess.run(["git", "diff", "--name-only", os.environ["BASE"], os.environ["HEAD"]],
                                   check=True, capture_output=True, text=True).stdout.split()
            infra = any(f.startswith(infra_paths) for f in files)
            for k, v in filters.items():
                if not v["pr"]: run[k] = False
                elif infra or not (v["paths"] or v["ignore"]): run[k] = True
                elif v["paths"]: run[k] = any(hit(v["paths"], f) for f in files)
                else: run[k] = any(not hit(v["ignore"], f) for f in files)
            print(f"{len(files)} changed files; infra={infra}")
        elif event == "schedule":
            cron = os.environ["CRON"]
            for k, v in filters.items(): run[k] = cron in v["crons"]
        elif event == "push":
            for k, v in filters.items(): run[k] = v["push"]
        elif event == "merge_group":
            for k, v in filters.items(): run[k] = v["pr"] and not v["range"]
        else:
            for k, v in filters.items(): run[k] = v["pr"]
        print(json.dumps(run, indent=1))
        with open(os.environ["GITHUB_OUTPUT"], "a") as fh: fh.write("run=" + json.dumps(run) + "\n")
        PY
  a2a_s3_retain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: interop/a2a-s3-retain-2026-10-01
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.13'
    - name: Install bounded runner and test dependencies
      run: python -m pip install -r requirements.txt
    - name: Exercise native signatures and adverse inputs
      env:
        PYTHONPATH: .
      run: python -m pytest -q
    - name: Recompute and retain source-pinned result
      run: python run_regression.py > run-report.json
    - name: Retain result
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: a2a-s3-retain-report
        path: interop/a2a-s3-retain-2026-10-01/run-report.json
        if-no-files-found: error
        retention-days: 14
    needs:
    - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['a2a_s3_retain'] }}
    permissions:
      contents: read
  a2a_s4_dual_name:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: interop/a2a-s4-dual-name-2026-10-02
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.13'
    - name: Install selected regression dependencies
      run: python -m pip install -r ../a2a-s3-retain-2026-10-01/requirements.txt
    - name: Test alias and signature controls
      env:
        PYTHONPATH: .
      run: python -m pytest -q tests
    - name: Recompute both native readings
      run: python run_dual_name.py > fresh-report.json
    - name: Retain report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: a2a-s4-dual-name-report
        path: interop/a2a-s4-dual-name-2026-10-02/fresh-report.json
        if-no-files-found: error
        retention-days: 90
    needs:
    - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['a2a_s4_dual_name'] }}
    permissions:
      contents: read
  aae_verdict_binding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      with:
        python-version: '3.13'
    - name: Set fresh report destination
      run: printf 'AAE_BINDING_ATTEMPT=%s/aae-verdict-binding-attempt\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
    - name: Install locked development dependencies
      run: uv sync --locked --extra dev
    - name: Lint the package
      run: uv run ruff check interop/aae-verdict-binding-v1
    - name: Test kernel, binding, pins and refusal paths
      run: uv run python -m pytest interop/aae-verdict-binding-v1 -q
    - name: Reproduce the vectors and run every binding case
      run: uv run python interop/aae-verdict-binding-v1/run_binding.py --output-dir "$AAE_BINDING_ATTEMPT"
    - name: Require the report and check pinned outcomes
      run: uv run python interop/aae-verdict-binding-v1/check_report.py "$AAE_BINDING_ATTEMPT/report.json"
    - name: Retain measured report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: aae-verdict-binding-report
        path: ${{ runner.temp }}/aae-verdict-binding-attempt/report.json
        if-no-files-found: error
        retention-days: 30
    needs:
    - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['aae_verdict_binding'] }}
    permissions:
      contents: read
  acs_hook_probes:
    name: hook probes against AGT (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
        - label: integration-d1ad294-bun-1.3.11
          ref: d1ad2943107601e3c09f8e0c8eaf57b78b38a01b
          bun: 1.3.11
          expect: agt-integration-d1ad294-bun-1.3.11.json
        - label: integration-d1ad294-bun-1.4.2
          ref: d1ad2943107601e3c09f8e0c8eaf57b78b38a01b
          bun: 1.4.2
          expect: agt-integration-d1ad294-bun-1.4.2.json
        - label: integration-27799c2-bun-1.3.11
          ref: 27799c2c27414a483a4a043b957bfd2997d53231
          bun: 1.3.11
          expect: agt-integration-27799c2-bun-1.3.11.json
        - label: integration-27799c2-bun-1.4.2
          ref: 27799c2c27414a483a4a043b957bfd2997d53231
          bun: 1.4.2
          expect: agt-integration-27799c2-bun-1.4.2.json
        - label: integration-7d2dd3c-bun-1.4.2
          ref: 7d2dd3c69f82ec7565eef49b1609906deba1ef6b
          bun: 1.4.2
          expect: agt-integration-7d2dd3c-bun-1.4.2.json
    steps:
    - name: Check out the probes
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Check out the shim and Guardian under test
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: GenAI-Security-Project/agent-control-standard
        ref: ${{ matrix.ref }}
        path: source/acs
        persist-credentials: false
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: ${{ matrix.bun }}
    - name: Install the locked reference implementation dependencies
      working-directory: source/acs/reference-implementations/agt
      run: bun install --frozen-lockfile --ignore-scripts
    - name: The probes fail a shim that answers nothing
      run: python3 -I corpora/vectors-acs-core/hook-probes/acs_hook_probes.py --acs source/acs --out out --selftest
    - name: Run the probes against the recorded expectation
      run: bash corpora/vectors-acs-core/hook-probes/run_against_agt.sh source/acs out corpora/vectors-acs-core/hook-probes/expected/${{ matrix.expect }}
    - name: Keep the hook captures
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: acs-hook-probes-${{ matrix.label }}
        path: out
        retention-days: 30
    needs:
    - changes
    if: ${{ fromJSON(needs.changes.outputs.run)['acs_hook_probes'] }}
    permissions:
      contents: read
