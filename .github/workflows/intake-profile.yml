name: intake-profile
on:
  push:
    branches: [fix/intake-records-speed-1114]
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.13'
      - run: uv sync --locked --extra generators
      - name: after, the pooled generator in check mode (timed)
        run: |
          nproc; go version
          /usr/bin/time -v uv run --locked --extra generators python scripts/gen-intake-records.py --check 2>&1 | tee "$RUNNER_TEMP/after.log"
      - name: before, the serial generator of main, every phase timed (the oracle)
        if: always()
        run: |
          git fetch --depth=1 origin 250de75575a945d00211415d7af41894d15427fa
          git show 250de75575a945d00211415d7af41894d15427fa:scripts/gen-intake-records.py > scripts/gen-intake-records-serial.py
          INTAKE_SCRIPT=scripts/gen-intake-records-serial.py uv run --locked --extra generators python scripts/intake-records-profile.py "$RUNNER_TEMP/profile" 2>&1 | tee "$RUNNER_TEMP/profile.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: intake-profile
          path: ${{ runner.temp }}/*.log
