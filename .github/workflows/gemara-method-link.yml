name: Gemara method-link conformance

on:
  # Bot-token merges suppress push events; allow the native jobs on exact main.
  workflow_dispatch:
  pull_request:
    paths:
      - "interop/gemara-method-link/**"
      - ".github/workflows/gemara-method-link.yml"
      - "pyproject.toml"
      - "uv.lock"
  push:
    paths:
      - "interop/gemara-method-link/**"
      - ".github/workflows/gemara-method-link.yml"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13.15"
      - name: install pinned test dependencies
        run: python -m pip install -r interop/gemara-method-link/requirements-test.txt
      - name: relationship and tampering tests
        run: python -m pytest interop/gemara-method-link/test_method_link.py -q
      - name: reproduce pinned inputs and reader reports
        run: |
          set -euo pipefail
          cd interop/gemara-method-link
          mkdir -p .build
          python method_link.py > .build/result.json
          python method_link.py --adapter "python method_link.py --stdin" > .build/self-adapter.json
          status=0
          python method_link.py --adapter "python controls/accept_all.py" > .build/negative-control.json || status=$?
          test "$status" -eq 1
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from method_link import load_cases

          root = Path.cwd()
          manifest, cases = load_cases(root)
          pin = hashlib.sha256((root / "MANIFEST.json").read_bytes()).hexdigest()
          for name in ("result.json", "negative-control.json"):
              actual = json.loads((root / ".build" / name).read_text())
              expected = json.loads((root / name).read_text())
              assert actual == expected, f"report drift: {name}"
              assert (root / ".build" / name).read_bytes() == (root / name).read_bytes()
              assert actual["manifest_sha256"] == pin, f"manifest drift: {name}"
              assert actual["total"] == len(cases) == len(manifest["cases"])
          result = json.loads((root / ".build/result.json").read_text())
          adapter = json.loads((root / ".build/self-adapter.json").read_text())
          negative = json.loads((root / ".build/negative-control.json").read_text())
          assert adapter == result, "self-adapter drift"
          assert result["matched"] == result["total"]
          assert negative["matched"] < negative["total"]
          print(f"Pinned cases={len(cases)} sources={len(manifest['sources'])} manifest={pin}")
          print(f"Author reader={result['matched']}/{result['total']}; "
                f"self-adapter={adapter['matched']}/{adapter['total']}; "
                f"accept-all={negative['matched']}/{negative['total']} exit=1")
          PY
      - name: install checksum-pinned native CUE
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import io
          import json
          import os
          import tarfile
          import urllib.request
          from pathlib import Path

          manifest = json.loads(Path("interop/gemara-method-link/native/MANIFEST.json").read_text())
          tool = manifest["tool"]
          with urllib.request.urlopen(tool["archive_url"], timeout=60) as response:
              archive = response.read()
          assert hashlib.sha256(archive).hexdigest() == tool["archive_sha256"], "CUE archive drift"
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz") as release:
              member = release.getmember("cue")
              assert member.isfile(), "CUE executable is not a regular file"
              with release.extractfile(member) as stream:
                  binary = stream.read()
          assert hashlib.sha256(binary).hexdigest() == tool["binary_sha256"], "CUE binary drift"
          directory = Path(os.environ["RUNNER_TEMP"]) / "gemara-native-cue"
          directory.mkdir(exist_ok=True)
          executable = directory / "cue"
          executable.write_bytes(binary)
          executable.chmod(0o755)
          with Path(os.environ["GITHUB_ENV"]).open("a") as environment:
              environment.write(f"GEMARA_CUE_BINARY={executable}\n")
          print(f"CUE archive={tool['archive_sha256']} binary={tool['binary_sha256']}")
          PY
      - name: native schema and integrity tests
        run: python -m pytest interop/gemara-method-link/test_native_cue.py -q
      - name: reproduce separate native schema reports
        run: |
          set -euo pipefail
          cd interop/gemara-method-link
          python native_cue.py --cue "$GEMARA_CUE_BINARY" --output-dir native/.build > .build/native-combined.json
          python - <<'PY'
          import json
          from pathlib import Path

          from native_cue import separate_reports

          report = json.loads(Path(".build/native-combined.json").read_text())
          for filename, evidence in separate_reports(report).items():
              generated = Path("native/.build") / filename
              pinned = Path("native") / filename
              assert generated.read_bytes() == pinned.read_bytes(), f"native report drift: {filename}"
              assert json.loads(generated.read_text()) == evidence
              totals = evidence["totals"]
              print(f"{filename}: {totals['cases']} cases; {totals['policies']} Policy + "
                    f"{totals['logs']} EvaluationLog; accepted={totals['accepted']} "
                    f"rejected={totals['rejected']}; rejected logs={evidence['rejected_logs']}")
          PY
