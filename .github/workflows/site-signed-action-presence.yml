# Moved from site/.github/workflows/signed-action-presence.yml when the package was imported;
# its steps run from site.
name: signed-action-presence

on:
  push:
    paths: ['site/**', '.github/workflows/site-signed-action-presence.yml']
    branches: [main]
  pull_request:
    paths: ['site/**', '.github/workflows/site-signed-action-presence.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: site

jobs:
  supplied-bytes-and-refusal-controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.12.24"
      - name: Install the hash-pinned reader and test wheels
        run: |
          uv venv --python 3.14.7 .research-cache/signed-actions
          uv pip install --python .research-cache/signed-actions/bin/python --require-hashes --only-binary=:all: -r interop/action-presence/requirements-dev.txt
      - name: Check the bounded profile and adverse controls
        run: |
          .research-cache/signed-actions/bin/ruff check --isolated interop/action-presence
          .research-cache/signed-actions/bin/ruff check --isolated --select C901 --config lint.mccabe.max-complexity=10 interop/action-presence
          .research-cache/signed-actions/bin/ruff format --isolated --check interop/action-presence
          PYTHONPATH=interop/action-presence COVERAGE_FILE=.research-cache/signed-actions/.coverage .research-cache/signed-actions/bin/python -m coverage run --source=reader,run_corpus -m pytest interop/action-presence/test_reader.py -q --junitxml=.research-cache/signed-actions/tests.xml
          COVERAGE_FILE=.research-cache/signed-actions/.coverage .research-cache/signed-actions/bin/python -m coverage json -o .research-cache/signed-actions/coverage.json
      - name: Require coverage for each reader source file
        run: |
          .research-cache/signed-actions/bin/python - <<'PY'
          import json
          from pathlib import Path
          files = json.loads(Path(".research-cache/signed-actions/coverage.json").read_text())["files"]
          expected = {"interop/action-presence/reader.py", "interop/action-presence/run_corpus.py"}
          if set(files) != expected:
              raise SystemExit("reader source population differs")
          for name, report in files.items():
              if report["summary"]["percent_covered"] < 80:
                  raise SystemExit("coverage below threshold: " + name)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: signed-action-presence-controls
          path: |
            site/.research-cache/signed-actions/tests.xml
            site/.research-cache/signed-actions/coverage.json
