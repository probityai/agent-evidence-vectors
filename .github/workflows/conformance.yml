name: conformance

# The reusable conformance workflow behind docs/VERIFIED-BADGE.md. A project
# calls it from its own CI, pinned by full commit SHA:
#
#   jobs:
#     conformance:
#       permissions: { contents: read, actions: read, id-token: write }
#       uses: probityai/agent-evidence-vectors/.github/workflows/conformance.yml@<full SHA> # v0.36.0
#       with:
#         corpus: vectors-a2a-jcs-v01
#         verifier: ./bin/my-verifier
#
# Three jobs. `pin` learns this workflow's own commit from its OIDC token and
# runs nothing else. `execute` runs the candidate and holds no signing
# capability: `contents: read` only, so no OIDC token and no secret reaches it,
# and everything it hands on is data. `sign` runs no candidate code: it checks
# out this repository at the commit its own token names, downloads the
# execution job's transcript by numeric artifact id, replays it through the
# harness over the pinned corpus, recomputes the verdict, and only when
# scripts/conformance_receipt.py sign-check accepts does it ask for a signing
# certificate. The receipt's Fulcio identity is this file at that commit.

on:
  workflow_call:
    inputs:
      verifier:
        description: Command line of the verifier under test, run as `<verifier> <harness arguments>`.
        required: true
        type: string
      corpus:
        description: Shipped corpus id to replay; the case set is that corpus's manifest in this release.
        required: false
        type: string
        default: vectors
      setup:
        description: Optional shell command that builds the candidate, run in the execution job only.
        required: false
        type: string
        default: ""
      artifact-suffix:
        description: Suffix for the transcript artifact name when the workflow is called more than once in a run.
        required: false
        type: string
        default: ""
    outputs:
      receipt-artifact:
        description: Name of the artifact holding receipt.json and receipt.sigstore.json.
        value: ${{ jobs.sign.outputs.receipt-artifact }}

permissions: {}

jobs:
  pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write
    outputs:
      sha: ${{ steps.self.outputs.sha }}
    steps:
      - name: this workflow's own commit, read from its OIDC token
        id: self
        shell: python3 {0}
        run: |
          import base64, json, os, re, urllib.request
          req = urllib.request.Request(
              os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=agent-evidence-vectors-pin",
              headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
          )
          token = json.load(urllib.request.urlopen(req, timeout=30))["value"]
          body = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(body + "=" * (-len(body) % 4)))
          sha = claims["job_workflow_sha"]
          assert re.fullmatch(r"[0-9a-f]{40}", sha), sha
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"sha={sha}\n")

  execute:
    needs: pin
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: check out the pinned corpus release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: probityai/agent-evidence-vectors
          ref: ${{ needs.pin.outputs.sha }}
          path: .agent-evidence-vectors
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.15"
      - name: build the candidate
        if: ${{ inputs.setup != '' }}
        env:
          SETUP: ${{ inputs.setup }}
        run: bash -c "$SETUP"
      - name: run the candidate over the corpus and record every answer
        env:
          VERIFIER: ${{ inputs.verifier }}
          CORPUS: ${{ inputs.corpus }}
        run: |
          set -u
          aev="$GITHUB_WORKSPACE/.agent-evidence-vectors"
          mkdir -p "$RUNNER_TEMP/aev-transcript"
          # The exit status is not acted on here: the signer recomputes the
          # verdict, and a failing candidate's transcript is still its record.
          python3 "$aev/packaging/run_vectors.py" --corpus "$CORPUS" \
            --verifier "python3 $aev/scripts/conformance_receipt.py record --transcript $RUNNER_TEMP/aev-transcript/transcript.json -- $VERIFIER --aev-harness-args" \
            --report "$RUNNER_TEMP/execution-report.json" || true
          test -s "$RUNNER_TEMP/aev-transcript/transcript.json"
      - name: hand on the transcript
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aev-conformance-transcript${{ inputs.artifact-suffix }}
          path: ${{ runner.temp }}/aev-transcript/transcript.json
          retention-days: 7

  sign:
    needs: execute
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      receipt-artifact: aev-conformance-receipt${{ inputs.artifact-suffix }}
    env:
      COSIGN_VERSION: v3.1.3
      COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
    steps:
      - name: the run's identity, read from this job's own OIDC token
        id: claims
        shell: python3 {0}
        run: |
          import base64, json, os, urllib.request
          req = urllib.request.Request(
              os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=agent-evidence-vectors-conformance",
              headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
          )
          token = json.load(urllib.request.urlopen(req, timeout=30))["value"]
          body = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(body + "=" * (-len(body) % 4)))
          path = os.path.join(os.environ["RUNNER_TEMP"], "claims.json")
          with open(path, "w", encoding="utf-8") as out:
              json.dump(claims, out)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"sha={claims['job_workflow_sha']}\n")
      - name: check out this workflow's own commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: probityai/agent-evidence-vectors
          ref: ${{ steps.claims.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.15"
      - name: every corpus digest in the release manifest recomputes from the files
        run: python3 scripts/release-digests.py --check
      - name: fetch the transcript by numeric artifact id
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.execute.outputs.artifact-id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$ARTIFACT_ID" in ''|*[!0-9]*) echo "::error::no numeric artifact id"; exit 1 ;; esac
          gh api "repos/$REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/artifact.json"
          gh api "repos/$REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/artifact.zip"
          gh api "repos/$REPOSITORY" --jq .default_branch > "$RUNNER_TEMP/default-branch"
          mkdir -p "$RUNNER_TEMP/replay"
          python3 -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extract('transcript.json', sys.argv[2])" \
            "$RUNNER_TEMP/artifact.zip" "$RUNNER_TEMP/replay"
      - name: replay the transcript over the pinned corpus
        id: replay
        env:
          CORPUS: ${{ inputs.corpus }}
        run: |
          status=0
          python3 packaging/run_vectors.py --corpus "$CORPUS" \
            --verifier "python3 $GITHUB_WORKSPACE/scripts/conformance_receipt.py replay --transcript $RUNNER_TEMP/replay/transcript.json" \
            --report "$RUNNER_TEMP/replay-report.json" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: recompute the verdict and refuse anything a grant cannot rest on
        env:
          CORPUS: ${{ inputs.corpus }}
          STATUS: ${{ steps.replay.outputs.status }}
        run: |
          mkdir -p "$RUNNER_TEMP/receipt"
          python3 scripts/conformance_receipt.py sign-check \
            --claims "$RUNNER_TEMP/claims.json" --report "$RUNNER_TEMP/replay-report.json" \
            --status "$STATUS" --artifact "$RUNNER_TEMP/artifact.json" --artifact-zip "$RUNNER_TEMP/artifact.zip" \
            --digests release/CORPUS-DIGESTS.txt --corpus "$CORPUS" \
            --default-branch "$(cat "$RUNNER_TEMP/default-branch")" --out "$RUNNER_TEMP/receipt/receipt.json"
      - name: fetch the pinned signer through the verified fetch action
        uses: ./.github/actions/fetch-tool
        with:
          repo: sigstore/cosign
          tag: ${{ env.COSIGN_VERSION }}
          asset: cosign-linux-amd64
          sha256: ${{ env.COSIGN_SHA256 }}
          dest: ${{ runner.temp }}/cosign
          executable: 'true'
      - name: sign the receipt with a certificate naming this workflow
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/cosign" sign-blob --yes \
            --bundle "$RUNNER_TEMP/receipt/receipt.sigstore.json" "$RUNNER_TEMP/receipt/receipt.json"
          {
            echo "### Verified by Probity receipt"
            echo '```json'
            cat "$RUNNER_TEMP/receipt/receipt.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: publish the receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aev-conformance-receipt${{ inputs.artifact-suffix }}
          path: ${{ runner.temp }}/receipt/
          retention-days: 90
