name: CCS draft-10 reader

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['interop/ccs-draft10-reader/**', '.github/workflows/ccs-draft10-reader.yml']
  push:
    branches: [main]
    paths: ['interop/ccs-draft10-reader/**', '.github/workflows/ccs-draft10-reader.yml']

permissions:
  contents: read

concurrency:
  # A newer push to the same pull request or branch supersedes the older run.
  # Main and tags never cancel: each main push keeps its own group by sha.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')) }}

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: install the Rust toolchain the jcs-admit cross-check builds with
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          echo "RUSTUP_TOOLCHAIN=1.90.0" >> "$GITHUB_ENV"
      - name: install the pinned reader dependencies
        run: python -m pip install -r interop/ccs-draft10-reader/requirements.txt ruff==0.16.0
      - name: lint the reader
        run: ruff check interop/ccs-draft10-reader
      - name: rerun the reader twice and compare every output with the committed results
        run: python -m pytest -q interop/ccs-draft10-reader/test_ccs_reader.py
