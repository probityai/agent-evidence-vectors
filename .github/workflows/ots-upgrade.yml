name: ots-upgrade

# Capture reached attempts and grade ordinary review eligibility. Never rewrite a bot
# branch, change an immutable release, or claim chain validation from upgrade.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.13'
      - name: check candidate custody and refusal controls
        run: python3 scripts/retain-timestamp-candidate-test.py
      - name: upgrade the working proof and record output
        id: upgrade
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
          candidate_dir="$RUNNER_TEMP/timestamp-candidate"
          mkdir -p "$candidate_dir"
          uv run --no-project --with opentimestamps-client==0.7.2 \
            bash scripts/release-timestamps.sh upgrade 2>&1 | tee "$candidate_dir/upgrade.log"
      - name: check the signature binding and record the actual chain result
        id: verify
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
          uv run --no-project --with opentimestamps-client==0.7.2 \
            bash scripts/release-timestamps.sh verify 2>&1 | tee "$RUNNER_TEMP/timestamp-candidate/verify.log"
      - name: capture available attempt bytes before grading
        if: always()
        env:
          UPGRADE_OUTCOME: ${{ steps.upgrade.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
          python3 scripts/retain-timestamp-candidate.py \
            "$RUNNER_TEMP/timestamp-candidate" "$UPGRADE_OUTCOME" "$VERIFY_OUTCOME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timestamp-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/timestamp-candidate/
          if-no-files-found: error
          overwrite: false
          retention-days: 90
