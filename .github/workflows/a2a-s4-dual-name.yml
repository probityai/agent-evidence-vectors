name: A2A dual-name candidate regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'interop/a2a-s4-dual-name-2026-10-02/**'
      - 'interop/a2a-s3-retain-2026-10-01/**'
      - '.github/workflows/a2a-s4-dual-name.yml'
  pull_request:
    branches: [main]
    paths:
      - 'interop/a2a-s4-dual-name-2026-10-02/**'
      - 'interop/a2a-s3-retain-2026-10-01/**'
      - '.github/workflows/a2a-s4-dual-name.yml'

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: interop/a2a-s4-dual-name-2026-10-02
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install selected regression dependencies
        run: python -m pip install -r ../a2a-s3-retain-2026-10-01/requirements.txt
      - name: Test alias and signature controls
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests
      - name: Recompute both native readings
        run: python run_dual_name.py > fresh-report.json
      - name: Retain report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: a2a-s4-dual-name-report
          path: interop/a2a-s4-dual-name-2026-10-02/fresh-report.json
          if-no-files-found: error
          retention-days: 90
