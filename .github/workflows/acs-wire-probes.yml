name: ACS-Core wire probes

# Runs vectors-acs-core/wire-probes against the AGT reference Guardian at pinned
# refs of the specification's repository: the integration tip before pull
# request 229 (every D1 to D10 probe fails there, which proves each one can),
# the pull request head the probes were first written against (where the D11
# probes fail, which proves they can), and its current head. Each run must match
# its recorded expectation exactly, so a probe that starts passing, or stops,
# turns this red.

# Pull requests only. The job runs a third party's code, so it never runs in
# the default branch's context, where a cache it wrote could be read later.
on:
  pull_request:
    paths:
      - vectors-acs-core/wire-probes/**
      - .github/workflows/acs-wire-probes.yml

permissions:
  contents: read

jobs:
  probes:
    name: wire probes against AGT (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: integration-770f1e0
            ref: 770f1e06b0a037518e910255109be4e6f2e0ca0c
            key_id_mode: label
            expect: agt-integration-770f1e0.json
          - label: pr229
            ref: beee5b54d1292c30137d66ab660c2639929a5284
            key_id_mode: session_id
            expect: agt-pr229.json
          - label: pr229-6e6942d
            ref: 6e6942deb8393e15916976b95e3bd18b97071b62
            key_id_mode: session_id
            expect: agt-pr229-6e6942d.json
          - label: pr229-f94d393
            ref: f94d3931fdcee5500ccfad689bae82b352e67faa
            key_id_mode: label
            expect: agt-pr229-f94d393.json
    steps:
      - name: Check out the probes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check out the Guardian under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: GenAI-Security-Project/agent-control-standard
          ref: ${{ matrix.ref }}
          path: source/acs
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install the locked Guardian dependencies
        working-directory: source/acs/reference-implementations/agt
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run the probes against the recorded expectation
        env:
          # Heads before section 10 fixed key_id as a label read it as the session_id.
          ACS_PROBE_KEY_ID_MODE: ${{ matrix.key_id_mode }}
        run: >-
          bash vectors-acs-core/wire-probes/run_against_agt.sh source/acs out
          vectors-acs-core/wire-probes/expected/${{ matrix.expect }}

      - name: Keep the wire captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acs-wire-probes-${{ matrix.label }}
          path: out
          retention-days: 30
