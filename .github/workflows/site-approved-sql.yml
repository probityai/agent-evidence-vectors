# Moved from site/.github/workflows/approved-sql.yml when the package was imported;
# its steps run from site.
name: approved-sql

on:
  push:
    paths: ['site/**', '.github/workflows/site-approved-sql.yml']
    branches: [main]
  pull_request:
    paths: ['site/**', '.github/workflows/site-approved-sql.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: site

jobs:
  supplied-record-controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.12.24"
      - name: Install the locked example tools in their own environment
        working-directory: site/examples/approved-sql
        run: uv sync --frozen --group dev --python 3.14.7
      - name: Check the reader and every supplied-record outcome
        working-directory: site/examples/approved-sql
        run: .venv/bin/python scripts/qualify.py
      - name: Refuse failing, empty and unrelated test runs
        run: examples/approved-sql/.venv/bin/python -m pytest tests/test_coverage_gate.py --junitxml=examples/approved-sql/gate-results/coverage-gate-tests.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: approved-sql-supplied-record-controls
          path: site/examples/approved-sql/gate-results/
