name: crosswalk

# `crosswalks/aee-to-ave.json` is generated from two trees, and for most of its
# life nothing ran the generator. The committed file drifted three suite
# revisions and twenty-two vectors behind the repository it was generated in, and
# a reader could not see that: a figure with a recipe printed beside it reads as
# derived whether or not anybody ever re-ran the recipe.
#
# The reason it ran nowhere is that the generator needs a checkout of
# aveproject/ave, which a per-push job has no business cloning. So the check is
# split along the line that actually matters, which is who caused the change:
#
#   check-local, on every push. It verifies only `source.conformance_suite` --
#   the revision, the vector total and the three verdict counts -- against
#   vectors/MANIFEST.json and vectors/CHANGES.md in this same tree. No network,
#   no second checkout. This is the half that drifted, and it is the half a
#   reader is most likely to act on, because it says what they will find when
#   they clone this repository.
#
#   crosswalk-upstream, weekly. It clones aveproject/ave, runs the full --check,
#   and on divergence OPENS OR UPDATES AN ISSUE without failing anything. A
#   third-party corpus growing is their event, not a fault in the commit being
#   pushed, and a gate that goes red for something nobody here did is a gate
#   people learn to skip. The issue is the right shape because closing it needs
#   an editorial judgement: the generator refuses when upstream carries a value
#   of a mapped field no row covers, and answering that is a person's decision
#   about what the value means, not a regeneration. Only a read that could not
#   COMPLETE fails this job, because an unread upstream and an agreeing one must
#   never report the same way.
#
# EVERY `run:` BLOCK HERE IS RUNNABLE ON A WORKSTATION, and none of them
# interpolates a `${{ }}` expression. scripts/workflow-steps-gate.py executes
# every shell step of every workflow locally before a push, in order, with no
# runner variables set, so a step that needs $RUNNER_TEMP or an expression fails
# there and a workflow nobody can mirror locally is one nobody checks. The one
# step that writes to GitHub guards on $GITHUB_ACTIONS, which that mirror blanks
# on purpose, and it says out loud that it filed nothing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 05:40 UTC on Mondays. Weekly rather than daily because the thing it watches
    # is somebody else's release cadence, and off the hour so it does not queue
    # behind everything scheduled at :00.
    - cron: '40 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-local:
    # Not on the schedule: this half is about the commit being pushed, and
    # re-running it weekly against an unchanged tree proves nothing new.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the crosswalk publishes this corpus as it stands
        run: python3 scripts/crosswalk-gen.py --check-local

  crosswalk-upstream:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      # A shallow clone is enough: the generator reads HEAD and the records, and
      # refuses a dirty or unrecognised checkout rather than trusting either. The
      # working directory is used instead of $RUNNER_TEMP so the same command
      # runs under the local mirror, and it is removed first so a second run
      # reads a fresh tree rather than a stale one.
      - name: clone the upstream corpus
        run: |
          rm -rf .crosswalk-upstream
          mkdir -p .crosswalk-upstream
          git clone --depth 1 https://github.com/aveproject/ave .crosswalk-upstream/ave
      - name: the crosswalk still describes both trees
        run: |
          set +e
          python3 scripts/crosswalk-gen.py --ave-repo .crosswalk-upstream/ave --check \
            > .crosswalk-upstream/report.txt 2>&1
          status=$?
          set -e
          cat .crosswalk-upstream/report.txt
          echo "$status" > .crosswalk-upstream/status
          # Exit 0 and exit 1 are both answers: agreement, and a divergence the
          # next step files. Anything else means the generator did not run to a
          # verdict, and an unread upstream is not an agreeing one.
          if [ "$status" != "0" ] && [ "$status" != "1" ]; then
            echo "crosswalk-gen.py exited $status, which is neither agreement nor a"
            echo "divergence. Nothing was compared, so nothing is being reported."
            exit 1
          fi
      # One issue, reopened and rewritten rather than a new one every week. A
      # weekly job that files a fresh issue teaches everybody to close them
      # unread, which is the same failure as a gate people learn to skip.
      - name: open or update the divergence issue
        env:
          GH_TOKEN: ${{ github.token }}
          CROSSWALK_REPO: ${{ github.repository }}
          CROSSWALK_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$(cat .crosswalk-upstream/status)" = "0" ]; then
            echo "the crosswalk agrees with both trees, so there is nothing to file"
            exit 0
          fi
          upstream=$(git -C .crosswalk-upstream/ave rev-parse HEAD)
          {
            echo "\`crosswalks/aee-to-ave.json\` no longer describes both trees."
            echo
            echo "Upstream aveproject/ave is at \`$upstream\`. What the generator said:"
            echo
            echo '```'
            cat .crosswalk-upstream/report.txt
            echo '```'
            echo
            echo "Regenerate, which needs a checkout because the upstream side is counted out of a real tree:"
            echo
            echo '```'
            echo "git clone https://github.com/aveproject/ave /tmp/ave"
            echo "python3 scripts/crosswalk-gen.py --ave-repo /tmp/ave"
            echo '```'
            echo
            echo "If the generator refuses on an uncovered value, that is not a regeneration. Upstream has added a value of a mapped field, and what it means in this predicate's vocabulary is an editorial decision: add a \`Row\` in \`scripts/crosswalk-gen.py\`, or a \`KNOWN_UNCOVERED\` entry carrying the reason it maps to nothing."
            echo
            echo "Run: ${CROSSWALK_RUN_URL:-not a runner}"
          } > .crosswalk-upstream/body.md
          cat .crosswalk-upstream/body.md
          if [ "$GITHUB_ACTIONS" != "true" ]; then
            echo
            echo "NOT ON A RUNNER: the body above was written and NOTHING was filed."
            echo "This step posts only where \$GITHUB_ACTIONS is true, so the local"
            echo "workflow mirror can run it without writing to the repository."
            exit 0
          fi
          title='crosswalk: aee-to-ave.json has diverged from upstream'
          existing=$(gh issue list --repo "$CROSSWALK_REPO" --state open \
            --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$CROSSWALK_REPO" \
              --body-file .crosswalk-upstream/body.md
          else
            gh issue create --repo "$CROSSWALK_REPO" --title "$title" \
              --body-file .crosswalk-upstream/body.md
          fi
      - name: leave no upstream checkout behind
        run: rm -rf .crosswalk-upstream
