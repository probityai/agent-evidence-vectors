# Moved from site/.github/workflows/aps-priorseal-replay.yml when the package was imported;
# its steps run from site.
name: APS and PriorSeal source replay

on:
  push:
    branches: [main]
    paths:
      - 'site/experiments/aps-priorseal-source-replay/**'
      - '.github/workflows/site-aps-priorseal-replay.yml'
  pull_request:
    paths:
      - 'site/experiments/aps-priorseal-source-replay/**'
      - '.github/workflows/site-aps-priorseal-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: site

jobs:
  source-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: altrudev/Frequency-Federation-Review
          ref: 4162622af24c94efb843f53aa27940ffd1256ad6
          path: site/.build/aps-priorseal-replay/capsule
          sparse-checkout: capsules/aps-priorseal-v0.1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: altrudev/Frequency-Federation-Review
          ref: b12879d5878991d9c3ed260d06ee11716eb99d33
          path: site/.build/aps-priorseal-replay/review-wrapper
          sparse-checkout: capsules/aps-priorseal-v0.1
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aeoess/agent-passport-system
          ref: 948f99b85343bef2c6fa677c8543965caacfc087
          path: site/.build/aps-priorseal-replay/aps
          sparse-checkout: fixtures/priorseal-decision-binding
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: imokokok/PriorSeal
          ref: d749d2691c3e6be139de4020e7b27cdafca2c428
          path: site/.build/aps-priorseal-replay/priorseal
          sparse-checkout: examples/aps-priorseal-decision-binding-v1
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Install the review adapter's locked dependencies
        working-directory: site/.build/aps-priorseal-replay/capsule/capsules/aps-priorseal-v0.1/adapter
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check the pinned sources, claims and failed controls
        run: |
          node experiments/aps-priorseal-source-replay/run.mjs \
            --runner https://github.com/probityai/agent-evidence-atlas \
            .build/aps-priorseal-replay/capsule \
            .build/aps-priorseal-replay/aps \
            .build/aps-priorseal-replay/priorseal \
            .build/aps-priorseal-replay/result
      - name: Check the pinned wrapper's run contract
        run: |
          node experiments/aps-priorseal-source-replay/check-run-contract.mjs \
            --runner https://github.com/probityai/agent-evidence-atlas \
            .build/aps-priorseal-replay/review-wrapper \
            .build/aps-priorseal-replay/aps \
            .build/aps-priorseal-replay/priorseal \
            .build/aps-priorseal-replay/contract-result
      - name: Check caller declarations, copied tools and original outcomes
        run: |
          node experiments/aps-priorseal-source-replay/test-runner.mjs \
            .build/aps-priorseal-replay/capsule \
            .build/aps-priorseal-replay/review-wrapper \
            .build/aps-priorseal-replay/aps \
            .build/aps-priorseal-replay/priorseal \
            .build/aps-priorseal-replay/caller-controls
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: aps-priorseal-source-replay
          path: |
            site/.build/aps-priorseal-replay/result/receipt.json
            site/.build/aps-priorseal-replay/contract-result/record.json
            site/.build/aps-priorseal-replay/caller-controls/public-results/
            site/.build/aps-priorseal-replay/caller-controls/public-artifact-manifest.json
            site/.build/aps-priorseal-replay/result/*.command.json
            site/.build/aps-priorseal-replay/result/*.stdout
            site/.build/aps-priorseal-replay/result/*.stderr
            site/.build/aps-priorseal-replay/contract-result/*.command.json
            site/.build/aps-priorseal-replay/contract-result/*.stdout
            site/.build/aps-priorseal-replay/contract-result/*.stderr
          if-no-files-found: error
          include-hidden-files: true
