# Moved from site/.github/workflows/discovery-evaluation.yml when the package was imported;
# its steps run from site.
name: discovery-evaluation

on:
  push:
    paths: ['site/**', '.github/workflows/site-discovery-evaluation.yml']
    branches: [main]
  pull_request:
    paths: ['site/**', '.github/workflows/site-discovery-evaluation.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: site

jobs:
  retained-packets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The fixed suite references an immutable catalog in earlier history.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the maintained catalog test dependencies
        run: python3 -m pip install -r requirements/discoverability-test.txt
      - name: Check strict retained-packet and outcome controls
        run: python3 -m pytest -q tests/test_discovery_evaluation.py
      - name: Check the fixed suite and both prompt modes
        run: |
          python3 tools/discovery_evaluation.py check
          python3 tools/discovery_evaluation.py prompts --mode open_search > prompts-open-search.json
          python3 tools/discovery_evaluation.py prompts --mode navigation > prompts-navigation.json
      - name: Preserve the explicit no-attempt baseline
        run: |
          python3 tools/discovery_evaluation.py report \
            --session examples/discovery-evaluation/no-attempts.json \
            --evidence-root examples/discovery-evaluation > no-attempts-report.json
          cmp examples/discovery-evaluation/no-attempts-report.json no-attempts-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: discovery-packet-checks
          path: |
            site/prompts-open-search.json
            site/prompts-navigation.json
            site/no-attempts-report.json
          if-no-files-found: error
