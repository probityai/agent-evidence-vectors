name: Declared-constant operand provenance

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'packaging/agent_evidence_vectors/operand_provenance/**'
      - 'scripts/operand-provenance-build.py'
      - 'scripts/operand-provenance-test.py'
      - '.github/workflows/operand-provenance.yml'
  push:
    branches: [main]
    paths:
      - 'packaging/agent_evidence_vectors/operand_provenance/**'
      - 'scripts/operand-provenance-build.py'
      - 'scripts/operand-provenance-test.py'
      - '.github/workflows/operand-provenance.yml'

permissions:
  contents: read

jobs:
  judge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.15'
      - name: Install pinned control dependencies
        run: python -m pip install pytest==8.4.2
      - name: The committed corpus is what the builder writes
        run: python scripts/operand-provenance-build.py --check
      - name: Test every expected answer, refusal, rule kill and verifier contract
        run: python -m pytest -q scripts/operand-provenance-test.py
      - name: Retain the checkout run
        working-directory: packaging
        run: >-
          python -m agent_evidence_vectors.operand_provenance.run
          --output ../.build/operand-provenance/checkout
      - name: Run the installed entry point from the built wheel alone
        run: |
          python -m pip install build==1.3.0
          python -m build --wheel --outdir .build/dist
          python -m venv .build/wheel-venv
          .build/wheel-venv/bin/python -m pip install .build/dist/*.whl
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.build/wheel-venv/bin/agent-evidence-vectors-operand-provenance" \
            --output "$GITHUB_WORKSPACE/.build/operand-provenance/wheel"
          grep -q '"implementation_revision": "agent-evidence-vectors==' \
            "$GITHUB_WORKSPACE/.build/operand-provenance/wheel/report.json"
      - name: Retain the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: operand-provenance
          path: .build/operand-provenance
          if-no-files-found: error
          retention-days: 90
