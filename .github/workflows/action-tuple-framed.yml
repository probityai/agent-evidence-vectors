name: Framed action tuple candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'interop/action-tuple-framed-v1/**'
      - '.github/workflows/action-tuple-framed.yml'
  pull_request:
    branches: [main]
    paths:
      - 'interop/action-tuple-framed-v1/**'
      - '.github/workflows/action-tuple-framed.yml'

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test fixed bytes and actual process refusals
        run: python -m unittest discover -s interop/action-tuple-framed-v1 -p 'test_*.py' -v
      - name: Run selected candidate corpus with a fresh report
        shell: bash
        run: |
          python interop/action-tuple-framed-v1/reader.py corpus interop/action-tuple-framed-v1/MANIFEST.json \
            --manifest-sha256 0a81393d3e9af4e5ef020a7325a0d7c51196506f83292064ec17c6676f1446f1 \
            --output-dir "${{ runner.temp }}/action-tuple-first-attempt"
      - name: Retain the per-case result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: action-tuple-${{ matrix.os }}-${{ matrix.python-version }}
          path: ${{ runner.temp }}/action-tuple-first-attempt/report.json
          if-no-files-found: error
          retention-days: 30
