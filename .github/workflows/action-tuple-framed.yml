name: Framed action tuple candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'interop/action-tuple-framed-v1/**'
      - '.github/workflows/action-tuple-framed.yml'
  pull_request:
    branches: [main]
    paths:
      - 'interop/action-tuple-framed-v1/**'
      - '.github/workflows/action-tuple-framed.yml'

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test fixed bytes and actual process refusals
        run: python -m unittest discover -s interop/action-tuple-framed-v1 -p 'test_*.py' -v
      - name: Run selected candidate corpus with a fresh report
        run: |
          python interop/action-tuple-framed-v1/reader.py corpus interop/action-tuple-framed-v1/MANIFEST.json \
            --manifest-sha256 b77fb91733b21710e183553e95af3ce552d578e35d600d56f056ca5a8007ae39 \
            --output-dir "$RUNNER_TEMP/action-tuple-first-attempt"
      - name: Retain the per-case result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: action-tuple-${{ matrix.python-version }}
          path: ${{ runner.temp }}/action-tuple-first-attempt/report.json
          if-no-files-found: error
          retention-days: 30
