name: AgentID action_ref v2 recompute

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'interop/agentid-action-ref-v2/**'
      - '.github/workflows/agentid-action-ref-v2.yml'
      - 'uv.lock'
  pull_request:
    branches: [main]
    paths:
      - 'interop/agentid-action-ref-v2/**'
      - '.github/workflows/agentid-action-ref-v2.yml'
      - 'uv.lock'

permissions:
  contents: read

jobs:
  recompute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Set fresh report destination
        run: printf 'ACTION_REF_ATTEMPT=%s/action-ref-v2-attempt\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install locked development dependencies
        run: uv sync --locked --extra dev
      - name: Check reader and refusal paths
        run: |
          uv run ruff check interop/agentid-action-ref-v2
          uv run ruff format --check interop/agentid-action-ref-v2
          uv run python -m pytest interop/agentid-action-ref-v2/test_reader.py -q
      - name: Recompute the pinned vectors and domain cases
        run: uv run python interop/agentid-action-ref-v2/reader.py --output-dir "$ACTION_REF_ATTEMPT"
      - name: Retain measured report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentid-action-ref-v2-report
          path: ${{ runner.temp }}/action-ref-v2-attempt/report.json
          if-no-files-found: error
          retention-days: 30
