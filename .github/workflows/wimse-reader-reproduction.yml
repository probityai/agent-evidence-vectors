name: WIMSE reader reproduction

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'interop/wimse-agent-audit-record-reader-2026-10-01/**'
      - '.github/workflows/wimse-reader-reproduction.yml'
  pull_request:
    branches: [main]
    paths:
      - 'interop/wimse-agent-audit-record-reader-2026-10-01/**'
      - '.github/workflows/wimse-reader-reproduction.yml'

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: interop/wimse-agent-audit-record-reader-2026-10-01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.14'
      - name: Install reader dependency
        run: python -m pip install cryptography==46.0.0
      - name: Fetch pinned sources
        run: python fetch_inputs.py
      - name: Reproduce reader results
        run: python run_reproduction.py
      - name: Retain stage outputs
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wimse-reader-rerun
          path: |
            interop/wimse-agent-audit-record-reader-2026-10-01/.build/corpus/envelope_results.json
            interop/wimse-agent-audit-record-reader-2026-10-01/.build/corpus/stage2_results.json
            interop/wimse-agent-audit-record-reader-2026-10-01/.build/corpus/stage34_results.json
          if-no-files-found: error
          retention-days: 14
