name: Evaluation claim record

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'packaging/agent_evidence_vectors/claim_record/**'
      - 'packaging/run_vectors.py'
      - 'spec/predicates/evaluation-claim.md'
      - 'scripts/claim-record-build.py'
      - 'scripts/claim-record-test.py'
      - '.github/workflows/claim-record.yml'
  push:
    branches: [main]
    paths:
      - 'packaging/agent_evidence_vectors/claim_record/**'
      - 'packaging/run_vectors.py'
      - 'spec/predicates/evaluation-claim.md'
      - 'scripts/claim-record-build.py'
      - 'scripts/claim-record-test.py'
      - '.github/workflows/claim-record.yml'

permissions:
  contents: read

jobs:
  judge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.15'
      - name: Install pinned control dependencies
        run: python -m pip install pytest==8.4.2 mypy==2.3.1
      - name: The committed corpus is what the builder writes
        run: python scripts/claim-record-build.py --check
      - name: Every case, every repair and every rule kill
        run: python -m pytest -q scripts/claim-record-test.py
      - name: The verifier type-checks under strict mode
        working-directory: packaging
        run: >-
          python -m mypy --strict agent_evidence_vectors/claim_record/reader.py
          agent_evidence_vectors/claim_record/run.py agent_evidence_vectors/claim_record/ops.py
      - name: Retain the checkout run
        working-directory: packaging
        run: >-
          python -m agent_evidence_vectors.claim_record.run run
          --output ../.build/claim-record/checkout
          --implementation-revision "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Run both installed entry points from the built wheel alone
        run: |
          python -m pip install build==1.3.0
          python -m build --wheel --outdir .build/dist
          python -m venv .build/wheel-venv
          .build/wheel-venv/bin/python -m pip install .build/dist/*.whl
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.build/wheel-venv/bin/agent-evidence-vectors" claim run \
            --output "$GITHUB_WORKSPACE/.build/claim-record/wheel"
          grep -q '"implementation_revision": "agent-evidence-vectors==' \
            "$GITHUB_WORKSPACE/.build/claim-record/wheel/report.json"
          "$GITHUB_WORKSPACE/.build/wheel-venv/bin/agent-evidence-vectors-claim" run \
            --output "$GITHUB_WORKSPACE/.build/claim-record/wheel-console"
      - name: Retain the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claim-record
          path: .build/claim-record
          if-no-files-found: error
          retention-days: 90
