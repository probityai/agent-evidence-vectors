name: identifier-hosts

# Two hosts that signed records depend on, and that nothing else here watches.
#
# 31 statements in the corpus carry the predicate type
# https://github.com/probityai/agent-evidence-vocabulary/blob/main/docs/predicates/agent-change-admission-v1.md
# inside their signed payloads. That repository moved to probityai-archive, so the
# URI resolves only through GitHub's 301. Creating any repository at
# probityai/agent-evidence-vocabulary would end the redirect, and the URI would
# then name whatever that new repository holds. The same holds for
# every other repository listed in scripts/archived-repos.toml, which were archived by
# transfer to probityai-archive, so their links resolve only through the same 301.
# This job fails when any of those redirects is gone, when the archive organisation
# holds a repository the list does not name, or when a home no longer exists.
#
# The registry-links job reads the live crates.io, PyPI and npm page of every
# unit in release.toml, plus the corpus on PyPI, and fails when a page links to
# an archived, private or renamed repository (scripts/registry_links.py). A
# registry page keeps the links of its last release, so only a new release
# clears a finding. That is why a pull request does not gate on a finding: the
# pages it reads are the ones already published, the change under review cannot
# alter them, and a red check there held every merge train that touched the
# script while the release that clears the finding waited behind that train. On
# a pull request a finding is a warning and an unread page still fails; the
# weekly and dispatched runs fail on both.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/identifier-hosts.yml", "scripts/archived-repos.toml", "scripts/archived-repo-gate.py", "scripts/registry_links.py", "scripts/release_links.py"]

permissions:
  contents: read

concurrency:
  # A newer push to the same pull request or branch supersedes the older run.
  # Main and tags never cancel: each main push keeps its own group by sha.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')) }}

jobs:
  hosts:
    if: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'merge-train/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: the vocabulary repository is still the archived one behind the redirect
        run: |
          set -euo pipefail
          name="$(gh api repos/probityai/agent-evidence-vocabulary --jq .full_name)"
          if [ "$name" != "probityai-archive/agent-evidence-vocabulary" ]; then
            echo "::error::probityai/agent-evidence-vocabulary resolves to '$name'; a repository at that path breaks the predicate URI in 31 signed statements"
            exit 1
          fi
          echo "probityai/agent-evidence-vocabulary redirects to $name"
      - name: the predicate URI answers with the redirect and the page behind it
        run: |
          set -euo pipefail
          uri="https://github.com/probityai/agent-evidence-vocabulary/blob/main/docs/predicates/agent-change-admission-v1.md"
          # curl truncates its output file before a retry, which fails on /dev/null (exit 23),
          # so a retried probe writes to a temp file instead.
          out="$(mktemp)"
          trap 'rm -f "$out"' EXIT
          code="$(curl -sS --retry 5 --retry-all-errors --retry-delay 5 -o "$out" -w '%{http_code}' "$uri")"
          location="$(curl -sS --retry 5 --retry-all-errors --retry-delay 5 -o "$out" -w '%{redirect_url}' "$uri")"
          case "$location" in
            https://github.com/probityai-archive/agent-evidence-vocabulary/*) ;;
            *) echo "::error::$uri answered $code with location '$location'"; exit 1 ;;
          esac
          final="$(curl -sSL --retry 5 --retry-all-errors --retry-delay 5 -o "$out" -w '%{http_code}' "$uri")"
          if [ "$final" != "200" ]; then
            echo "::error::$uri ends in HTTP $final"
            exit 1
          fi
          echo "$uri answers $code to $location, then 200"
      # Every archived repository, not only agent-evidence: each old name still redirects to
      # its archived copy, the archive organisation holds no repository the list does not
      # name, and every home in scripts/archived-repos.toml still exists.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: the list of archived repositories matches GitHub
        run: python3 scripts/archived-repo-gate.py --live

  registry-links:
    if: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'merge-train/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: every published package page links to a live repository
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set +e
          python3 scripts/registry_links.py
          rc=$?
          set -e
          if [ "$EVENT" = pull_request ] && [ "$rc" = 1 ]; then
            echo "::warning::a published package page links to an unusable repository; only a release clears it, so the weekly run gates on it"
            exit 0
          fi
          exit "$rc"
