name: E2 reproduction

on:
  # Bot-token merges suppress push events; allow the native jobs on exact main.
  workflow_dispatch:
  push:
    branches: [main, interop/aps-priorseal-e2-2026-09-30]
    paths:
      - 'interop/aps-priorseal-e2-2026-09-30/**'
      - '.github/workflows/e2-reproduction.yml'
  pull_request:
    branches: [main]
    paths:
      - 'interop/aps-priorseal-e2-2026-09-30/**'
      - '.github/workflows/e2-reproduction.yml'

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: interop/aps-priorseal-e2-2026-09-30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.15'
      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Test refusal paths
        run: python -m pytest -q test_reproduction.py
      - name: Fetch and hash-check all 31 inputs
        run: sh fetch_inputs.sh
      - name: Reproduce results and negative controls
        run: python check_reproduction.py
      - name: Retain reproduced outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2-reproduction
          path: |
            .build/e2-reproduction/RESULTS.json
            .build/e2-reproduction/NEGATIVES.json
          if-no-files-found: error
          retention-days: 14
