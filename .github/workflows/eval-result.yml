name: Evaluation result readings

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'packaging/agent_evidence_vectors/eval_result/**'
      - 'packaging/run_vectors.py'
      - 'scripts/eval-result-build.py'
      - 'scripts/eval-result-test.py'
      - '.github/workflows/eval-result.yml'
  push:
    branches: [main]
    paths:
      - 'packaging/agent_evidence_vectors/eval_result/**'
      - 'packaging/run_vectors.py'
      - 'scripts/eval-result-build.py'
      - 'scripts/eval-result-test.py'
      - '.github/workflows/eval-result.yml'

permissions:
  contents: read

jobs:
  judge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.15'
      - name: Install pinned control dependencies
        run: python -m pip install pytest==8.4.2 mypy==2.3.1
      - name: The committed corpus is what the builder writes
        run: python scripts/eval-result-build.py --check
      - name: Every case, every repair and every rule kill
        run: python -m pytest -q scripts/eval-result-test.py
      - name: The reader type-checks under strict mode
        working-directory: packaging
        run: >-
          python -m mypy --strict agent_evidence_vectors/eval_result/reader.py
          agent_evidence_vectors/eval_result/run.py
      - name: Retain the checkout run
        working-directory: packaging
        run: >-
          python -m agent_evidence_vectors.eval_result.run run
          --output ../.build/eval-result/checkout
          --implementation-revision "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Run both installed entry points from the built wheel alone
        run: |
          python -m pip install build==1.3.0
          python -m build --wheel --outdir .build/dist
          python -m venv .build/wheel-venv
          .build/wheel-venv/bin/python -m pip install .build/dist/*.whl
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.build/wheel-venv/bin/agent-evidence-vectors" evalresult run \
            --output "$GITHUB_WORKSPACE/.build/eval-result/wheel"
          grep -q '"implementation_revision": "agent-evidence-vectors==' \
            "$GITHUB_WORKSPACE/.build/eval-result/wheel/report.json"
          "$GITHUB_WORKSPACE/.build/wheel-venv/bin/agent-evidence-vectors-evalresult" run \
            --output "$GITHUB_WORKSPACE/.build/eval-result/wheel-console"
      - name: Retain the reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-result
          path: .build/eval-result
          if-no-files-found: error
          retention-days: 90
