# Moved from site/.github/workflows/ap1-declared-constants.yml when the package was imported;
# its steps run from site.
name: ap1-declared-constants

on:
  push:
    paths: ['site/**', '.github/workflows/site-ap1-declared-constants.yml']
    branches: [main]
  pull_request:
    paths: ['site/**', '.github/workflows/site-ap1-declared-constants.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: site

jobs:
  known-answers-and-pinned-replay:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site/interop/ap1-declared-constants
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Synthetic known answers
        run: python3 -I -m unittest discover -s tests -v
      - name: Replay the pinned ap1-run states
        run: python3 -I replay.py "$RUNNER_TEMP"
      - name: Retained results match a fresh replay
        run: git diff --exit-code -- results.json
