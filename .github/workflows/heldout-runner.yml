name: Held-out runner and Python floor

# The package declares requires-python >=3.12. A floor is a claim until a run
# on the floor proves it, so this builds the wheel once and installs it into a
# clean interpreter at the floor, at the version every other job uses, and at
# the newest supported, then runs both entry points from outside the checkout.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  floor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build the wheel
        run: |
          python -m pip install --upgrade 'build==1.3.0'
          python -m build --wheel --outdir "$RUNNER_TEMP/dist"
      - name: Install it in a clean environment outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --no-deps "$RUNNER_TEMP"/dist/*.whl
      - name: Both entry points run from the installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/venv/bin/agent-evidence-vectors" --self-test
          "$RUNNER_TEMP/venv/bin/agent-evidence-vectors" --corpus vectors --report "$RUNNER_TEMP/report.json"
          "$RUNNER_TEMP/venv/bin/agent-evidence-heldout" suites
          "$RUNNER_TEMP/venv/bin/agent-evidence-heldout" self-test
      - name: Held-out runner cases from the checkout
        run: python scripts/heldout-runner-test.py
