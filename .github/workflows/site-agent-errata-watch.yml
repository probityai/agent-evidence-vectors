# Moved from site/.github/workflows/agent-errata-watch.yml when the package was imported;
# its steps run from site.
name: Harness Watch pinned row import

on:
  push:
    paths:
      - 'site/interop/agent-errata-watch/**'
      - '.github/workflows/site-agent-errata-watch.yml'
  pull_request:
    paths:
      - 'site/interop/agent-errata-watch/**'
      - '.github/workflows/site-agent-errata-watch.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: site

jobs:
  watch-import:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned build and lint tools
        working-directory: site/interop/agent-errata-watch
        run: python -m pip install -r requirements-check.txt
      - name: Fetch and verify saved source pins
        working-directory: site/interop/agent-errata-watch
        run: |
          python fetch_sources.py --output .build/upstream
          python fetch_sources.py --verify-source --output .build/verify-source
      - name: Install the two selected readers
        working-directory: site/interop/agent-errata-watch
        run: |
          python -m pip install --no-build-isolation --target .build/installation .
          python -m pip install --no-build-isolation --target .build/verify-installation .build/verify-source
      - name: Lint the importer
        working-directory: site/interop/agent-errata-watch
        run: python -m ruff check .
      - name: Require finite native controls
        working-directory: site/interop/agent-errata-watch
        run: |
          PROBITY_VERIFY_ROOT="$PWD/.build/verify-installation" python test_import.py > .build/unit-tests.txt 2>&1
          cat .build/unit-tests.txt
      - name: Qualify installed API, CLI and Verify bridge
        working-directory: site/interop/agent-errata-watch
        run: |
          python qualify.py --input-root .build/upstream \
            --installation .build/installation \
            --verify-installation .build/verify-installation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: watch-import-${{ matrix.python }}-${{ github.sha }}
          include-hidden-files: true
          retention-days: 90
          path: |
            .github/workflows/site-agent-errata-watch.yml
            site/interop/agent-errata-watch/watch_import/*.py
            site/interop/agent-errata-watch/fetch_sources.py
            site/interop/agent-errata-watch/qualify.py
            site/interop/agent-errata-watch/test_import.py
            site/interop/agent-errata-watch/pyproject.toml
            site/interop/agent-errata-watch/requirements-check.txt
            site/interop/agent-errata-watch/source-pins.json
            site/interop/agent-errata-watch/README.md
            site/interop/agent-errata-watch/report.json
            site/interop/agent-errata-watch/.build/unit-tests.txt
            site/interop/agent-errata-watch/.build/bundle/
            site/interop/agent-errata-watch/.build/controls/
