name: GovOps TRACE profile conformance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - interop/govops-trace-profile/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/govops-trace-profile.yml
  pull_request:
    paths:
      - interop/govops-trace-profile/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/govops-trace-profile.yml

permissions:
  contents: read

jobs:
  govops-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13.15", "3.14.7"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: lint and type-check the reader, generator and checker
        run: |
          uv run --extra dev ruff check interop/govops-trace-profile
          uv run --extra dev ruff format --check interop/govops-trace-profile
          uv run --extra dev mypy --strict interop/govops-trace-profile/verifier.py \
            interop/govops-trace-profile/check_vectors.py interop/govops-trace-profile/gen_vectors.py
      # The checker judges the committed bytes, compares the funds-transfer
      # capability resolutions with hand-written values, and turns off each rule
      # in turn to prove every member depends on the rule it names.
      - name: the corpus behaves as its manifest claims, and every rule is load-bearing
        run: uv run --extra generators python interop/govops-trace-profile/check_vectors.py
      - name: the corpus regenerates byte-identically
        run: |
          uv run --extra generators python interop/govops-trace-profile/gen_vectors.py
          git diff --exit-code -- interop/govops-trace-profile
