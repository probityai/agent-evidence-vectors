name: Record paths

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  refuse-local-paths:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.15'
      - name: Install pinned control dependencies
        run: python -m pip install pytest==8.4.2 hypothesis==6.168.3
      - name: Test the writer-side refusal and scan every committed record
        run: python -m pytest -q scripts/record-paths-test.py scripts/remora-e7-reader-test.py
