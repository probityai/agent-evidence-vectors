# The derived-file check merge-train runs on a pull request before it adds it to the merge queue.
#
# Derived files are a function of the whole tree, so merge-train judges each pull request on the tree its
# merge group will test: main, then every pull request already queued, then the pull request. It builds that
# tree as a commit, pushes it to a throwaway branch merge-train-prequeue/<token>, dispatches this workflow on
# that branch, reads the verdict artifact and deletes the branch. Every candidate of a stack runs at once, one
# job each, on a hosted runner: on the workstation the same check took 660 to 830 s per pull request, one after
# another, and on a hosted runner 109 s.
#
# With regenerate set (merge-train sets it only when nothing is queued ahead), a failed check is followed by
# regenerate-derived.py on the same tree and the check again. The artifact then carries the derived-file diff and
# the tree it gives; merge-train applies the diff, refuses it unless the tree matches and every changed path
# carries the `derived` attribute, and pushes it to the pull request's head.
#
# The commands below are the ones merge-train's config names (prequeue, prequeue_regenerate); the verdict records
# the argv each ran, and merge-train refuses a verdict whose argv differs from its config.
name: prequeue
run-name: prequeue ${{ inputs.token }}
on:
  workflow_dispatch:
    inputs:
      token:
        description: merge-train's name for this check; the branch is merge-train-prequeue/<token>
        required: true
        type: string
      regenerate:
        description: on a failed check, regenerate the derived files and check again
        required: false
        type: boolean
        default: false
permissions:
  contents: read

jobs:
  prequeue:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.13'
      # Only a dispatch runs this; a push carries no inputs, so the step is skipped there and in
      # scripts/workflow-steps-gate.py, which mirrors a push.
      - name: check the derived files, and regenerate them on request
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          TOKEN: ${{ inputs.token }}
          REGENERATE: ${{ inputs.regenerate }}
        run: |
          set -u
          out="$RUNNER_TEMP/prequeue"
          mkdir -p "$out"
          check=(uv run --locked --python 3.13 --extra generators --group crosscheck python scripts/regenerate-derived.py --check)
          regen=(uv run --locked --python 3.13 --extra generators --group crosscheck python scripts/regenerate-derived.py)
          printf '%s\0' "${check[@]}" > "$out/check.argv"
          printf '%s\0' "${regen[@]}" > "$out/regenerate.argv"
          git rev-parse HEAD > "$out/sha"
          git rev-parse 'HEAD^{tree}' > "$out/tree"
          started=$(date +%s)
          check_rc=0
          "${check[@]}" > "$out/check.log" 2>&1 || check_rc=$?
          echo "$check_rc" > "$out/check.rc"
          if [ "$check_rc" -ne 0 ] && [ "$REGENERATE" = "true" ]; then
            regen_rc=0
            "${regen[@]}" > "$out/regenerate.log" 2>&1 || regen_rc=$?
            echo "$regen_rc" > "$out/regenerate.rc"
            if [ "$regen_rc" -eq 0 ]; then
              git add -A
              git diff --cached --binary HEAD > "$out/derived.patch"
              git write-tree > "$out/regenerated.tree"
              recheck_rc=0
              "${check[@]}" > "$out/recheck.log" 2>&1 || recheck_rc=$?
              echo "$recheck_rc" > "$out/recheck.rc"
            fi
          fi
          echo $(( $(date +%s) - started )) > "$out/seconds"
          printf '%s\n' "$TOKEN" > "$out/token"
          tail -n 40 "$out/check.log"
          exit "$check_rc"
      - name: hand the verdict to merge-train
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prequeue-${{ inputs.token }}
          path: ${{ runner.temp }}/prequeue/
          retention-days: 3
          if-no-files-found: error
