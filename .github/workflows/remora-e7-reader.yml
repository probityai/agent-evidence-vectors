name: REMORA E7 reader

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['interop/remora-e7-reader/**', '.github/workflows/remora-e7-reader.yml']
  push:
    branches: [main, feat/remora-e7-reader-2026-10-02]
    paths: ['interop/remora-e7-reader/**', '.github/workflows/remora-e7-reader.yml']

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.15'
      - name: Install pinned control dependencies
        run: python -m pip install pytest==8.4.2 hypothesis==6.168.3
      - name: Test frozen bytes and refusal paths
        run: python -m pytest -q interop/remora-e7-reader/test_reader.py
      - name: Retain native E7 results
        env:
          READER_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python interop/remora-e7-reader/run.py
          --upstream interop/remora-e7-reader/upstream
          --output .build/remora-e7-result
          --reader-revision "${READER_REVISION:-$(git rev-parse HEAD)}"
          --operator EXTERNAL
          --run-ref https://probityai.github.io/agent-evidence-atlas/lab.html
      - name: Retain report and external run record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: remora-e7-reader
          path: .build/remora-e7-result
          if-no-files-found: error
          retention-days: 90
