name: release

# Two release paths share this file, and the trigger tells them apart.
#
# 1. The corpus. A pushed tag `v<major>.<minor>.<patch>` runs `verify` (the
#    signed digest list, the tag signature, the time evidence) and then
#    `publish`, which builds the agent-evidence-vectors wheel and sdist and
#    uploads them to PyPI with attestations, then replaces the Hugging Face dataset
#    with the same release. The job runs in the protected environment
#    public-release (required reviewer: the repository owner), so one approval
#    publishes both. The PyPI trusted publisher entry should name that
#    environment; until it does, the environment gates this workflow's job but not
#    PyPI's acceptance of another job in this file. This workflow
#    VERIFIES and never signs: the private half of the corpus signing key is in
#    the maintainer's keyring and the signature is made locally, at tag time, by
#    scripts/release-sign.sh. Putting the key in an Actions secret would make it
#    readable by every workflow that ever runs here and by anyone who can land a
#    workflow change.
#
# 2. The crates, packages and Action. A published GitHub release whose tag is
#    <prefix>-v<version> publishes one unit of release.toml: a crate to
#    crates.io (environment crates-io), a distribution to PyPI (environment
#    pypi) or an npm package (environment npm), all through trusted publishing,
#    so no registry token is stored anywhere. A pushed tag alone publishes
#    nothing on this path: the import of a repository brings its old tags under a
#    prefix, and those must never trigger a publish. A release published for a
#    bare `v<version>` tag resolves to registry "none" and no job runs for it.
#
# Trusted publisher entries, all alike: owner probityai, repository
# agent-evidence-vectors, workflow release.yml, and the environment named by the
# job (the corpus wheel's entry predates the environments and names none, which
# matches any environment, so register public-release on it).
#
#   tag prefix                  registry   unit
#   v<version> (bare)           PyPI       the agent-evidence-vectors wheel (path 1)
#   dsse-v                      crates.io  crates/dsse
#   dsse-npm-v                  npm        crates/dsse/npm (the tarball crate-dsse-npm.yml qualified)
#   jcs-admit-v                 crates.io  crates/jcs-admit
#   jcs-admit-py-v              PyPI       crates/jcs-admit/python (seven wheels and the sdist)
#   jcs-admit-npm-v             npm        crates/jcs-admit/npm (the tarball crate-jcs-admit-npm.yml qualified)
#   agent-evidence-vocabulary-v PyPI       the vocabulary distribution
#   agent-evidence-vocabulary-python-v PyPI  the same distribution, when the data tag exists already
#   agent-evidence-admission-v  PyPI       the admission distribution
#   action-v                    (none)     the root action.yml; the release is its
#                                          Marketplace version, and check-action
#                                          re-runs its checks on the tagged commit
#
# Before any PyPI publish of a family distribution, family-pin-guard refuses a
# version that the newest published release of another family distribution
# (scripts/family-packages.toml) cannot be installed beside, and names the
# sibling and its pin. When it refuses, release that sibling with a widened pin
# first (docs/LAYOUT.md, Releases).
#
# resolve refuses a tag whose unit is not in release.toml yet, whose directory
# is missing, whose manifest carries another version, or whose commit is not on
# main. Each publish job runs only for its own unit, so the job holding the
# id-token for one project never runs for another. PyPI trusted publishing does
# not accept a reusable workflow, so each publish job carries its steps here.

# A second path shares this file. A published GitHub release whose tag is
# <prefix>-v<version> publishes one unit of release.toml through trusted
# publishing: today the jcs-admit npm package (tag jcs-admit-npm-v<version>,
# environment npm). The two paths cannot meet: the corpus jobs run on a pushed
# tag matching v*, and never on a release event; the unit jobs run on a release
# event only, and resolve refuses a tag whose unit is not in release.toml, whose
# version differs from the manifest, or whose commit is not on main. A bare
# v<version> release resolves to registry "none" and no unit job runs for it.

on:
  push:
    tags: ['v*']
  release:
    types: [published]

# Least privilege at the top; the publish jobs alone add id-token, which is what
# the registries verify the workflow identity with.
permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name != 'release' }}
    runs-on: ubuntu-latest
    steps:
      # Full history and tags, because scripts/release-gate.py --tag compares the
      # tag being cut against HEAD. A shallow, tagless checkout would have the
      # gate report that the tag does not resolve, which is a true statement about
      # a tree no consumer will ever see.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - uses: sigstore/cosign-installer@v3

      - name: sync toolchain
        run: uv sync --extra dev

      # The offline half, and the half that decides the run: the digest list is
      # what the corpora on disk produce, the published key is the shape the
      # README tells a stranger to expect, the signature verifies against that
      # key, and the release surface is committed at the tag.
      #
      # GITHUB_REF_NAME is empty when this step is run by
      # scripts/workflow-steps-gate.py, which executes every shell step in this
      # directory before a push. In that case the tag checks are the ones that
      # cannot apply, so they are omitted by not passing --tag rather than by
      # passing an empty one: a gate handed an empty tag name reports that the
      # empty string does not resolve, which reads like a broken release.
      - name: the signed digest list verifies, and the tag holds it
        run: |
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            # Freeze the input objects before either gate checks the name.
            selected_commit="$(git rev-parse HEAD)"
            event_commit="$(git rev-parse "${GITHUB_SHA:?}^{commit}")"
            if [ "$selected_commit" != "$event_commit" ]; then
              echo "release checkout does not match the event commit" >&2
              exit 1
            fi
            # actions/checkout rewrites refs/tags/<name> to the bare commit it
            # checked out, so the local ref no longer names the annotated tag.
            # Fetch the tag object itself before recording it, and require that
            # it peels to the commit under test.
            git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
            selected_tag="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}")"
            if [ "$(git cat-file -t "$selected_tag")" != "tag" ]; then
              echo "release tag ${GITHUB_REF_NAME} is not an annotated tag object" >&2
              exit 1
            fi
            if [ "$(git rev-parse "${selected_tag}^{commit}")" != "$selected_commit" ]; then
              echo "release tag ${GITHUB_REF_NAME} does not peel to the checked-out commit" >&2
              exit 1
            fi
            echo "AEV_RELEASE_COMMIT=$selected_commit" >> "$GITHUB_ENV"
            echo "AEV_RELEASE_TAG_OBJECT=$selected_tag" >> "$GITHUB_ENV"
          fi
          if [ -n "${GITHUB_REF_NAME:-}" ]; then
            uv run python scripts/release-gate.py --tag "${GITHUB_REF_NAME}"
          else
            uv run python scripts/release-gate.py
          fi

      # The tag itself, which the digest-list signature does not cover: anyone
      # who can push can move or recreate a tag. It must be an annotated tag
      # signed by the key in release/tag-signing-key.asc, pinned by fingerprint
      # in the script. The tag object is fetched explicitly because a checkout
      # may hold the commit without the annotated tag that signs it. With no
      # tag (the local workflow mirror), there is nothing to check and the step
      # says so rather than reporting a pass.
      - name: the release tag is signed by the published tag key
        run: |
          if [ -z "${GITHUB_REF_NAME:-}" ] || [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            echo "no release tag in this run; the tag signature check did not run"
            exit 0
          fi
          # The preceding step froze these objects before its artifact gate.
          # A later fetch must not replace the selected signed release.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          python3 scripts/verify-release-tag.py "${GITHUB_REF_NAME}" \
            --expected-commit "${AEV_RELEASE_COMMIT:?}" --expected-tag-object "${AEV_RELEASE_TAG_OBJECT:?}"

      # The time evidence, which reaches the network and therefore decides
      # nothing on its own. What it enforces is offline and absolute: the RFC
      # 3161 token chains to the root pinned in spec/tsa-roots.pem and is over
      # the imprint of this signature, and the OpenTimestamps proof carries this
      # signature's digest. What it REPORTS is the Bitcoin attestation state,
      # because an unreachable calendar and a bad proof are indistinguishable
      # from a non-zero exit, and a fresh proof is legitimately pending for about
      # a day. ots-upgrade.yml is what moves it from pending to attested.
      - name: the time evidence covers this signature
        run: |
          command -v ots >/dev/null || python3 -m pip install --quiet opentimestamps-client
          uv run python scripts/release-gate.py --with-timestamps

      # The grants behind the Verified by Probity badge, re-checked against the
      # current workflow allowlist and revocations. A grant that fails blocks the
      # release until it is fixed or withdrawn.
      - name: every Verified by Probity grant still meets the evidence rule
        run: python3 scripts/badge-grants-gate.py

      - name: what a citer will verify
        run: |
          cat release/CORPUS-DIGESTS.txt
          openssl x509 -in spec/tsa-roots.pem -noout -subject -fingerprint -sha256

  # Builds and checks the wheel and the sdist once. The guard and the publish
  # job below use these bytes.
  build-corpus:
    needs: verify
    if: ${{ github.event_name != 'release' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'

      - name: build the wheel and the sdist
        run: |
          rm -rf dist
          uv build
          go build -o "$RUNNER_TEMP/aee-verify-release" ./cmd/aee-verify

      - name: the source archive contains only the selected public package
        run: |
          uv run --locked --extra dev python scripts/package-boundary-gate.py
          uv run --locked --extra dev python scripts/package-boundary-gate-test.py

      # The wheel is exercised from a directory that is not the checkout, so a
      # path that only resolves inside the repository is caught here and not
      # by the first relying party. --no-project keeps uv from reading the
      # checkout's own pyproject.toml through the working directory.
      #
      # EVERY corpus the wheel ships is replayed, not only the default one, and
      # each must end in one of two states: judged clean by a reader in this
      # package, or refused by name (exit 2) because its suite has no reader
      # here. A third state -- a verdict printed by a rail that does not
      # implement the suite -- fails the release; the harness produced exactly
      # that for eight corpora until it learned to refuse them. The refused
      # suites also run through the Go directory readers against the installed
      # wheel data below. SCITT-COSE explicitly needs a CBOR reader.
      # The replay below sees only what the wheel carries, so a corpus the wheel
      # lacks is invisible to it. This compares both artifacts with the corpora the
      # signed digest list names.
      - name: the wheel and the sdist carry every corpus the signed list names
        run: python3 scripts/wheel-corpora-gate.py "$(ls "$PWD"/dist/agent_evidence_vectors-*.whl)" "$(ls "$PWD"/dist/agent_evidence_vectors-*.tar.gz)"

      - name: the wheel runs from outside the checkout and replays every corpus
        run: scripts/installed-wheel-replay.sh "$(ls "$PWD"/dist/agent_evidence_vectors-*.whl)" "$RUNNER_TEMP/aee-verify-release"

      # GITHUB_REF_NAME is empty under scripts/workflow-steps-gate.py, which
      # runs this step before a push; the version check then has no tag to
      # compare against and says so rather than comparing to an empty string.
      - name: the wheel's version is the tag's
        id: version
        run: |
          wheels=(dist/agent_evidence_vectors-*.whl)
          test "${#wheels[@]}" -eq 1
          name="${wheels[0]##*/agent_evidence_vectors-}"
          version="${name%%-*}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ -z "${GITHUB_REF_NAME:-}" ]; then
            echo "no tag in this run; the wheel is version ${version}"
          elif [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "the wheel is version ${version} and the tag is ${GITHUB_REF_NAME}" >&2
            exit 1
          else
            echo "wheel ${version} matches tag ${GITHUB_REF_NAME}"
          fi

      # The guard and the publish job read these exact bytes, so the wheel that
      # was replayed and version-checked above is the wheel that is uploaded.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist-agent-evidence-vectors
          path: dist/
          if-no-files-found: error

  # Refuses a release that the newest published release of another family
  # distribution cannot be installed beside (scripts/family_pin_guard.py).
  family-pin-guard-corpus:
    needs: build-corpus
    if: ${{ github.event_name != 'release' && startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/family-pin-guard.yml
    with:
      distribution: agent-evidence-vectors
      version: ${{ needs.build-corpus.outputs.version }}
      artifact: python-dist-agent-evidence-vectors
      wheel-glob: "*.whl"

  # The package on PyPI is cut from the same tag the signed digest list was
  # verified for, and only after that verification passed: a wheel whose
  # corpus does not verify is not published. No API token is stored anywhere;
  # the id-token grant lets PyPI check this workflow's OIDC identity against
  # the trusted publisher registered for the project, and attestations: true
  # attaches PEP 740 provenance to every uploaded distribution.
  publish:
    needs: [verify, build-corpus, family-pin-guard-corpus]
    if: ${{ github.event_name != 'release' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    # The owner's approval of the release, which covers the PyPI wheel and the
    # Hugging Face dataset together: both are published by this one job.
    environment: public-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.15'
      - name: the released commit is on main, and the dataset token is set
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::the HF_TOKEN secret of the public-release environment is not set"
            exit 1
          fi
      - name: install the pinned signature verifier
        run: |
          set -euo pipefail
          [ "$(uname -m)" = x86_64 ]
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}"
          mkdir -p "$RUNNER_TEMP/cosign-bin"
          binary="$RUNNER_TEMP/cosign-bin/cosign"
          curl --fail --location --silent --show-error \
            https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64 \
            --output "$binary"
          printf '%s  %s\n' 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71 "$binary" | sha256sum --check -
          chmod 0755 "$binary"
          echo "$RUNNER_TEMP/cosign-bin" >> "$GITHUB_PATH"
      - name: install the pinned Hugging Face command
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/hf-venv"
          "$RUNNER_TEMP/hf-venv/bin/python" -m pip install --quiet --require-hashes --only-binary :all: \
            -r scripts/hf-publish-requirements.txt
          echo "$RUNNER_TEMP/hf-venv/bin" >> "$GITHUB_PATH"
      # Built and checked before anything is published, so a dataset that cannot
      # be built stops the wheel too.
      - name: build the dataset tree from the release tag
        run: python scripts/publish-hf-dataset.py build --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/dataset"
      - name: check the built tree
        run: python scripts/publish-hf-dataset.py check "$RUNNER_TEMP/dataset"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist-agent-evidence-vectors
          path: dist/

      # Pinned to v1.14.2 rather than to the release/v1 branch, because a
      # moving ref is a different action on every run. v1.14.0 was pinned here
      # first and could not upload this wheel at all: it bundles a Twine older
      # than core metadata 2.5, which the build backend now emits, so the
      # upload failed with `'2.5' is not a valid metadata version` after the
      # trusted-publisher exchange had already succeeded. v1.14.2 carries
      # Twine v7, whose release notes state it uploads metadata 2.5. The fix
      # belongs here and not in the build backend: the wheel is correct, and
      # pinning the metadata version down to suit an old uploader would make
      # every future consumer read an older wheel than the one we build.
      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true
          # A first upload cannot succeed until the trusted publisher exists on
          # PyPI, and the fix for that is to re-run this job rather than to cut
          # a new version. skip-existing keeps the re-run idempotent if a
          # previous attempt uploaded part of the pair. The step above has
          # already refused any wheel whose version is not the tag's, so this
          # cannot quietly pass over a version that needed publishing.
          skip-existing: true

      - name: replace the dataset and tag it
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/publish-hf-dataset.py upload "$RUNNER_TEMP/dataset" --tag "$GITHUB_REF_NAME"

  resolve:
    if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      prefix: ${{ steps.target.outputs.prefix }}
      name: ${{ steps.target.outputs.name }}
      registry: ${{ steps.target.outputs.registry }}
      directory: ${{ steps.target.outputs.directory }}
      version: ${{ steps.target.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: target
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python3 scripts/workspace.py release-target "$TAG" > target.json
          cat target.json
          python3 - >> "$GITHUB_OUTPUT" <<'PYCODE'
          import json
          for key, value in sorted(json.load(open("target.json")).items()):
              print(f"{key}={value}")
          PYCODE

  # The Action publishes nothing: the GitHub release is its version, and the
  # Marketplace listing follows the release. This re-runs every Action check on
  # the tagged bytes, so a release whose Action does not work goes red.
  check-action:
    needs: resolve
    if: needs.resolve.outputs.registry != 'none' && (needs.resolve.outputs.registry == 'github-actions')
    uses: ./.github/workflows/actions-admission.yml

  publish-crate-dsse:
    needs: resolve
    if: needs.resolve.outputs.registry != 'none' && (needs.resolve.outputs.prefix == 'dsse')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: crates-io
      url: https://crates.io/crates/dsse
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install the stable toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: package exactly the files that will be published
        working-directory: ${{ needs.resolve.outputs.directory }}
        run: cargo package --locked
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: publish through crates.io trusted publishing
        working-directory: ${{ needs.resolve.outputs.directory }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  publish-crate-jcs-admit:
    needs: resolve
    if: needs.resolve.outputs.registry != 'none' && (needs.resolve.outputs.prefix == 'jcs-admit')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: crates-io
      url: https://crates.io/crates/jcs-admit
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install the stable toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: package exactly the files that will be published
        working-directory: ${{ needs.resolve.outputs.directory }}
        run: cargo package --locked
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: publish through crates.io trusted publishing
        working-directory: ${{ needs.resolve.outputs.directory }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  qualify-dsse-npm:
    needs: resolve
    if: needs.resolve.outputs.registry != 'none' && (needs.resolve.outputs.prefix == 'dsse-npm')
    uses: ./.github/workflows/crate-dsse-npm.yml
    secrets:
      DSSE_FORBIDDEN_SHA256: ${{ secrets.DSSE_FORBIDDEN_SHA256 }}

  # Publishes the exact tarball the qualification job tested, with npm
  # provenance, and attests it as pkg:npm/dsse@<version>. Ported from
  # probityai/dsse npm-release.yml and the provenance job of its npm.yml.
  publish-dsse-npm:
    needs: [resolve, qualify-dsse-npm]
    if: needs.resolve.outputs.registry != 'none' && (needs.resolve.outputs.prefix == 'dsse-npm')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/dsse
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: crates/dsse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.qualify-dsse-npm.outputs.artifact-name }}
          path: ${{ runner.temp }}/dsse-qualified
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: verify the exact qualified artifact and bind its subject
        id: artifact
        env:
          QUALIFIED_RECEIPTS: ${{ runner.temp }}/dsse-qualified
          VERIFIED_NPM: ${{ runner.temp }}/dsse-verified-npm.json
        run: |
          python3 npm/check_release.py "$QUALIFIED_RECEIPTS" --commit "$GITHUB_SHA" > "$VERIFIED_NPM"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          verified = json.loads(Path(os.environ['VERIFIED_NPM']).read_text())
          manifest = json.loads(Path('npm/package.json').read_text())
          assert manifest['name'] == 'dsse'
          tarball = Path(verified['tarball']).read_bytes()
          assert hashlib.sha256(tarball).hexdigest() == verified['sha256']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tarball=' + verified['tarball'] + '\n')
              output.write('subject=pkg:npm/' + manifest['name'] + '@' + manifest['version'] + '\n')
              output.write('digest=sha512:' + hashlib.sha512(tarball).hexdigest() + '\n')
          PY
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.1.0
        id: attest
        with:
          subject-name: ${{ steps.artifact.outputs.subject }}
          subject-digest: ${{ steps.artifact.outputs.digest }}
      - name: retain the signed npm provenance bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dsse-npm-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: ${{ steps.attest.outputs.bundle-path }}
      - name: publish the tested bytes with npm trusted publishing
        env:
          QUALIFIED_TARBALL: ${{ steps.artifact.outputs.tarball }}
        run: npm publish "$QUALIFIED_TARBALL" --access public --provenance --ignore-scripts

  qualify-jcs-admit-npm:
    needs: resolve
    if: needs.resolve.outputs.registry != 'none' && (needs.resolve.outputs.prefix == 'jcs-admit-npm')
    uses: ./.github/workflows/crate-jcs-admit-npm.yml

  # Publishes the exact tarball the qualification job tested, with npm
  # provenance, and attests it as pkg:npm/jcs-admit@<version>. Ported from
  # probityai/jcs-admit npm-release.yml and the provenance job of its npm.yml.
  publish-jcs-admit-npm:
    needs: [resolve, qualify-jcs-admit-npm]
    if: needs.resolve.outputs.registry != 'none' && (needs.resolve.outputs.prefix == 'jcs-admit-npm')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/jcs-admit
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: crates/jcs-admit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.qualify-jcs-admit-npm.outputs.artifact-name }}
          path: ${{ runner.temp }}/jcs-qualified
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: verify the exact qualified artifact and bind its subject
        id: artifact
        env:
          QUALIFIED_RECEIPTS: ${{ runner.temp }}/jcs-qualified
          VERIFIED_NPM: ${{ runner.temp }}/jcs-verified-npm.json
        run: |
          python3 npm/check_release.py "$QUALIFIED_RECEIPTS" --commit "$GITHUB_SHA" > "$VERIFIED_NPM"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          verified = json.loads(Path(os.environ['VERIFIED_NPM']).read_text())
          manifest = json.loads(Path('npm/package.json').read_text())
          assert manifest['name'] == 'jcs-admit'
          tarball = Path(verified['tarball']).read_bytes()
          assert hashlib.sha256(tarball).hexdigest() == verified['sha256']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tarball=' + verified['tarball'] + '\n')
              output.write('subject=pkg:npm/' + manifest['name'] + '@' + manifest['version'] + '\n')
              output.write('digest=sha512:' + hashlib.sha512(tarball).hexdigest() + '\n')
          PY
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.1.0
        id: attest
        with:
          subject-name: ${{ steps.artifact.outputs.subject }}
          subject-digest: ${{ steps.artifact.outputs.digest }}
      - name: retain the signed npm provenance bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jcs-npm-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: ${{ steps.attest.outputs.bundle-path }}
      - name: publish the tested bytes with npm trusted publishing
        env:
          QUALIFIED_TARBALL: ${{ steps.artifact.outputs.tarball }}
        run: npm publish "$QUALIFIED_TARBALL" --access public --provenance --ignore-scripts

  build-jcs-admit-python:
    needs: resolve
    if: needs.resolve.outputs.registry != 'none' && (needs.resolve.outputs.prefix == 'jcs-admit-py')
    uses: ./.github/workflows/jcs-admit-python-build.yml

  family-pin-guard-jcs-admit:
    needs: [resolve, build-jcs-admit-python]
    if: needs.resolve.outputs.prefix == 'jcs-admit-py'
    uses: ./.github/workflows/family-pin-guard.yml
    with:
      distribution: ${{ needs.resolve.outputs.name }}
      version: ${{ needs.resolve.outputs.version }}
      artifact: python-wheel-manylinux-x86_64
      wheel-glob: "*.whl"

  publish-jcs-admit-python:
    needs: [resolve, build-jcs-admit-python, family-pin-guard-jcs-admit]
    if: needs.resolve.outputs.registry != 'none' && (needs.resolve.outputs.prefix == 'jcs-admit-py')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/jcs-admit/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-*
          merge-multiple: true
          path: built
      - name: verify the seven wheels and the sdist, and stage them
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: python3 scripts/check-jcs-admit-python-release.py built --tag "$TAG" --out upload
      - name: install the staged files alone and import them
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --no-index --only-binary :all: --find-links upload jcs-admit
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import os
          from importlib.metadata import version
          import jcs_admit, jcs_admit.dsse
          assert "jcs-admit-py-v" + version("jcs-admit") == os.environ["TAG"]
          PY
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: upload

  build-python:
    needs: resolve
    if: needs.resolve.outputs.registry != 'none' && (needs.resolve.outputs.registry == 'pypi' && needs.resolve.outputs.prefix != 'jcs-admit-py')
    uses: ./.github/workflows/python-build.yml
    with:
      directory: ${{ needs.resolve.outputs.directory }}
      distribution: ${{ needs.resolve.outputs.name }}
      version: ${{ needs.resolve.outputs.version }}

  family-pin-guard:
    needs: [resolve, build-python]
    if: needs.resolve.outputs.registry == 'pypi' && needs.resolve.outputs.prefix != 'jcs-admit-py'
    uses: ./.github/workflows/family-pin-guard.yml
    with:
      distribution: ${{ needs.resolve.outputs.name }}
      version: ${{ needs.resolve.outputs.version }}
      artifact: python-dist-${{ needs.resolve.outputs.name }}
      wheel-glob: "dist/*.whl"

  publish-agent-evidence-vocabulary:
    needs: [resolve, build-python, family-pin-guard]
    if: needs.resolve.outputs.registry != 'none' && (needs.resolve.outputs.prefix == 'agent-evidence-vocabulary' || needs.resolve.outputs.prefix == 'agent-evidence-vocabulary-python')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/agent-evidence-vocabulary/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist-agent-evidence-vocabulary
          path: release-artifacts
      - name: the files are the ones built from this commit
        run: |
          cd release-artifacts
          test "$(cat SOURCE-COMMIT)" = "$GITHUB_SHA"
          sha256sum --check SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: release-artifacts/dist/

  publish-agent-evidence-admission:
    needs: [resolve, build-python, family-pin-guard]
    if: needs.resolve.outputs.registry != 'none' && (needs.resolve.outputs.prefix == 'agent-evidence-admission')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/agent-evidence-admission/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist-agent-evidence-admission
          path: release-artifacts
      - name: the files are the ones built from this commit
        run: |
          cd release-artifacts
          test "$(cat SOURCE-COMMIT)" = "$GITHUB_SHA"
          sha256sum --check SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: release-artifacts/dist/
