# Moved from site/.github/workflows/motebit-approval-triad.yml, where it never ran, because
# GitHub reads workflows only from the repository root; its steps run from site.
name: Motebit approval triad reader

on:
  push:
    branches: [main]
    paths:
      - 'site/examples/motebit-approval-triad/**'
      - '.github/workflows/site-motebit-approval-triad.yml'
  pull_request:
    paths:
      - 'site/examples/motebit-approval-triad/**'
      - '.github/workflows/site-motebit-approval-triad.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: site

jobs:
  independent-reader-controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: motebit/motebit
          ref: 3ed6e6d2da617d775fe9431c36020efc24749fe6
          path: site/.build/motebit-producer
          sparse-checkout: examples/interop/approval-triad
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.12.24"
      - name: Install the pinned Atlas link parser
        run: |
          curl -fsSL -o pandoc.deb https://github.com/jgm/pandoc/releases/download/3.3/pandoc-3.3-1-amd64.deb
          echo "7a6625d5aeb6b8666375807a3e16cc00659c48fb88299707651f60d88c31a360  pandoc.deb" | sha256sum -c -
          sudo dpkg -i pandoc.deb
      - name: Run the separate reader and pinned producer controls
        run: |
          bash examples/motebit-approval-triad/run_checks.sh \
            .build/motebit-approval-triad \
            .build/motebit-producer/examples/interop/approval-triad
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: motebit-approval-triad-controls
          path: |
            site/.build/motebit-approval-triad/report.json
            site/.build/motebit-approval-triad/junit.xml
            site/.build/motebit-approval-triad/coverage.json
            site/.build/motebit-approval-triad/runtime.json
          if-no-files-found: error
