name: version-pins

# Holds every live page to the version its owner decides (pyproject.toml here), and
# holds each historical exclusion in version-pins.toml to a planted stale pin.

on:
  schedule:
  - cron: 47 7 * * *
  workflow_dispatch: 
  workflow_call: 

permissions:
  contents: read

jobs:
  pins:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: live pages agree with their owner
        uses: probityai/.github/actions/version-pins@bfaca9ac2695e0bb5c669adaf19c7caad19761d3 # main
        with:
          command: check
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: probityai/.github
          ref: bfaca9ac2695e0bb5c669adaf19c7caad19761d3
          path: pins-checker
          persist-credentials: false
      - name: historical exclusions hold
        env:
          VERSION_PINS_SCRIPT: ${{ github.workspace }}/pins-checker/scripts/version-pins.py
        run: python3 -B scripts/version-pins-config-test.py

  registry:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: manifests, tags, registries and the family lock agree
        uses: probityai/.github/actions/version-pins@bfaca9ac2695e0bb5c669adaf19c7caad19761d3 # main
        with:
          command: registry
