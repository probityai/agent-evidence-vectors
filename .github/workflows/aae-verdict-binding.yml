name: AAE verdict binding

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'interop/aae-verdict-binding-v1/**'
      - 'corpora/vectors-observed-effect/check_vectors.py'
      - 'corpora/vectors-observed-effect/gen_vectors.py'
      - '.github/workflows/aae-verdict-binding.yml'
      - 'uv.lock'
  pull_request:
    branches: [main]
    paths:
      - 'interop/aae-verdict-binding-v1/**'
      - 'corpora/vectors-observed-effect/check_vectors.py'
      - 'corpora/vectors-observed-effect/gen_vectors.py'
      - '.github/workflows/aae-verdict-binding.yml'
      - 'uv.lock'

permissions:
  contents: read

concurrency:
  # A newer push to the same pull request or branch supersedes the older run.
  # Main and tags never cancel: each main push keeps its own group by sha.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')) }}

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: '3.13'
      - name: Set fresh report destination
        run: printf 'AAE_BINDING_ATTEMPT=%s/aae-verdict-binding-attempt\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install locked development dependencies
        run: uv sync --locked --extra dev
      - name: Lint the package
        run: uv run ruff check interop/aae-verdict-binding-v1
      - name: Test kernel, binding, pins and refusal paths
        run: uv run python -m pytest interop/aae-verdict-binding-v1 -q
      - name: Reproduce the vectors and run every binding case
        run: uv run python interop/aae-verdict-binding-v1/run_binding.py --output-dir "$AAE_BINDING_ATTEMPT"
      - name: Require the report and check pinned outcomes
        run: uv run python interop/aae-verdict-binding-v1/check_report.py "$AAE_BINDING_ATTEMPT/report.json"
      - name: Retain measured report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aae-verdict-binding-report
          path: ${{ runner.temp }}/aae-verdict-binding-attempt/report.json
          if-no-files-found: error
          retention-days: 30
