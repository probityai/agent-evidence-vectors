name: AgentAvow signed-map extraction candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'interop/agentavow-signed-map-v1/**'
      - 'interop/agentavow-live-mcp/**'
      - 'packaging/run_vectors.py'
      - '.github/workflows/agentavow-signed-map.yml'
  pull_request:
    branches: [main]
    paths:
      - 'interop/agentavow-signed-map-v1/**'
      - 'interop/agentavow-live-mcp/**'
      - 'packaging/run_vectors.py'
      - '.github/workflows/agentavow-signed-map.yml'

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: interop/agentavow-signed-map-v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install selected regression dependencies
        run: python -m pip install -r ../a2a-s3-retain-2026-10-01/requirements.txt
      - name: Shared-source lock is current
        run: python lock_sources.py --check
      - name: Exercise signed-map and mutation controls
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests
      - name: Fetch one selected native packet
        run: python fetch_fixture.py --output "$RUNNER_TEMP/agentavow-native-packet.json"
      - name: Recompute native packet result
        run: python run_agentavow.py --fixture "$RUNNER_TEMP/agentavow-native-packet.json" > fresh-report.json
      - name: Retain fresh report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: agentavow-signed-map-report
          path: interop/agentavow-signed-map-v1/fresh-report.json
          if-no-files-found: error
          retention-days: 90
