name: codeql

# Static analysis of this repository's own code, by an analyser nobody here
# wrote.
#
# ci.yml already runs go vet, staticcheck, golangci-lint, mypy --strict and
# ruff, and all of them are held at zero warnings. Those tools are chosen by the
# maintainer and configured by him, so they answer the question he thought to
# ask. CodeQL asks a different set -- taint reaching a sink, a path that
# dereferences what it just checked for nil, an unsanitised value crossing a
# trust boundary -- and it asks them the same way in every repository it runs
# in, which is the property that matters here. A verifier that mis-parses is a
# verifier that accepts what it should refuse, so the analysis is about the
# corpus's argument and not only about hygiene.
#
# Two languages, and the split in build mode is not cosmetic: the Go core is
# compiled, so the database is built by compiling it, and the Python rail and
# the gates are interpreted, so there is nothing to build and asking for a build
# would only produce a failure to explain. go.work links the stdlib-only core to
# the attestor module, so autobuild covers both without a build command here
# that could drift from the one ci.yml runs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, because a query pack updates without this repository changing:
    # a scheduled run is what finds the defect that was always there and only
    # became detectable.
    - cron: '41 6 * * 3'

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # The findings are written into code scanning.
      security-events: write
      actions: read
      contents: read

    strategy:
      # Not fail-fast: a Go result is not a reason to stop wanting the Python
      # one, and a matrix that cancels its siblings reports a partial analysis
      # as a finished one.
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: python
            build-mode: none
          # The workflow files themselves, for injection and over-permissioned
          # token patterns. This repository carries more workflows than it
          # carries Go packages and scanned none of them until this leg existed,
          # which is the one place a CodeQL matrix can be silently narrower than
          # the repository it claims to cover.
          - language: actions
            build-mode: none

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version: '1.24'

      - name: initialize codeql
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: perform codeql analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
