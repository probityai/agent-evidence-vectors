name: TRACE Acta receipt comparison

on:
  workflow_dispatch:
  schedule:
    - cron: "19 8 * * 1"
  push:
    branches: [main]
    paths:
      - vectors-receipt-signature/**
      - packaging/**
      - interop/trace-acta-receipts/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/trace-acta-receipts.yml
  pull_request:
    paths:
      - vectors-receipt-signature/**
      - packaging/**
      - interop/trace-acta-receipts/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/trace-acta-receipts.yml

permissions:
  contents: read

jobs:
  receipt-signature:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13.15", "3.14.7"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Retain and check the immutable upstream verifier
        run: |
          set -euo pipefail
          mkdir -p .build
          capture=$(mktemp -d .build/trace-acta-receipts.XXXXXXXX)
          echo "TRACE_CAPTURE_DIR=$capture" >> "$GITHUB_ENV"
          curl --fail --location --proto '=https' --max-time 60 \
            --dump-header "$capture/source-http-headers.txt" \
            'https://raw.githubusercontent.com/agentrust-io/trace-spec/9cac83a86a54b869ab891ea7e76006342785c15c/tools/acta_receipt_verifier.py' \
            --output "$capture/acta_receipt_verifier.py" \
            2> "$capture/source-fetch.stderr"
          printf '%s  %s\n' \
            c71069425ca6b7aedbf75d3b04fb0b40320d3abc493fb93daaba0920665b7973 \
            "$capture/acta_receipt_verifier.py" > "$capture/source.sha256"
          sha256sum --check "$capture/source.sha256" | tee "$capture/source-check.txt"
      - name: Run the repository corpus against the upstream reader
        run: |
          set -euo pipefail
          uv run --locked --extra dev python --version > "$TRACE_CAPTURE_DIR/python-version.txt"
          uv run --locked --extra dev python packaging/run_vectors.py \
            --corpus vectors-receipt-signature \
            --verifier "python3 $TRACE_CAPTURE_DIR/acta_receipt_verifier.py" \
            --report "$TRACE_CAPTURE_DIR/report.json" \
            > "$TRACE_CAPTURE_DIR/harness.stdout" 2> "$TRACE_CAPTURE_DIR/harness.stderr"
          uv run --locked --extra dev python interop/trace-acta-receipts/check_report.py \
            "$TRACE_CAPTURE_DIR/report.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: trace-acta-receipts-${{ matrix.python }}-${{ github.run_attempt }}
          path: ${{ env.TRACE_CAPTURE_DIR }}
          include-hidden-files: true
          if-no-files-found: error
