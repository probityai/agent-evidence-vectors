name: GovOps descriptor and decision IDs

on:
  workflow_dispatch:
  push:
    paths:
      - "interop/govops-capability-id/**"
      - ".github/workflows/govops-capability-id.yml"
  pull_request:
    paths:
      - "interop/govops-capability-id/**"
      - ".github/workflows/govops-capability-id.yml"

permissions:
  contents: read

jobs:
  govops-ids:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: rustup toolchain install 1.99.0 --profile minimal -c rustfmt -c clippy
      - run: rustup default 1.99.0
      - name: install pinned reader and check dependencies
        run: python -m pip install -r interop/govops-capability-id/requirements-check.txt
      - name: check native raw admission
        run: |
          cargo fmt --manifest-path interop/govops-capability-id/admission/Cargo.toml --check
          cargo clippy --locked --manifest-path interop/govops-capability-id/admission/Cargo.toml --all-targets -- -D warnings
          cargo build --locked --release --manifest-path interop/govops-capability-id/admission/Cargo.toml
      - name: lint the reader and finite controls
        run: |
          python -m ruff check --config interop/govops-capability-id/pyproject.toml \
            interop/govops-capability-id/govops_ids interop/govops-capability-id/fixtures.py \
            interop/govops-capability-id/qualify.py interop/govops-capability-id/test_reader.py
      - name: exercise trust, scope, raw input and failure controls
        run: |
          set -euo pipefail
          mkdir -p interop/govops-capability-id/.build
          python -m unittest discover -s interop/govops-capability-id -p test_reader.py -v \
            2>&1 | tee interop/govops-capability-id/.build/unit-tests.txt
      - name: qualify the installed API and command
        run: |
          python interop/govops-capability-id/qualify.py \
            --admitter interop/govops-capability-id/admission/target/release/govops-jcs-admission \
            --installation "$RUNNER_TEMP/govops-ids-installed"
      - name: retain original inputs, source and native responses
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: govops-ids-${{ matrix.python }}-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          path: |
            .github/workflows/govops-capability-id.yml
            interop/govops-capability-id/govops_ids/*.py
            interop/govops-capability-id/fixtures.py
            interop/govops-capability-id/qualify.py
            interop/govops-capability-id/test_reader.py
            interop/govops-capability-id/pyproject.toml
            interop/govops-capability-id/requirements-check.txt
            interop/govops-capability-id/MANIFEST.json
            interop/govops-capability-id/README.md
            interop/govops-capability-id/history
            interop/govops-capability-id/source
            interop/govops-capability-id/admission/Cargo.toml
            interop/govops-capability-id/admission/Cargo.lock
            interop/govops-capability-id/admission/src
            interop/govops-capability-id/.build/cases.json
            interop/govops-capability-id/.build/unit-tests.txt
            interop/govops-capability-id/report.json
