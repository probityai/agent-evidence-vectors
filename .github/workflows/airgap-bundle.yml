name: Airgap bundle

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'release/airgap/**'
      - 'docs/guides/airgap-enclave.md'
      - 'scripts/airgap-bundle.py'
      - 'scripts/airgap-bundle-test.py'
      - '.github/workflows/airgap-bundle.yml'
  push:
    branches: [main]
    paths:
      - 'release/airgap/**'
      - 'docs/guides/airgap-enclave.md'
      - 'scripts/airgap-bundle.py'
      - 'scripts/airgap-bundle-test.py'
      - '.github/workflows/airgap-bundle.yml'

permissions:
  contents: read

concurrency:
  # A newer push to the same pull request or branch supersedes the older run.
  # Main and tags never cancel: each main push keeps its own group by sha.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')) }}

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.15'
      - name: Install pinned test dependency
        run: python -m pip install pytest==8.4.2
      - name: Build, verify and install a bundle with every network route dead
        run: python -m pytest -q scripts/airgap-bundle-test.py
      - name: Build a bundle of the pinned release and install it offline
        run: |
          python scripts/airgap-bundle.py build --lock release/airgap/requirements.lock \
            --release-dir release --out "$RUNNER_TEMP/aev-airgap"
          python scripts/airgap-bundle.py verify "$RUNNER_TEMP/aev-airgap"
          env HTTP_PROXY=http://127.0.0.1:9 HTTPS_PROXY=http://127.0.0.1:9 \
            PIP_INDEX_URL=http://127.0.0.1:9/simple PYTHON="$(command -v python)" \
            sh "$RUNNER_TEMP/aev-airgap/install.sh" "$RUNNER_TEMP/aev-venv"
          "$RUNNER_TEMP/aev-venv/bin/agent-evidence-vectors" --list-corpora | grep -qx vectors
