name: Vanta connector

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'packaging/agent_evidence_vectors/vanta_connector/**'
      - 'docs/guides/vanta.md'
      - 'scripts/vanta-connector-test.py'
      - '.github/workflows/vanta-connector.yml'
  push:
    branches: [main]
    paths:
      - 'packaging/agent_evidence_vectors/vanta_connector/**'
      - 'docs/guides/vanta.md'
      - 'scripts/vanta-connector-test.py'
      - '.github/workflows/vanta-connector.yml'

permissions:
  contents: read

jobs:
  judge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.15'
      - name: Install pinned control dependencies
        run: python -m pip install pytest==8.4.2
      - name: Test the connector against a local fake server
        run: python -m pytest -q scripts/vanta-connector-test.py
      - name: Dry run from the checkout
        working-directory: packaging
        run: python -m agent_evidence_vectors.vanta_connector.cli push --fail-on-fail
      - name: Run the installed entry point from the built wheel alone
        run: |
          python -m pip install build==1.3.0
          python -m build --wheel --outdir .build/dist
          python -m venv .build/wheel-venv
          .build/wheel-venv/bin/python -m pip install .build/dist/*.whl
          mkdir -p "$GITHUB_WORKSPACE/.build/vanta-connector"
          cd "$RUNNER_TEMP"
          out="$GITHUB_WORKSPACE/.build/vanta-connector/wheel-dry-run.txt"
          "$GITHUB_WORKSPACE/.build/wheel-venv/bin/agent-evidence-vectors-vanta" schema
          "$GITHUB_WORKSPACE/.build/wheel-venv/bin/agent-evidence-vectors-vanta" push \
            --corpus vectors --fail-on-fail > "$out"
          grep -q 'aev-vectors: allPass=True' "$out"
      - name: Retain the dry run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vanta-connector
          path: .build/vanta-connector
          if-no-files-found: error
          retention-days: 90
