name: commit-message-lint

# The commit-message gate is a git hook, and a git hook is advisory:
# `git commit --no-verify` walks past it, and `core.hooksPath` is local config
# that no clone inherits, so a fresh clone that never ran the bootstrap has no
# hook at all. Neither of those is detectable from inside the hook. CI runs the
# SAME tracked file so the rule holds regardless of what any developer's clone
# is configured to do.

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  commit-message-lint:
    # A job with no ceiling is a job that can hang a queue for six hours; taken
    # from the one copy of this file that already bounded it.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      # Pinned to the tip of the v5 release train. The pin this file carried
      # before named a commit on the v6 line and commented it `# v4`, so the
      # comment described neither the SHA nor the major -- a mislabelled pin is
      # worse than a floating ref, because it reads as the discipline it is not.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Gate self-test
        run: .githooks/commit-msg --selftest

      # Dependabot writes the pull request title ("bump X from A to B in /dir
      # (#N)" runs past 72 characters for any deep directory) and no setting
      # shortens it: commit-message.prefix changes only the first words. Its
      # pull requests are merged with the subject written by hand
      # (`gh pr merge --squash --subject ...`), so the generated title never
      # becomes a commit on the default branch, and the range lint below still
      # checks every commit that lands. Every other author keeps this check.
      - name: Lint the prospective merge subject
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] \
             || [[ "$PR_TITLE" == *$'\n'* || "$PR_TITLE" == *$'\r'* ]]; then
            echo 'Expected a single-line PR title and a positive PR number.' >&2
            exit 1
          fi
          subject="${PR_TITLE} (#${PR_NUMBER})"
          if [ "${#subject}" -gt 72 ]; then
            echo 'Shorten the PR title: the merge subject including (#number) exceeds 72 characters.' >&2
            exit 1
          fi
          message_file=$(mktemp)
          trap 'rm -f "$message_file"' EXIT
          printf '%s\n' "$subject" > "$message_file"
          .githooks/commit-msg "$message_file"

      - name: Lint the commit messages this event introduces
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PUSH_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [ -z "${DEFAULT_BRANCH:-}" ] \
             || ! git check-ref-format "refs/heads/$DEFAULT_BRANCH"; then
            echo 'Refusing a commit range without a valid repository default branch.' >&2
            exit 1
          fi
          if [ -n "${PR_BASE:-}" ]; then
            range="$(git merge-base "$PR_BASE" HEAD)..HEAD"
          elif [[ "${PUSH_REF:-refs/heads/local-gate}" == refs/heads/* ]] \
               && [ "${PUSH_REF:-}" != "refs/heads/$DEFAULT_BRANCH" ]; then
            # Published default-branch messages can arrive through a merge.
            # A missing base cannot establish which branch commits are new.
            if ! git cat-file -e "refs/remotes/origin/$DEFAULT_BRANCH^{commit}" 2>/dev/null; then
              echo 'Refusing a commit range whose published default base is unavailable.' >&2
              exit 1
            fi
            # With no event ref, the local gate checks all unpublished commits.
            range="refs/remotes/origin/$DEFAULT_BRANCH..HEAD"
          elif [ -n "${PUSH_BEFORE:-}" ] && [ "$PUSH_BEFORE" != "$zero" ] \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="${PUSH_BEFORE}..HEAD"
          elif git rev-parse -q --verify HEAD~1 >/dev/null; then
            # New branch, or a force-push whose old tip is gone: lint the tip.
            range="HEAD~1..HEAD"
          else
            range="HEAD"
          fi
          echo "linting $range"
          # Dependabot writes its own subjects ("bump X from A to B in /dir")
          # and stops maintaining a pull request once anyone else pushes to
          # it, so its commits cannot be brought under the subject limit. They
          # never reach the default branch either: the squash subject is the
          # PR title, which the step above lints. On a Dependabot pull request
          # or a Dependabot push to its own branch, the commits Dependabot
          # authored are therefore left out, and every other commit in the
          # range is still linted one by one against the same baseline.
          bot='dependabot[bot]'
          bot_email='49699333+dependabot[bot]@users.noreply.github.com'
          if [ "${PR_AUTHOR:-}" = "$bot" ] \
             || { [ -z "${PR_BASE:-}" ] && [ "${PUSH_ACTOR:-}" = "$bot" ] \
                  && [[ "${PUSH_REF:-}" == refs/heads/dependabot/* ]]; }; then
            status=0
            for commit in $(git rev-list "$range"); do
              if [ "$(git log -1 --format=%ae "$commit")" = "$bot_email" ]; then
                echo "left out: $(git log -1 --format='%h %s' "$commit") (written by Dependabot)"
                continue
              fi
              .githooks/commit-msg --check-range "$commit^!" || status=1
            done
            exit "$status"
          fi
          .githooks/commit-msg --check-range "$range"
