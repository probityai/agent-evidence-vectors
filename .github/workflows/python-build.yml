name: python-build

# Build one pure-Python distribution with uv, check it, install it outside the
# checkout, and upload it with its checksums and source commit. release.yml
# calls this and publishes exactly these files; nothing here publishes.

on:
  workflow_call:
    inputs:
      directory:
        required: true
        type: string
      distribution:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.8"
          python-version: "3.12"
          enable-cache: false
      - name: build the wheel and the source distribution
        env:
          DIRECTORY: ${{ inputs.directory }}
          DISTRIBUTION: ${{ inputs.distribution }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          # uv writes a .gitignore into its output directory unless told not to, and the
          # count below admits exactly the wheel and the source distribution.
          uv build --no-create-gitignore --out-dir dist "$DIRECTORY"
          stem="${DISTRIBUTION//-/_}-$VERSION"
          ls dist
          test "$(find dist -type f | wc -l)" -eq 2
          test -f "dist/$stem.tar.gz"
          compgen -G "dist/$stem-*.whl" > /dev/null
          uvx --from twine==7.0.0 twine check --strict dist/*
          sha256sum dist/* > SHA256SUMS
          git rev-parse HEAD > SOURCE-COMMIT
      - name: install the wheel alone, outside the checkout
        env:
          DISTRIBUTION: ${{ inputs.distribution }}
        run: |
          set -euo pipefail
          uv venv "$RUNNER_TEMP/consumer"
          uv pip install --python "$RUNNER_TEMP/consumer" dist/*.whl
          cd "$RUNNER_TEMP"
          uv pip check --python "$RUNNER_TEMP/consumer"
          uv pip show --python "$RUNNER_TEMP/consumer" "$DISTRIBUTION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist-${{ inputs.distribution }}
          path: |
            dist/
            SHA256SUMS
            SOURCE-COMMIT
          if-no-files-found: error
          retention-days: 30
