name: field-readiness

# Five checks per field of predicates (scripts/field-readiness.py): the type URIs
# resolve, the latest release lists the corpus, the reference verifier that
# release pins judges every member, an outside workflow runs the corpus, and an
# adopter record names the field. Pull requests that touch the script run its
# offline cases and one live report. The schedule writes the daily report. Red
# checks are reported in the job summary and do not fail the job. A read that
# did not complete fails it, because then the count says nothing.

on:
  schedule:
    # Daily 06:30 UTC.
    - cron: '30 6 * * *'
  workflow_dispatch: {}
  pull_request:
    paths:
      - scripts/field-readiness.py
      - scripts/field-readiness-test.py
      - release/field-readiness.toml
      - .github/workflows/field-readiness.yml

permissions:
  contents: read

concurrency:
  # A newer push to the same pull request or branch supersedes the older run.
  # Main and tags never cancel: each main push keeps its own group by sha.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')) }}

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: every check state is reached by its own case
        run: python3 scripts/field-readiness-test.py
      - name: restart field, live
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/field-readiness.py restart
