name: dco

# Checks that every commit a pull request adds carries a Developer Certificate
# of Origin sign-off from its author. CONTRIBUTING.md says what the sign-off
# certifies and how to add one.
#
# It runs on pull_request_target so that the script judging a pull request
# comes from the base branch; on pull_request, the pull request could edit the
# script that judges it. Nothing from the pull request is run: the script fetches
# its commits and reads them with git and the API. The verdict is posted as
# the `dco/sign-off` commit status on the pull request's head commit, which is
# the name to require in a branch ruleset.
#
# It also runs on merge_group, because the ruleset requires `dco/sign-off` on
# the merge queue's commit too; without it every queue entry times out. There
# the pull request number is read from the queue branch
# (gh-readonly-queue/main/pr-<n>-<base sha>), the script again comes from the
# base commit, and the status is posted on the queue's head commit.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  merge_group:

permissions:
  contents: read

concurrency:
  # A newer push to the same pull request or branch supersedes the older run.
  # Main and tags never cancel: each main push keeps its own group by sha.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')) }}

jobs:
  dco:
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # In the merge queue, judge with the base branch's script, not the
          # queued pull request's copy of it.
          ref: ${{ github.event.merge_group.base_sha || '' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Self-test the sign-off rule
        run: bash .github/scripts/dco-check.sh --selftest

      - name: Check the sign-off on every commit
        env:
          GH_TOKEN: ${{ github.token }}
          # Logins whose own commits need no sign-off, space separated.
          DCO_MAINTAINERS: astrogilda
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$PR" ] && [ -n "$QUEUE_REF" ]; then
            PR="$(printf '%s\n' "$QUEUE_REF" | sed -n 's|^refs/heads/gh-readonly-queue/[^/]*/pr-\([0-9][0-9]*\)-[0-9a-f]*$|\1|p')"
            if [ -z "$PR" ]; then
              gh api "repos/$REPO/statuses/$HEAD_SHA" -f state=error \
                -f context=dco/sign-off -f description="The queue branch names no pull request; nothing was verified" \
                -f target_url="$RUN_URL" > /dev/null
              echo "could not read a pull request number from $QUEUE_REF"
              exit 2
            fi
          fi
          if [ -z "$PR" ]; then
            echo "This event carries no pull request, so no sign-off was checked."
            exit 0
          fi
          set +e
          bash .github/scripts/dco-check.sh "$REPO" "$PR"
          rc=$?
          set -e
          case "$rc" in
            0) state=success; description="Every commit that needs a sign-off has one" ;;
            1) state=failure; description="A commit lacks a sign-off; the run log names it" ;;
            *) state=error; description="The check could not run; nothing was verified" ;;
          esac
          gh api "repos/$REPO/statuses/$HEAD_SHA" -f state="$state" \
            -f context=dco/sign-off -f description="$description" \
            -f target_url="$RUN_URL" > /dev/null
          exit "$rc"
