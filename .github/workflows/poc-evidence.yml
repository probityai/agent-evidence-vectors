name: Proof-of-Control evidence vectors

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'vectors-poc-evidence/**'
      - '.github/workflows/poc-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'vectors-poc-evidence/**'
      - '.github/workflows/poc-evidence.yml'

permissions:
  contents: read

jobs:
  judge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.15'
      - name: Install pinned control dependencies
        run: python -m pip install cryptography==45.0.7 build==1.3.0 jsonschema==4.25.1
      - name: The committed corpus is what the builder writes
        run: python vectors-poc-evidence/build/proof-of-control-build.py --check
      - name: Every case ties to the specification text and fools only its wrong verifier
        run: python -m unittest discover -s vectors-poc-evidence/tests -v
      - name: Run the corpus from the built wheel alone
        run: |
          python -m build --wheel --outdir .build/poc-dist vectors-poc-evidence/package
          python -m venv .build/poc-venv
          .build/poc-venv/bin/python -m pip install .build/poc-dist/*.whl
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.build/poc-venv/bin/python" -m poc_evidence_vectors.run_vectors
