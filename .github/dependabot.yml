version: 2

# One pull request per ecosystem. Every ecosystem lists all of its manifest
# directories and puts them in a single group, so a week of updates arrives as
# one reviewable pull request that the merge train tests once, never as a pile
# of one-package pull requests that collide on the same lock file. A second
# group per ecosystem (applies-to: security-updates) does the same for alert
# fixes, so an alert becomes one grouped pull request too.
#
# The squash subject of a Dependabot pull request is its title plus " (#N)",
# and the repository job refuses a subject over 72 characters. Dependabot
# writes the title and has no length setting, but a grouped pull request is
# titled "<prefix>: bump the <group> group [in <directory>] with N updates",
# which does not grow with package names or versions. Every ecosystem is
# therefore one group with a short name, so a title stays under 65 characters
# by construction and the limit is never relaxed. One group per ecosystem
# also moves related pins together: the GitHub Actions group bumps
# codeql-action's init and analyze steps in one pull request, where
# separate ones left the two at different versions.
#
# Not listed on purpose: interop/aps-priorseal-e2-2026-09-30 (hash-locked CI
# requirements regenerated by hand), the packages/admission/consumers build
# locks and the vendored interop/govops-capability-id/source copy, whose
# digests other gates bind.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      gha:
        applies-to: version-updates
        patterns: ["*"]
      gha-sec:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: uv
    directories:
      - /
      - /corpora/vectors-acs-decision-record/run
      - /crates/jcs-admit/python
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      uv:
        applies-to: version-updates
        patterns: ["*"]
      uv-sec:
        applies-to: security-updates
        patterns: ["*"]
    # cbor2 6.x decodes COSE messages to a tuple and breaks every well-formed
    # SCITT vector; pymupdf is pinned exactly because the NIST AI 300-1 digests
    # bind to the text it extracts and 2.x is untyped under mypy strict.
    ignore:
      - dependency-name: cbor2
        versions: [">=6"]
      - dependency-name: pymupdf
  - package-ecosystem: pip
    directories:
      - /docs/guides/offline-verify
      - /interop/a2a-s3-retain-2026-10-01
      - /interop/agmi-anchored-chain
      - /interop/ccs-draft10-reader
      - /interop/gemara-method-link
      - /interop/govops-capability-id
      - /interop/jep-core07-reader
      - /interop/observed-code-digest-candidate
      - /interop/observed-invocation-binding-candidate
      - /interop/remora-boundary-readers
      - /packages/admission
      - /packages/admission/python
      - /packages/vocabulary
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      pip:
        applies-to: version-updates
        patterns: ["*"]
      pip-sec:
        applies-to: security-updates
        patterns: ["*"]
    # cbor2 6.x decodes COSE messages to a tuple and breaks every well-formed
    # SCITT vector; pymupdf is pinned exactly because the NIST AI 300-1 digests
    # bind to the text it extracts and 2.x is untyped under mypy strict.
    ignore:
      - dependency-name: cbor2
        versions: [">=6"]
      - dependency-name: pymupdf
  - package-ecosystem: cargo
    directories:
      - /crates/dsse
      - /crates/dsse/npm/wasm
      - /crates/jcs-admit
      - /crates/jcs-admit/npm/wasm
      - /crates/jcs-admit/python
      - /crates/jcs-admit/interop/aps-canonical-bytes/runner
      - /crates/jcs-admit/interop/go-jcs/admission
      - /interop/aps-jcs/runner
      - /interop/ccs-draft10-reader/jcs-admit-check
      - /interop/govops-capability-id/admission
      - /interop/mcp-sdks/jcs-admit
      - /interop/mcp-sdks/rust
      - /readers/w3c-report-rs
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      cargo:
        applies-to: version-updates
        patterns: ["*"]
      cargo-sec:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: gomod
    directories:
      - /witnessattestor
      - /crates/dsse/vectors/generate
      - /interop/mcp-sdks/go
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      go:
        applies-to: version-updates
        patterns: ["*"]
      go-sec:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directories:
      - /crates/dsse/npm
      - /crates/jcs-admit/npm
      - /interop/mcp-sdks/typescript
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      npm:
        applies-to: version-updates
        patterns: ["*"]
      npm-sec:
        applies-to: security-updates
        patterns: ["*"]
