name: Independent run report
description: Report a run of a corpus in this repository by a verifier this repository did not write.
title: "run report: <your verifier> at suiteRevision <N>"
labels: ["independent-run"]
body:
  - type: markdown
    attributes:
      value: |
        A run reported here goes into [`RUNS.md`](../blob/main/RUNS.md) transcribed exactly as you post it,
        under the label you give it, with your own words quoted. It is never rounded, never restated as a
        fraction of a different corpus, and never described as unprompted if you call it directed.

        **A disagreement is the interesting result.** If your verifier answered differently from the corpus
        on any vector, that is worth more here than a clean pass, and it is a defect in one of the two of us
        without prejudice as to which.
  - type: input
    id: implementation
    attributes:
      label: The implementation
      description: Repository, or a name and a link if it is not public.
      placeholder: "example/my-verifier"
    validations:
      required: true
  - type: dropdown
    id: corpus
    attributes:
      label: Which corpus
      options:
        - "vectors/"
        - "vectors-aci/"
        - "vectors-acs-core/"
        - "vectors-ai-agent-action/"
        - "vectors-ai-generation/"
        - "vectors-anchor-stream/"
        - "vectors-artifact-binding/"
        - "vectors-mcp-record-contract/"
        - "vectors-mcp-response-phase/"
        - "vectors-observed-effect/"
        - "vectors-scitt-cose/"
        - "vectors-w3c-report/"
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: suiteRevision
      description: The head heading of vectors/CHANGES.md at the commit you ran, or the equivalent for the corpus you ran.
    validations:
      required: true
  - type: input
    id: suite-commit
    attributes:
      label: Suite commit
      description: The commit of this repository you ran against, so a reader can fetch the same bytes.
    validations:
      required: true
  - type: input
    id: figures
    attributes:
      label: The headline figure, exactly as you would publish it
      description: >
        In your own wording and your own arithmetic. It is transcribed here as you write it, never
        rounded and never restated as a fraction of a different corpus, so write the one you would
        stand behind in your own repository.
      placeholder: "<total>/<total>"
    validations:
      required: true
  - type: dropdown
    id: label
    attributes:
      label: Blind or directed
      description: >
        Directed if you read the specification diff, the changelog, the rail source, the manifest's
        expected codes or vectors/interpretation-decisions.json before or during the implementation.
        Blind if you did not. Only you can answer this and the answer is taken as given.
      options:
        - "blind"
        - "directed"
        - "part blind, part directed (say which in the notes)"
    validations:
      required: true
  - type: input
    id: verdict-counts
    attributes:
      label: Verdict counts for the corpus you ran
      description: >
        Per outcome, in that corpus's own vocabulary. Two corpora here answer over three verdicts
        rather than accept and reject, and collapsing one of those into two buckets drops the
        bucket the corpus exists to test.
      placeholder: "accepts <n>/<n>, rejects <n>/<n>, indeterminate <n>/<n>; or verified/failed/notEstablished"
    validations:
      required: true
  - type: textarea
    id: disagreements
    attributes:
      label: Disagreements, as bug reports
      description: >
        Every vector where your verifier and the corpus reached different answers. One entry per
        vector, written as a defect report rather than a tally: the vector id, what the corpus
        expects, what your verifier answered, and the reason it answered that. Each entry is
        triaged against the specification text on its own, and whichever side is wrong it becomes
        a row in DISPOSITIONS.md under a permanent identifier, in your frame.
      placeholder: "bad-0000: the corpus expects invalid with code X; we return valid, because ..."
    validations:
      required: false
  - type: input
    id: source-digest
    attributes:
      label: Source digest of the build that ran
      description: >
        The digest of the implementation as it was when it ran. Optional, and its absence is recorded as
        an absence rather than filled in from a later build.
    validations:
      required: false
  - type: input
    id: posting
    attributes:
      label: Where the run record lives
      description: A link that resolves to the record itself, not to a summary of it.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything the figures do not carry
      description: >
        Scope the run does not cover, a rule no vector exercised, contamination you want disclosed, a
        method correction. This is the field that makes a row worth reading a year later.
    validations:
      required: false
