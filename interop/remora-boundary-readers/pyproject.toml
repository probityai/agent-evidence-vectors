[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "probity-remora-boundary-reader"
version = "0.1.0"
description = "Separate readers for frozen REMORA execution-boundary fixtures"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[project.scripts]
probity-remora-boundary = "remora_boundary.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["remora_boundary*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["remora_boundary", "controls", "verify_bridge"]
