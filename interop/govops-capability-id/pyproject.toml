[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "probity-govops-ids"
version = "0.0.0"
description = "Raw descriptor correlation and explicit signed decision bindings"
requires-python = ">=3.11"
dependencies = ["cryptography==46.0.0"]

[project.scripts]
probity-govops-ids = "govops_ids.cli:main"

[tool.setuptools]
packages = ["govops_ids"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C90"]

[tool.ruff.lint.isort]
# Name the local modules: the workflow lints from the repository root, which
# has its own fixtures/ directory, so path-based detection depends on the
# working directory.
known-first-party = ["fixtures", "govops_ids", "qualify"]

[tool.ruff.lint.mccabe]
max-complexity = 10
