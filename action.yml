name: "agent-evidence-vectors"
description: "Check a verifier of AI-agent and supply-chain formats against public conformance corpora, and publish a pass/fail report"
author: "Sankalp Gilda"

# Replay a consumer's verifier and retain its results. The interface is in
# docs/reference/verifier-contract.md; workflow examples are in
# docs/guides/runner.md.

branding:
  icon: "check-square"
  color: "purple"

inputs:
  verifier:
    description: >-
      Command line of the verifier under test, for example `./aee-verify -validity-only -json`.
      The first token must be on PATH or a path relative to the workspace. This
      verifier is always the program that runs: the job fails when it cannot be
      started or when it answered fewer vectors than the corpus holds. Name
      either this or `runtime`.
    required: false
    default: ""
  runtime:
    description: >-
      Command line of a runtime adapter, for a corpus that defines a runtime
      contract (today `vectors-uncertain-effect`). The adapter is run as
      `<runtime> <scenario.json>` against a counting effect owner whose URL is in
      `AEV_EFFECT_OWNER`, performs the scenario's operation through the runtime's
      own execution and retry path, and prints its outcome; the job fails when
      the owner ends up holding an effect count, or the runtime reports an
      outcome, that the scenario does not accept. The contract is in the corpus
      README. When it is set, `verifier` is not used.
    required: false
    default: ""
  corpus:
    description: >-
      Name of the shipped corpus to replay. `vectors` is the Adversarial
      Execution Evidence corpus the reference rail judges.
      `vectors-a2a-jcs-v01` is the a2a Agent Card canonicalization corpus from
      a2a-tck; its verifier is run as `<verifier> <target> <input.json>` (see
      docs/reference/corpus-readers.md), and setting `A2A_JCS_TARGET: rfc8785`
      in the step's env scores a bare RFC 8785 canonicalizer. Run
      `agent-evidence-vectors --list-corpora` for every name the release carries.
    required: false
    default: "vectors"
  vectors:
    description: >-
      Path, relative to the workspace, of a corpus directory to replay in place
      of a shipped corpus: a directory holding a MANIFEST.json, such as a
      checkout of a2a-tck's `conformance-vectors/a2a-jcs-v01` at the commit a
      workflow pins. When it is set, `corpus` is not used. The report carries
      the corpus digest that directory's MANIFEST recomputes to, so the
      workflow can hold the run to its own pin rather than to whichever copy
      this action's release carries.
    required: false
    default: ""
  tag:
    description: >-
      Release of the corpus to replay, as a git tag such as `v0.11.1`. The
      default is the ref this action was used at, so `uses: ...@v0.11.1` replays
      the v0.11.1 corpus. Set it to replay a different release than the action
      itself was pinned to.
    required: false
    default: ""
  artifact-name:
    description: >-
      Name of the uploaded results artifact. A scoreboard pulls the report by
      this name, so leave the default unless this action runs more than once in
      one workflow, in which case each run needs its own.
    required: false
    default: "agent-evidence-vectors-results"
  report-path:
    description: "Where the report JSON is written, relative to the workspace."
    required: false
    default: "agent-evidence-vectors-report.json"
  retention-days:
    description: >-
      Days GitHub keeps the uploaded report artifact. The default, 30, is what
      every earlier release of this action used. The repository or organisation
      retention setting caps it, and GitHub refuses a value outside 1 to 90.
    required: false
    default: "30"

outputs:
  report:
    description: "Path of the report JSON."
    value: ${{ steps.replay.outputs.report }}
  vectors:
    description: "How many vectors were replayed."
    value: ${{ steps.summary.outputs.vectors }}
  conform:
    description: "How many vectors the verifier conformed on, by verdict and result."
    value: ${{ steps.summary.outputs.conform }}
  executed:
    description: "How many vectors the named verifier actually ran on."
    value: ${{ steps.summary.outputs.executed }}
  result:
    description: >-
      `pass` when the named verifier ran on every vector, every vector passed,
      and the suite raised no refusal; else `fail`.
    value: ${{ steps.summary.outputs.result }}

  reference-checked:
    description: "How many corpus members the reference verifier judged the way the corpus declares."
    value: ${{ steps.reference.outputs.reference-checked }}
  reference-total:
    description: "How many members the corpus holds, the M of `reference-checked conformance N of M`."
    value: ${{ steps.reference.outputs.reference-total }}
  full-release:
    description: >-
      `true` only when the corpus holds members and the reference verifier
      judged every one of them as declared; else `false`.
    value: ${{ steps.reference.outputs.full-release }}
  reference-verifier-id:
    description: "The identifier of the reference verifier, also recorded in the report as reference.verifier.id."
    value: ${{ steps.reference.outputs.reference-verifier-id }}

runs:
  using: "composite"
  steps:
    # An exact patch release, so every run of one action pin builds and replays
    # on the same interpreter rather than on whichever 3.13 the runner image
    # resolves that day.
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.13.15"

    - name: Install the suite
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        ACTION_REF: ${{ github.action_ref }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        echo "::group::Install agent-evidence-vectors"
        # The build backend comes from a lock carried in this checkout, by
        # version and hash, as wheels only, into a venv of its own so it never
        # lands in the interpreter the rest of the job uses. The package is
        # built there with no index at all, so nothing else is fetched, and
        # only the built wheel is installed for the replay.
        build="$RUNNER_TEMP/agent-evidence-vectors-build"
        rm -rf "$build"
        python -m venv "$build/venv"
        build_python="$build/venv/bin/python"
        [ -x "$build_python" ] || build_python="$build/venv/Scripts/python.exe"
        "$build_python" -m pip install --quiet --disable-pip-version-check \
          --require-hashes --only-binary :all: \
          -r "$ACTION_PATH/action-build-requirements.txt"
        # The checkout this action runs from IS the release the consumer pinned
        # in `uses:`, so the default builds it directly. A different tag is
        # fetched from the repository by name and built with the same backend.
        if [ -z "$TAG" ] || [ "$TAG" = "$ACTION_REF" ]; then
          package_source="$ACTION_PATH"
        else
          package_source="agent-evidence-vectors @ git+https://github.com/probityai/agent-evidence-vectors@${TAG}"
        fi
        "$build_python" -m pip wheel --quiet --disable-pip-version-check \
          --no-build-isolation --no-index --no-deps --wheel-dir "$build/dist" "$package_source"
        python -m pip install --quiet --disable-pip-version-check \
          --no-index --no-deps "$build"/dist/agent_evidence_vectors-*.whl
        agent-evidence-vectors --list-corpora
        echo "::endgroup::"

    - name: Replay the corpus
      id: replay
      shell: bash
      env:
        VERIFIER: ${{ inputs.verifier }}
        RUNTIME: ${{ inputs.runtime }}
        CORPUS: ${{ inputs.corpus }}
        VECTORS: ${{ inputs.vectors }}
        REPORT: ${{ inputs.report-path }}
      run: |
        # The exit status is kept rather than acted on here so the report and
        # the summary are produced for a failing run too; a red run with no
        # report says nothing about which vector disagreed.
        source_args=(--corpus "$CORPUS")
        if [ -n "$VECTORS" ]; then
          source_args=(--vectors "$VECTORS")
        fi
        status=0
        if [ -n "$RUNTIME" ]; then
          agent-evidence-vectors runtime "${source_args[@]}" --runtime "$RUNTIME" --report "$REPORT" || status=$?
        elif [ -n "$VERIFIER" ]; then
          agent-evidence-vectors "${source_args[@]}" --verifier "$VERIFIER" --report "$REPORT" || status=$?
        else
          echo "::error::name a verifier or a runtime; nothing was run."
          status=2
        fi
        echo "report=$REPORT" >> "$GITHUB_OUTPUT"
        echo "status=$status" >> "$GITHUB_OUTPUT"

    - name: Write the job summary
      id: summary
      if: ${{ !cancelled() }}
      shell: bash
      env:
        REPORT: ${{ steps.replay.outputs.report }}
        STATUS: ${{ steps.replay.outputs.status }}
        CORPUS: ${{ inputs.vectors || inputs.corpus }}
      # The body is scripts/action-summary.py in this action's own checkout
      # rather than a heredoc here, so the local workflow mirror can run the
      # same code and produce the same outputs. A mirror that reimplemented
      # this arithmetic would agree on the day it was written and drift after.
      run: python3 "$GITHUB_ACTION_PATH/scripts/action-summary.py"

    # The second stage. No input names it and none switches it off: a candidate
    # verifier is always also checked against the reference verifier, pinned by
    # version and hash in action-reference-requirements.txt. Installing it into a
    # venv of its own keeps it out of the interpreter the candidate runs on, and
    # the package's own metadata names none of it.
    - name: Install the reference verifier
      id: reference-install
      if: ${{ !cancelled() }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        echo "::group::Install the reference verifier"
        ref="$RUNNER_TEMP/agent-evidence-vectors-reference"
        rm -rf "$ref"
        python -m venv "$ref/venv"
        ref_python="$ref/venv/bin/python"
        [ -x "$ref_python" ] || ref_python="$ref/venv/Scripts/python.exe"
        "$ref_python" -m pip install --quiet --disable-pip-version-check \
          --require-hashes --only-binary :all: \
          -r "$ACTION_PATH/action-reference-requirements.txt"
        "$ref_python" -m pip install --quiet --disable-pip-version-check \
          --no-index --no-deps "$RUNNER_TEMP"/agent-evidence-vectors-build/dist/agent_evidence_vectors-*.whl
        echo "python=$ref_python" >> "$GITHUB_OUTPUT"
        echo "::endgroup::"

    - name: Check against the reference verifier
      id: reference
      if: ${{ !cancelled() }}
      shell: bash
      env:
        REPORT: ${{ steps.replay.outputs.report }}
        VECTORS: ${{ inputs.vectors }}
        CORPUS: ${{ inputs.corpus }}
        REF_PYTHON: ${{ steps.reference-install.outputs.python }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        if [ -n "$VECTORS" ]; then
          CORPUS_DIR="$VECTORS"
        else
          CORPUS_DIR="$("$REF_PYTHON" -c "import agent_evidence_vectors, pathlib, sys; print(pathlib.Path(agent_evidence_vectors.__file__).parent / 'corpora' / sys.argv[1])" "$CORPUS")"
        fi
        export CORPUS_DIR
        "$REF_PYTHON" "$ACTION_PATH/scripts/action-reference-stage.py"

    - name: Upload the report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.replay.outputs.report }}
        overwrite: true
        retention-days: ${{ inputs.retention-days }}

    # Keyed on the summary's verdict as well as the exit status. The status
    # alone once turned a replay on the harness's own reference rail into a
    # green job for a verifier that never started; the summary refuses any
    # report that does not show the named verifier answering every vector.
    - name: Fail the job when the replay did, or the verifier did not run
      if: ${{ !cancelled() && (steps.replay.outputs.status != '0' || steps.summary.outputs.result != 'pass') }}
      shell: bash
      env:
        STATUS: ${{ steps.replay.outputs.status }}
        EXECUTED: ${{ steps.summary.outputs.executed }}
      run: |
        if [ "$STATUS" != "0" ]; then
          echo "::error::agent-evidence-vectors exited $STATUS; the job summary names the vectors that disagreed, or the log says the verifier did NOT run."
          exit "$STATUS"
        fi
        echo "::error::the harness exited 0 but the report does not show the named verifier answering every vector (executed: ${EXECUTED:-unreported}); the job summary says why."
        exit 1
