# Rationales for functions carrying `# noqa: C901`.
#
# A few functions exceed the mccabe cyclomatic-complexity threshold in
# pyproject.toml because the work they do is inherently branch-heavy, not
# because of tangled structure. Each entry records the function, its measured
# complexity, and why the complexity is inherent.
#
# `scripts/complexity-table-gate.py --rail python` enforces this file against a
# fresh measurement and fails the build on drift. The measurement has to pass
# ruff `--ignore-noqa`, because the marker that brings a function here is also
# what stops the linter from reporting its number. Run the gate with `--sync`
# after a legitimate change; adding or dropping an entry stays a hand edit.

["vectors/accept/gen_valid_vectors.py::verify"]
complexity = 47
rationale = """
The accept-vector generator carries its own independent statement verifier as a
build-time self-check, a deliberate second opinion distinct from the Go and
Python reference verifiers. It replicates the full gate logic (well-formedness,
coverage validity, per-record payload and binding checks, tier derivation), so
its branch count mirrors the specification's, not any avoidable structure.
Decomposing it would not lower the inherent branching and would risk diverging
the self-check from the spec it mirrors.
"""

["vectors/accept/gen_valid_vectors.py::make_statement"]
complexity = 12
rationale = """
make_statement assembles a valid statement from many independent, optional
Options fields (result, signer role, record shape, coverage sets, and so on).
Each option contributes one guarded branch; the complexity is the coordination
of those independent knobs, not tangled control flow.
"""

["vectors/reject/gen_invalid_vectors.py::second_fault_absence"]
complexity = 16
rationale = """
second_fault_absence runs a sequence of independent second-fault checks (root
family, vocabulary, corpus, binding, signatures, result recompute, and the
run-end record-set commitment) to assert each reject vector is broken exactly
one way. The checks are independent by construction; the branch count is the
number of fault families guarded, one per family.
"""

["vectors/accept/gen_valid_vectors.py::verify_commitments"]
complexity = 29
rationale = """
verify_commitments reads a finished accept vector a SECOND time and asserts each
of the coverage validity requirements this predicate version adds, one branch per
requirement per subject it holds over: three requirements over every row, three
over every carried record, and three over the run-level records of a statement
carrying a substrate row. The branch count is the requirement count, and the
duplication against the builder is the point rather than an accident -- a builder
and a checker that share a derivation share its mistakes, and nine accept vectors
moved when these requirements landed without anything in this file being able to
see it. Splitting it by subject would hide the one property a reader wants, which
is that every requirement in the specification's list has a line here.
"""

["vectors/reject/gen_invalid_vectors.py::commitments_check"]
complexity = 19
rationale = """
commitments_check asserts the same list over every reject PARENT, which is the
statement each vector derived from that parent starts as. A parent that quietly
violates one of them gives every child a fault it was not written to test, and
four parents did exactly that the moment the sealed record became unconditional.
One branch per requirement, plus the guards that skip the substrate-only half on
an artifact-only parent.
"""

["scripts/mutationdiff.py::recomputed_result"]
complexity = 12
rationale = """
The carried result is defined by the specification as a minimum over three
conditions quantified across every attackResults row, and each condition is a
separate guarded clause on a separate member. The branch count is the rule's,
and the function exists precisely so the one-mutation diff can tell a result
that follows from the rows from a result somebody set. Decomposing it would
split one specification sentence across several functions and invite the copy
that diverges.
"""

["scripts/mutationdiff.py::_derived_marks"]
complexity = 20
rationale = """
One guarded branch per derived field the projection knows about -- corpus
digest, vocabulary digest, batch root, per-record signature, run binding,
observed set, posture digest -- each with its own readability guard because the
statements it runs over are deliberately malformed. The branches are
independent and trivial; the count is the number of derived fields, not the
depth of any structure.
"""

["scripts/mutationdiff.py::semantic_preimage"]
complexity = 17
rationale = """
The mirror of _derived_marks: one guarded branch per derived field, replacing
what the marker map allows. It is a separate function from the marker pass on
purpose, because every derivation must be computed from the statement AS GIVEN
before anything is replaced -- a collapse that fed another would derive a
different binding and read every record as hand-set.
"""

["scripts/mutationdiff.py::_walk"]
complexity = 13
rationale = """
Type dispatch over a JSON tree: object against object, array against array,
scalar against scalar, plus the three structural cases that make one edit count
once -- a member renamed, an array permuted, a subtree present on one side.
Each branch is a few lines and none nests inside another.
"""

["scripts/gen_spec_anchors.py::main"]
complexity = 37
rationale = """
A one-time migration, and its branch count is the migration's own shape rather
than tangled structure: read the pinned previous revision of the specification,
map every line-number citation onto the companion file that now holds that text,
walk each range inward past blank lines, snap it outward to whole markdown
blocks, name the unit, insert the anchor bottom-up so earlier offsets stay valid,
rewrite the citation in the source, and write the registry. Each phase is
sequential and each one's failure has to be reported in its own terms, which is
where the branches are.

It is accepted rather than decomposed for a reason specific to this script: the
migration has already been applied, so the --apply path cannot be exercised
again without rewriting the tree it already rewrote. Refactoring code that will
not run again, against a path no test can safely drive, trades a real risk for a
number. The number is recorded here instead, where the gate holds it: if this
function is ever edited and its complexity moves, the build fails until someone
reads this entry.
"""
