# Every unit .github/workflows/release.yml can publish. A GitHub release whose
# tag is <prefix>-v<version> publishes the unit with that prefix, from the
# directory named here, after scripts/workspace.py checks that the directory
# exists, that its manifest carries that version, and that the tagged commit is
# on main. A unit is added in the change that imports its directory.
#
# registry "crates.io" reads the version from <directory>/Cargo.toml;
# registry "pypi" reads it from <directory>/pyproject.toml;
# registry "npm" reads it from <directory>/package.json;
# registry "github-actions" reads it from <directory>/VERSION.

[[unit]]
prefix = "dsse"
name = "dsse"
registry = "crates.io"
directory = "crates/dsse"

[[unit]]
prefix = "dsse-npm"
name = "dsse"
registry = "npm"
directory = "crates/dsse/npm"

[[unit]]
prefix = "jcs-admit"
name = "jcs-admit"
registry = "crates.io"
directory = "crates/jcs-admit"

[[unit]]
prefix = "jcs-admit-py"
name = "jcs-admit"
registry = "pypi"
directory = "crates/jcs-admit/python"

[[unit]]
prefix = "jcs-admit-npm"
name = "jcs-admit"
registry = "npm"
directory = "crates/jcs-admit/npm"

[[unit]]
prefix = "agent-evidence-admission"
name = "agent-evidence-admission"
registry = "pypi"
directory = "packages/admission/python"

[[unit]]
prefix = "agent-evidence-vocabulary"
name = "agent-evidence-vocabulary"
registry = "pypi"
directory = "packages/vocabulary"

# The same distribution under a separate tag, for publishing the Python package
# of a data release whose own tag already exists and must not move (the
# agent-evidence-vocabulary-python-v0.5.0 tag is the earlier case).
[[unit]]
prefix = "agent-evidence-vocabulary-python"
name = "agent-evidence-vocabulary"
registry = "pypi"
directory = "packages/vocabulary"

# The root action.yml, whose code is under actions/. Its release is the GitHub
# release itself (and its Marketplace listing); nothing goes to a registry.
[[unit]]
prefix = "action"
name = "agent-evidence"
registry = "github-actions"
directory = "actions"
