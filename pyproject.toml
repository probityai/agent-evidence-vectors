# agent-evidence-vectors Python tooling.
#
# The reference verification RAIL (packaging/run_vectors.py) is deliberately
# stdlib-only (zero third-party dependency) so a relying party can run the
# suite against any verifier with nothing but a CPython install. Only the
# vector GENERATORS (vectors/**/gen_*.py) use the cryptography library, and
# only at build time. Do not add a runtime dependency to the rail.

[project]
name = "agent-evidence-vectors"
version = "0.31.0"
description = "Conformance corpora and reference verifiers for agent evidence records"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
readme = "README.md"
authors = [{ name = "Sankalp Gilda", email = "sankalp.gilda@gmail.com" }]
keywords = ["in-toto", "attestation", "conformance", "test-vectors", "agent-evidence", "dsse"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/probityai/agent-evidence-vectors"
Repository = "https://github.com/probityai/agent-evidence-vectors"
Documentation = "https://probityai.github.io/agent-evidence-vectors/start.html"
Issues = "https://github.com/probityai/agent-evidence-vectors/issues"
Changelog = "https://github.com/probityai/agent-evidence-vectors/releases"

# The one console entry point. It is named after the distribution so that
# `uvx agent-evidence-vectors` resolves without a --from, which is the whole
# reason a relying party would reach for the package instead of a clone.
[project.scripts]
agent-evidence-vectors = "agent_evidence_vectors.run_vectors:main"
# The held-out runner: one child adapter per run, a steward-sealed slice, and
# a record sealed at run end. See docs/HELD-OUT-CONFORMANCE.md.
agent-evidence-heldout = "agent_evidence_vectors.heldout:main"

# REMORA's runtime-surface-e7-v0.1 reader, with the frozen producer package it
# was pinned to shipped beside it, so `pip install agent-evidence-vectors==X`
# alone reproduces an E7 run without a clone.
agent-evidence-vectors-remora-e7 = "agent_evidence_vectors.remora_e7.run:main"

# One pinned MCP invocation judged on three separate axes (package integrity,
# request and decision correspondence, observed effect), with its frozen corpus.
agent-evidence-vectors-invocation-axes = "agent_evidence_vectors.invocation_axes.run:main"

# Building-automation write trails judged on six axes: retried dispatch, approval after a pause,
# stale or cached reads, missing observation and reader vantage.
agent-evidence-vectors-building-effect = "agent_evidence_vectors.building_effect.run:main"

# Building-control decision trails (ot-federation-case/v1) judged on six claims, with a corpus
# that catches each check a verifier could drop; also writes the cases as a sealed fixture set.
agent-evidence-vectors-ot-federation = "agent_evidence_vectors.ot_federation.run:main"

# One resumed agent task: turn ownership, artifact replay and repeated effects judged apart.
agent-evidence-vectors-resume-turns = "agent_evidence_vectors.resume_turns.run:main"
# One paid request occurrence: issuer budget, payment and execution receipts each
# judged natively, with the cross-artifact spend and occurrence links kept apart.
agent-evidence-vectors-occurrence-binding = "agent_evidence_vectors.occurrence_binding.run:main"
# One synthetic FX trade booking after a lost reply: booking-system, liquidity-provider and
# agent-ledger statements each counted under their own key, judged on seven separate axes.
agent-evidence-vectors-trade-booking = "agent_evidence_vectors.trade_booking.run:main"
# ACS host steps taken while the Guardian is unreachable (startup default, cached
# deny or proceed, audit to OTLP), from a recorded replay, with an external-verifier contract.
agent-evidence-vectors-acs-outage = "agent_evidence_vectors.acs_outage.run:main"
# The ACS conformance verdict evidence controls: peer-authored scope lifts and
# bound quarantine records, with an external-verifier contract.
agent-evidence-vectors-verdict-evidence = "agent_evidence_vectors.verdict_evidence.run:main"
# Operand provenance: a declared constant grounds an operand only when the
# executed derivation read it, at the declared value.
agent-evidence-vectors-operand-provenance = "agent_evidence_vectors.operand_provenance.run:main"
# The evaluation claim record: every coordinate present, judged under the profile the
# relying party's acceptance rule pins. Also reachable as `agent-evidence-vectors claim`.
agent-evidence-vectors-claim = "agent_evidence_vectors.claim_record.run:main"
# Evaluation result readings: score direction declared and never inferred, evidence origin
# per item apart from verifier identity, and held-out status where absent is unknown.
# Also reachable as `agent-evidence-vectors evalresult`.
agent-evidence-vectors-evalresult = "agent_evidence_vectors.eval_result.run:main"
# Recorded sets: retained bytes from a live run against the digest list their
# publisher wrote. Also reachable as `agent-evidence-vectors recorded`.
agent-evidence-vectors-recorded = "agent_evidence_vectors.recorded:main"
# Push verifier pass/fail into Vanta as a custom resource (dry run unless --send), so a
# Vanta Custom Test can read it as compliance evidence.
agent-evidence-vectors-vanta = "agent_evidence_vectors.vanta_connector.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# The repository stays a virtual project for `uv sync`: most gates run the rail
# from packaging/ by path. Python CI installs the checkout wheel separately to
# resolve the E2 imports of its distribution layout. The E2 reproduction job
# keeps its released-wheel pin. `uv build` still produces the wheel and sdist.
[tool.uv]
package = false

# probity-verify is the implementation the done corpora's rules come from. The
# cross-check (vectors-done-receipt/crosscheck_probity_verify.py) replays every done
# member through it, pinned to the commit the readers were ported against. A
# dependency group, so it never reaches the published package's metadata.
[tool.uv.sources]
probity-verify = { git = "https://github.com/probityai/probity", rev = "932c1e3ecc8f2142cb878cd43bf9689cbcb5f342", subdirectory = "packages/probity-verify" }

[dependency-groups]
crosscheck = ["probity-verify"]
# The repository tools of the imported parts (scripts/workspace.py and the other
# tests under tests/). The packages under packages/ are standalone projects built
# by directory (`uv build packages/<name>`); none of them has a runtime dependency. Their ruff run
# reads ruff-parts.toml, not the rules below, which the corpora and the rail keep.
dev = ["packaging==26.3", "pytest==9.2.0", "ruff==0.17.3"]

# What the wheel carries, and where. The rail is a single stdlib-only module
# kept at packaging/run_vectors.py, where every gate in scripts/ imports it by
# path; the wheel moves it under a package named after the distribution rather
# than shipping a top-level module called `packaging`, which would shadow the
# library of that name in every environment that installed us. The corpora ride
# along as data under corpora/, which the rail looks for beside itself before
# it falls back to the checkout layout. They total under ten megabytes, so they
# ship rather than being fetched by tag: a wheel that fetches at run time
# cannot be run where the network is off, and being runnable offline is the
# property the whole suite is built around.
# Corpus directories carry their generators and checkers beside the data. They
# are repository tools: they read the tree around them, and several import build
# dependencies (cryptography, cbor2) that a stdlib-only package does not carry,
# so the wheel carries the data and the packaged readers only; the sdist keeps
# them, because it is the source. Every table below is written from
# corpora/REGISTRY.toml: add or move a corpus there, never here.
# BEGIN corpus-registry: generated by scripts/corpus-registry.py from corpora/REGISTRY.toml; do not edit
