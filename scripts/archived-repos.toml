# The repositories of the probityai organisation that were archived by transfer to
# probityai-archive, and where each one's contents live now.
#
# Read by scripts/archived-repo-gate.py (the live-link gate) and by its --live check
# (which the identifier-hosts workflow runs every week). An old probityai/<name> URL
# only resolves through GitHub's 301 to probityai-archive/<name>, so a link to it lands
# a reader on a frozen copy. `home` is where a link to the archived repository goes
# instead: <owner>/<repository>[/<path inside it>].
#
# Add a row the day a repository is archived. The --live check fails when the archive
# organisation holds a repository with no row here, so a row cannot be forgotten.

[[repo]]
name = "agent-evidence"
home = "probityai/agent-evidence-vectors"
# Issues closed before the merge stayed in the archived repository; the open ones moved
# here under new numbers. A link to one of these names a record that exists only there.
untransferred_issues = [30, 31, 32, 35]

[[repo]]
name = "agent-evidence-vocabulary"
home = "probityai/agent-evidence-vectors/packages/vocabulary"

