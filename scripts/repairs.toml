# The repair registry: for every gate that COMPARES a committed artifact against
# something regenerable, the command that regenerates it.
#
# WHY THIS FILE EXISTS. A comparing gate answers "does the committed copy still
# match what the generator produces". When it refuses, the repair is always the
# same shape -- re-run the generator -- and until this file existed the operator
# had to remember which one, and in what order. Ordering matters because repairs
# are not independent: regenerating the manifest changes the corpus digest that
# the consumer ledger is compared against, so a fixed point is reached by running
# to convergence rather than by running each once in a guessed sequence.
#
# WHAT BELONGS HERE, AND WHAT DOES NOT. A gate belongs here when its argv carries
# `--check` or `--verify` EXACTLY. That is a whole-flag match on purpose: a gate
# invoked with `--check-baseline` or `--check-live` is comparing against a live
# external state or an allocation decision, not against a regenerable artifact,
# and "repairing" it would mean overwriting a record of what the world was.
# `scripts/regen.py --audit` refuses when a comparing gate declares no repair, so
# a gate added to CI without a row here turns the audit red rather than silently
# leaving the operator to remember.
#
# The `fix` is run from the repository root unless `workdir` says otherwise.
#
# EVERY REPAIR BELOW WAS READ OUT OF THE GATE'S OWN SOURCE, NOT GUESSED FROM ITS
# --help. The first draft of this file declared `--write` for two of the three,
# because that is the flag such a gate usually has. Neither has it: in this
# repository `--check` is the READ-ONLY mode and a bare invocation is what
# writes, which is visible in main() and not in the argument help. A registry of
# repairs that do not run is worse than no registry, since it converts "I must
# remember the command" into "I ran the command and nothing happened".

[[gate]]
ident = "coverage-matrix"
argv = ["python3", "scripts/coverage-matrix-gate.py", "--check"]
fix = ["python3", "scripts/coverage-matrix-gate.py"]
why = """
The requirement-coverage matrix is generated from the corpus and committed. A
vector that gains or loses a condition moves a cell, and the gate compares the
committed table against a fresh derivation.
"""

[[gate]]
ident = "condition-forcing"
argv = ["python3", "scripts/condition-forcing-gate.py", "--check"]
fix = ["python3", "scripts/condition-forcing-gate.py"]
why = """
The published weak-spot figure is derived from the forcing analysis rather than
typed, and the gate holds the published number to a fresh run.
"""

[[gate]]
ident = "consumer-lag"
argv = ["python3", "scripts/consumer-lag-gate.py", "--check"]
fix = ["python3", "scripts/consumer-lag-gate.py", "--sync"]
why = """
The consumer ledger records the corpus each vendored rail carries, read from that
rail's own vendor stamp. --sync REQUIRES a --copy id=dir argument per rail, so
this repair cannot run unattended and the runner reports it as needing the
operator rather than pretending to have run it. It is declared here so the audit
can see that the gate has a repair at all, and so nobody has to remember which
flag it is at the moment the gate is red.
"""
needs_operator = true

[[gate]]
ident = "install-pins"
argv = ["python3", "scripts/sync-install-pins.py", "--check"]
fix = ["python3", "scripts/sync-install-pins.py"]
why = """
The pinned install lines on the README, DISTRIBUTION.md and the runner guide are
generated from the published release in CITATION.cff. A release bumps the
citation and the bare invocation moves every pin to it.
"""

[[gate]]
ident = "rail-parity"
argv = ["python3", "scripts/rail-parity-gate.py", "--check"]
fix = ["python3", "scripts/rail-parity-gate.py"]
why = """
The per-member code-set divergence between the two first-party rails is derived
by replaying both over the corpus and committed. A rail change that moves which
codes one of them reports moves a row, and the gate compares the committed
baseline against a fresh replay. The bare invocation re-derives it. Note that
the repair CANNOT write away a verdict split: the gate refuses to record one and
exits non-zero with nothing written, because a verdict split is a rail defect
rather than a figure to note down.
"""

[[gate]]
ident = "intake-records"
argv = ["uv", "run", "--locked", "--extra", "generators", "python", "scripts/gen-intake-records.py", "--check"]
fix = ["uv", "run", "--locked", "--extra", "generators", "python", "scripts/gen-intake-records.py"]
why = """
Every corpus in release/CORPUS-DIGESTS.txt has an intake record and a native
checker output under release/intake/, written from a fresh run of that corpus's
checker. --check reruns every checker and refuses any differing byte; a bare
invocation is what writes the records. It needs the Go toolchain, because the
checker is aee-verify.
"""

[[gate]]
ident = "derived-files"
argv = ["uv", "run", "--locked", "--extra", "generators", "python", "scripts/regenerate-derived.py", "--check"]
fix = ["uv", "run", "--locked", "--extra", "generators", "python", "scripts/regenerate-derived.py"]
why = """
The signed digest list, the intake records and the shared-source lock are
derived files. --check runs the three generators in comparing mode and refuses
any differing byte; a bare invocation rewrites all three in order. After a
merge whose conflicts are all in derived files, --resolve-merge settles it.
"""

[[gate]]
ident = "corpus-registry"
argv = ["uv", "run", "--locked", "--extra", "dev", "python", "scripts/corpus-registry.py", "--check"]
fix = ["uv", "run", "--locked", "--extra", "dev", "python", "scripts/corpus-registry.py"]
why = """
corpora/REGISTRY.toml is the one place a corpus is declared. The packaging
block in pyproject.toml (between its BEGIN and END markers) and corpora/README.md
are derived from it. --check refuses when either differs from what a run writes;
a bare invocation rewrites both.
"""

[[gate]]
ident = "jcs-drift-vectors"
argv = ["python3", "scripts/gen-jcs-drift-vectors.py", "--check"]
fix = ["python3", "scripts/gen-jcs-drift-vectors.py"]
why = """
The driftCases and depthCases keys of corpora/jcs-byte-vectors/cases.json are
written by the generator, with the canonical bytes pinned by hand in it. A hand
edit to either key, or a change to the generator, moves the file; the Go
module's embedded copy follows through scripts/gen-jcsvectors-data.py.
"""

[[gate]]
ident = "mcp-owasp-vectors"
argv = ["uv", "run", "python", "corpora/vectors-mcp-owasp/gen_vectors.py", "--check"]
fix = ["uv", "run", "python", "corpora/vectors-mcp-owasp/gen_vectors.py"]
why = """
The MCP OWASP vector tree is written by its generator. --check rebuilds the
tree in memory and refuses when the files on disk differ; a bare run deletes
files it no longer emits and rewrites the rest. Until ci.yml was read as YAML
this gate sat on the first line of a run block, which the line scan skipped.
"""

[[gate]]
ident = "agentavow-live-mcp-cases"
argv = ["env", "PYTHONPATH=packaging", "uv", "run", "python", "interop/agentavow-live-mcp/build_cases.py", "--check"]
fix = ["env", "PYTHONPATH=packaging", "uv", "run", "python", "interop/agentavow-live-mcp/build_cases.py"]
why = """
fixtures/cases.json holds the live MCP named-tool definition cases. --check
refuses when the committed bytes differ from a fresh build; a bare run writes
the file. Missed by the old line scan for the same reason as above.
"""

[[gate]]
ident = "ws4-prior-witness-fixture"
argv = ["env", "PYTHONPATH=packaging", "uv", "run", "python", "interop/ws4-prior-witness-candidate/gen_fixture.py", "--check"]
fix = ["env", "PYTHONPATH=packaging", "uv", "run", "python", "interop/ws4-prior-witness-candidate/gen_fixture.py", "--write"]
why = """
The WS4 prior-witness fixture files are generated. --check names each file
whose bytes differ; this generator writes only with --write, and any other
argument prints usage and exits 2. Missed by the old line scan for the same
reason as above.
"""
