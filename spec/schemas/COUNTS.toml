# Expected counts per published predicate schema, checked by scripts/schema_counts.py.
# `samples` are globs of sample records; `where` keeps those whose top-level members equal it.
# After a deliberate schema change, run `python3 scripts/schema_counts.py --print` and copy
# the measured counts into `expect`; review the diff, because a count that moved is the change.

[[schema]]
schema = "spec/schemas/incident-evidence-cell-v1.schema.json"
samples = ["corpora/vectors-incident-evidence-cell/cases/*/record.json"]
expect = { samples = 31, positive = 9, negative = 22, mutants = 416, mutants_rejected = 416 }

[[schema]]
schema = "spec/schemas/incident-action-authorization-v1.schema.json"
samples = ["corpora/vectors-restart-records/cases/*/*.json"]
where = { predicateType = "https://probityai.github.io/agent-evidence-vectors/predicate/v1/incident-action-authorization" }
expect = { samples = 21, positive = 17, negative = 4, mutants = 1459, mutants_rejected = 1392 }

