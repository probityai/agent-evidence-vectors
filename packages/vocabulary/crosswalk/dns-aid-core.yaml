system: dns-aid-core
system_url: https://github.com/dns-aid/dns-aid-core
crosswalk_version: "0.1.0"
vocabulary_version_targeted: "0.10.0"

maintainer:
  github: probityai
  third_party_authored: true

summary_of_system: >
  A Python library and CLI that publishes and resolves agent discovery records in DNS (SVCB records
  under the DAWN discovery draft) and verifies a JWS that binds a record's parameters. Its verifier
  reports why verification reached its answer as one value of a SignatureStatus enumeration
  (src/dns_aid/core/jwks.py, read at commit 825ccea1259267898df59b80e063317ec6900224). This filing
  maps that enumeration; it is written from outside the project and promotes nothing.

record_binding:
  signature_coverage:
    match: partial
    evidence: asserted
    source_path: https://github.com/dns-aid/dns-aid-core/blob/825ccea1259267898df59b80e063317ec6900224/src/dns_aid/core/jwks.py#L95-L132
    notes: "SignatureStatus.VERIFIED maps to full and VERIFIED_ENDPOINT_ONLY ('valid, but only the endpoint is attested') to endpoint_only, exactly. INVALID, UNBOUND, EXPIRED and NOT_SIGNED all map to none. NO_KEY ('no JWKS reachable / no key matched -- unknown') and NOT_CHECKED (the verification budget ran out) are cannot tell, which this term does not register as a value and a verifier reports beside it."
    divergences:
      - "One enumeration carries the coverage, the reason a signature failed (INVALID, UNBOUND, EXPIRED) and the reason nothing was decided (NO_KEY, NOT_CHECKED). The registry keeps coverage in this term and leaves the failure reason and the undecided state to the verifier's report, so four enumeration values fold into none and two into no value."
      - "SKIPPED_DNSSEC is retained for stored records only and is no longer produced; it maps to no value of this term, because it recorded that no signature was checked."
  key_authority:
    match: partial
    evidence: asserted
    source_path: https://github.com/dns-aid/dns-aid-core/blob/825ccea1259267898df59b80e063317ec6900224/src/dns_aid/core/jwks.py#L95-L132
    notes: "The key is fetched as a JWKS from the zone's well-known URL. No enumeration value names how the key's authority was established, so a verdict maps to none unless the caller pinned the key (pin)."
    divergences:
      - "The withdrawn SKIPPED_DNSSEC state read the resolver's AD flag without validating a DNSSEC chain; dnssec_chain requires the chain to be validated from a held trust anchor, so that state never mapped to dnssec_chain."
      - "No key-transparency inclusion is checked, so kt_inclusion has no counterpart."
