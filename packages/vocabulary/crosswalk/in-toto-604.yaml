# Filed from outside, from the issue text of in-toto/attestation#604, read on
# 2026-10-17 at the state of that date.
#
# This filing maps a proposed predicate onto the done_verification section. The
# proposal is a registration request that was open when read, so nothing here
# describes a ratified predicate. It cannot promote a term and is not offered as
# promoting one: the promotion rule in vocabulary.yaml and GOVERNANCE.md requires
# the emitting system's own maintainers to file, declaring evidence: emitted with
# a resolvable path. A filing from outside records provenance and nothing else.

system: "OpenFab Generation Predicate (in-toto/attestation#604)"
system_url: "https://github.com/in-toto/attestation/issues/604"
crosswalk_version: "0.1.0"
vocabulary_version_targeted: "0.6.0"

maintainer:
  github: "astrogilda"
  third_party_authored: true

summary_of_system: >
  A proposed in-toto predicate for AI code-generation provenance. Among its
  fields the issue lists acceptance_passed and an embedded acceptance[] contract
  of re-runnable checks, and describes a normative claimed-versus-observed
  distinction for verifiers: did the producer's acceptance contract pass as a
  self-report, and separately, did it pass when this verifier re-executed it.

done_verification:

  done_contract:
    match: partial
    evidence: asserted
    source_path: "https://github.com/in-toto/attestation/issues/604"
    divergences:
      - "The embedded acceptance[] holds the checks. The issue does not describe protected paths, an adequacy measure or a digest sealed before the agent acts."
    notes: "The embedded acceptance contract gates the artifact and travels in the statement."

  done_receipt:
    match: partial
    evidence: asserted
    source_path: "https://github.com/in-toto/attestation/issues/604"
    divergences:
      - "The statement records generation provenance and a producer's acceptance result. The issue does not describe a combined verdict over a protection check, an acceptance grade and tool claims."
    notes: "The statement is a signed record carrying the contract and its result, so it is the nearest member."

  acceptance_observed:
    match: structural
    evidence: asserted
    source_path: "https://github.com/in-toto/attestation/issues/604"
    notes: "The issue's second policy question asks whether the contract passed when this verifier re-executed it, which is the question this term answers. The issue states it as a verifier requirement, in prose."

  protected_path:
    match: no_mapping
    notes: "The issue lists no protected-path field."

  claimed_tool_output:
    match: partial
    evidence: asserted
    source_path: "https://github.com/in-toto/attestation/issues/604"
    divergences:
      - "The claimed side is the producer's self-reported acceptance_passed, a result for the whole contract, not a per-command claim with an argument vector."
    notes: "The issue names the self-report as the claimed half of its claimed-versus-observed split."

  observed_tool_output:
    match: no_mapping
    notes: "The observed half is the verifier's own re-execution of the contract, which is a grade here. The issue describes no observer's record of what the producer's run executed."

  stop_decision:
    match: no_mapping
    notes: "The issue describes no loop policy."

  inconclusive_verdict:
    match: no_mapping
    notes: "The issue's questions are answered pass or fail; it describes no third value."
