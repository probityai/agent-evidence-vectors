# gitleaks configuration for this corpus.
#
# The vectors carry public key material and digests by design: SHA-256 digests
# of keys and tokens, Ed25519 public keys in hex, did:key identifiers and one
# signed JWT fixture. The default generic-api-key rule reads a field whose name
# contains "key" or "token" followed by a long value as a leaked secret. Each
# allowlist entry below names one such field shape, so a value in any other
# place, or a real token shape (sk-live-, ghp_, AKIA), is still reported.
# Test signing keys are derived from published constants (recipe in
# vectors/reject/INDEX.md), so they are public by construction.

[extend]
useDefault = true

[[allowlists]]
description = "64-hex SHA-256 digests under a field whose name ends in digest or sha256, anywhere"
# The name says the value is a digest, so its length is fixed: exactly 64 lower-case
# hex characters. A key, token or secret field outside the corpus directories is not
# passed for being 64 hex characters long.
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = [
  '''^(?i:[\w.-]*(?:digest|sha-?256))["'\x60]?\s*[:=]\s*["'\x60]?[0-9a-f]{64}["'\x60]?$''',
]

[[allowlists]]
description = "64-hex test keys under a key, digest or credential field inside the corpus and fixture directories"
# Corpus generators derive every signing seed from a published constant (the recipe in
# vectors/reject/INDEX.md, an RFC 8032 test seed, the ACS specification's example secret),
# so the hex key material the corpora carry under names such as signer_key or
# private_key_seed is public by construction. AND: only inside corpora/, vectors/,
# vectors-<name>/, fixtures/ or testdata/, and only exactly 64 hex characters.
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?:^|/)(?:testdata|fixtures?|corpora|vectors(?:-[a-z0-9-]+)?)/''']
regexTarget = "match"
regexes = [
  '''(?i)[a-z0-9_-]*(key|digest|token_?sha256)[a-z0-9_-]*["'`]?\s*[:=]\s*["'`][0-9a-f]{64}["'`]''',
]

[[allowlists]]
description = "Ed25519 public keys in the revocation vectors: issuerKey and successor members hold canonical base64 of a raw 32-byte public key"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = [
  '''(issuerKey|successor)"\s*:\s*"[A-Za-z0-9+/]{43}="''',
]

[[allowlists]]
description = "Raw Ed25519 public keys, 32 bytes in standard base64 (44 characters), in the holderKey and issuerKey of a delegation-chain grant"
# The keys come from fixed published seeds (vectors-delegation-chain/gen_vectors.py), so each is public by
# construction. The shape is pinned to one 44-character value ending in "=", in these two field names only.
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''(holderKey|issuerKey)"\s*:\s*"[A-Za-z0-9+/]{43}="''']

[[allowlists]]
description = "RFC 7638 thumbprints of public JWKs: a SHA-256 digest in base64url, 43 characters (audit-record principal members)"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''(keyThumbprint|pinnedThumbprint)"\s*:\s*"[A-Za-z0-9_-]{43}"''']

[[allowlists]]
description = "HKDF outputs from the ACS specification's published example secret (vectors-acs-core)"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''derived_key_hex"\s*:\s*"[0-9a-f]{128}"''']

[[allowlists]]
description = "The IndexNow key: public by protocol, served as a text file at the site root so engines can fetch it"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''INDEXNOW_KEY:\s*[0-9a-f]{32}''']

[[allowlists]]
description = "did:key identifiers (multibase public keys)"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''key:z[1-9A-HJ-NP-Za-km-z]{44,}''']

[[allowlists]]
description = "The Solana USDC mint address inside a CAIP-19 asset identifier"
# EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v is the public mint account of USDC on
# Solana, the asset id the audit-record consumption vectors carry. The generic rule
# reads the base58 string after "token:" as a key. The value is pinned, so any other
# base58 string after token: is still reported.
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = ['''^EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v$''']

[[allowlists]]
description = "Truncated did:key identifier in a description string of the agent-passport vectors"
# The descriptions in agent-passport-vectors-v2*.json write a did:key identifier
# cut short with "...", so the did:key entry above, which needs the whole 44
# characters, does not match. AND: only these two vectors files and only a line
# holding a did:key identifier that ends in "...". Any other line in them is
# still scanned.
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)experiments/aps-corrected20(-r2)?-[0-9-]+/producer/agent-passport-vectors-v2(-r2)?\.json$''']
regexTarget = "line"
regexes = ['''did:key:z[1-9A-HJ-NP-Za-km-z]{8,}\.\.\.''']

[[allowlists]]
description = "Type annotation, not a value"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''signing_key: Ed25519PrivateKey\b''']

[[allowlists]]
description = "A public signed JWT fixture, by path"
paths = [
  '''^interop/agentid-offline/fixtures/positive\.raw\.json$''',
]

[[allowlists]]
description = "SHA-256 file digests in a corpus manifest, keyed by a case file name"
# CORPUS-MANIFEST.json maps each case file to the SHA-256 of its bytes. Case
# names such as CAN-P-nested-key-order.json contain "key", so the generic rule
# reads the digest beside them as a secret. AND: the entry applies only inside
# a manifest and only to the "<name>.json": "<64 hex>" shape.
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)CORPUS-MANIFEST\.json$''']
regexTarget = "match"
regexes = ['''[A-Za-z0-9_./-]+\.json"\s*:\s*"[0-9a-f]{64}"''']

[[allowlists]]
description = "Base64 Ed25519 public key in a principal-action case (producerKey)"
# Each principal-action case hands the reader the producer's public key as base64.
# The signing seed is the SHA-256 of a public label (gen_vectors.py, label
# "producer"), so the key is public by construction. AND: only the producerKey
# member of a principal-action case file, and only the one published producer
# key. The value is pinned: any other producerKey value is still reported.
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^(corpora/)?vectors-principal-action/cases/[^/]+/case\.json$''']
regexTarget = "match"
regexes = ['''producerKey"\s*:\s*"pWbiKVTpr34PRZmWAPP9o3EYfVOvGvRJ09qC4DLx9ew="''']

[[allowlists]]
description = "The principal-action producer public key, as the hex constant of the allowlist test"
# scripts/secret-scan-allowlist-test.py keeps the producer key above as 64 hex characters
# (PRODUCER_KEY_HEX) and derives the base64 form from it, so the file carries no base64 key
# literal. The corpus entry for a 64-hex key passes only inside a corpus or fixture directory,
# and this file sits in scripts/, so it needs its own pin. The signing seed is the SHA-256 of
# a public label (gen_vectors.py, label "producer"), so the key is public by construction.
# AND: only this one file, and only the one published value on a PRODUCER_KEY_HEX line. The
# same value in any other file, and any other value in this one, is still reported.
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^scripts/secret-scan-allowlist-test\.py$''']
regexTarget = "match"
regexes = ['''PRODUCER_KEY_HEX\s*=\s*"a566e22954e9af7e0f45999600f3fda371187d53af1af449d3da82e032f1f5ec"''']

[[allowlists]]
description = "The unsigned empty JWT used as the credential placeholder in the credential-release suite"
# The value is the three-part JWT with header {"alg":"none"}, payload {} and an
# empty signature. It grants nothing. The pattern names that exact string, so a
# JWT with any other header, payload or signature is still reported.
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^(corpora/)?vectors-credential-release/(gen_vectors\.py|cases/[^/]+/statement\.json)$''']
regexTarget = "match"
regexes = ['''token"?\s*[:=]\s*"eyJhbGciOiJub25lIn0\.e30\."''']

[[allowlists]]
description = "Signed UMA for Agents terms agreements in the principal-binding corpus"
# Each binding.jws is a compact JWS that an agent test key signs. The seeds are
# the SHA-256 of published labels (gen_vectors.py), so the keys and the tokens
# are public by construction, and the payloads carry terms, not credentials.
# AND: only binding.jws files of that corpus, and only a token whose header names
# one of the two published test keys (the agent and the other agent), so a JWS
# with any other header is still reported.
targetRules = ["jwt"]
condition = "AND"
paths = ['''^corpora/vectors-principal-binding/cases/[^/]+/binding\.jws$''']
regexTarget = "match"
regexes = [
  '''^eyJhbGciOiJFZERTQSIsImp3ayI6eyJjcnYiOiJFZDI1NTE5Iiwia3R5IjoiT0tQIiwieCI6IlhzQVg4d2Z2SkpSRGhzeDZvcmpOWVVFLWE3dE1UVXdxVm5uV1U4SWhGRGcifX0\.''',
  '''^eyJhbGciOiJFZERTQSIsImp3ayI6eyJjcnYiOiJFZDI1NTE5Iiwia3R5IjoiT0tQIiwieCI6Ik9hMzBSblFUVHJONWJ5MGlGbHRoS040UmJaZTQ5MUJWZHdKUUtpb1NOYzgifX0\.''',
]

[[allowlists]]
description = "The ignore file lists commit:file:rule:line fingerprints, which read as high-entropy values"
paths = ['''^\.gitleaksignore$''']

[[allowlists]]
description = "SHA-256 digest of a retained keys file, keyed by its file name (vectors-refund-connected manifest)"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''keys\.json"\s*:\s*"[0-9a-f]{64}"''']

[[allowlists]]
description = "Base64url Ed25519 public keys in a badge-vc-verify case's issuers map"
# The suite hands the reader each issuer's public key under issuers.<did>.keys.
# The signing seeds are SHA-256 of public labels (gen_vectors.py), so the keys
# are public by construction. AND: only the badge-vc-verify case file, and only
# a 43-character base64url value in a "key-N" member.
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^(corpora/)?vectors-badge-vc-verify/cases/[^/]+/case\.json$''']
regexTarget = "match"
regexes = ['''key-[0-9]+"\s*:\s*"[A-Za-z0-9_-]{43}"''']

[[allowlists]]
description = "Test credentials in a badge-vc-verify case, signed with a public test key"
# Each credential is a compact JWS over a fictional example.com credential,
# signed with a test key whose seed is the SHA-256 of a public label. AND: only
# the "credential" member of a badge-vc-verify case file.
targetRules = ["jwt", "generic-api-key"]
condition = "AND"
paths = ['''^(corpora/)?vectors-badge-vc-verify/cases/[^/]+/case\.json$''']
regexTarget = "match"
regexes = ['''eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*''']

# Public keys in corpus and fixture files. gitleaks's own generic-api-key (v8.30.1, the
# version scripts/secret-scan.sh pins) already passes ANY value under a name containing
# pub(lic)?[_.-]?key (publicKey, public_key, pubkey, even public_key_seed), whatever its
# size and wherever it sits. The names that do fire are the others: issuerKey,
# verifyingKey, verificationKey, and key inside a trust root. The two entries below pass
# those, and the two rules after them report what the upstream exemption hides.
#
# The first entry passes a value only when three things hold together:
#   1. where it is: corpora/, vectors/, vectors-<name>/, fixtures/ or testdata/, or a
#      corpus file anywhere (a .json or .jsonl file whose name holds corpus or vectors,
#      such as packages/admission/rego/corpus_vectors.json);
#   2. what it is called: the field name ends in a public-key term (public_key,
#      publicKey, pubkey, pub_key, verifyingKey, verificationKey, verify_key) and at
#      most one encoding suffix (hex, b64, b64u, base64, base64url, raw, bytes), or it
#      is the exact JSON member issuerKey, which the agent-card-receipt,
#      credential-release and revocation-list suites define as the issuer's Ed25519
#      public key (ISSUER_KEY or issuer_key, which can as well name a signing key,
#      still fire);
#   3. its size: the value decodes to exactly 32 bytes: 64 hex characters of one case,
#      or 43 canonical base64 or base64url characters (the last one carries two zero
#      pad bits, so it is one of AEIMQUYcgkosw048) with an optional single "=".
# A 64-byte value, a PEM block, a JWT, a token, a non-canonical encoding and a value of
# any other length under these names still fire. A 32-byte seed has a public key's
# size, which is why the name and the directory are required too. The target is the
# match, so a credential under another field on the same line is still found. This
# replaces the issuerKey entry that pinned one value: a new suite's issuer key passes
# without a new pin.
[[allowlists]]
description = "A 32-byte public key under a public-key field name in a corpus or fixture directory"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?:^|/)(?:testdata|fixtures?|corpora|vectors(?:-[a-z0-9-]+)?)/|(?:^|/)[\w.-]*(?:corpus|vectors)[\w.-]*\.jsonl?$''']
regexTarget = "match"
regexes = [
  '''^(?:[\w.-]*(?i:pub(?:lic)?[_.-]?key|verif(?:y|ying|ication)[_.-]?key)(?i:[_.-]?(?:hex|b64u?|base64(?:url)?|raw|bytes))?|issuerKey)["'\x60]?\s*(?::=|=>|:|=)\s*["'\x60]?(?:[0-9a-f]{64}|[0-9A-F]{64}|[A-Za-z0-9+/]{42}[AEIMQUYcgkosw048]=?|[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]=?)(?:["'\x60;]|\s|\\[nr])?$''',
]

[[allowlists]]
description = "A 32-byte key member of a TRUST.json trust root in a corpus or fixture directory"
# A trust root is the verifier's own list of the keys it accepts, so in a file named
# TRUST.json the member key names a public verifying key. Only the JSON member key,
# only a 32-byte value as above, only that file name.
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(?:^|/)(?:testdata|fixtures?|corpora|vectors(?:-[a-z0-9-]+)?)/(?:[^/]+/)*TRUST\.json$''']
regexTarget = "match"
regexes = [
  '''^key"\s*:\s*"(?:[0-9a-f]{64}|[0-9A-F]{64}|[A-Za-z0-9+/]{42}[AEIMQUYcgkosw048]=?|[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]=?)"$''',
]

# What the upstream exemption hides, reported in every path. A public-key name that
# also carries a private word in either order (seed_public_key, private.publicKey,
# public_key_seed, secret_verify_key) names a secret as often as a public key, and a
# 32-byte value under it is reported. It has its own id, so no entry above reaches it.
[[rules]]
id = "public-key-field-private-word"
description = "A 32-byte value under a public-key name that also says private, secret, seed, password or token may be the secret"
regex = '''(?i:[\w.-]{0,60}(?:(?:priv|secret|seed|passw|token|credential)[\w.-]{0,60}(?:pub(?:lic)?[_.-]?key|verif(?:y|ying|ication)[_.-]?key)|(?:pub(?:lic)?[_.-]?key|verif(?:y|ying|ication)[_.-]?key)[\w.-]{0,60}(?:priv|secret|seed|passw|token|credential))[\w.-]{0,60})["'\x60]?\s*(?::=|=>|:|=)\s*["'\x60]?([0-9a-f]{64}|[0-9A-F]{64}|[A-Za-z0-9+/]{42}[AEIMQUYcgkosw048]=?|[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]=?)(?:["'\x60;\s]|\\[nr]|$)'''
keywords = ["pub", "verif"]

# The other thing the upstream exemption hides: a 64-byte value under a public-key name.
# An Ed25519 private key in Go, libsodium and NaCl is the seed followed by the public
# half, so writing the private key where the public one was meant puts exactly 64 bytes
# under a public-key name. Exactly 64 bytes: 128 hex characters of one case, or 86
# canonical base64 or base64url characters (the last one is one of AQgw) with an
# optional "==". A 65-byte uncompressed P-256 point, an RSA or ML-DSA public key and a
# 32-byte key are other sizes and are not reported.
[[rules]]
id = "public-key-field-64-bytes"
description = "A 64-byte value under a public-key name has the size of an Ed25519 private key (seed then public half)"
regex = '''(?i:[\w.-]{0,60}(?:pub(?:lic)?[_.-]?key|verif(?:y|ying|ication)[_.-]?key)(?:[_.-]?(?:hex|b64u?|base64(?:url)?|raw|bytes))?|issuerKey)["'\x60]?\s*(?::=|=>|:|=)\s*["'\x60]?([0-9a-f]{128}|[0-9A-F]{128}|[A-Za-z0-9+/]{85}[AQgw](?:==)?|[A-Za-z0-9_-]{85}[AQgw](?:==)?)(?:["'\x60;\s]|\\[nr]|$)'''
keywords = ["pub", "verif", "issuerkey"]

[[allowlists]]
# vectors-catalog-trust-manifest carries one detached JWS stored WITH its payload
# segment (case reject-jws-attached-payload), so it has the three-segment shape of
# a JWT. It is signed by a test key whose scalar is the SHA-256 of a public label in
# gen_vectors.py. AND: only the trust manifest signature member of that one case.
description = "the attached-payload JWS fixture of vectors-catalog-trust-manifest (public test key)"
targetRules = ["jwt"]
condition = "AND"
paths = ['''^corpora/vectors-catalog-trust-manifest/cases/reject-jws-attached-payload/catalog\.json$''']
regexTarget = "match"
regexes = ['''eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*''']

[[allowlists]]
description = "Test signatures and key material in a dns-aid-sig case, from public test labels"
# Each sig is a compact JWS over a fictional example.com SVCB record, signed with a
# P-256 key whose scalar is the SHA-256 of a public label (gen_vectors.py), so the
# key and every signature are public by construction. AND: only a dns-aid-sig case
# file, and only a compact JWS or a 43-character base64url value in the x, y or
# jwks_fingerprint member.
targetRules = ["jwt", "generic-api-key"]
condition = "AND"
paths = ['''^(corpora/)?vectors-dns-aid-sig-v01/cases/[^/]+\.json$''']
regexTarget = "match"
regexes = ['''eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*\.[A-Za-z0-9_-]*''', '''"(x|y|jwks_fingerprint)"\s*:\s*"[A-Za-z0-9_-]{43}"''']

[[allowlists]]
description = "Base64 Ed25519 public keys naming the assessor in a capability-requirement case"
# The suite's requirement names the held-out assessor by public key (assessorKey). The
# signing seeds are SHA-256 of public labels (gen_vectors.py), so the keys are public by
# construction. AND: only a capability-requirement case file, and only the two published
# test keys (the assessor and the other key a case swaps in). A base64 shape cannot tell a
# public key from a secret, so the values are pinned: any other assessorKey value is still
# reported.
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^(corpora/)?vectors-capability-requirement/cases/[^/]+/record\.json$''']
regexTarget = "match"
regexes = ['''assessorKey"\s*:\s*"(xCAlDc\+XkJ6JNf3j8F80rmvh8MwS3WQSV9YyXmyTcWE|7CkOHtB4Qly2Q/YX/OkMPba7HJwNRcVwmNmTr3A/6Hk)="''']

[[allowlists]]
description = "Test proof JWTs inside the agent request-proof corpus envelopes"
# Every proof is signed by a key derived from a published label in the corpus
# generator, or is the upstream SDK's own golden fixture; they grant nothing.
# Scoped to the jwt rule and this corpus's envelopes only.
targetRules = ["jwt"]
paths = ['''^corpora/vectors-agent-request-proof/cases/[^/]+/envelope-[0-9]+\.json$''']

[[allowlists]]
description = "Test Security Event Tokens of the revocation-fence feed cases"
# Each set.jws is a compact JWS signed with an Ed25519 key whose seed is the SHA-256 of a
# published label in the corpus generator, so every token is public by construction and
# grants nothing. Scoped to the jwt rule and the feed cases' set.jws files only.
targetRules = ["jwt"]
paths = ['''^corpora/vectors-revocation-fence/cases/feed-[a-z0-9-]+/set\.jws$''']

[[allowlists]]
description = "The public recorder key of the agent request-proof corpus"
# An Ed25519 PUBLIC key derived from a published seed label; the pattern names
# that exact value, so any other value is still reported.
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^corpora/vectors-agent-request-proof/cases/[^/]+/case\.json$''']
regexTarget = "match"
regexes = ['''recorderKey"\s*:\s*"BMA4qFpSvSiLzOhNuhs1bmui/v29XYS9mMxGqVEfCwg="''']

[[allowlists]]
description = "SHA-256 digests of case files in the status-receipt-binding manifest"
# MANIFEST.json lists each case file with the SHA-256 of its bytes. The generic rule
# reads the 64-hex value after "credential.json" as a key. All ten distinct values
# were checked to equal the digest of a file in the corpus, so they are digests and
# not secrets. AND: only this one manifest path, and only a file-name member whose
# value is 64 hex characters.
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^corpora/vectors-status-receipt-binding/MANIFEST\.json$''']
regexTarget = "match"
regexes = ['''credential\.json"\s*:\s*"[0-9a-f]{64}"''']

[[allowlists]]
description = "Base64url Ed25519 public keys in the actor-marker-survival trust bundle"
# TRUST.json gives the verifier each writer's public key under writers.<name>.key.
# Each signing seed is the SHA-256 of "actor-marker-survival/v1 test key " plus the
# writer's name (gen_vectors.py, key()), so the keys are public by construction.
# A base64url shape cannot tell a public key from a 32-byte secret, so the eight
# values are pinned: AND, only that one file, and only these exact members. A new
# writer, a changed key or the same value anywhere else is still reported.
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^(corpora/)?vectors-actor-marker-survival/TRUST\.json$''']
regexTarget = "match"
regexes = ['''key"\s*:\s*"(6u-4h_FKsEp4zItPdJFa_DrmaHVAiVt4frww42pfudo|ojuNdiZ-Y96TCP8fLPW86JL89c2LQIFtm_bZoaJ1BJQ|eYH24yhsIF5f8QY2d_So64YHeJAx6grKd2TYcL9SLpQ|XIot846rHq3eno56PetnXmHJ3bsYDHeIPoNlkoFDFvg|mbrVmGamyI0XZ8R3fGQ8LYe5s5NwXhncyipcsliO21g|A1FDEw7pxa9CGhe1FAxhV9WrJliSRNgUl0SgL2_U3Ko|ywcgKBs8VG84u-mviUvpzfop7iadzd42m8A6ermMk1Y|Pu8FJnMUFaC6MDLFlZEgBsWHUPcyVcriltHq7UZTxuM)"''']

[[allowlists]]
description = "Published demo provenance keys in the ocsf-audit sample output"
# SAMPLE-OUTPUT-PROVENANCE.md is the upstream sink's published sample, copied
# unchanged and pinned by SHA-256. Its two `provenance_key` lines carry the
# base64 of the plain labels "AiIdentity-demo-provenance-key-2026-10-01-a" and
# "-b", published so a reader can recompute the sample digests. AND: only this
# file and only a line naming provenance_key; every other line is still scanned.
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)corpora/vectors-ocsf-decision/source/SAMPLE-OUTPUT-PROVENANCE\.md$''']
regexTarget = "line"
regexes = ['''// verify: provenance_key(_rotated)? += QWlJZGVudGl0eS1kZW1vLXByb3ZlbmFuY2Uta2V5LTIwMjYtMTAtMDEt(YQ|Yg)==$''']
